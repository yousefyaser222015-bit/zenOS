name: Build zenOS (Tizen-Based Engine) ARM64 & x86_64

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-zenos-arm64:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cross Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap qemu-user-static gcc-aarch64-linux-gnu \
                                 g++-aarch64-linux-gnu bison flex libncurses-dev libssl-dev \
                                 bc libelf-dev e2fsprogs dosfstools wget

      # 1. بناء نواة ARM64 مع تفعيل الرسوميات والمحاكاة
      - name: Build ARM64 Kernel
        run: |
          mkdir -p kernel_build
          cd kernel_build
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz
          tar -xf linux-6.1.80.tar.xz
          cd linux-6.1.80
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig

          # تفعيل محركات الرسوميات و Framebuffer و Devtmpfs
          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_VT

          make -j$(nproc) Image
          cd ../..
          mkdir -p boot_out
          cp kernel_build/linux-6.1.80/arch/arm64/boot/Image boot_out/Image

      # 2. إنشاء RootFS متكامل يحتوي على كافة مكتبات النظام المتوافقة (ARM64)
      - name: Build Tizen-Compatible RootFS via Debootstrap
        run: |
          sudo debootstrap --arch=arm64 --foreign noble rootfs http://ports.ubuntu.com/ubuntu-ports
          sudo cp /usr/bin/qemu-aarch64-static rootfs/usr/bin/
          sudo chroot rootfs /debootstrap/debootstrap --second-stage

          # تثبيت Weston والواجهة الرسومية داخل البيئة
          sudo chroot rootfs apt-get update
          sudo chroot rootfs apt-get install -y weston wayland-protocols libwayland-egl1 dbus systemd

          # نسخ النواة
          sudo mkdir -p rootfs/boot
          sudo cp boot_out/Image rootfs/boot/Image

          # 3. إعداد سكريبت البدء التلقائي للواجهة الرسومية (/sbin/init)
          sudo bash -c 'cat << "EOF" > rootfs/sbin/init
#!/bin/bin/sh
mount -t proc proc /proc
mount -t sysfs sysfs /sys
mount -t devtmpfs devtmpfs /dev
mkdir -p /dev/pts /dev/shm /tmp
mount -t devpts devpts /dev/pts
chmod 1777 /tmp

export XDG_RUNTIME_DIR=/tmp
export WAYLAND_DISPLAY=wayland-0

echo "=================================================="
echo "      Starting zenOS (Tizen/Wayland Core)        "
echo "=================================================="

if [ -x /usr/bin/weston ]; then
  exec /usr/bin/weston --backend=drm-backend.so --continue-without-input
else
  exec /bin/sh
fi
EOF'
          sudo chmod +x rootfs/sbin/init

      # 4. تجميع القرص النهائي (3GB)
      - name: Create Bootable Disk Image
        run: |
          dd if=/dev/zero of=zenOS-ARM64-TizenCore.img bs=1M count=3000
          mkfs.ext4 -F -L "zenOS-Root" zenOS-ARM64-TizenCore.img
          
          mkdir -p /tmp/mnt_zenos
          sudo mount -o loop zenOS-ARM64-TizenCore.img /tmp/mnt_zenos
          sudo cp -a rootfs/* /tmp/mnt_zenos/
          sudo umount /tmp/mnt_zenos

      - name: Upload ARM64 Image
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-TizenCore
          path: zenOS-ARM64-TizenCore.img
          
