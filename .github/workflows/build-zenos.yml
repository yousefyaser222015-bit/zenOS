name: Build Authentic Tizen OS GUI & Runtime Engine (Termux Ready)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-tizen-os:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools & Native QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                                 bison flex libncurses-dev libssl-dev bc libelf-dev \
                                 qemu-user-static qemu-system-arm qemu-utils \
                                 e2fsprogs dosfstools kmod cpio wget curl zstd jq zip

      # 1. تجميع نواة Linux ARM64 مخصصة بالكامل لـ QEMU VirtIO
      - name: Compile Linux Kernel with DRM & Complete VirtIO Stack
        run: |
          mkdir -p kernel_build
          cd kernel_build
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz
          tar -xf linux-6.1.80.tar.xz
          cd linux-6.1.80
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig

          # تفعيل تعاريف VirtIO Block & PCI & GPU المباشرة
          scripts/config --enable CONFIG_PCI
          scripts/config --enable CONFIG_PCI_HOST_GENERIC
          scripts/config --enable CONFIG_VIRTIO
          scripts/config --enable CONFIG_VIRTIO_PCI
          scripts/config --enable CONFIG_VIRTIO_MMIO
          scripts/config --enable CONFIG_VIRTIO_BLK
          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_EXT4_FS
          scripts/config --enable CONFIG_TMPFS
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable CONFIG_UNIX
          scripts/config --enable CONFIG_INET
          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_VIRTIO_NET
          scripts/config --enable CONFIG_VIRTIO_INPUT
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_VT
          scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          scripts/config --enable CONFIG_INPUT_EVDEV

          make -j$(nproc) Image
          cd ../..
          mkdir -p boot_kernel
          cp kernel_build/linux-6.1.80/arch/arm64/boot/Image boot_kernel/Image

      # 2. التفتيش الديناميكي عن صورة Tizen Headed لتجنب الـ 404
      - name: Dynamic Search and Fetch Tizen Headed RootFS
        run: |
          BASE_REPO_URL="https://download.tizen.org/releases/daily/tizen/unified/"
          
          echo "Scanning for valid Tizen unified releases..."
          LATEST_DIR=$(curl -s "$BASE_REPO_URL" | grep -oE 'tizen-unified_[0-9\._\-]+|latest' | tail -n 1)
          
          if [ -z "$LATEST_DIR" ]; then
             LATEST_DIR="latest"
          fi
          
          TARGET_URL="${BASE_REPO_URL}${LATEST_DIR}/images/standard/tizen-headed-aarch64/"
          echo "Target Release Path: ${TARGET_URL}"
          
          TARBALL_NAME=$(curl -s "$TARGET_URL" | grep -oE 'tizen-headed-aarch64-[0-9\._\-]+\.tar\.gz|tizen-headed-aarch64-[0-9\._\-]+\.tar\.xz' | head -n 1)

          if [ -z "$TARBALL_NAME" ]; then
            echo "Direct Headed Tarball not found, attempting fallback image search..."
            TARBALL_NAME=$(curl -s "$TARGET_URL" | grep -oE '[a-zA-Z0-9\._\-]+\.tar\.(gz|xz)' | head -n 1)
          fi

          if [ -z "$TARBALL_NAME" ]; then
            echo "Critical Error: Could not locate any valid Tizen image package at $TARGET_URL"
            exit 1
          fi

          echo "Downloading Image: ${TARBALL_NAME}..."
          wget -q --show-progress "${TARGET_URL}${TARBALL_NAME}" -O tizen-rootfs.tar.gz

          mkdir -p zenos_rootfs
          tar -xf tizen-rootfs.tar.gz -C zenos_rootfs/

          # تصحيح الـ Nested Directory المستخرجة تلقائياً
          if [ ! -d "zenos_rootfs/usr" ]; then
              SUBDIR=$(find zenos_rootfs/ -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$SUBDIR" ] && [ -d "$SUBDIR/usr" ]; then
                  echo "Flattening nested directory structure from $SUBDIR..."
                  mv $SUBDIR/* zenos_rootfs/
                  rm -rf $SUBDIR
              fi
          fi

          if [ ! -d "zenos_rootfs/usr" ]; then
              echo "Fatal Error: RootFS structure invalid post-extraction!"
              exit 1
          fi

      # 3. بناء وتضمين BusyBox ARM64 Static من السورس
      - name: Build Native ARM64 Static BusyBox
        run: |
          mkdir -p busybox_build
          cd busybox_build
          wget -q https://busybox.net/downloads/busybox-1.36.1.tar.bz2
          tar -xf busybox-1.36.1.tar.bz2
          cd busybox-1.36.1
          make defconfig
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          sed -i 's/CONFIG_STATIC=n/CONFIG_STATIC=y/' .config
          make -j$(nproc) install
          
          cp -r _install/* ../../zenos_rootfs/
          cd ../..
          rm -rf busybox_build

      # 4. فحص جودة واكتمال بيئة Tizen
      - name: Strict Verification of Core Binaries
        run: |
          cd zenos_rootfs
          ERR=0
          [ -f "usr/bin/weston" ] || { echo "WARNING: Weston Binary missing!"; }
          [ -f "usr/bin/dbus-daemon" ] || { echo "WARNING: D-Bus Daemon missing!"; }
          
          # التأكد من صحة الملفات التنفيذية
          file bin/busybox | grep -q "aarch64" || { echo "CRITICAL: BusyBox is not ARM64!"; ERR=1; }

          if [ $ERR -eq 1 ]; then
             echo "Health Check Failed!"
             exit 1
          fi
          echo "Health Check Passed!"
          cd ..

      # 5. مشغل Tizen GUI ذكي ومحسّن
      - name: Create Tizen GUI Launcher
        run: |
          cat << 'EOF' > zenos_rootfs/usr/bin/start-tizen-gui
          #!/bin/sh
          export XDG_RUNTIME_DIR=/run/user/0
          export WAYLAND_DISPLAY=wayland-0
          export ELM_ENGINE=wayland_egl
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export LD_LIBRARY_PATH=/usr/lib:/lib:/usr/lib64

          mkdir -p /run/user/0
          chmod 0700 /run/user/0

          dbus-uuidgen --ensure 2>/dev/null
          dbus-daemon --system --fork 2>/dev/null

          echo "[zenOS Engine] Checking DRM device node (/dev/dri/card0)..."
          WAIT_CARD=0
          while [ ! -c /dev/dri/card0 ] && [ $WAIT_CARD -lt 5 ]; do
              sleep 1
              WAIT_CARD=$((WAIT_CARD+1))
          done

          if [ -c /dev/dri/card0 ] && [ -x /usr/bin/weston ]; then
              echo "[zenOS Engine] Starting Weston Compositor on DRM..."
              weston --backend=drm-backend.so --use-pixman --continue-without-input --log=/tmp/weston.log &
              
              COUNT=0
              while [ $COUNT -lt 6 ]; do
                  if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
                      echo "[zenOS Engine] Wayland Compositor successfully initialized!"
                      exit 0
                  fi
                  sleep 1
                  COUNT=$((COUNT+1))
              done
          fi

          if [ -x /usr/bin/enlightenment ]; then
              echo "[zenOS Engine] Attempting Enlightenment Desktop Fallback..."
              enlightenment &
              sleep 2
              exit 0
          fi

          echo "[zenOS Engine] Graphical server launch failed."
          exit 1
          EOF

          chmod +x zenos_rootfs/usr/bin/start-tizen-gui

      # 6. بناء برنامج init مخصص بلغة C
      - name: Compile Native C Init Manager
        run: |
          cat << 'EOF' > tizen_init.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/mount.h>
          #include <sys/stat.h>
          #include <sys/wait.h>

          int main() {
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              mkdir("/dev/pts", 0755);
              mkdir("/dev/shm", 0755);
              mkdir("/tmp", 0777);
              mkdir("/run/user", 0755);
              mkdir("/run/user/0", 0700);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);

              printf("\n==================================================\n");
              printf("  zenOS Engine (ARM64 Tizen Native Architecture)  \n");
              printf("==================================================\n\n");

              int res = system("/usr/bin/start-tizen-gui");

              if (res != 0) {
                  printf("\n[zenOS Engine] GUI Server Start Failed. Entering Interactive Repair Shell...\n");
                  setenv("PS1", "zenos~# ", 1);
                  setenv("TERM", "xterm", 1);
                  setenv("PATH", "/usr/bin:/bin:/usr/sbin:/sbin", 1);

                  while(1) {
                      pid_t pid = fork();
                      if (pid == 0) {
                          setsid();
                          int fd = open("/dev/console", O_RDWR);
                          if (fd >= 0) {
                              dup2(fd, 0);
                              dup2(fd, 1);
                              dup2(fd, 2);
                              if (fd > 2) close(fd);
                          }
                          execl("/bin/sh", "sh", "-l", NULL);
                          exit(0);
                      }
                      waitpid(pid, NULL, 0);
                      sleep(1);
                  }
              }

              while(1) {
                  sleep(3600);
              }
              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc -static tizen_init.c -o zenos_rootfs/sbin/init
          chmod +x zenos_rootfs/sbin/init

      # 7. إنشاء صورة النظام Ext4
      - name: Generate EXT4 File System Image
        run: |
          dd if=/dev/zero of=zenOS-ARM64-Tizen-GUI.img bs=1M count=2500
          mkfs.ext4 -F -L "zenOS-Tizen" zenOS-ARM64-Tizen-GUI.img
          
          mkdir -p /tmp/zenos_mnt
          sudo mount -o loop zenOS-ARM64-Tizen-GUI.img /tmp/zenos_mnt
          sudo cp -a zenos_rootfs/* /tmp/zenos_mnt/
          sudo umount /tmp/zenos_mnt

      # 8. QEMU Boot Verification Test
      - name: Run QEMU Boot Smoke Test
        run: |
          timeout 25 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a57 \
            -m 2048M \
            -smp 2 \
            -kernel boot_kernel/Image \
            -drive file=zenOS-ARM64-Tizen-GUI.img,format=raw,if=virtio \
            -append "console=ttyAMA0 root=/dev/vda rw init=/sbin/init" \
            -device virtio-gpu-pci \
            -vnc :5 \
            -nographic > qemu_boot.log 2>&1 || true

          cat qemu_boot.log

      # 9. حزم ملفات النظام لبيئة Termux
      - name: Create Termux Bundle Package
        run: |
          mkdir -p termux_package
          cp zenOS-ARM64-Tizen-GUI.img termux_package/
          cp boot_kernel/Image termux_package/

          cat << 'EOF' > termux_package/start-qemu.sh
          #!/data/data/com.termux/files/usr/bin/bash
          echo "Starting zenOS on Termux QEMU..."
          qemu-system-aarch64 \
            -M virt \
            -cpu host \
            -enable-kvm \
            -m 2048M \
            -smp 4 \
            -kernel Image \
            -drive file=zenOS-ARM64-Tizen-GUI.img,format=raw,if=virtio \
            -append "console=ttyAMA0 root=/dev/vda rw init=/sbin/init" \
            -device virtio-gpu-pci \
            -vnc :5 \
            -display default
          EOF

          chmod +x termux_package/start-qemu.sh
          zip -j zenOS-ARM64-Termux.zip termux_package/* qemu_boot.log

      # 10. رفع حزمة ה-ZIP كـ Artifact
      - name: Upload Termux ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Termux-ZIP
          path: zenOS-ARM64-Termux.zip
          
