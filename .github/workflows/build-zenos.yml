          /* ===== FAST Graphics (no heavy effects) ===== */
          static inline void px(int x, int y, uint32_t c) {
              if (x >= 0 && x < W && y >= 0 && y < H) fb_back[y * W + x] = c;
          }

          static void fill_rect(int x, int y, int w, int h, uint32_t c) {
              for (int j = y; j < y + h; j++)
                  for (int i = x; i < x + w; i++) px(i, j, c);
          }

          static void rrect_fast(int x, int y, int w, int h, int r, uint32_t c) {
              fill_rect(x + r, y, w - 2*r, h, c);
              fill_rect(x, y + r, r, h - 2*r, c);
              fill_rect(x + w - r, y + r, r, h - 2*r, c);
              for (int j = -r; j <= r; j++)
                  for (int i = -r; i <= r; i++)
                      if (i*i + j*j <= r*r) {
                          px(x + r + i, y + r + j, c);
                          px(x + w - r - 1 + i, y + r + j, c);
                          px(x + r + i, y + h - r - 1 + j, c);
                          px(x + w - r - 1 + i, y + h - r - 1 + j, c);
                      }
          }

          static void grad_v_fast(int x, int y, int w, int h, uint32_t c1, uint32_t c2) {
              uint8_t r1=(c1>>16)&0xFF, g1=(c1>>8)&0xFF, b1=c1&0xFF;
              uint8_t r2=(c2>>16)&0xFF, g2=(c2>>8)&0xFF, b2=c2&0xFF;
              for (int j = 0; j < h; j++) {
                  uint8_t r = r1 + (r2-r1)*j/h;
                  uint8_t g = g1 + (g2-g1)*j/h;
                  uint8_t b = b1 + (b2-b1)*j/h;
                  uint32_t c = 0xFF000000 | (r<<16) | (g<<8) | b;
                  for (int i = 0; i < w; i++) px(x + i, y + j, c);
              }
          }

          static void dchar(int x, int y, char ch, int s, uint32_t c) {
              if (ch < 32 || ch > 126) ch = '?';
              const uint8_t *g = font8x16[ch - 32];
              for (int row = 0; row < 16; row++)
                  for (int col = 0; col < 8; col++)
                      if (g[row] & (0x80 >> col))
                          for (int sy = 0; sy < s; sy++)
                              for (int sx = 0; sx < s; sx++)
                                  px(x + col*s + sx, y + row*s + sy, c);
          }

          static void dstr(int x, int y, const char *s, int sc, uint32_t c) {
              int cx = x;
              for (int i = 0; s[i]; i++) {
                  if (s[i] == '\n') { cx = x; y += 16*sc + 2; continue; }
                  dchar(cx, y, s[i], sc, c);
                  cx += 8*sc;
              }
          }

          static int strw(const char *s, int sc) { return strlen(s) * 8 * sc; }

          /* ===== TPK Runner ===== */
          static int run_tpk(const char *path, const char *event, char *out, int sz) {
              char cmd[2048];
              if (event && *event)
                  snprintf(cmd, sizeof(cmd),
                      "/bin/busybox unzip -p '%s' shared/res/entry.sh 2>/dev/null | TPK_EVENT='%s' /bin/busybox sh 2>/dev/null",
                      path, event);
              else
                  snprintf(cmd, sizeof(cmd),
                      "/bin/busybox unzip -p '%s' shared/res/entry.sh 2>/dev/null | /bin/busybox sh 2>/dev/null",
                      path);
              FILE *f = popen(cmd, "r");
              if (!f) return -1;
              size_t t = 0;
              while (t < (size_t)sz - 1) {
                  size_t r = fread(out + t, 1, sz - 1 - t, f);
                  if (r == 0) break;
                  t += r;
              }
              out[t] = 0;
              pclose(f);
              return 0;
          }

          /* ===== UI Command ===== */
          typedef struct {
              char cmd[32], id[64], text[256];
              int x, y, w, h, size;
              uint32_t color;
          } ui_cmd_t;
          static ui_cmd_t ui_cmds[512];
          static int n_ui_cmds = 0;

          static void parse_ui(const char *output) {
              n_ui_cmds = 0;
              const char *p = output;
              while (*p && n_ui_cmds < 512) {
                  while (*p && isspace(*p)) p++;
                  if (!*p) break;
                  ui_cmd_t *c = &ui_cmds[n_ui_cmds];
                  memset(c, 0, sizeof(*c));
                  char line[1024];
                  int i = 0;
                  while (*p && *p != '\n' && i < 1023) line[i++] = *p++;
                  line[i] = 0;
                  if (*p == '\n') p++;

                  char *save, *tok = strtok_r(line, " \t", &save);
                  if (!tok) continue;

                  if (strcmp(tok, "BG") == 0) {
                      strcpy(c->cmd, "BG");
                      tok = strtok_r(NULL, " \t", &save);
                      if (tok) c->color = strtoul(tok, NULL, 0);
                  } else if (strcmp(tok, "RECT") == 0) {
                      strcpy(c->cmd, "RECT");
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->w = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->h = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->color = strtoul(tok, NULL, 0);
                  } else if (strcmp(tok, "TEXT") == 0) {
                      strcpy(c->cmd, "TEXT");
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->size = atoi(tok);
                      char *q = strchr(save, '"');
                      char *e = NULL;
                      if (q) {
                          q++;
                          e = strchr(q, '"');
                          if (e) {
                              int l = e - q;
                              if (l > 255) l = 255;
                              strncpy(c->text, q, l);
                              c->text[l] = 0;
                          }
                      }
                      if (q && e) {
                          q = e + 1;
                          while (*q == ' ' || *q == '\t') q++;
                          if (*q) c->color = strtoul(q, NULL, 0);
                      }
                  } else if (strcmp(tok, "BTN") == 0) {
                      strcpy(c->cmd, "BTN");
                      tok = strtok_r(NULL, " \t", &save);
                      if (tok) strncpy(c->id, tok, 63);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->w = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->h = atoi(tok);
                      char label[128] = {0};
                      char *q = strchr(save ? save : "", '"');
                      char *e = NULL;
                      if (q) {
                          q++;
                          e = strchr(q, '"');
                          if (e) {
                              int l = e - q;
                              if (l > 127) l = 127;
                              strncpy(label, q, l);
                              label[l] = 0;
                          }
                      }
                      if (q && e) {
                          q = e + 1;
                          while (*q == ' ' || *q == '\t') q++;
                          c->color = strtoul(q, NULL, 0);
                      }
                      snprintf(c->text, sizeof(c->text), "%s", label);
                  }
                  n_ui_cmds++;
              }
          }

          static void scan_tpks(void) {
              DIR *d = opendir(TPK_DIR);
              if (!d) return;
              struct dirent *e;
              n_apps = 0;
              uint32_t P[][2] = {
                  {0x6C5CE7,0xA29BFE},{0x00B894,0x55EFC4},{0xE17055,0xFAB1A0},
                  {0x0984E3,0x74B9FF},{0xFD79A8,0xFDCB6E},{0x00CEC9,0x81ECEC},
                  {0xE84393,0xFD79A8},{0x2D3436,0x636E72},{0xD63031,0xFF7675},
                  {0x00B894,0x00CEC9},{0xFDCB6E,0xE17055},{0x0984E3,0x6C5CE7}
              };
              while ((e = readdir(d)) && n_apps < MAX_APPS) {
                  char *dot = strstr(e->d_name, ".tpk");
                  if (dot) {
                      strncpy(apps[n_apps].filename, e->d_name, 255);
                      strncpy(apps[n_apps].name, e->d_name, dot - e->d_name);
                      apps[n_apps].name[dot - e->d_name] = 0;
                      apps[n_apps].icon_letter = apps[n_apps].name[0];
                      if (apps[n_apps].icon_letter >= 'a' && apps[n_apps].icon_letter <= 'z')
                          apps[n_apps].icon_letter -= 32;
                      apps[n_apps].color1 = P[n_apps % 12][0];
                      apps[n_apps].color2 = P[n_apps % 12][1];
                      n_apps++;
                  }
              }
              closedir(d);
          }

          static int create_window(const char *name, const char *file, uint32_t color) {
              for (int i = 0; i < MAX_WINDOWS; i++) {
                  if (!windows[i].active) {
                      windows[i].active = 1;
                      windows[i].x = 50 + i * 30;
                      windows[i].y = 80 + i * 20;
                      windows[i].w = 700;
                      windows[i].h = 360;
                      strncpy(windows[i].title, name, 63);
                      snprintf(windows[i].tpk_path, sizeof(windows[i].tpk_path),
                               TPK_DIR "/%s", file);
                      windows[i].color = color;
                      active_window = i;
                      return i;
                  }
              }
              return -1;
          }

          static void close_window(int idx) {
              if (idx >= 0 && idx < MAX_WINDOWS) {
                  windows[i].active = 0;
                  if (active_window == idx) active_window = -1;
              }
          }

          static void draw_window(int idx) {
              window_t *w = &windows[idx];
              if (!w->active || w->minimized) return;
              int x = w->x, y = w->y, width = w->w, height = w->h;

              rrect_fast(x, y, width, height, 12, 0x1A1A2E);
              grad_v_fast(x, y, width, 40, 0x2D3436, 0x1A1A2E);

              /* Close button */
              int cx = x + width - 36, cy = y + 8;
              rrect_fast(cx, cy, 24, 24, 6, 0xD63031);
              dstr(cx + 8, cy + 6, "X", 2, 0xFFFFFFFF);
              
              /* Title */
              dstr(x + 12, y + 12, w->title, 2, 0xFFFFFFFF);

              char output[65536];
              if (run_tpk(w->tpk_path, "", output, sizeof(output)) == 0) {
                  parse_ui(output);
                  uint32_t bg = 0x1A1A2E;
                  for (int i = 0; i < n_ui_cmds; i++)
                      if (strcmp(ui_cmds[i].cmd, "BG") == 0) bg = ui_cmds[i].color;
                  fill_rect(x, y + 40, width, height - 40, bg);

                  for (int i = 0; i < n_ui_cmds; i++) {
                      ui_cmd_t *c = &ui_cmds[i];
                      if (strcmp(c->cmd, "RECT") == 0) {
                          fill_rect(x + c->x, y + 40 + c->y, c->w, c->h, c->color);
                      } else if (strcmp(c->cmd, "TEXT") == 0) {
                          dstr(x + c->x, y + 40 + c->y, c->text, c->size, c->color);
                      } else if (strcmp(c->cmd, "BTN") == 0) {
                          rrect_fast(x + c->x, y + 40 + c->y, c->w, c->h, 8, c->color);
                          int tw = strw(c->text, 2);
                          dstr(x + c->x + (c->w - tw)/2,
                               y + 40 + c->y + (c->h - 16)/2,
                               c->text, 2, 0xFFFFFFFF);
                      }
                  }
              }
          }

          static void draw_status_bar(void) {
              fill_rect(0, 0, W, 48, 0x0D0D22);
              time_t now = time(NULL);
              struct tm *t = localtime(&now);
              char ts[32], ds[32];
              strftime(ts, sizeof(ts), "%H:%M", t);
              strftime(ds, sizeof(ds), "%a %b %d", t);
              dstr(20, 14, ts, 2, 0xFFFFFFFF);
              dstr(20, 32, ds, 1, 0xAAAAAAFF);
              
              /* Input indicator */
              if (n_inputs > 0) {
                  for (int j = -6; j <= 6; j++)
                      for (int i = -6; i <= 6; i++)
                          if (i*i + j*j <= 36)
                              px(W - 30 + i, 24 + j, mouse_down ? 0xFF0000 : 0x00FF00);
              }
              dstr(W - 120, 16, "zenOS", 2, 0x00D4FF);
          }

          /* REMOVED: draw_nav_bar() - no more Windows-style buttons */

          static void draw_home(void) {
              grad_v_fast(0, 0, W, H, 0x0A0A1E, 0x16213E);
              scan_tpks();
              if (n_apps == 0) {
                  dstr((W - strw("No Apps", 2))/2, H/2 - 20, "No Apps", 2, 0xAAAAAA);
                  return;
              }
              int cols = 4, icon = 90, gx = 30, gy = 40;
              int tw = cols*icon + (cols-1)*gx;
              int sx = (W - tw)/2, sy = 80;
              dstr(sx, sy - 30, "Applications", 2, 0x888888);
              for (int i = 0; i < n_apps; i++) {
                  int col = i % cols, row = i / cols;
                  int ax = sx + col*(icon + gx);
                  int ay = sy + row*(icon + gy + 30);
                  rrect_fast(ax, ay, icon, icon, icon/5, 0x2D3436);
                  grad_v_fast(ax, ay, icon, icon, apps[i].color1, apps[i].color2);
                  char l[2] = {apps[i].icon_letter, 0};
                  int sc = icon/32; if (sc < 2) sc = 2;
                  int tw2 = strw(l, sc);
                  dstr(ax + (icon - tw2)/2, ay + (icon - 16*sc)/2, l, sc, 0xFFFFFFFF);
                  char dn[64];
                  int nw = strw(apps[i].name, 2);
                  if (nw > icon + 20) {
                      strncpy(dn, apps[i].name, 12); dn[12] = 0; strcat(dn, "..");
                  } else strcpy(dn, apps[i].name);
                  int dw = strw(dn, 2);
                  dstr(ax + (icon - dw)/2, ay + icon + 8, dn, 2, 0xCCCCCC);
              }
          }

          static void draw_cursor(void) {
              if (mouse_x < 0 || mouse_y < 0) return;
              /* Small fast cursor */
              for (int i = 0; i < 12; i++) {
                  px(mouse_x + i, mouse_y + i, 0xFFFFFFFF);
                  px(mouse_x + i + 1, mouse_y + i, 0x000000);
                  px(mouse_x + i, mouse_y + i + 1, 0x000000);
              }
          }

          /* ===== Android-style Gestures ===== */
          static void handle_gesture_end(void) {
              int dx = mouse_x - gesture_start_x;
              int dy = mouse_y - gesture_start_y;
              
              /* Swipe up from bottom edge = Home */
              if (gesture_start_y > H - 50 && dy < -100) {
                  klog("Gesture: Home");
                  for (int i = 0; i < MAX_WINDOWS; i++)
                      if (windows[i].active) windows[i].active = 0;
                  active_window = -1;
                  return;
              }
              
              /* Swipe from left edge = Back */
              if (gesture_start_x < 50 && dx > 100) {
                  klog("Gesture: Back");
                  if (active_window >= 0) close_window(active_window);
                  return;
              }
              
              /* Swipe from right edge = Recent (close current) */
              if (gesture_start_x > W - 50 && dx < -100) {
                  klog("Gesture: Recent");
                  if (active_window >= 0) close_window(active_window);
                  return;
              }
          }

          static void handle_click(void) {
              if (mouse_y < 48) return;
              
              if (active_window >= 0 && windows[active_window].active) {
                  window_t *w = &windows[active_window];
                  int lx = mouse_x - w->x, ly = mouse_y - w->y;
                  
                  if (lx >= w->w - 36 && lx <= w->w - 12 && ly >= 8 && ly <= 32) {
                      close_window(active_window); return;
                  }
                  if (ly >= 0 && ly < 40) {
                      w->x = mouse_x - w->w/2; w->y = mouse_y - 20; return;
                  }
                  
                  char output[65536];
                  if (run_tpk(w->tpk_path, "", output, sizeof(output)) == 0) {
                      parse_ui(output);
                      int wy = ly - 40;
                      for (int i = 0; i < n_ui_cmds; i++) {
                          if (strcmp(ui_cmds[i].cmd, "BTN") == 0 &&
                              lx >= ui_cmds[i].x && lx <= ui_cmds[i].x + ui_cmds[i].w &&
                              wy >= ui_cmds[i].y && wy <= ui_cmds[i].y + ui_cmds[i].h) {
                              char event[128];
                              snprintf(event, sizeof(event), "click_%s", ui_cmds[i].id);
                              char out2[65536];
                              run_tpk(w->tpk_path, event, out2, sizeof(out2));
                              return;
                          }
                      }
                  }
              } else {
                  int cols = 4, icon = 90, gx = 30, gy = 40;
                  int tw = cols*icon + (cols-1)*gx;
                  int sx = (W - tw)/2, sy = 80;
                  for (int i = 0; i < n_apps; i++) {
                      int col = i % cols, row = i / cols;
                      int ax = sx + col*(icon + gx);
                      int ay = sy + row*(icon + gy + 30);
                      if (mouse_x >= ax && mouse_x <= ax + icon &&
                          mouse_y >= ay && mouse_y <= ay + icon) {
                          create_window(apps[i].name, apps[i].filename, apps[i].color1);
                          return;
                      }
                  }
              }
          }

          /* ===== FAST Input with Mouse Smoothing ===== */
          static void init_input(void) {
              n_inputs = 0;
              sleep(2);
              for (int i = 0; i < 16 && n_inputs < MAX_INPUTS; i++) {
                  char path[64];
                  snprintf(path, sizeof(path), "/dev/input/event%d", i);
                  int fd = open(path, O_RDONLY | O_NONBLOCK);
                  if (fd >= 0) {
                      struct input_absinfo abs;
                      if (ioctl(fd, EVIOCGABS(ABS_X), &abs) == 0) {
                          abs_x_min = abs.minimum;
                          abs_x_max = abs.maximum;
                      }
                      if (ioctl(fd, EVIOCGABS(ABS_Y), &abs) == 0) {
                          abs_y_min = abs.minimum;
                          abs_y_max = abs.maximum;
                      }
                      input_fds[n_inputs++] = fd;
                  }
              }
          }

          static void poll_input(void) {
              if (n_inputs == 0) return;
              fd_set rfds;
              FD_ZERO(&rfds);
              int max_fd = -1;
              for (int i = 0; i < n_inputs; i++) {
                  FD_SET(input_fds[i], &rfds);
                  if (input_fds[i] > max_fd) max_fd = input_fds[i];
              }
              struct timeval tv = {0, 0};
              int ret = select(max_fd + 1, &rfds, NULL, NULL, &tv);
              if (ret <= 0) return;
              
              for (int i = 0; i < n_inputs; i++) {
                  if (!FD_ISSET(input_fds[i], &rfds)) continue;
                  struct input_event ev;
                  ssize_t r = read(input_fds[i], &ev, sizeof(ev));
                  if (r == sizeof(ev)) {
                      if (ev.type == EV_ABS) {
                          int raw_x = mouse_x, raw_y = mouse_y;
                          if (ev.code == ABS_X) {
                              int range = abs_x_max - abs_x_min;
                              if (range > 0)
                                  raw_x = (ev.value - abs_x_min) * (W - 1) / range;
                              else
                                  raw_x = ev.value * W / 32767;
                          }
                          if (ev.code == ABS_Y) {
                              int range = abs_y_max - abs_y_min;
                              if (range > 0)
                                  raw_y = (ev.value - abs_y_min) * (H - 1) / range;
                              else
                                  raw_y = ev.value * H / 32767;
                          }
                          
                          /* Mouse smoothing for faster feel */
                          smooth_x = smooth_x + (raw_x - smooth_x) / SMOOTH_FACTOR;
                          smooth_y = smooth_y + (raw_y - smooth_y) / SMOOTH_FACTOR;
                          mouse_x = smooth_x;
                          mouse_y = smooth_y;
                          
                          if (mouse_x < 0) mouse_x = 0;
                          if (mouse_x >= W) mouse_x = W - 1;
                          if (mouse_y < 0) mouse_y = 0;
                          if (mouse_y >= H) mouse_y = H - 1;
                          
                          if (ev.code == ABS_PRESSURE || ev.code == ABS_MT_PRESSURE) {
                              last_mouse_down = mouse_down;
                              mouse_down = (ev.value > 0) ? 1 : 0;
                              
                              if (mouse_down && !last_mouse_down) {
                                  gesture_start_x = mouse_x;
                                  gesture_start_y = mouse_y;
                                  gesture_active = 1;
                              }
                              if (!mouse_down && last_mouse_down && gesture_active) {
                                  handle_gesture_end();
                                  gesture_active = 0;
                              }
                          }
                      } else if (ev.type == EV_KEY) {
                          int v = ev.value;
                          if (v == 2) v = 1;
                          if (ev.code == BTN_LEFT || ev.code == BTN_TOUCH ||
                              ev.code == BTN_MOUSE || ev.code == BTN_RIGHT) {
                              last_mouse_down = mouse_down;
                              mouse_down = v;
                              
                              if (mouse_down && !last_mouse_down) {
                                  gesture_start_x = mouse_x;
                                  gesture_start_y = mouse_y;
                                  gesture_active = 1;
                              }
                              if (!mouse_down && last_mouse_down && gesture_active) {
                                  handle_gesture_end();
                                  gesture_active = 0;
                              }
                          }
                      } else if (ev.type == EV_REL) {
                          if (ev.code == REL_X) {
                              mouse_x += ev.value;
                              if (mouse_x < 0) mouse_x = 0;
                              if (mouse_x >= W) mouse_x = W - 1;
                          }
                          if (ev.code == REL_Y) {
                              mouse_y += ev.value;
                              if (mouse_y < 0) mouse_y = 0;
                              if (mouse_y >= H) mouse_y = H - 1;
                          }
                      }
                  }
              }
          }

          static void render(void) {
              memset(fb_back, 0, fb_size);
              draw_home();
              for (int i = 0; i < MAX_WINDOWS; i++)
                  if (windows[i].active) draw_window(i);
              draw_status_bar();
              draw_cursor();
              if (fb_front) memcpy(fb_front, fb_back, fb_size);
          }

          int main(void) {
              klog("init starting");
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              sleep(2);
              mkdir("/dev/pts", 0755);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);
              mount("tmpfs", "/tmp", "tmpfs", 0, NULL);
              mkdir(TPK_DIR, 0755);
              mkdir("/root", 0755);
              mkdir("/data", 0755);

              if (fork() == 0) {
                  setsid();
                  int fd = open("/dev/tty2", O_RDWR);
                  if (fd < 0) fd = open("/dev/console", O_RDWR);
                  if (fd >= 0) {
                      ioctl(fd, TIOCSCTTY, 1);
                      dup2(fd, 0); dup2(fd, 1); dup2(fd, 2);
                      if (fd > 2) close(fd);
                  }
                  setenv("PS1", "zenos~# ", 1);
                  setenv("HOME", "/root", 1);
                  setenv("PATH", "/bin:/usr/bin", 1);
                  execl("/bin/busybox", "sh", "-i", NULL);
                  exit(1);
              }

              {
                  int tty = open("/dev/tty1", O_RDWR);
                  if (tty >= 0) {
                      ioctl(tty, VT_ACTIVATE, 1);
                      ioctl(tty, VT_WAITACTIVE, 1);
                      ioctl(tty, KDSETMODE, KD_GRAPHICS);
                      close(tty);
                  }
              }

              sleep(1);
              for (int t = 0; t < 15; t++) {
                  fb_fd = open("/dev/fb0", O_RDWR);
                  if (fb_fd >= 0) break;
                  sleep(1);
              }
              if (fb_fd < 0) {
                  klog("no framebuffer!");
                  while (1) { int s; while (waitpid(-1, &s, WNOHANG) > 0); sleep(5); }
              }
              struct fb_var_screeninfo vi;
              ioctl(fb_fd, FBIOGET_VSCREENINFO, &vi);
              W = vi.xres; H = vi.yres;
              fb_size = W * H * 4;
              fb_front = mmap(0, fb_size, PROT_READ|PROT_WRITE, MAP_SHARED, fb_fd, 0);
              if (fb_front == MAP_FAILED) { klog("mmap fail"); return 1; }
              fb_back = malloc(fb_size);
              memset(fb_back, 0, fb_size);

              init_input();
              klog("GUI ready, %d inputs", n_inputs);

              while (1) {
                  poll_input();
                  int new_click = mouse_down && !last_mouse_down;
                  if (new_click) handle_click();
                  last_mouse_down = mouse_down;
                  render();
                  usleep(8333); /* 120 FPS for faster response */
                  int s;
                  while (waitpid(-1, &s, WNOHANG) > 0);
              }
              return 0;
          }
