name: Build zenOS Official Tizen Environment (ARM64 & x86_64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-tizen-arm64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. تثبيت أدوات معالجة حزم Tizen (RPM/cpio) وأدوات البناء
      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                                 bison flex libncurses-dev libssl-dev bc libelf-dev \
                                 qemu-user-static qemu-system-arm qemu-utils \
                                 e2fsprogs dosfstools kmod rpm2cpio cpio wget curl zstd

      # 2. بناء نواة Tizen المحسنة لـ ARM64 مع تفعيل الرسوميات
      - name: Compile ARM64 Graphics Kernel
        run: |
          mkdir -p kernel_build
          cd kernel_build
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz
          tar -xf linux-6.1.80.tar.xz
          cd linux-6.1.80
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig

          # تفعيل محركات الرسوميات كاملة
          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_VT
          scripts/config --enable CONFIG_TMPFS

          make -j$(nproc) Image
          cd ../..
          mkdir -p boot_kernel
          cp kernel_build/linux-6.1.80/arch/arm64/boot/Image boot_kernel/Image

      # 3. تحميل وتفكيك حزم Tizen الرسمية المحدثة
      - name: Fetch and Extract Tizen Unified Packages
        run: |
          mkdir -p tizen_rootfs/{bin,sbin,etc,proc,sys,usr,dev,mnt,boot,root,tmp,run,var}
          mkdir -p tizen_rpms
          cd tizen_rpms

          # رابط المستودع الرسمي المحدث لـ Tizen Unified Snapshot 2026
          TIZEN_REPO="https://download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/latest/repos/standard/packages/aarch64/"

          echo "Downloading essential Tizen Core packages..."
          # تحميل قائمة الحزم وفك الحزم الأساسية
          wget -q -r -l1 -nd -A "*busybox*.rpm,*glibc*.rpm,*bash*.rpm,*weston*.rpm,*wayland*.rpm,*efl*.rpm" "$TIZEN_REPO" || true

          echo "Extracting RPMs to rootfs..."
          for rpm in *.rpm; do
            if [ -f "$rpm" ]; then
              rpm2cpio "$rpm" | cpio -idmv -D ../tizen_rootfs 2>/dev/null || true
            fi
          done
          cd ..

      # 4. إعداد سكريبت البدء التلقائي للواجهة الرسومية Tizen (/sbin/init)
      - name: Configure Tizen Boot & Init Script
        run: |
          cp boot_kernel/Image tizen_rootfs/boot/Image

          # ضمان وجود busybox كبديل سريع للأوامر
          BUSYBOX_PATH=$(which busybox)
          cp $BUSYBOX_PATH tizen_rootfs/bin/busybox || true
          chmod +x tizen_rootfs/bin/busybox || true

          # إنشاء ملف /sbin/init
          cat << 'EOF' > tizen_rootfs/sbin/init
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev 2>/dev/null || true
          mkdir -p /dev/pts /dev/shm /tmp
          mount -t devpts none /dev/pts 2>/dev/null || true
          chmod 1777 /tmp

          clear
          echo "=================================================="
          echo "    Welcome to zenOS (Powered by Tizen Core)     "
          echo "=================================================="

          export XDG_RUNTIME_DIR=/tmp
          export DISPLAY=:0

          if [ -x /usr/bin/weston ]; then
            echo "Launching Tizen GUI (Weston)..."
            exec /usr/bin/weston --backend=drm-backend.so --continue-without-input
          elif [ -x /bin/bash ]; then
            exec /bin/bash
          else
            exec /bin/sh
          fi
          EOF
          chmod +x tizen_rootfs/sbin/init

      # 5. تجميع القرص لـ ARM64 (3GB)
      - name: Create Bootable Tizen OS Image (3GB)
        run: |
          dd if=/dev/zero of=zenOS-ARM64-Tizen-Official.img bs=1M count=3000
          mkfs.ext4 -F -L "zenOS-Tizen" zenOS-ARM64-Tizen-Official.img
          
          mkdir -p /tmp/zenos_mnt
          sudo mount -o loop zenOS-ARM64-Tizen-Official.img /tmp/zenos_mnt
          sudo cp -a tizen_rootfs/* /tmp/zenos_mnt/
          sudo umount /tmp/zenos_mnt

      # 6. رفع ملف الصورة لـ ARM64
      - name: Upload Tizen ARM64 Image
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Tizen-Official
          path: zenOS-ARM64-Tizen-Official.img
          
