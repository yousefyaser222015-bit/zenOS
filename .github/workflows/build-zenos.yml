name: Build zenOS Full Tizen GUI & Runtime (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-zenos-tizen-gui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                                 bison flex libncurses-dev libssl-dev bc libelf-dev \
                                 qemu-user-static qemu-system-arm qemu-utils \
                                 e2fsprogs dosfstools kmod rpm2cpio cpio wget curl zstd

      # 1. بناء النواة مع تفعيل كاميرات العرض ومعالجات الرسوميات VirtIO DRM
      - name: Compile ARM64 Graphics Kernel
        run: |
          mkdir -p kernel_build
          cd kernel_build
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz
          tar -xf linux-6.1.80.tar.xz
          cd linux-6.1.80
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig

          # تفعيل محركات الرسوميات كاملة
          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_VT
          scripts/config --enable CONFIG_INPUT_EVDEV

          make -j$(nproc) Image
          cd ../..
          mkdir -p boot_kernel
          cp kernel_build/linux-6.1.80/arch/arm64/boot/Image boot_kernel/Image

      # 2. تحميل بيئة Tizen Unified الشاملة (EFL, Wayland, Weston, Runtime)
      - name: Download & Install Full Tizen Runtime Packages
        run: |
          mkdir -p zenos_rootfs/{bin,sbin,etc,proc,sys,usr/bin,usr/lib,usr/libexec,dev,mnt,boot,root,tmp,run,lib,lib64,var/run}
          mkdir -p tizen_rpms
          cd tizen_rpms

          TIZEN_REPO="https://download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/latest/repos/standard/packages/aarch64/"
          
          echo "Downloading Tizen Runtime, EFL Graphics & Wayland Compositor..."
          wget -q -r -l1 -nd -A "*busybox*.rpm,*glibc*.rpm,*bash*.rpm,*weston*.rpm,*wayland*.rpm,*efl*.rpm,*elementary*.rpm,*cairo*.rpm,*pixman*.rpm,*libdrm*.rpm,*dbus*.rpm,*systemd*.rpm" "$TIZEN_REPO" || true

          for rpm in *.rpm; do
            if [ -f "$rpm" ]; then
              rpm2cpio "$rpm" | cpio -idmv -D ../zenos_rootfs 2>/dev/null || true
            fi
          done
          cd ..

          # إصلاح المسارات الرمزية للـ Dynamic Linker والمكتبات
          cd zenos_rootfs
          [ -d lib64 ] || mkdir lib64
          ln -sf /lib/ld-linux-aarch64.so.1 lib64/ld-linux-aarch64.so.1 2>/dev/null || true
          ln -sf /usr/lib/ld-linux-aarch64.so.1 lib/ld-linux-aarch64.so.1 2>/dev/null || true
          cd ..

      # 3. كتابة برنامج C Init لمكاملة وتشغيل Tizen GUI و Display Server تلقائياً
      - name: Compile Tizen Launcher Init Executable
        run: |
          cat << 'EOF' > init_tizen.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/stat.h>

          int main() {
              // تهيئة ملفات النظام الضرورية
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              mkdir("/dev/pts", 0755);
              mkdir("/dev/shm", 0755);
              mkdir("/tmp", 0777);
              mkdir("/run/user", 0755);
              mkdir("/run/user/0", 0700);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);

              printf("\n==================================================\n");
              printf("   zenOS (Full Tizen Runtime & GUI Launching...)  \n");
              printf("==================================================\n\n");

              // إعداد متغيرات بيئة Tizen و Wayland
              setenv("XDG_RUNTIME_DIR", "/run/user/0", 1);
              setenv("WAYLAND_DISPLAY", "wayland-0", 1);
              setenv("DISPLAY", ":0", 1);
              setenv("ELM_ENGINE", "wayland_egl", 1);

              // تشغيل D-Bus الخاص بخدمات Tizen
              if (access("/usr/bin/dbus-daemon", X_OK) == 0) {
                  system("/usr/bin/dbus-uuidgen --ensure");
                  system("/usr/bin/dbus-daemon --system --fork 2>/dev/null");
              }

              // تشغيل خادم العرض Weston / Tizen Compositor
              if (access("/usr/bin/weston", X_OK) == 0) {
                  printf("[zenOS] Starting Tizen Weston Compositor...\n");
                  execl("/usr/bin/weston", "weston", "--backend=drm-backend.so", "--log=/tmp/weston.log", NULL);
              } else if (access("/bin/weston", X_OK) == 0) {
                  printf("[zenOS] Starting Tizen Weston Compositor...\n");
                  execl("/bin/weston", "weston", "--backend=drm-backend.so", NULL);
              }

              printf("[zenOS] GUI Compositor not found, launching Tizen Shell...\n");
              execl("/bin/bash", "bash", NULL);
              execl("/bin/sh", "sh", NULL);

              while(1) { sleep(10); }
              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc -static init_tizen.c -o zenos_rootfs/sbin/init
          chmod +x zenos_rootfs/sbin/init
          cp boot_kernel/Image zenos_rootfs/boot/Image

      # 4. إنشاء القرص النهائي بحجم (4GB) ليعطي متسعاً لـ Tizen Runtime
      - name: Build Tizen GUI Disk Image
        run: |
          dd if=/dev/zero of=zenOS-ARM64-Tizen-GUI.img bs=1M count=4000
          mkfs.ext4 -F -L "zenOS-Tizen" zenOS-ARM64-Tizen-GUI.img
          
          mkdir -p /tmp/zenos_mnt
          sudo mount -o loop zenOS-ARM64-Tizen-GUI.img /tmp/zenos_mnt
          sudo cp -a zenos_rootfs/* /tmp/zenos_mnt/
          sudo umount /tmp/zenos_mnt

      # 5. رفع ملف الصورة لـ GitHub Artifacts
      - name: Upload Final Tizen GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Tizen-GUI
          path: zenOS-ARM64-Tizen-GUI.img
          
