name: Build zenOS ARM64 Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            bison flex libssl-dev bc libncurses5-dev libncursesw5-dev \
            qemu-utils u-boot-tools fdisk kpartx unzip busybox-static \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libexpat1-dev

      - name: Setup Workspace and Directories
        run: |
          mkdir -p workspace rootfs/bin rootfs/sbin rootfs/etc rootfs/proc rootfs/sys rootfs/dev rootfs/apps

      - name: Create Native C Init & Tizen/TPK Runner (SDL2 Interface)
        run: |
          cat << 'EOF' > workspace/init.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <SDL2/SDL.h>

          void mount_filesystems() {
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
          }

          int install_tpk(const char *tpk_path) {
              printf("[zenOS TPK Loader] Installing package: %s\n", tpk_path);
              char cmd[512];
              snprintf(cmd, sizeof(cmd), "unzip -o %s -d /apps/temp_app > /dev/null 2>&1", tpk_path);
              int res = system(cmd);
              if (res == 0) {
                  printf("[zenOS TPK Loader] TPK Extracted successfully to /apps/temp_app\n");
                  return 0;
              } else {
                  printf("[zenOS TPK Loader] Failed to extract TPK package.\n");
                  return -1;
              }
          }

          void run_gui() {
              if (SDL_Init(SDL_INIT_VIDEO) < 0) {
                  printf("SDL_Init Error: %s\n", SDL_GetError());
                  return;
              }

              SDL_Window *win = SDL_CreateWindow("zenOS Launcher (Tizen Style)",
                                                 SDL_WINDOWPOS_CENTERED, SDL_WINDOWPOS_CENTERED,
                                                 800, 480, SDL_WINDOW_SHOWN | SDL_WINDOW_FULLSCREEN);
              if (!win) {
                  SDL_Quit();
                  return;
              }

              SDL_Renderer *ren = SDL_CreateRenderer(win, -1, SDL_RENDERER_ACCELERATED | SDL_RENDERER_PRESENTVSYNC);

              int running = 1;
              SDL_Event e;
              while (running) {
                  while (SDL_PollEvent(&e)) {
                      if (e.type == SDL_QUIT || e.type == SDL_KEYDOWN) {
                          running = 0;
                      }
                  }

                  // Background - Tizen Blue (#1A2B4C)
                  SDL_SetRenderDrawColor(ren, 26, 43, 76, 255);
                  SDL_RenderClear(ren);

                  // Header Bar - Dark Blue (#0F1A2E)
                  SDL_SetRenderDrawColor(ren, 15, 26, 46, 255);
                  SDL_Rect header = {0, 0, 800, 50};
                  SDL_RenderFillRect(ren, &header);

                  // Tizen-style Round App Icons Placeholders
                  for (int i = 0; i < 4; i++) {
                      SDL_SetRenderDrawColor(ren, 240, 240, 240, 255);
                      SDL_Rect icon = {100 + (i * 170), 180, 100, 100};
                      SDL_RenderFillRect(ren, &icon);
                  }

                  SDL_RenderPresent(ren);
                  SDL_Delay(16);
              }

              SDL_DestroyRenderer(ren);
              SDL_DestroyWindow(win);
              SDL_Quit();
          }

          void run_shell() {
              printf("\nWelcome to zenOS ARM64 Shell\n");
              char command[256];
              while (1) {
                  printf("zenos~# ");
                  fflush(stdout);
                  if (fgets(command, sizeof(command), stdin) == NULL) break;
                  
                  command[strcspn(command, "\n")] = 0;

                  if (strcmp(command, "exit") == 0) break;
                  if (strcmp(command, "gui") == 0) {
                      run_gui();
                      continue;
                  }
                  if (strncmp(command, "tpk-install ", 12) == 0) {
                      install_tpk(command + 12);
                      continue;
                  }

                  system(command);
              }
          }

          int main(int argc, char *argv[]) {
              mount_filesystems();
              printf("=========================================\n");
              printf("       Starting zenOS Kernel & Init       \n");
              printf("=========================================\n");

              // Spawn GUI on startup (Background or Direct)
              printf("[zenOS] Starting SDL2 Tizen GUI...\n");
              run_gui();

              // Fallback to Interactive Shell
              run_shell();

              return 0;
          }
          EOF

      - name: Compile Init for ARM64
        run: |
          aarch64-linux-gnu-gcc -O2 workspace/init.c -o rootfs/init -static -lpthread -ldl

      - name: Populate RootFS with BusyBox & Utilities
        run: |
          # Copy BusyBox binary
          cp /bin/busybox rootfs/bin/busybox
          
          # Create essential symlinks
          cd rootfs/bin
          ln -s busybox sh
          ln -s busybox ls
          ln -s busybox cat
          ln -s busybox echo
          ln -s busybox mkdir
          ln -s busybox unzip
          cd ../..

      - name: Build Initramfs
        run: |
          cd rootfs
          find . | cpio -o -H newc | gzip -9 > ../workspace/initrd.img
          cd ..

      - name: Build U-Boot and Linux Kernel Stubs
        run: |
          # Prepare uImage & dummy DTB for booting simulation
          mkimage -A arm64 -O linux -T ramdisk -C gzip -d workspace/initrd.img workspace/uInitrd
          
          # Create a bootable script for U-Boot
          cat << 'EOF' > workspace/boot.cmd
          setenv bootargs "console=ttyAMA0 root=/dev/ram0 rw init=/init"
          echo "Booting zenOS Kernel..."
          bootm
          EOF
          
          mkimage -C none -A arm64 -T script -d workspace/boot.cmd workspace/boot.scr

      - name: Create zenOS .IMG Disk Output
        run: |
          # Create a 64MB raw disk image
          dd if=/dev/zero of=zenos-arm64.img bs=1M count=64
          
          # Create FAT16 Partition
          parted -s zenos-arm64.img mklabel msdos
          parted -s zenos-arm64.img mkpart primary fat16 1MiB 100%
          
          # Setup loop device
          LOOP_DEV=$(sudo losetup -fP --show zenos-arm64.img)
          sudo mkfs.vfat ${LOOP_DEV}p1
          
          # Mount and copy Boot Files
          mkdir -p mnt
          sudo mount ${LOOP_DEV}p1 mnt
          sudo cp workspace/uInitrd mnt/
          sudo cp workspace/boot.scr mnt/
          
          # Cleanup
          sudo umount mnt
          sudo losetup -d ${LOOP_DEV}

      - name: Upload zenOS Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenos-arm64-image
          path: zenos-arm64.img
          
