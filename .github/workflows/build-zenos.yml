name: Build ZenOS ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential gcc-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev cpio gzip \
            qemu-system-arm

      - name: Download sources
        run: |
          git clone --depth=1 https://github.com/torvalds/linux.git linux
          git clone --depth=1 https://github.com/bminor/busybox.git busybox

      - name: Build BusyBox
        run: |
          cd busybox
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          make CONFIG_PREFIX=$GITHUB_WORKSPACE/root install

      - name: Create ZenOS
        run: |
          mkdir -p root/{proc,sys,dev,tmp,run,etc,root,apps}
          mkdir -p root/usr/bin

          cat > root/etc/profile <<'EOF'
          export PATH=/bin:/sbin:/usr/bin:/usr/sbin
          export HOME=/root
          export PS1='zenos~# '
          EOF

          cat > root/etc/motd <<'EOF'
          =========================
                 ZenOS ARM64
          =========================
          Linux + BusyBox + TPK
          =========================
          EOF

          cat > root/init.c <<'EOF'
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/wait.h>
          #include <stdio.h>
          #include <stdlib.h>

          static void mount_fs(void)
          {
              mkdir("/proc",0555);
              mkdir("/sys",0555);
              mkdir("/dev",0755);
              mkdir("/tmp",01777);

              mount("proc","/proc","proc",0,NULL);
              mount("sysfs","/sys","sysfs",0,NULL);
              mount("devtmpfs","/dev","devtmpfs",0,NULL);
              mount("tmpfs","/tmp","tmpfs",0,"mode=1777");
          }

          int main(void)
          {
              if(getpid()!=1)
                  return 1;

              mount_fs();

              {
                  char *a[]={"/bin/busybox","--install","-s",NULL};
                  pid_t p=fork();

                  if(p==0)
                  {
                      execv(a[0],a);
                      _exit(127);
                  }

                  waitpid(p,NULL,0);
              }

              setenv("PATH",
                     "/bin:/sbin:/usr/bin:/usr/sbin",1);

              setenv("PS1","zenos~# ",1);
              setenv("HOME","/root",1);

              {
                  char *a[]={"/bin/zenos-gui",NULL};
                  if(fork()==0)
                  {
                      execv(a[0],a);
                      _exit(127);
                  }
              }

              for(;;)
              {
                  char *a[]={"/bin/sh","-l",NULL};
                  pid_t p=fork();

                  if(p==0)
                  {
                      execv(a[0],a);
                      _exit(127);
                  }

                  waitpid(p,NULL,0);
              }

              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc -static -O2 \
            root/init.c -o root/init
          chmod 755 root/init

      - name: Build TPK loader
        run: |
          cat > root/tpk.c <<'EOF'
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <limits.h>
          #include <dirent.h>
          #include <string.h>

          static int find_elf(const char *d,char *out)
          {
              DIR *x=opendir(d);
              if(!x) return -1;

              struct dirent *e;

              while((e=readdir(x)))
              {
                  if(e->d_name[0]=='.') continue;

                  char p[PATH_MAX];
                  snprintf(p,sizeof(p),"%s/%s",
                           d,e->d_name);

                  struct stat s;
                  if(stat(p,&s)) continue;

                  if(S_ISDIR(s.st_mode))
                  {
                      if(!find_elf(p,out))
                      {
                          closedir(x);
                          return 0;
                      }
                  }

                  if(S_ISREG(s.st_mode) &&
                     (s.st_mode&0111))
                  {
                      FILE *f=fopen(p,"rb");
                      unsigned char h[4];

                      if(f && fread(h,1,4,f)==4 &&
                         h[0]==0x7f &&
                         h[1]=='E' &&
                         h[2]=='L' &&
                         h[3]=='F')
                      {
                          fclose(f);
                          strncpy(out,p,PATH_MAX-1);
                          closedir(x);
                          return 0;
                      }

                      if(f) fclose(f);
                  }
              }

              closedir(x);
              return -1;
          }

          int main(int argc,char **argv)
          {
              if(argc!=2)
              {
                  fprintf(stderr,
                          "usage: tpk app.tpk\n");
                  return 2;
              }

              char dir[PATH_MAX];
              snprintf(dir,sizeof(dir),
                       "/tmp/tpk-%d",getpid());

              mkdir(dir,0700);

              pid_t p=fork();

              if(p==0)
              {
                  execl("/bin/busybox",
                        "busybox","unzip","-o",
                        argv[1],"-d",dir,NULL);
                  _exit(127);
              }

              int st;
              waitpid(p,&st,0);

              if(!WIFEXITED(st) || WEXITSTATUS(st))
              {
                  fprintf(stderr,"TPK: invalid package\n");
                  return 3;
              }

              char elf[PATH_MAX];

              if(find_elf(dir,elf))
              {
                  fprintf(stderr,
                          "TPK: ARM64 ELF not found\n");
                  return 4;
              }

              printf("TPK: %s\n",elf);
              execl(elf,elf,NULL);

              perror("TPK");
              return 5;
          }
          EOF

          aarch64-linux-gnu-gcc -static -O2 \
            root/tpk.c -o root/usr/bin/zenos-tpk

          chmod 755 root/usr/bin/zenos-tpk

          cat > root/usr/bin/tpk <<'EOF'
          #!/bin/sh
          exec /usr/bin/zenos-tpk "$1"
          EOF

          chmod 755 root/usr/bin/tpk

      - name: Build ZenOS GUI
        run: |
          cat > root/gui.c <<'EOF'
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <linux/fb.h>
          #include <stdint.h>

          int main(void)
          {
              int f=open("/dev/fb0",O_RDWR);
              if(f<0) return 0;

              struct fb_var_screeninfo v;
              struct fb_fix_screeninfo s;

              if(ioctl(f,FBIOGET_VSCREENINFO,&v)<0 ||
                 ioctl(f,FBIOGET_FSCREENINFO,&s)<0)
              {
                  close(f);
                  return 1;
              }

              long n=(long)s.line_length*v.yres;

              uint32_t *p=mmap(NULL,n,
                  PROT_READ|PROT_WRITE,
                  MAP_SHARED,f,0);

              if(p==MAP_FAILED)
              {
                  close(f);
                  return 1;
              }

              for(unsigned y=0;y<v.yres;y++)
                  for(unsigned x=0;x<v.xres;x++)
                  {
                      uint8_t r=8+(x*25)/v.xres;
                      uint8_t g=15+(y*35)/v.yres;
                      uint8_t b=45;

                      p[(y*s.line_length/4)+x] =
                          (r<<16)|(g<<8)|b;
                  }

              munmap(p,n);
              close(f);
              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc -static -O2 \
            root/gui.c -o root/usr/bin/zenos-gui

          chmod 755 root/usr/bin/zenos-gui

      - name: Build Linux
        run: |
          cd linux
          make ARCH=arm64 defconfig

          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_BLK_DEV_INITRD
          ./scripts/config --enable CONFIG_TMPFS
          ./scripts/config --enable CONFIG_EXT4_FS
          ./scripts/config --enable CONFIG_VIRTIO
          ./scripts/config --enable CONFIG_VIRTIO_PCI
          ./scripts/config --enable CONFIG_VIRTIO_BLK
          ./scripts/config --enable CONFIG_VIRTIO_NET
          ./scripts/config --enable CONFIG_DRM
          ./scripts/config --enable CONFIG_DRM_SIMPLEDRM
          ./scripts/config --enable CONFIG_FB
          ./scripts/config --enable CONFIG_FB_SIMPLE
          ./scripts/config --enable CONFIG_INPUT
          ./scripts/config --enable CONFIG_INPUT_EVDEV

          make ARCH=arm64 olddefconfig
          make -j$(nproc) ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- Image

      - name: Make ZenOS IMG
        run: |
          cd root
          find . -print0 |
            cpio --null -o -H newc |
            gzip -9 > ../zenos.img

          cd ..
          mkdir release
          cp linux/arch/arm64/boot/Image release/
          cp zenos.img release/

          sha256sum release/* > release/SHA256SUMS

      - name: Upload ZenOS
        uses: actions/upload-artifact@v4
        with:
          name: ZenOS-ARM64
          path: release/
