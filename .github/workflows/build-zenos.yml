name: Build Compact Tizen OS GUI & Runtime Engine (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-tizen-compact-gui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Native Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                                 bison flex libncurses-dev libssl-dev bc libelf-dev \
                                 qemu-system-arm qemu-utils \
                                 e2fsprogs dosfstools kmod rpm2cpio cpio wget curl zstd busybox-static

      - name: Compile Light DRM Kernel
        run: |
          mkdir -p kernel_build
          cd kernel_build
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz
          tar -xf linux-6.1.80.tar.xz
          cd linux-6.1.80
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig
          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_VIRTIO_PCI
          scripts/config --enable CONFIG_VIRTIO_MMIO
          scripts/config --enable CONFIG_VIRTIO_BLK
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_DRM_BOCHS
          scripts/config --enable CONFIG_DRM_SIMPLEDRM
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          scripts/config --enable CONFIG_VT
          scripts/config --enable CONFIG_INPUT_EVDEV
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable CONFIG_TMPFS
          make -j$(nproc) Image
          make -j$(nproc) modules
          cd../..
          mkdir -p boot_kernel
          cp kernel_build/linux-6.1.80/arch/arm64/boot/Image boot_kernel/Image

      - name: Fetch Latest Tizen Runtime Packages Only
        run: |
          mkdir -p zenos_rootfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,usr/lib,usr/libexec,dev,mnt,boot,root,tmp,run,lib,lib64,var/run,etc/dbus-1,etc/xdg/weston}
          mkdir -p tizen_rpms
          cd tizen_rpms
          TIZEN_REPO="https://download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/latest/repos/standard/packages/aarch64/"
          curl -sL "$TIZEN_REPO" | grep -oP 'href="\K[^"]+\.rpm' > rpm_list.txt
          # Filter only runtime, latest, no X11, no devel
          grep -Ei "glibc|busybox|bash|wayland|weston|libdrm|libxkbcommon|pixman|cairo|dbus|vconf|buxton|aul|pkgmgr|app-manager|efl|elementary|libinput|libevdev|libffi|mesa|libwayland|tzsh|enlightenment|seatd|libcap|libseccomp" rpm_list.txt | grep -vEi "\-devel|\-debug|\-doc|\-static|\-tests|examples|x11|xorg" | sort -u | head -n 220 > target_rpms.txt
          echo "Downloading $(wc -l < target_rpms.txt) packages"
          while read -r rpm_file; do
            [ -n "$rpm_file" ] && wget -q -c "${TIZEN_REPO}${rpm_file}" -O "$rpm_file" || true
          done < target_rpms.txt
          for rpm in *.rpm; do
            if [ -f "$rpm" ] && [ -s "$rpm" ]; then
              rpm2cpio "$rpm" | cpio -idmv -D../zenos_rootfs 2>/dev/null || true
            fi
          done
          cd..
          rm -rf zenos_rootfs/usr/share/man zenos_rootfs/usr/share/doc zenos_rootfs/usr/include zenos_rootfs/var/cache/*
          rm -rf zenos_rootfs/usr/apps/* 2>/dev/null || true
          # BusyBox
          cp /bin/busybox zenos_rootfs/bin/busybox
          cp /bin/busybox zenos_rootfs/bin/busybox.static
          chmod +x zenos_rootfs/bin/busybox*
          cd zenos_rootfs/bin &&./busybox --install -s. 2>/dev/null || true && cd../..
          # Libs and base files
          cd zenos_rootfs
          [ -d usr/lib64 ] && cp -a usr/lib64/* usr/lib/ 2>/dev/null || true
          [ -d lib64 ] || mkdir lib64
          if [ -f usr/lib/ld-linux-aarch64.so.1 ]; then
            ln -sf /usr/lib/ld-linux-aarch64.so.1 lib/ld-linux-aarch64.so.1 2>/dev/null || true
            ln -sf /usr/lib/ld-linux-aarch64.so.1 lib64/ld-linux-aarch64.so.1 2>/dev/null || true
          fi
          echo -e "/usr/lib\n/lib\n/usr/local/lib" > etc/ld.so.conf
          echo "root:x:0:0:root:/root:/bin/bash" > etc/passwd
          echo "root:x:0:" > etc/group
          echo "zenOS" > etc/hostname
          echo 'NAME="zenOS" ID=zenos VERSION="1.0-Tizen" PRETTY_NAME="zenOS Tizen Compact"' > etc/os-release
          echo "PS1='zenos~# '" > etc/profile
          echo "rootfs / auto defaults 0" > etc/fstab
          cd..

      - name: Setup Tizen Engine & GUI Script
        run: |
          cat << 'EOF' > zenos_rootfs/etc/xdg/weston/weston.ini
          [core]
          backend=drm-backend.so
          use-pixman=true
          idle-time=0
          [shell]
          background-color=0xFF111111
          panel-position=none
          [output]
          name=DSI-1
          mode=1024x768
          EOF

          cat << 'EOF' > zenos_rootfs/usr/bin/start-tizen-gui
          #!/bin/sh
          export XDG_RUNTIME_DIR=/run/user/0
          export WAYLAND_DISPLAY=wayland-0
          export ELM_ENGINE=wayland_egl
          export ELM_DISPLAY=wl
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export LD_LIBRARY_PATH=/usr/lib:/lib:/usr/local/lib
          mkdir -p /run/user/0 /var/run/dbus /tmp
          chmod 700 /run/user/0
          rm -f /run/zenos-gui-ready /tmp/weston.log
          /sbin/ldconfig 2>/dev/null || true

          # Start Tizen core daemons for TPK support
          dbus-uuidgen --ensure 2>/dev/null || true
          dbus-daemon --system --fork 2>/dev/null || dbus-daemon --session --fork 2>/dev/null || true
          vconf-init 2>/dev/null || true
          buxtond 2>/dev/null &
          sleep 1

          launch_tizen_ui() {
            if [ -x /usr/bin/tzsh ]; then
              tzsh &
            elif [ -x /usr/bin/enlightenment ]; then
              enlightenment &
            fi
            if [ -x /usr/bin/pkgcmd ]; then
              echo "[zenOS] pkgcmd available for TPK"
            fi
          }

          attempt_backend() {
            BNAME=$1
            echo "[zenOS] Trying backend: $BNAME"
            weston --backend=${BNAME}-backend.so --use-pixman --idle-time=0 --log=/tmp/weston.log &
            sleep 4
            if pgrep weston > /dev/null; then
              echo "[zenOS] Weston $BNAME started OK"
              touch /run/zenos-gui-ready
              launch_tizen_ui
              return 0
            else
              echo "[zenOS] Weston $BNAME failed"
              pkill -9 weston 2>/dev/null || true
              sleep 1
              return 1
            fi
          }

          # Fallback chain: drm -> fbdev -> headless
          if [ -e /dev/dri/card0 ]; then
            attempt_backend drm && exit 0
          fi
          attempt_backend fbdev && exit 0

          echo "[zenOS] GUI backends failed, starting runtime only"
          launch_tizen_ui
          # Keep runtime alive even without GUI, TPK can still run headless
          touch /run/zenos-gui-ready
          exit 0
          EOF
          chmod +x zenos_rootfs/usr/bin/start-tizen-gui

      - name: Create Native Tizen C Init Tool
        run: |
          cat << 'EOF' > tizen_init.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          int main() {
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              mkdir("/dev/pts", 0755);
              mkdir("/dev/shm", 0755);
              mkdir("/tmp", 0777);
              mkdir("/run", 0755);
              mkdir("/run/user", 0755);
              mkdir("/run/user/0", 0700);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);
              mount("tmpfs", "/tmp", "tmpfs", 0, NULL);
              mount("tmpfs", "/run", "tmpfs", 0, NULL);
              mkdir("/run/user", 0755);
              mkdir("/run/user/0", 0700);

              printf("\n==================================================\n");
              printf(" zenOS (Booting Tizen GUI & Runtime Engine) \n");
              printf("==================================================\n\n");

              setenv("PS1", "zenos~# ", 1);
              setenv("TERM", "xterm", 1);
              setenv("PATH", "/usr/bin:/bin:/usr/sbin:/sbin", 1);
              setenv("XDG_RUNTIME_DIR", "/run/user/0", 1);

              printf("[zenOS] Starting GUI engine in background...\n");
              pid_t pid = fork();
              if (pid == 0) {
                  execl("/usr/bin/start-tizen-gui", "start-tizen-gui", NULL);
                  _exit(0);
              }
              sleep(6);
              if (access("/run/zenos-gui-ready", F_OK) == 0) {
                  printf("[zenOS] Runtime layer is ACTIVE\n");
                  printf("[zenOS] If VNC shows black, check /tmp/weston.log\n");
              } else {
                  printf("[zenOS] GUI not ready, falling back to shell\n");
              }
              printf("[zenOS] Dropping to zenos~# shell\n\n");
              while(1) {
                  if (access("/bin/bash", X_OK) == 0) {
                      execl("/bin/bash", "bash", "--login", NULL);
                  }
                  execl("/bin/busybox", "sh", "-l", NULL);
                  execl("/bin/busybox.static", "sh", "-l", NULL);
                  sleep(1);
              }
              return 0;
          }
          EOF
          aarch64-linux-gnu-gcc -static tizen_init.c -o zenos_rootfs/sbin/init
          chmod +x zenos_rootfs/sbin/init
          cp boot_kernel/Image zenos_rootfs/boot/Image
          # Install kernel modules to rootfs
          cd kernel_build/linux-6.1.80
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make modules_install INSTALL_MOD_PATH=../../zenos_rootfs 2>/dev/null || true
          cd../..

      - name: Create System Image with Auto Shrink
        run: |
          dd if=/dev/zero of=zenOS-ARM64-Tizen-GUI.img bs=1M count=1200
          mkfs.ext4 -F -L "zenOS-Tizen" zenOS-ARM64-Tizen-GUI.img
          mkdir -p /tmp/zenos_mnt
          sudo mount -o loop zenOS-ARM64-Tizen-GUI.img /tmp/zenos_mnt
          sudo cp -a zenos_rootfs/* /tmp/zenos_mnt/
          sudo umount /tmp/zenos_mnt
          echo "Shrinking image to minimal size..."
          sudo e2fsck -f -y zenOS-ARM64-Tizen-GUI.img || true
          sudo resize2fs -M zenOS-ARM64-Tizen-GUI.img
          BLOCK_COUNT=$(sudo dumpe2fs -h zenOS-ARM64-Tizen-GUI.img 2>/dev/null | grep "Block count" | awk '{print $3}')
          BLOCK_SIZE=$(sudo dumpe2fs -h zenOS-ARM64-Tizen-GUI.img 2>/dev/null | grep "Block size" | awk '{print $3}')
          if [ -n "$BLOCK_COUNT" ] && [ -n "$BLOCK_SIZE" ]; then
            NEW_BYTES=$((BLOCK_COUNT * BLOCK_SIZE))
            NEW_BYTES=$((NEW_BYTES + 30*1024*1024))
            echo "New size: $NEW_BYTES bytes"
            truncate -s $NEW_BYTES zenOS-ARM64-Tizen-GUI.img
            sudo e2fsck -f -y zenOS-ARM64-Tizen-GUI.img || true
            sudo resize2fs zenOS-ARM64-Tizen-GUI.img || true
          fi
          ls -lh zenOS-ARM64-Tizen-GUI.img
          cat << 'READ' > README.txt
          zenOS - Tizen Compact Light OS - QEMU Direct Boot

          Termux QEMU command for VNC :5
          qemu-system-aarch64 -M virt -cpu cortex-a72 -m 1024 -kernel Image -append "root=/dev/vda rw console=ttyAMA0 console=tty0 init=/sbin/init" -drive if=none,file=zenOS-ARM64-Tizen-GUI.img,format=raw,id=hd0 -device virtio-blk-device,drive=hd0 -device virtio-gpu-pci -display none -vnc :5 -serial mon:stdio

          Then open VNC Viewer to localhost:5905
          Shell prompt is zenos~#
          If GUI fails: cat /tmp/weston.log ; weston --backend=fbdev-backend.so --use-pixman &
          TPK runtime: pkgcmd -l or pkgcmd -i -t tpk -p /path/app.tpk
          READ
          zip -r zenOS-Complete.zip zenOS-ARM64-Tizen-GUI.img boot_kernel/Image README.txt
          ls -lh zenOS-Complete.zip

      - name: Upload Tizen Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Tizen-GUI
          path: zenOS-Complete.zip
