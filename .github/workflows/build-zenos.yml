          static inline void px(int x, int y, uint32_t c) {
              if ((unsigned)x < (unsigned)W && (unsigned)y < (unsigned)H)
                  fb_back[y * W + x] = c;
          }

          static void fill_rect(int x, int y, int w, int h, uint32_t c) {
              if (x < 0) { w += x; x = 0; }
              if (y < 0) { h += y; y = 0; }
              if (x + w > W) w = W - x;
              if (y + h > H) h = H - y;
              if (w <= 0 || h <= 0) return;
              uint32_t *p = fb_back + y * W + x;
              for (int j = 0; j < h; j++) {
                  uint32_t *row = p + j * W;
                  for (int i = 0; i < w; i++) row[i] = c;
              }
          }

          static void rrect(int x, int y, int w, int h, int r, uint32_t c) {
              if (r > w/2) r = w/2;
              if (r > h/2) r = h/2;
              fill_rect(x + r, y, w - 2*r, h, c);
              fill_rect(x, y + r, r, h - 2*r, c);
              fill_rect(x + w - r, y + r, r, h - 2*r, c);
              for (int j = -r; j <= r; j++)
                  for (int i = -r; i <= r; i++)
                      if (i*i + j*j <= r*r) {
                          px(x + r + i, y + r + j, c);
                          px(x + w - r - 1 + i, y + r + j, c);
                          px(x + r + i, y + h - r - 1 + j, c);
                          px(x + w - r - 1 + i, y + h - r - 1 + j, c);
                      }
          }

          static void dchar(int x, int y, char ch, int s, uint32_t c) {
              if (ch < 32 || ch > 126) ch = '?';
              const uint8_t *g = font8x16[ch - 32];
              for (int row = 0; row < 16; row++)
                  for (int col = 0; col < 8; col++)
                      if (g[row] & (0x80 >> col))
                          for (int sy = 0; sy < s; sy++)
                              for (int sx = 0; sx < s; sx++)
                                  px(x + col*s + sx, y + row*s + sy, c);
          }

          static void dstr(int x, int y, const char *s, int sc, uint32_t c) {
              int cx = x;
              for (int i = 0; s[i]; i++) {
                  if (s[i] == '\n') { cx = x; y += 16*sc + 2; continue; }
                  dchar(cx, y, s[i], sc, c);
                  cx += 8*sc;
              }
          }

          static int strw(const char *s, int sc) { return strlen(s) * 8 * sc; }

          static void cmd_ls(const char *path, char *out, int sz) {
              out[0] = 0;
              DIR *d = opendir(path);
              if (!d) { snprintf(out, sz, "Cannot open %s", path); return; }
              struct dirent *e;
              int pos = 0;
              while ((e = readdir(d)) != NULL && pos < sz - 200) {
                  char full[512];
                  snprintf(full, sizeof(full), "%s/%s", path, e->d_name);
                  struct stat st;
                  if (stat(full, &st) == 0) {
                      char type = S_ISDIR(st.st_mode) ? 'd' : '-';
                      int len = snprintf(out + pos, sz - pos,
                          "%c %7ld %s\n", type, (long)st.st_size, e->d_name);
                      if (len > 0) pos += len;
                  }
              }
              closedir(d);
          }

          static void cmd_ps(char *out, int sz) {
              out[0] = 0;
              int pos = snprintf(out, sz, "PID   CMD\n");
              DIR *d = opendir("/proc");
              if (!d) return;
              struct dirent *e;
              while ((e = readdir(d)) != NULL && pos < sz - 200) {
                  if (!isdigit(e->d_name[0])) continue;
                  char path[256];
                  snprintf(path, sizeof(path), "/proc/%s/comm", e->d_name);
                  FILE *f = fopen(path, "r");
                  if (f) {
                      char name[64] = {0};
                      if (fgets(name, sizeof(name), f)) {
                          name[strcspn(name, "\n")] = 0;
                          pos += snprintf(out + pos, sz - pos, "%-5s %s\n", e->d_name, name);
                      }
                      fclose(f);
                  }
              }
              closedir(d);
          }

          static void cmd_df(char *out, int sz) {
              out[0] = 0;
              struct statvfs st;
              int pos = snprintf(out, sz, "Mount      Size    Used\n");
              const char *mounts[] = {"/", "/tmp", "/var", NULL};
              for (int i = 0; mounts[i]; i++) {
                  if (statvfs(mounts[i], &st) == 0) {
                      unsigned long total = st.f_blocks * st.f_frsize / (1024*1024);
                      unsigned long free_m = st.f_bfree * st.f_frsize / (1024*1024);
                      unsigned long used = total - free_m;
                      pos += snprintf(out + pos, sz - pos, "%-10s %4luM   %4luM\n",
                          mounts[i], total, used);
                  }
              }
          }

          static void cmd_uname(char *out, int sz) {
              struct utsname u;
              if (uname(&u) == 0) {
                  snprintf(out, sz, "%s %s %s %s %s",
                      u.sysname, u.nodename, u.release, u.version, u.machine);
              } else {
                  snprintf(out, sz, "uname failed");
              }
          }

          static void cmd_meminfo(char *out, int sz) {
              FILE *f = fopen("/proc/meminfo", "r");
              if (!f) { snprintf(out, sz, "Cannot open /proc/meminfo"); return; }
              size_t r = fread(out, 1, sz - 1, f);
              out[r] = 0;
              fclose(f);
          }

          static void cmd_date(char *out, int sz) {
              time_t t = time(NULL);
              struct tm *tm = localtime(&t);
              strftime(out, sz, "%Y-%m-%d %H:%M:%S %Z", tm);
          }

          static void cmd_uptime(char *out, int sz) {
              FILE *f = fopen("/proc/uptime", "r");
              if (!f) { snprintf(out, sz, "?"); return; }
              double up = 0, idle = 0;
              if (fscanf(f, "%lf %lf", &up, &idle) == 2) {
                  int days = (int)(up / 86400);
                  int hours = (int)(up / 3600) % 24;
                  int mins = (int)(up / 60) % 60;
                  snprintf(out, sz, "Up: %dd %dh %dm", days, hours, mins);
              }
              fclose(f);
          }

          static void cmd_dmesg(char *out, int sz) {
              out[0] = 0;
              FILE *f = fopen("/dev/kmsg", "r");
              if (!f) { snprintf(out, sz, "Cannot read kmsg"); return; }
              char lines[32][128];
              int idx = 0, count = 0;
              char line[256];
              int max_reads = 200;
              while (max_reads-- > 0 && fgets(line, sizeof(line), f)) {
                  strncpy(lines[idx], line, 127);
                  lines[idx][127] = 0;
                  char *nl = strchr(lines[idx], '\n');
                  if (nl) *nl = 0;
                  idx = (idx + 1) % 32;
                  if (count < 32) count++;
              }
              fclose(f);
              int pos = 0;
              for (int i = 0; i < count; i++) {
                  int real_idx = (idx - count + i + 32) % 32;
                  pos += snprintf(out + pos, sz - pos, "%.80s\n", lines[real_idx]);
              }
              if (pos == 0) snprintf(out, sz, "(no dmesg)");
          }

          static void terminal_exec(const char *cmd_name, char *out, int sz) {
              if (strcmp(cmd_name, "ls") == 0) cmd_ls("/", out, sz);
              else if (strcmp(cmd_name, "ps") == 0) cmd_ps(out, sz);
              else if (strcmp(cmd_name, "df") == 0) cmd_df(out, sz);
              else if (strcmp(cmd_name, "uname") == 0) cmd_uname(out, sz);
              else if (strcmp(cmd_name, "mem") == 0) cmd_meminfo(out, sz);
              else if (strcmp(cmd_name, "date") == 0) cmd_date(out, sz);
              else if (strcmp(cmd_name, "uptime") == 0) cmd_uptime(out, sz);
              else if (strcmp(cmd_name, "dmesg") == 0) cmd_dmesg(out, sz);
              else if (strcmp(cmd_name, "whoami") == 0) snprintf(out, sz, "root (uid=0)");
              else if (strcmp(cmd_name, "clear") == 0) out[0] = 0;
              else snprintf(out, sz, "Unknown: %s", cmd_name);
          }

          typedef struct {
              char cmd[16], id[32], text[128];
              int x, y, w, h, size;
              uint32_t color;
          } ui_cmd_t;
          static ui_cmd_t ui_cmds[256];
          static int n_ui_cmds = 0;

          static void parse_ui(const char *output) {
              n_ui_cmds = 0;
              const char *p = output;
              while (*p && n_ui_cmds < 256) {
                  while (*p && isspace(*p)) p++;
                  if (!*p) break;
                  ui_cmd_t *c = &ui_cmds[n_ui_cmds];
                  memset(c, 0, sizeof(*c));
                  char line[512];
                  int i = 0;
                  while (*p && *p != '\n' && i < 511) line[i++] = *p++;
                  line[i] = 0;
                  if (*p == '\n') p++;
                  char *save, *tok = strtok_r(line, " \t", &save);
                  if (!tok) continue;
                  if (strcmp(tok, "BG") == 0) {
                      strcpy(c->cmd, "BG");
                      tok = strtok_r(NULL, " \t", &save);
                      if (tok) c->color = strtoul(tok, NULL, 0);
                  } else if (strcmp(tok, "RECT") == 0) {
                      strcpy(c->cmd, "RECT");
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->w = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->h = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->color = strtoul(tok, NULL, 0);
                  } else if (strcmp(tok, "TEXT") == 0) {
                      strcpy(c->cmd, "TEXT");
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->size = atoi(tok);
                      char *q = strchr(save, '"'); char *e = NULL;
                      if (q) { q++; e = strchr(q, '"'); if (e) { int l = e - q; if (l > 127) l = 127; strncpy(c->text, q, l); c->text[l] = 0; } }
                      if (q && e) { q = e + 1; while (*q == ' ' || *q == '\t') q++; if (*q) c->color = strtoul(q, NULL, 0); }
                  } else if (strcmp(tok, "BTN") == 0) {
                      strcpy(c->cmd, "BTN");
                      tok = strtok_r(NULL, " \t", &save); if (tok) strncpy(c->id, tok, 31);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->w = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->h = atoi(tok);
                      char label[64] = {0}; char *q = strchr(save ? save : "", '"'); char *e = NULL;
                      if (q) { q++; e = strchr(q, '"'); if (e) { int l = e - q; if (l > 63) l = 63; strncpy(label, q, l); label[l] = 0; } }
                      if (q && e) { q = e + 1; while (*q == ' ' || *q == '\t') q++; c->color = strtoul(q, NULL, 0); }
                      snprintf(c->text, sizeof(c->text), "%s", label);
                  }
                  n_ui_cmds++;
              }
          }

          static void build_terminal_ui(app_t *a, int refresh) {
              char *out = a->ui;
              int pos = 0;
              pos += snprintf(out + pos, sizeof(a->ui) - pos,
                  "BG 0x000000\n"
                  "TEXT 10 10 2 \"zenOS Terminal\" 0x00FF00\n"
                  "RECT 10 40 680 1 0x008800\n"
                  "BTN ls 10 50 80 36 \"ls\" 0x2D3436\n"
                  "BTN ps 100 50 80 36 \"ps\" 0x2D3436\n"
                  "BTN df 190 50 80 36 \"df\" 0x2D3436\n"
                  "BTN uname 280 50 80 36 \"uname\" 0x2D3436\n"
                  "BTN mem 370 50 80 36 \"mem\" 0x2D3436\n"
                  "BTN date 460 50 80 36 \"date\" 0x2D3436\n"
                  "BTN uptime 550 50 80 36 \"uptime\" 0x0984E3\n"
                  "BTN dmesg 10 95 80 36 \"dmesg\" 0x6C5CE7\n"
                  "BTN whoami 100 95 80 36 \"whoami\" 0x0984E3\n"
                  "BTN clear 190 95 80 36 \"clear\" 0xD63031\n");

              char result[8192] = {0};
              char rpath[512];
              snprintf(rpath, sizeof(rpath), "%s/result.txt", a->dir);
              int fd = open(rpath, O_RDONLY);
              if (fd >= 0) {
                  ssize_t r = read(fd, result, sizeof(result) - 1);
                  close(fd);
                  if (r > 0) result[r] = 0;
              }

              int y = 140;
              char *line = strtok(result, "\n");
              while (line && y < 400 && pos < (int)sizeof(a->ui) - 200) {
                  if (strlen(line) > 90) line[90] = 0;
                  char safe[128];
                  int si = 0;
                  for (int i = 0; line[i] && si < 120; i++) {
                      if (line[i] == '"') safe[si++] = '\'';
                      else safe[si++] = line[i];
                  }
                  safe[si] = 0;
                  pos += snprintf(out + pos, sizeof(a->ui) - pos,
                      "TEXT 10 %d 1 \"%s\" 0x00FF00\n", y, safe);
                  y += 12;
                  line = strtok(NULL, "\n");
              }
              a->ui_valid = 1;
          }

          static void build_monitor_ui(app_t *a, int refresh) {
              char *out = a->ui;
              int pos = 0;
              pos += snprintf(out + pos, sizeof(a->ui) - pos,
                  "BG 0x0A0A1E\n"
                  "TEXT 10 10 2 \"System Monitor\" 0x00D4FF\n");

              struct utsname uts_info;  /* FIXED: renamed from 'u' */
              if (uname(&uts_info) == 0) {
                  pos += snprintf(out + pos, sizeof(a->ui) - pos,
                      "TEXT 10 40 1 \"Kernel: %s\" 0xFFFFFF\n", uts_info.release);
              }

              FILE *f = fopen("/proc/uptime", "r");
              if (f) {
                  double up = 0;
                  if (fscanf(f, "%lf", &up) == 1) {  /* FIXED: check return value */
                      int d = (int)(up/86400), h = (int)(up/3600)%24, m = (int)(up/60)%60;
                      pos += snprintf(out + pos, sizeof(a->ui) - pos,
                          "TEXT 10 56 1 \"Uptime: %dd %dh %dm\" 0xFFFFFF\n", d, h, m);
                  }
                  fclose(f);
              }

              long total = 0, avail = 0;
              f = fopen("/proc/meminfo", "r");
              if (f) {
                  char line[128];
                  while (fgets(line, sizeof(line), f)) {
                      if (strncmp(line, "MemTotal:", 9) == 0) sscanf(line + 10, "%ld", &total);
                      if (strncmp(line, "MemAvailable:", 13) == 0) sscanf(line + 14, "%ld", &avail);
                  }
                  fclose(f);
              }
              long used = total - avail;  /* FIXED: renamed from 'u' to 'used' */
              int pct = total > 0 ? (int)(used * 100 / total) : 0;
              pos += snprintf(out + pos, sizeof(a->ui) - pos,
                  "TEXT 10 80 1 \"RAM: %ld/%ld MB (%d%%)\" 0xFFFFFF\n"
                  "RECT 10 100 500 12 0x2D3436\n"
                  "RECT 10 100 %d 12 0x00B894\n"
                  "TEXT 10 130 1 \"Processes:\" 0xFDCB6E\n",
                  used/1024, total/1024, pct, pct*5);

              int y = 150;
              DIR *d = opendir("/proc");
              if (d) {
                  struct dirent *e;
                  int n = 0;
                  while ((e = readdir(d)) && n < 12 && y < 340) {
                      if (!isdigit(e->d_name[0])) continue;
                      char pth[256];
                      snprintf(pth, sizeof(pth), "/proc/%s/comm", e->d_name);
                      FILE *cf = fopen(pth, "r");
                      if (cf) {
                          char nm[64] = {0};
                          if (fgets(nm, sizeof(nm), cf)) {
                              nm[strcspn(nm, "\n")] = 0;
                              pos += snprintf(out + pos, sizeof(a->ui) - pos,
                                  "TEXT 10 %d 1 \"[%s] %s\" 0xCCCCCC\n", y, e->d_name, nm);
                              y += 12;
                              n++;
                          }
                          fclose(cf);
                      }
                  }
                  closedir(d);
              }
              pos += snprintf(out + pos, sizeof(a->ui) - pos,
                  "BTN refresh 10 340 120 36 \"Refresh\" 0x0984E3\n");
              a->ui_valid = 1;
          }

