name: Build Full Tizen OS Image with Native GUI (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-full-tizen-os:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. تثبيت أدوات التعامل مع حزم Tizen (RPM Tools) وأدوات البناء
      - name: Install Build & Tizen Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                                 bison flex libncurses-dev libssl-dev bc libelf-dev \
                                 qemu-user-static qemu-system-arm qemu-utils \
                                 e2fsprogs dosfstools kmod rpm2cpio cpio wget curl zstd

      # 2. بناء نواة Tizen مع تفعيل شاشة الجرافيك و DRMs
      - name: Compile Tizen-Optimized ARM64 Kernel
        run: |
          mkdir -p kernel_build
          cd kernel_build
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz
          tar -xf linux-6.1.80.tar.xz
          cd linux-6.1.80
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig

          # تفعيل محركات الرسوميات كاملة
          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          scripts/config --enable CONFIG_VT
          scripts/config --enable CONFIG_TMPFS

          make -j$(nproc) Image
          cd ../..
          mkdir -p boot_kernel
          cp kernel_build/linux-6.1.80/arch/arm64/boot/Image boot_kernel/Image

      # 3. جلب مكونات وحزم Tizen Core & GUI من مستودعات Tizen الرسمية
      - name: Fetch Official Tizen Core & Graphic Packages
        run: |
          mkdir -p tizen_rootfs/{bin,sbin,etc,proc,sys,usr,dev,mnt,boot,root,tmp,run,var}
          mkdir -p tizen_downloads
          cd tizen_downloads

          # تحميل حزم Tizen Base و System Core و Graphic Libraries
          echo "Downloading Tizen Packages..."
          BASE_URL="http://download.tizen.org/releases/weekly/tizen/unified/latest/repos/standard/packages/aarch64"
          
          # تنزيل أهم حزم تشغيل Tizen الأساسية
          wget -q -r -l1 -nd -A "*.rpm" "$BASE_URL/" || true

          echo "Extracting Tizen Packages into RootFS..."
          for rpm in *.rpm; do
            if [ -f "$rpm" ]; then
              rpm2cpio "$rpm" | cpio -idmv -D ../tizen_rootfs 2>/dev/null || true
            fi
          done
          cd ..

      # 4. تهيئة سكريبت الإقلاع والواجهة الرسومية لنظام zenOS
      - name: Setup Tizen Init & Desktop Startup Script
        run: |
          # نسخ النواة داخل RootFS
          cp boot_kernel/Image tizen_rootfs/boot/Image

          # التأكد من وجود Busybox كاحتياطي للأوامر
          BUSYBOX_PATH=$(which busybox)
          cp $BUSYBOX_PATH tizen_rootfs/bin/busybox || true
          chmod +x tizen_rootfs/bin/busybox || true

          # إنشاء ملف التشغيل الرئيسي /etc/init
          cat << 'EOF' > tizen_rootfs/etc/init
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev 2>/dev/null || true
          mkdir -p /dev/pts /dev/shm /tmp
          mount -t devpts none /dev/pts 2>/dev/null || true
          chmod 1777 /tmp

          clear
          echo "=================================================="
          echo "    Starting zenOS (Official Tizen Core & GUI)    "
          echo "=================================================="

          export XDG_RUNTIME_DIR=/tmp
          export DISPLAY=:0

          # تشغيل واجهة Tizen / Weston الرسومية
          if [ -x /usr/bin/weston ]; then
            echo "Starting Tizen Graphic Display..."
            exec /usr/bin/weston --backend=drm-backend.so --continue-without-input
          elif [ -x /usr/bin/enlightenment ]; then
            echo "Starting Tizen Enlightenment Desktop..."
            exec /usr/bin/enlightenment
          else
            echo "Starting Tizen Shell System..."
            exec /bin/sh
          fi
          EOF
          chmod +x tizen_rootfs/etc/init

      # 5. إنشاء قرص النظام الكامل بحجم 3GB
      - name: Create Bootable Tizen OS Image (3GB)
        run: |
          dd if=/dev/zero of=zenOS-arm64-tizen-full.img bs=1M count=3000
          mkfs.ext4 -F -L "zenOS-Tizen" zenOS-arm64-tizen-full.img
          
          mkdir -p /tmp/zenos_mnt
          sudo mount -o loop zenOS-arm64-tizen-full.img /tmp/zenos_mnt
          sudo cp -a tizen_rootfs/* /tmp/zenos_mnt/
          sudo umount /tmp/zenos_mnt

          ls -lh zenOS-arm64-tizen-full.img

      # 6. رفع الصورة المكتملة
      - name: Upload Full Tizen OS Image
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Full-Tizen-Image
          path: zenOS-arm64-tizen-full.img
          
