          echo "BTN h1 200 48 100 24 \"Set: zenos\" 0x0984E3"
          echo "BTN h2 310 48 100 24 \"Set: tizen\" 0x0984E3"
          echo "BTN h3 420 48 100 24 \"Set: samsung\" 0x0984E3"

          echo "TEXT 10 90 1 \"Kernel: $KVER\" 0xFFFFFF"
          echo "TEXT 10 106 1 \"Arch: $(uname -m)\" 0xFFFFFF"

          echo "TEXT 10 140 1 \"--- Storage ---\" 0xFDCB6E"
          df -h / 2>/dev/null | awk 'NR==2 {printf "TEXT 10 160 1 \"Root: %s used of %s (%s)\" 0xFFFFFF\n", $3, $2, $5}'

          echo "TEXT 10 190 1 \"--- System Info ---\" 0xFDCB6E"
          CPUINFO=$(awk '/processor/ {c++} END {print c}' /proc/cpuinfo 2>/dev/null || echo "?")
          MEM=$(awk '/MemTotal/ {printf "%.0f MB", $2/1024}' /proc/meminfo 2>/dev/null || echo "?")
          echo "TEXT 10 210 1 \"CPU cores: $CPUINFO\" 0xFFFFFF"
          echo "TEXT 10 226 1 \"RAM: $MEM\" 0xFFFFFF"

          echo "TEXT 10 260 1 \"--- Timezone Actions ---\" 0xFDCB6E"
          echo "BTN date 10 280 200 30 \"Show current time\" 0x00B894"
          echo "BTN kill 220 280 200 30 \"List processes\" 0xD63031"

          case "$1" in
            "click h1") echo "zenos" > "$HNAME_FILE" ;;
            "click h2") echo "tizen" > "$HNAME_FILE" ;;
            "click h3") echo "samsung" > "$HNAME_FILE" ;;
            "click date") date > /tmp/settings_out ;;
            "click kill") ps > /tmp/settings_out ;;
          esac

          if [ -f /tmp/settings_out ]; then
            Y=320
            while IFS= read -r line; do
              [ $Y -gt 370 ] && break
              echo "TEXT 10 $Y 1 \"$line\" 0xCCCCCC"
              Y=$((Y + 12))
            done < /tmp/settings_out
          fi
          SETTINGS
          chmod +x tpk_build/Settings/shared/res/entry.sh
          cd tpk_build/Settings && zip -qr ../../tpk/Settings.tpk . && cd ../..

          # 7. CLOCK - stopwatch + world clock
          echo "[+] Clock"
          mkdir -p tpk_build/Clock/shared/res
          cat > tpk_build/Clock/shared/res/entry.sh << 'CLOCK'
          #!/bin/sh
          SW_FILE="/tmp/clock_sw"
          [ ! -f "$SW_FILE" ] && echo "0 0" > "$SW_FILE"
          read START ELAPSED < "$SW_FILE"

          NOW=$(date +%s)
          TIME=$(date "+%H:%M:%S")
          DATE=$(date "+%A, %B %d, %Y")

          echo "BG 0x0A0A1E"
          echo "TEXT 10 10 2 \"Clock\" 0x00D4FF"

          echo "RECT 50 50 500 100 0x2D3436"
          echo "TEXT 100 70 6 \"$TIME\" 0x00FF00"
          echo "TEXT 150 120 2 \"$DATE\" 0xAAAAAA"

          echo "TEXT 10 180 2 \"Stopwatch\" 0xFDCB6E"
          if [ "$START" -gt 0 ] 2>/dev/null; then
            ELAPSED=$((NOW - START))
            MM=$((ELAPSED / 60))
            SS=$((ELAPSED % 60))
            echo "TEXT 50 210 4 \"Running: ${MM}m ${SS}s\" 0x00FF00"
            echo "BTN stop 10 260 120 30 \"Stop\" 0xD63031"
            echo "BTN reset 140 260 120 30 \"Reset\" 0x2D3436"
          else
            if [ "$ELAPSED" -gt 0 ] 2>/dev/null; then
              MM=$((ELAPSED / 60))
              SS=$((ELAPSED % 60))
              echo "TEXT 50 210 4 \"Stopped: ${MM}m ${SS}s\" 0xFDCB6E"
            else
              echo "TEXT 50 210 4 \"0m 0s\" 0x888888"
            fi
            echo "BTN start 10 260 120 30 \"Start\" 0x00B894"
            echo "BTN reset 140 260 120 30 \"Reset\" 0x2D3436"
          fi

          case "$1" in
            "click start") echo "$NOW 0" > "$SW_FILE" ;;
            "click stop") 
              read S E < "$SW_FILE"
              ELAPSED=$((NOW - S))
              echo "0 $ELAPSED" > "$SW_FILE"
              ;;
            "click reset") echo "0 0" > "$SW_FILE" ;;
          esac

          echo "TEXT 10 310 2 \"System Info\" 0xFDCB6E"
          echo "TEXT 10 340 1 \"Uptime: $(awk '{d=int($1/86400); h=int(($1%86400)/3600); m=int(($1%3600)/60); printf "%dd %dh %dm", d,h,m}' /proc/uptime)\" 0xFFFFFF"
          CLOCK
          chmod +x tpk_build/Clock/shared/res/entry.sh
          cd tpk_build/Clock && zip -qr ../../tpk/Clock.tpk . && cd ../..

          rm -rf tpk_build
          echo "=== TPK apps built ==="
          ls -lh tpk/

          find . | cpio -H newc -o > ../initramfs.cpio
          gzip -9 < ../initramfs.cpio > ../initramfs.img
          cd ..
          ls -lh initramfs.img

      - name: Create disk image
        run: |
          dd if=/dev/zero of=zenos.img bs=1M count=80
          mkfs.ext4 -F -L zenOS zenos.img
          mkdir -p mnt
          sudo mount -o loop zenos.img mnt
          sudo mkdir -p mnt/boot mnt/data
          sudo cp kernel.img mnt/boot/
          sudo cp initramfs.img mnt/boot/
          sudo sync && sudo umount mnt
          gzip -kf zenos.img
          ls -lh zenos.img*

      - name: Verify
        run: |
          ls -lh kernel.img initramfs.img zenos.img zenos.img.gz
          [ $(stat -c%s kernel.img) -gt 1000000 ] && echo "✓ kernel"
          [ $(stat -c%s initramfs.img) -gt 100000 ] && echo "✓ initramfs"
          [ $(stat -c%s zenos.img) -gt 60000000 ] && echo "✓ disk"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zenos-arm64
          path: |
            zenos.img.gz
            kernel.img
            initramfs.img

      - name: QEMU test
        run: |
          timeout 15 qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 512 \
            -kernel kernel.img -initrd initramfs.img \
            -append "console=ttyAMA0 rdinit=/init" \
            -device ramfb -nographic -no-reboot || true
