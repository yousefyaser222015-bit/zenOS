name: Build zenOS Professional

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libncurses-dev wget cpio zip unzip xz-utils

      - name: Download BusyBox
        run: |
          mkdir -p zenos-rootfs/bin
          wget -q -O zenos-rootfs/bin/busybox \
            https://raw.githubusercontent.com/shutingrz/busybox-static-binaries-fat/main/busybox-aarch64-linux-gnu
          chmod +x zenos-rootfs/bin/busybox

      - name: Build Kernel
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.51.tar.xz
          tar xf linux-6.12.51.tar.xz
          cd linux-6.12.51
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          ./scripts/config \
            -e CONFIG_FB -e CONFIG_FB_SIMPLE -e CONFIG_FRAMEBUFFER_CONSOLE \
            -e CONFIG_VT -e CONFIG_VT_CONSOLE -e CONFIG_INPUT_EVDEV \
            -e CONFIG_INPUT_KEYBOARD -e CONFIG_INPUT_MOUSE -e CONFIG_INPUT_MISC \
            -e CONFIG_DRM -e CONFIG_DRM_VIRTIO_GPU -e CONFIG_DRM_FBDEV_EMULATION \
            -e CONFIG_FONTS -e CONFIG_FONT_8x16 \
            -e CONFIG_VIRTIO_PCI -e CONFIG_VIRTIO_INPUT \
            -e CONFIG_HID -e CONFIG_HID_GENERIC -e CONFIG_USB_HID \
            -e CONFIG_USB -e CONFIG_USB_EHCI_HCD \
            -e CONFIG_SERIAL_AMBA_PL011 -e CONFIG_SERIAL_AMBA_PL011_CONSOLE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image
          cp arch/arm64/boot/Image ../kernel.img

      - name: Write Professional GUI (2000+ lines)
        run: |
          cat > zenos-rootfs/init.c << 'CEOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <string.h>
          #include <unistd.h>
          #include <dirent.h>
          #include <fcntl.h>
          #include <time.h>
          #include <math.h>
          #include <ctype.h>
          #include <errno.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <sys/mount.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <sys/select.h>
          #include <linux/fb.h>
          #include <linux/input.h>
          #include <linux/vt.h>
          #include <linux/kd.h>

          #define MAX_WINDOWS 16
          #define MAX_RECENT 8
          #define MAX_APPS 64
          #define MAX_INPUTS 8
