name: Build zenOS ARM64 Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup APT Multiarch for ARM64 (Fix 404 Error)
        run: |
          sudo dpkg --add-architecture arm64
          
          # Fix for Ubuntu 24.04 (Noble - DEB822 format)
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's/^Types: deb$/Types: deb\nArchitectures: amd64 i386/' /etc/apt/sources.list.d/ubuntu.sources
            cat <<EOF | sudo tee /etc/apt/sources.list.d/ubuntu-ports.sources
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: noble noble-updates noble-security noble-backports
          Components: main universe restricted multiverse
          Architectures: arm64
          EOF
          fi
          
          # Fix for older Ubuntu versions (Traditional format)
          if [ -f /etc/apt/sources.list ]; then
            sudo sed -i 's/^deb http/deb [arch=amd64,i386] http/g' /etc/apt/sources.list
            sudo sed -i 's/^deb mirror/deb [arch=amd64,i386] mirror/g' /etc/apt/sources.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs) main restricted universe multiverse" | sudo tee /etc/apt/sources.list.d/arm64.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-updates main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports/ $(lsb_release -cs)-security main restricted universe multiverse" | sudo tee -a /etc/apt/sources.list.d/arm64.list
          fi
          
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross libsdl2-dev:arm64 u-boot-tools parted dosfstools qemu-utils

      - name: Setup Workspace and Directories
        run: |
          mkdir -p workspace rootfs/bin rootfs/sbin rootfs/etc rootfs/proc rootfs/sys rootfs/dev rootfs/apps rootfs/lib rootfs/usr/lib/aarch64-linux-gnu

      - name: Create Native C Init & TPK Runner (SDL2 Tizen Interface)
        run: |
          cat << 'EOF' > workspace/init.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <SDL2/SDL.h>

          void mount_filesystems() {
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
          }

          int install_tpk(const char *tpk_path) {
              printf("[zenOS TPK Loader] Installing package: %s\n", tpk_path);
              char cmd[512];
              snprintf(cmd, sizeof(cmd), "unzip -o %s -d /apps/temp_app > /dev/null 2>&1", tpk_path);
              int res = system(cmd);
              if (res == 0) {
                  printf("[zenOS] TPK Extracted successfully!\n");
                  return 0;
              } else {
                  printf("[zenOS] Failed to extract TPK package.\n");
                  return -1;
              }
          }

          void run_gui() {
              // Set hints for minimal environments (Framebuffer/KMSDRM)
              setenv("SDL_VIDEODRIVER", "kmsdrm", 0);
              
              if (SDL_Init(SDL_INIT_VIDEO) < 0) {
                  printf("SDL_Init Error: %s\n", SDL_GetError());
                  printf("Fallback to shell...\n");
                  return;
              }

              SDL_Window *win = SDL_CreateWindow("zenOS", SDL_WINDOWPOS_CENTERED, SDL_WINDOWPOS_CENTERED, 800, 480, SDL_WINDOW_SHOWN);
              if (!win) {
                  SDL_Quit();
                  return;
              }

              SDL_Renderer *ren = SDL_CreateRenderer(win, -1, SDL_RENDERER_ACCELERATED | SDL_RENDERER_PRESENTVSYNC);

              int running = 1;
              SDL_Event e;
              while (running) {
                  while (SDL_PollEvent(&e)) {
                      if (e.type == SDL_QUIT || e.type == SDL_KEYDOWN) running = 0;
                  }

                  // Background - Tizen Blue
                  SDL_SetRenderDrawColor(ren, 26, 43, 76, 255);
                  SDL_RenderClear(ren);

                  // Header
                  SDL_SetRenderDrawColor(ren, 15, 26, 46, 255);
                  SDL_Rect header = {0, 0, 800, 50};
                  SDL_RenderFillRect(ren, &header);

                  // Dummy Icons
                  for (int i = 0; i < 4; i++) {
                      SDL_SetRenderDrawColor(ren, 240, 240, 240, 255);
                      SDL_Rect icon = {100 + (i * 170), 180, 100, 100};
                      SDL_RenderFillRect(ren, &icon);
                  }

                  SDL_RenderPresent(ren);
                  SDL_Delay(16);
              }

              SDL_DestroyRenderer(ren);
              SDL_DestroyWindow(win);
              SDL_Quit();
          }

          void run_shell() {
              printf("\nWelcome to zenOS ARM64\n");
              char command[256];
              while (1) {
                  printf("zenos~# ");
                  fflush(stdout);
                  if (fgets(command, sizeof(command), stdin) == NULL) break;
                  
                  command[strcspn(command, "\n")] = 0;

                  if (strcmp(command, "exit") == 0) break;
                  if (strcmp(command, "gui") == 0) {
                      run_gui();
                      continue;
                  }
                  if (strncmp(command, "tpk-install ", 12) == 0) {
                      install_tpk(command + 12);
                      continue;
                  }

                  system(command);
              }
          }

          int main(int argc, char *argv[]) {
              mount_filesystems();
              printf("=========================================\n");
              printf("       Starting zenOS Kernel & Init       \n");
              printf("=========================================\n");

              run_shell();
              return 0;
          }
          EOF

      - name: Compile Init for ARM64
        run: |
          aarch64-linux-gnu-gcc -O2 workspace/init.c -o rootfs/init \
            -I/usr/include/SDL2 -I/usr/include/aarch64-linux-gnu/SDL2 \
            -L/usr/lib/aarch64-linux-gnu \
            -lSDL2 -lpthread -ldl -lm

      - name: Populate RootFS (ARM64 BusyBox & Libs)
        run: |
          # Download correct ARM64 busybox binary
          wget https://busybox.net/downloads/binaries/1.35.0-aarch64-linux-musl/busybox -O rootfs/bin/busybox
          chmod +x rootfs/bin/busybox
          
          cd rootfs/bin
          for app in sh ls cat echo mkdir unzip clear rm cp mv; do
            ln -s busybox $app
          done
          cd ../..

          # Copy libraries to rootfs
          cp -a /usr/aarch64-linux-gnu/lib/*.so* rootfs/lib/ 2>/dev/null || true
          cp -a /usr/lib/aarch64-linux-gnu/libSDL2*.so* rootfs/usr/lib/aarch64-linux-gnu/ 2>/dev/null || true

      - name: Build Initramfs
        run: |
          cd rootfs
          find . | cpio -o -H newc | gzip -9 > ../workspace/initrd.img
          cd ..

      - name: Build U-Boot Script
        run: |
          mkimage -A arm64 -O linux -T ramdisk -C gzip -d workspace/initrd.img workspace/uInitrd
          
          cat << 'EOF' > workspace/boot.cmd
          setenv bootargs "console=ttyAMA0 root=/dev/ram0 rw init=/init"
          echo "Booting zenOS Kernel..."
          bootm
          EOF
          
          mkimage -C none -A arm64 -T script -d workspace/boot.cmd workspace/boot.scr

      - name: Create zenOS .IMG Disk
        run: |
          dd if=/dev/zero of=zenos-arm64.img bs=1M count=64
          parted -s zenos-arm64.img mklabel msdos
          parted -s zenos-arm64.img mkpart primary fat16 1MiB 100%
          
          LOOP_DEV=$(sudo losetup -fP --show zenos-arm64.img)
          sudo mkfs.vfat ${LOOP_DEV}p1
          
          mkdir -p mnt
          sudo mount ${LOOP_DEV}p1 mnt
          sudo cp workspace/uInitrd mnt/
          sudo cp workspace/boot.scr mnt/
          
          sudo umount mnt
          sudo losetup -d ${LOOP_DEV}

      - name: Upload zenOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenos-arm64-image
          path: zenos-arm64.img
          
