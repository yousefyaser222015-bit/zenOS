name: Build Native Pure Tizen OS Runtime & GUI (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-pure-tizen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Native Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                                 bison flex libncurses-dev libssl-dev bc libelf-dev \
                                 qemu-user-static qemu-system-arm qemu-utils \
                                 e2fsprogs dosfstools kmod rpm2cpio cpio wget curl zstd

      # 1. بناء نواة ARM64 المخصصة لدعم واجهات Tizen الرسومية (DRM/VirtIO)
      - name: Build Tizen Graphics Kernel
        run: |
          mkdir -p kernel_build
          cd kernel_build
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz
          tar -xf linux-6.1.80.tar.xz
          cd linux-6.1.80
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig

          # تفعيل محركات العرض والرسوميات لـ Tizen
          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_VT
          scripts/config --enable CONFIG_INPUT_EVDEV

          make -j$(nproc) Image
          cd ../..
          mkdir -p boot_kernel
          cp kernel_build/linux-6.1.80/arch/arm64/boot/Image boot_kernel/Image

      # 2. جلب جميع حزم Tizen النقية بالكامل وفكها داخل RootFS
      - name: Fetch Pure Tizen Official System Packages
        run: |
          mkdir -p zenos_rootfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,usr/lib,usr/libexec,dev,mnt,boot,root,tmp,run,lib,lib64,var/run,var/lib}
          mkdir -p tizen_rpms
          cd tizen_rpms

          # المستودع الرسمي الكامل لـ Tizen Unified Snapshot
          TIZEN_REPO="https://download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/latest/repos/standard/packages/aarch64/"

          echo "Downloading FULL Tizen OS Runtime & GUI Ecosystem..."
          # تحميل كافة حزم Tizen دون استثناء أي مكون من مكونات النظام
          wget -q -r -l1 -nd -A "*.rpm" "$TIZEN_REPO" || true

          echo "Extracting all Tizen RPM packages into RootFS..."
          for rpm in *.rpm; do
            if [ -f "$rpm" ]; then
              rpm2cpio "$rpm" | cpio -idmv -D ../zenos_rootfs 2>/dev/null || true
            fi
          done
          cd ..

          # إصلاح وتجهيز مسارات المكتبات لـ Tizen
          cd zenos_rootfs
          [ -d lib64 ] || mkdir lib64
          [ -d usr/lib64 ] && cp -a usr/lib64/* usr/lib/ 2>/dev/null || true
          ln -sf /usr/lib/ld-linux-aarch64.so.1 lib/ld-linux-aarch64.so.1 2>/dev/null || true
          ln -sf /usr/lib/ld-linux-aarch64.so.1 lib64/ld-linux-aarch64.so.1 2>/dev/null || true
          echo "/usr/lib" > etc/ld.so.conf
          echo "/lib" >> etc/ld.so.conf
          cd ..

      # 3. إنشاء مُشغل Tizen Init بالـ C مدمج للبحث عن خوادم العرض وتغليف الواجهة
      - name: Build Dynamic Tizen GUI Launcher
        run: |
          cat << 'EOF' > tizen_init.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/stat.h>

          int main() {
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              mkdir("/dev/pts", 0755);
              mkdir("/dev/shm", 0755);
              mkdir("/tmp", 0777);
              mkdir("/run/user", 0755);
              mkdir("/run/user/0", 0700);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);

              printf("\n==================================================\n");
              printf("  zenOS (Initializing Pure Tizen OS Ecosystem)   \n");
              printf("==================================================\n\n");

              setenv("XDG_RUNTIME_DIR", "/run/user/0", 1);
              setenv("WAYLAND_DISPLAY", "wayland-0", 1);
              setenv("DISPLAY", ":0", 1);
              setenv("ELM_ENGINE", "wayland_egl", 1);
              setenv("PATH", "/usr/bin:/bin:/usr/sbin:/sbin", 1);
              setenv("LD_LIBRARY_PATH", "/usr/lib:/lib", 1);

              // تشغيل خادم D-Bus لخدمات Tizen
              if (access("/usr/bin/dbus-daemon", X_OK) == 0) {
                  system("/usr/bin/dbus-uuidgen --ensure 2>/dev/null");
                  system("/usr/bin/dbus-daemon --system --fork 2>/dev/null");
              }

              // البحث وتشغيل الواجهة الرسومية الخاصة بـ Tizen / Weston
              if (access("/usr/bin/weston", X_OK) == 0) {
                  printf("[zenOS] Launching Tizen Weston Compositor...\n");
                  execl("/usr/bin/weston", "weston", "--backend=drm-backend.so", "--continue-without-input", NULL);
              } else if (access("/usr/bin/e_main", X_OK) == 0) {
                  printf("[zenOS] Launching Tizen EFL Window Manager...\n");
                  execl("/usr/bin/e_main", "e_main", NULL);
              } else if (access("/bin/bash", X_OK) == 0) {
                  printf("[zenOS] Starting Tizen Shell Environment...\n");
                  execl("/bin/bash", "bash", NULL);
              }

              execl("/bin/sh", "sh", NULL);
              while(1) { sleep(10); }
              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc -static tizen_init.c -o zenos_rootfs/sbin/init
          chmod +x zenos_rootfs/sbin/init
          cp boot_kernel/Image zenos_rootfs/boot/Image

      # 4. تجميع القرص بحجم (6GB) لاستيعاب كامل النظام والواجهة الرسومية
      - name: Generate Tizen System Disk Image
        run: |
          dd if=/dev/zero of=zenOS-ARM64-PureTizen-GUI.img bs=1M count=6000
          mkfs.ext4 -F -L "zenOS-Tizen" zenOS-ARM64-PureTizen-GUI.img
          
          mkdir -p /tmp/zenos_mnt
          sudo mount -o loop zenOS-ARM64-PureTizen-GUI.img /tmp/zenos_mnt
          sudo cp -a zenos_rootfs/* /tmp/zenos_mnt/
          sudo umount /tmp/zenos_mnt

      # 5. رفع صورة القرص النهائية
      - name: Upload Pure Tizen Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-PureTizen-GUI
          path: zenOS-ARM64-PureTizen-GUI.img
          
