name: Build zenOS ARM64 Tizen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ROOT: ${{ github.workspace }}/rootfs
      WORK: ${{ github.workspace }}/work
      REPO: https://download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/latest/repos/standard/packages/aarch64

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            bc bison flex \
            libssl-dev libelf-dev \
            qemu-system-arm \
            qemu-user-static \
            rpm2cpio cpio \
            wget curl \
            xz-utils \
            zip \
            e2fsprogs

      - name: Build Kernel
        run: |
          set -e

          mkdir -p "$WORK"
          cd "$WORK"

          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz
          tar -xf linux-6.1.80.tar.xz
          cd linux-6.1.80

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make defconfig

          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT

          scripts/config --enable CONFIG_VIRTIO
          scripts/config --enable CONFIG_VIRTIO_PCI
          scripts/config --enable CONFIG_VIRTIO_MMIO
          scripts/config --enable CONFIG_VIRTIO_BLK
          scripts/config --enable CONFIG_VIRTIO_NET
          scripts/config --enable CONFIG_VIRTIO_INPUT

          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_KMS_HELPER
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_FB_SIMPLE
          scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE

          scripts/config --enable CONFIG_INPUT_EVDEV
          scripts/config --enable CONFIG_INPUT_KEYBOARD
          scripts/config --enable CONFIG_INPUT_MOUSE

          scripts/config --enable CONFIG_EXT4_FS
          scripts/config --enable CONFIG_PROC_FS
          scripts/config --enable CONFIG_SYSFS

          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_INET

          make olddefconfig
          make -j"$(nproc)" Image

          cp arch/arm64/boot/Image "$WORK/Image"

      - name: Create RootFS
        run: |
          set -e

          mkdir -p \
            "$ROOT"/{bin,sbin,etc,proc,sys,dev,dev/pts,dev/shm,run,tmp,root,mnt,boot,var/log} \
            "$ROOT"/usr/{bin,sbin,lib,libexec,share}

          chmod 1777 "$ROOT/tmp"

      - name: Download Tizen Runtime
        run: |
          set -e

          cd "$WORK"
          mkdir -p rpms

          curl -fsSL "$REPO/" > index.html

          grep -oE 'href="[^"]+\.rpm"' index.html \
            | cut -d'"' -f2 \
            | grep -vE \
              '(-devel|-debug|-debuginfo|-debugsource|-doc|-tests|-static)' \
            > packages.txt

          grep -E \
            '^(glibc|bash|busybox|dbus|dbus-libs|wayland|weston|libdrm|mesa|pixman|cairo|pango|fontconfig|freetype|efl|eina|eet|eio|eo|evas|ecore|ecore-wayland|ecore-wl2|edje|elementary|aul|app-core|app-svc|pkgmgr|pkgmgr-info|pkgmgr-server|tizen-platform-config|libinput|libevdev|openssl|curl|ca-certificates)' \
            packages.txt \
            | sort -u \
            | while read -r p; do
                wget -q --retry-connrefused --tries=4 \
                  "$REPO/$p" \
                  -O "rpms/$p" || true
              done

          find rpms -type f -size 0 -delete

          test -n "$(find rpms -name '*.rpm' -print -quit)"

      - name: Extract Tizen
        run: |
          set -e

          cd "$WORK"

          for rpm in rpms/*.rpm; do
            rpm2cpio "$rpm" |
              cpio -idm -D "$ROOT" 2>/dev/null || true
          done

          test -d "$ROOT/usr"

      - name: Install BusyBox Shell
        run: |
          set -e

          cp /bin/busybox "$ROOT/bin/busybox"
          chmod 755 "$ROOT/bin/busybox"

          for x in \
            sh ash ls cat cp mv rm mkdir mount umount \
            ps kill sleep echo grep sed vi ip ping \
            chmod chown pwd uname dmesg sync

          do
            ln -sf /bin/busybox "$ROOT/bin/$x"
          done

          ln -sf /bin/busybox "$ROOT/usr/bin/sh"

      - name: Configure Libraries
        run: |
          set -e

          mkdir -p "$ROOT/lib" "$ROOT/lib64"

          if [ -f "$ROOT/usr/lib/ld-linux-aarch64.so.1" ]; then
            ln -sf /usr/lib/ld-linux-aarch64.so.1 \
              "$ROOT/lib/ld-linux-aarch64.so.1"

            ln -sf /usr/lib/ld-linux-aarch64.so.1 \
              "$ROOT/lib64/ld-linux-aarch64.so.1"
          fi

          cat > "$ROOT/etc/ld.so.conf" <<EOF
          /lib
          /lib64
          /usr/lib
          /usr/lib64
          EOF

      - name: Create Weston Config
        run: |
          set -e

          mkdir -p "$ROOT/etc/xdg/weston"

          cat > "$ROOT/etc/xdg/weston/weston.ini" <<EOF
          [core]
          backend=drm-backend.so
          idle-time=0

          [shell]
          locking=false

          [output]
          mode=1280x720
          EOF

      - name: Create zenOS GUI
        run: |
          set -e

          cat > "$ROOT/usr/bin/zenos-gui" <<'EOF'
          #!/bin/sh

          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export LD_LIBRARY_PATH=/usr/lib:/lib:/usr/lib64:/lib64
          export XDG_RUNTIME_DIR=/run/user/0
          export WAYLAND_DISPLAY=wayland-0
          export XDG_SESSION_TYPE=wayland
          export ELM_ENGINE=wayland_egl
          export ELM_DISPLAY=wl

          mkdir -p /run/user/0
          chmod 700 /run/user/0

          mkdir -p /var/log

          if command -v ldconfig >/dev/null 2>&1; then
            ldconfig || true
          fi

          if command -v dbus-daemon >/dev/null 2>&1; then
            dbus-daemon --system --fork || true
          fi

          if [ ! -e /dev/dri/card0 ]; then
            echo "zenOS: VirtIO DRM unavailable" >> /var/log/zenos-gui.log
            exit 1
          fi

          if [ ! -x /usr/bin/weston ]; then
            echo "zenOS: Weston unavailable" >> /var/log/zenos-gui.log
            exit 1
          fi

          /usr/bin/weston \
            --backend=drm-backend.so \
            --config=/etc/xdg/weston/weston.ini \
            --continue-without-input \
            --log=/var/log/weston.log

          exit $?
          EOF

          chmod 755 "$ROOT/usr/bin/zenos-gui"

      - name: Create Tizen Runtime Launcher
        run: |
          set -e

          cat > "$ROOT/usr/bin/zenos-runtime" <<'EOF'
          #!/bin/sh

          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export LD_LIBRARY_PATH=/usr/lib:/lib:/usr/lib64:/lib64

          if command -v dbus-daemon >/dev/null 2>&1; then
            dbus-daemon --system --fork || true
          fi

          if command -v pkgmgr-server >/dev/null 2>&1; then
            pkgmgr-server &
          fi

          if command -v aul-launcher >/dev/null 2>&1; then
            aul-launcher &
          fi

          wait
          EOF

          chmod 755 "$ROOT/usr/bin/zenos-runtime"

      - name: Build Init
        run: |
          set -e

          cat > "$WORK/init.c" <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/stat.h>
          #include <sys/types.h>
          #include <errno.h>

          static void m(
              const char *src,
              const char *dst,
              const char *type)
          {
              if (mount(src,dst,type,0,NULL) < 0 &&
                  errno != EBUSY)
                  perror(dst);
          }

          static void start(const char *path)
          {
              pid_t p=fork();

              if(p==0)
              {
                  execl(path,path,NULL);
                  _exit(127);
              }
          }

          int main(void)
          {
              mkdir("/proc",0555);
              mkdir("/sys",0555);
              mkdir("/dev",0755);
              mkdir("/dev/pts",0755);
              mkdir("/dev/shm",0755);
              mkdir("/run",0755);
              mkdir("/run/user",0755);
              mkdir("/run/user/0",0700);
              mkdir("/tmp",01777);

              m("proc","/proc","proc");
              m("sysfs","/sys","sysfs");
              m("devtmpfs","/dev","devtmpfs");
              m("devpts","/dev/pts","devpts");
              m("tmpfs","/dev/shm","tmpfs");
              m("tmpfs","/run","tmpfs");

              setenv(
                "PATH",
                "/usr/bin:/bin:/usr/sbin:/sbin",
                1
              );

              setenv("HOME","/root",1);
              setenv("USER","root",1);
              setenv("TERM","linux",1);
              setenv("PS1","zenos~# ",1);

              setenv(
                "XDG_RUNTIME_DIR",
                "/run/user/0",
                1
              );

              setenv(
                "WAYLAND_DISPLAY",
                "wayland-0",
                1
              );

              start("/usr/bin/zenos-runtime");

              sleep(2);

              start("/usr/bin/zenos-gui");

              sleep(4);

              printf("\n");
              printf("====================================\n");
              printf("             zenOS ARM64\n");
              printf("       Tizen Runtime / Wayland\n");
              printf("====================================\n");
              printf("GUI started asynchronously.\n");
              printf("If GUI fails, BusyBox shell remains active.\n");
              printf("\n");

              execl(
                "/bin/busybox",
                "busybox",
                "sh",
                "-l",
                NULL
              );

              execl(
                "/bin/sh",
                "sh",
                "-l",
                NULL
              );

              for(;;)
                  sleep(10);

              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            "$WORK/init.c" \
            -o "$ROOT/sbin/init"

          chmod 755 "$ROOT/sbin/init"

      - name: Install Kernel
        run: |
          set -e
          cp "$WORK/Image" "$ROOT/boot/Image"

      - name: Create Image
        run: |
          set -e

          IMG="$GITHUB_WORKSPACE/zenOS-arm64.img"

          dd if=/dev/zero \
            of="$IMG" \
            bs=1M \
            count=1024 \
            status=none

          mkfs.ext4 \
            -F \
            -L zenOS \
            "$IMG"

          mkdir -p "$WORK/mnt"

          sudo mount -o loop "$IMG" "$WORK/mnt"
          sudo cp -a "$ROOT/." "$WORK/mnt/"
          sync
          sudo umount "$WORK/mnt"

          e2fsck -fy "$IMG" || true

      - name: Create QEMU Script
        run: |
          cat > "$GITHUB_WORKSPACE/run-zenos.sh" <<'EOF'
          #!/bin/sh

          exec qemu-system-aarch64 \
            -machine virt \
            -cpu cortex-a72 \
            -m 1024 \
            -smp 4 \
            -kernel zenOS-arm64.img \
            -append "root=/dev/vda rw rootwait console=ttyAMA0,115200" \
            -drive file=zenOS-arm64.img,if=none,format=raw,id=disk \
            -device virtio-blk-pci,drive=disk \
            -device virtio-gpu-pci \
            -device virtio-keyboard-pci \
            -device virtio-mouse-pci \
            -device virtio-rng-pci \
            -nic user,model=virtio-net-pci \
            -display vnc=:5 \
            -serial stdio
          EOF

          chmod +x "$GITHUB_WORKSPACE/run-zenos.sh"

      - name: Create ZIP
        run: |
          set -e

          cd "$GITHUB_WORKSPACE"

          zip -9 \
            zenOS-arm64.zip \
            zenOS-arm64.img \
            run-zenos.sh

      - name: Upload zenOS
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-arm64
          path: |
            zenOS-arm64.zip
            zenOS-arm64.img
            run-zenos.sh
          compression-level: 0
