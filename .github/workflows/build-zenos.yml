          # ===== MONITOR =====
          mkdir -p tpk_build/Monitor/shared/res
          cat > tpk_build/Monitor/shared/res/entry.sh << 'MON'
          #!/bin/sh
          echo "BG 0x0A0A1E"
          echo "TEXT 10 10 2 \"System Monitor\" 0x00D4FF"
          UPT=$(awk '{print int($1)}' /proc/uptime)
          echo "TEXT 10 40 1 \"Kernel: $(uname -r)\" 0xFFFFFF"
          echo "TEXT 10 56 1 \"Uptime: $((UPT/3600))h $((UPT%3600/60))m\" 0xFFFFFF"
          T=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          A=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)
          U=$((T - A)); P=$((U * 100 / T))
          echo "TEXT 10 80 1 \"RAM: $((U/1024))/$((T/1024)) MB ($P%)\" 0xFFFFFF"
          BW=$((P * 5))
          echo "RECT 10 100 500 12 0x2D3436"
          echo "RECT 10 100 $BW 12 0x00B894"
          echo "TEXT 10 130 1 \"Processes:\" 0xFDCB6E"
          Y=150
          ps | head -12 | while IFS= read -r line; do
            [ $Y -gt 320 ] && break
            echo "TEXT 10 $Y 1 \"$line\" 0xCCCCCC"
            Y=$((Y + 12))
          done
          echo "BTN refresh 10 340 120 36 \"Refresh\" 0x0984E3"
          MON
          chmod +x tpk_build/Monitor/shared/res/entry.sh
          (cd tpk_build/Monitor && zip -qr ../../tpk/Monitor.tpk .)

          # ===== CALC =====
          mkdir -p tpk_build/Calc/shared/res
          cat > tpk_build/Calc/shared/res/entry.sh << 'CALC'
          #!/bin/sh
          SF="$APP_DIR/calc_state"; [ ! -f "$SF" ] && echo "0" > "$SF"
          V=$(cat "$SF")
          echo "BG 0x0A0A1E"
          echo "TEXT 10 10 2 \"Calculator\" 0x00D4FF"
          echo "RECT 10 50 560 60 0x2D3436"
          echo "TEXT 20 60 4 \"$V\" 0x00FF00"
          echo "BTN c  10  130 90 60 \"C\"  0xD63031"
          echo "BTN d7 110 130 90 60 \"7\"  0x2D3436"
          echo "BTN d8 210 130 90 60 \"8\"  0x2D3436"
          echo "BTN d9 310 130 90 60 \"9\"  0x2D3436"
          echo "BTN div 410 130 90 60 \"/\"  0x0984E3"
          echo "BTN d4 110 200 90 60 \"4\"  0x2D3436"
          echo "BTN d5 210 200 90 60 \"5\"  0x2D3436"
          echo "BTN d6 310 200 90 60 \"6\"  0x2D3436"
          echo "BTN mul 410 200 90 60 \"*\"  0x0984E3"
          echo "BTN d1 110 270 90 60 \"1\"  0x2D3436"
          echo "BTN d2 210 270 90 60 \"2\"  0x2D3436"
          echo "BTN d3 310 270 90 60 \"3\"  0x2D3436"
          echo "BTN sub 410 270 90 60 \"-\"  0x0984E3"
          echo "BTN d0 10  340 190 40 \"0\"  0x2D3436"
          echo "BTN eq  210 340 90 40 \"=\"  0x00B894"
          echo "BTN add 310 340 90 40 \"+\"  0x0984E3"
          case "$TPK_EVENT" in
            click_c) echo "0" > "$SF" ;;
            click_d*) D=${TPK_EVENT#click_d}; [ "$V" = "0" ] && echo "$D" > "$SF" || echo "${V}${D}" > "$SF" ;;
            click_add|click_sub|click_mul|click_div)
              OP=${TPK_EVENT#click_}; echo "$V" > /tmp/calc_p; echo "$OP" > /tmp/calc_o; echo "0" > "$SF" ;;
            click_eq)
              [ -f /tmp/calc_o ] && P=$(cat /tmp/calc_p) && O=$(cat /tmp/calc_o) && {
                case "$O" in add) R=$((P+V));; sub) R=$((P-V));; mul) R=$((P*V));; div) [ "$V" -ne 0 ] && R=$((P/V)) || R="ERR";; esac
                echo "$R" > "$SF"; rm -f /tmp/calc_o /tmp/calc_p
              } ;;
          esac
          CALC
          chmod +x tpk_build/Calc/shared/res/entry.sh
          (cd tpk_build/Calc && zip -qr ../../tpk/Calc.tpk .)

          # ===== SETTINGS =====
          mkdir -p tpk_build/Settings/shared/res
          cat > tpk_build/Settings/shared/res/entry.sh << 'SET'
          #!/bin/sh
          HF="$APP_DIR/hostname"; [ ! -f "$HF" ] && hostname > "$HF" 2>/dev/null || echo "zenos" > "$HF"
          HN=$(cat "$HF")
          echo "BG 0x0A0A1E"
          echo "TEXT 10 10 2 \"Settings\" 0x00D4FF"
          echo "TEXT 10 50 1 \"Hostname: $HN\" 0xFFFFFF"
          echo "BTN h1 200 48 100 24 \"zenos\" 0x0984E3"
          echo "BTN h2 310 48 100 24 \"device\" 0x0984E3"
          echo "BTN h3 420 48 100 24 \"phone\" 0x0984E3"
          echo "TEXT 10 90 1 \"Kernel: $(uname -r)\" 0xFFFFFF"
          echo "TEXT 10 106 1 \"Arch: $(uname -m)\" 0xFFFFFF"
          echo "BTN info 10 200 200 36 \"System Info\" 0x00B894"
          echo "BTN date 220 200 200 36 \"Date/Time\" 0x6C5CE7"
          case "$TPK_EVENT" in
            click_h1) echo "zenos" > "$HF" ;; click_h2) echo "device" > "$HF" ;; click_h3) echo "phone" > "$HF" ;;
            click_info) uname -a > "$APP_DIR/out" ;; click_date) date > "$APP_DIR/out" ;;
          esac
          [ -f "$APP_DIR/out" ] && {
            Y=250
            while IFS= read -r line; do [ $Y -gt 320 ] && break
              echo "TEXT 10 $Y 1 \"$line\" 0xCCCCCC"; Y=$((Y + 12))
            done < "$APP_DIR/out"
          }
          SET
          chmod +x tpk_build/Settings/shared/res/entry.sh
          (cd tpk_build/Settings && zip -qr ../../tpk/Settings.tpk .)

          # ===== CLOCK =====
          mkdir -p tpk_build/Clock/shared/res
          cat > tpk_build/Clock/shared/res/entry.sh << 'CLK'
          #!/bin/sh
          SW="$APP_DIR/sw"; [ ! -f "$SW" ] && echo "0 0" > "$SW"
          read S E < "$SW"
          NOW=$(date +%s); TIME=$(date "+%H:%M:%S"); DATE=$(date "+%A, %B %d, %Y")
          echo "BG 0x0A0A1E"
          echo "TEXT 10 10 2 \"Clock\" 0x00D4FF"
          echo "RECT 50 50 500 100 0x2D3436"
          echo "TEXT 100 70 6 \"$TIME\" 0x00FF00"
          echo "TEXT 150 120 2 \"$DATE\" 0xAAAAAA"
          echo "TEXT 10 180 2 \"Stopwatch\" 0xFDCB6E"
          if [ "$S" -gt 0 ] 2>/dev/null; then
            EL=$((NOW - S)); MM=$((EL/60)); SS=$((EL%60))
            echo "TEXT 50 210 4 \"Running: ${MM}m ${SS}s\" 0x00FF00"
            echo "BTN stop 10 260 120 36 \"Stop\" 0xD63031"
          else
            [ "$E" -gt 0 ] 2>/dev/null && { MM=$((E/60)); SS=$((E%60)); echo "TEXT 50 210 4 \"Stopped: ${MM}m ${SS}s\" 0xFDCB6E"; } || echo "TEXT 50 210 4 \"0m 0s\" 0x888888"
            echo "BTN start 10 260 120 36 \"Start\" 0x00B894"
          fi
          echo "BTN reset 140 260 120 36 \"Reset\" 0x2D3436"
          case "$TPK_EVENT" in
            click_start) echo "$NOW 0" > "$SW" ;;
            click_stop) read S2 E2 < "$SW"; echo "0 $((NOW - S2))" > "$SW" ;;
            click_reset) echo "0 0" > "$SW" ;;
          esac
          CLK
          chmod +x tpk_build/Clock/shared/res/entry.sh
          (cd tpk_build/Clock && zip -qr ../../tpk/Clock.tpk .)

          # ===== BATTERY/POWER (Real kernel data) =====
          mkdir -p tpk_build/Power/shared/res
          cat > tpk_build/Power/shared/res/entry.sh << 'PWR'
          #!/bin/sh
          echo "BG 0x0A0A1E"
          echo "TEXT 10 10 2 \"Power & Thermal\" 0x00D4FF"
          echo "TEXT 10 50 1 \"--- CPU Info ---\" 0xFDCB6E"
          Y=70
          cat /proc/cpuinfo 2>/dev/null | head -15 | while IFS= read -r line; do
            [ $Y -gt 200 ] && break
            echo "TEXT 10 $Y 1 \"$line\" 0xCCCCCC"
            Y=$((Y + 12))
          done
          echo "TEXT 10 220 1 \"--- Thermal Zones ---\" 0xFDCB6E"
          Y=240
          for tz in /sys/class/thermal/thermal_zone*; do
            [ -d "$tz" ] || continue
            TYPE=$(cat "$tz/type" 2>/dev/null || echo "?")
            TEMP=$(cat "$tz/temp" 2>/dev/null || echo "0")
            TC=$((TEMP / 1000))
            echo "TEXT 10 $Y 1 \"$TYPE: ${TC}°C\" 0xFFFFFF"
            Y=$((Y + 14))
          done
          echo "BTN refresh 10 340 120 36 \"Refresh\" 0x0984E3"
          PWR
          chmod +x tpk_build/Power/shared/res/entry.sh
          (cd tpk_build/Power && zip -qr ../../tpk/Power.tpk .)

          rm -rf tpk_build
          echo "=== TPK apps built ==="
          ls -lh tpk/
          find . | cpio -H newc -o > ../initramfs.cpio
          gzip -9 < ../initramfs.cpio > ../initramfs.img
          cd ..

      - name: Create disk
        run: |
          dd if=/dev/zero of=zenos.img bs=1M count=100
          mkfs.ext4 -F -L zenOS zenos.img
          mkdir -p mnt
          sudo mount -o loop zenos.img mnt
          sudo mkdir -p mnt/boot
          sudo cp kernel.img mnt/boot/
          sudo cp initramfs.img mnt/boot/
          sudo sync && sudo umount mnt
          gzip -kf zenos.img

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zenos-arm64
          path: |
            zenos.img.gz
            kernel.img
            initramfs.img
