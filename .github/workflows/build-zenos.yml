name: Build Compact Tizen OS GUI & Runtime Engine (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-tizen-compact-gui:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Native Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                                 bison flex libncurses-dev libssl-dev bc libelf-dev \
                                 qemu-user-static qemu-system-arm qemu-utils \
                                 e2fsprogs dosfstools kmod rpm2cpio cpio wget curl zstd busybox-static

      # 1. بناء النواة مع تفعيل Framebuffer و DRM و Seatd support
      - name: Compile Light DRM Kernel
        run: |
          mkdir -p kernel_build
          cd kernel_build
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz
          tar -xf linux-6.1.80.tar.xz
          cd linux-6.1.80
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig

          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_DRM_BOCHS
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_VT
          scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          scripts/config --enable CONFIG_INPUT_EVDEV

          make -j$(nproc) Image
          cd ../..
          mkdir -p boot_kernel
          cp kernel_build/linux-6.1.80/arch/arm64/boot/Image boot_kernel/Image

      # 2. جلب حزم Tizen الأساسية واستبعاد X11 تماماً
      - name: Fetch Latest Tizen Runtime Packages Only
        run: |
          mkdir -p zenos_rootfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,usr/lib,usr/libexec,dev,mnt,boot,root,tmp,run,lib,lib64,var/run}
          mkdir -p tizen_rpms
          cd tizen_rpms

          TIZEN_REPO="https://download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/latest/repos/standard/packages/aarch64/"

          curl -s "$TIZEN_REPO" | grep -oE 'href="[^"]+\.rpm"' | cut -d'"' -f2 > rpm_list.txt

          # تصفية الحزم التشغيلية فقط واستبعاد X11 كلياً
          grep -E "glibc|busybox|bash|wayland|weston|efl|elementary|cairo|pixman|libdrm|dbus|systemd|vconf|aul|buxton|pkgmgr|app-manager|tzsh|enlightenment" rpm_list.txt | grep -vE "\-devel|\-debug|\-doc|\-static|\-tests|x11|xorg" > target_rpms.txt || true

          while read -r rpm_file; do
            if [ -n "$rpm_file" ]; then
              wget -q -c "${TIZEN_REPO}${rpm_file}" -O "$rpm_file" || true
            fi
          done < target_rpms.txt

          for rpm in *.rpm; do
            if [ -f "$rpm" ] && [ -s "$rpm" ]; then
              rpm2cpio "$rpm" | cpio -idmv -D ../zenos_rootfs 2>/dev/null || true
            fi
          done
          cd ..

          # تنظيف الملفات المرتفعة الحجم
          rm -rf zenos_rootfs/usr/apps/*
          rm -rf zenos_rootfs/usr/share/man
          rm -rf zenos_rootfs/usr/share/doc
          rm -rf zenos_rootfs/usr/include
          rm -rf zenos_rootfs/var/cache/*

          # تثبيت BusyBox
          cp /bin/busybox zenos_rootfs/bin/busybox
          cp /bin/busybox zenos_rootfs/bin/busybox.static
          chmod +x zenos_rootfs/bin/busybox zenos_rootfs/bin/busybox.static

          # إعداد برامج BusyBox الأساسية
          cd zenos_rootfs/bin
          ./busybox --install -s . 2>/dev/null || true
          cd ../..

          # ربط المسارات والمكتبات
          cd zenos_rootfs
          [ -d lib64 ] || mkdir lib64
          [ -d usr/lib64 ] && cp -a usr/lib64/* usr/lib/ 2>/dev/null || true
          ln -sf /usr/lib/ld-linux-aarch64.so.1 lib/ld-linux-aarch64.so.1 2>/dev/null || true
          ln -sf /usr/lib/ld-linux-aarch64.so.1 lib64/ld-linux-aarch64.so.1 2>/dev/null || true
          
          echo "/usr/lib" > etc/ld.so.conf
          echo "/lib" >> etc/ld.so.conf
          echo "/usr/local/lib" >> etc/ld.so.conf
          cd ..

      # 3. إعداد سكريبت تشغيل المحركات والواجهة بالخلفية
      - name: Setup Tizen Engine & GUI Script
        run: |
          cat << 'EOF' > zenos_rootfs/usr/bin/start-tizen-gui
          #!/bin/sh
          export XDG_RUNTIME_DIR=/run/user/0
          export WAYLAND_DISPLAY=wayland-0
          export DISPLAY=:0
          export ELM_ENGINE=wayland_egl
          export ELM_DISPLAY=wl
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export LD_LIBRARY_PATH=/usr/lib:/lib

          /sbin/ldconfig 2>/dev/null || true

          # 1. تشغيل خدمات Tizen Runtime بالخلفية لدعم TPK
          dbus-uuidgen --ensure 2>/dev/null
          dbus-daemon --system --fork 2>/dev/null
          vconf-init 2>/dev/null || true
          buxtond 2>/dev/null &

          # 2. تشغيل Weston مع Pixman renderer لتفادي مشاكل كروت الشاشة
          if [ -x /usr/bin/weston ]; then
              echo "[zenOS Engine] Starting Weston (Wayland)..."
              weston --backend=drm-backend.so --use-pixman --continue-without-input --log=/tmp/weston.log &
              sleep 2
          fi

          # 3. محاولة تشغيل Tizen Shell أو Enlightenment
          if [ -x /usr/bin/tzsh ]; then
              tzsh &
          elif [ -x /usr/bin/enlightenment ]; then
              enlightenment &
          fi

          exit 0
          EOF

          chmod +x zenos_rootfs/usr/bin/start-tizen-gui

      # 4. بناء Init بلغة C مع شيل BusyBox تفاعلي دائم ومحكم
      - name: Create Native Tizen C Init Tool
        run: |
          cat << 'EOF' > tizen_init.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/stat.h>

          int main() {
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              mkdir("/dev/pts", 0755);
              mkdir("/dev/shm", 0755);
              mkdir("/tmp", 0777);
              mkdir("/run/user", 0755);
              mkdir("/run/user/0", 0700);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);

              printf("\n==================================================\n");
              printf("  zenOS (Booting Tizen GUI & Runtime Engine)     \n");
              printf("==================================================\n\n");

              /* تشغيل محرك الرسوميات و Tizen Runtime في الخلفية */
              system("/usr/bin/start-tizen-gui &");

              printf("[zenOS Engine] Tizen Core Runtime Layer is ACTIVE.\n");
              printf("[zenOS Engine] Interactive BusyBox Shell Ready.\n\n");

              /* إعداد بيئة الشيل التفاعلي */
              setenv("PS1", "zenos~# ", 1);
              setenv("TERM", "xterm", 1);
              setenv("PATH", "/usr/bin:/bin:/usr/sbin:/sbin", 1);

              /* تشغيل الشيل التفاعلي عبر BusyBox أو Bash بدون خروج */
              if (access("/bin/bash", X_OK) == 0) {
                  execl("/bin/bash", "bash", "--login", NULL);
              }
              
              execl("/bin/busybox", "sh", "-l", NULL);
              execl("/bin/busybox.static", "sh", "-l", NULL);

              while(1) { sleep(10); }
              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc -static tizen_init.c -o zenos_rootfs/sbin/init
          chmod +x zenos_rootfs/sbin/init
          cp boot_kernel/Image zenos_rootfs/boot/Image

      # 5. إنشاء صورة القرص
      - name: Create System Image
        run: |
          dd if=/dev/zero of=zenOS-ARM64-Tizen-GUI.img bs=1M count=1000
          mkfs.ext4 -F -L "zenOS-Tizen" zenOS-ARM64-Tizen-GUI.img
          
          mkdir -p /tmp/zenos_mnt
          sudo mount -o loop zenOS-ARM64-Tizen-GUI.img /tmp/zenos_mnt
          sudo cp -a zenos_rootfs/* /tmp/zenos_mnt/
          sudo umount /tmp/zenos_mnt

      # 6. رفع الملف النهائي
      - name: Upload Tizen Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Tizen-GUI
          path: zenOS-ARM64-Tizen-GUI.img
          
