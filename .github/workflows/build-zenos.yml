name: Build zenOS ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            qemu-system-arm \
            cpio \
            gzip \
            wget \
            unzip \
            file \
            xz-utils \
            bzip2 \
            libarchive-tools

      - name: Download prebuilt ARM64 BusyBox
        run: |
          mkdir -p rootfs/bin

          apt-get download busybox:arm64 || true

          DEB=$(ls busybox_*_arm64.deb | head -n1)

          if [ -z "$DEB" ]; then
            echo "Failed to obtain ARM64 BusyBox package"
            exit 1
          fi

          dpkg-deb -x "$DEB" busybox_pkg

          BUSYBOX=$(find busybox_pkg -type f -name busybox | head -n1)

          if [ -z "$BUSYBOX" ]; then
            echo "BusyBox binary not found"
            exit 1
          fi

          cp "$BUSYBOX" rootfs/bin/busybox
          chmod +x rootfs/bin/busybox

          file rootfs/bin/busybox

      - name: Create BusyBox commands
        run: |
          cd rootfs/bin

          ./busybox --install -s .

          ln -sf /bin/busybox sh

      - name: Build zenOS init
        run: |
          cat > init.c <<'EOF'
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <stdlib.h>
          #include <stdio.h>

          static void mount_fs(
              const char *src,
              const char *dst,
              const char *type)
          {
              mkdir(dst, 0755);
              mount(src, dst, type, 0, 0);
          }

          int main(void)
          {
              if (getpid() != 1)
                  return 1;

              mount_fs("proc", "proc", "proc");
              mount_fs("sysfs", "sys", "sysfs");
              mount_fs("devtmpfs", "dev", "devtmpfs");
              mount_fs("tmpfs", "run", "tmpfs");
              mount_fs("tmpfs", "tmp", "tmpfs");

              setenv(
                  "PATH",
                  "/bin:/sbin:/usr/bin:/usr/sbin",
                  1
              );

              setenv("HOME", "/root", 1);
              setenv("TERM", "linux", 1);
              setenv("PS1", "zenos~# ", 1);

              mkdir("/root", 0755);

              printf(
                  "\n"
                  "=================================\n"
                  "             zenOS\n"
                  "        ARM64 userspace\n"
                  "=================================\n"
                  "\n"
              );

              for (;;)
              {
                  pid_t p = fork();

                  if (p == 0)
                  {
                      char *argv[] = {
                          "/bin/sh",
                          "-l",
                          NULL
                      };

                      execv(argv[0], argv);
                      _exit(127);
                  }

                  if (p > 0)
                      waitpid(p, NULL, 0);
              }

              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            -s \
            init.c \
            -o rootfs/init

          chmod +x rootfs/init

      - name: Create directories
        run: |
          mkdir -p rootfs/{dev,proc,sys,run,tmp,etc,root,usr/bin,usr/sbin,sbin}

      - name: Build TPK launcher
        run: |
          cat > tpk.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <dirent.h>
          #include <fcntl.h>
          #include <elf.h>

          static char found[4096];

          static int find_elf(const char *dir)
          {
              DIR *d = opendir(dir);
              if (!d)
                  return 0;

              struct dirent *e;

              while ((e = readdir(d)))
              {
                  if (!strcmp(e->d_name, ".") ||
                      !strcmp(e->d_name, ".."))
                      continue;

                  char path[4096];

                  snprintf(
                      path,
                      sizeof(path),
                      "%s/%s",
                      dir,
                      e->d_name
                  );

                  struct stat st;

                  if (stat(path, &st))
                      continue;

                  if (S_ISDIR(st.st_mode))
                  {
                      if (find_elf(path))
                      {
                          closedir(d);
                          return 1;
                      }
                  }

                  if (!S_ISREG(st.st_mode))
                      continue;

                  int fd = open(path, O_RDONLY);

                  if (fd < 0)
                      continue;

                  unsigned char magic[64] = {0};

                  ssize_t n = read(fd, magic, sizeof(magic));
                  close(fd);

                  if (n < 20)
                      continue;

                  if (magic[0] != 0x7f ||
                      magic[1] != 'E' ||
                      magic[2] != 'L' ||
                      magic[3] != 'F')
                      continue;

                  if (magic[4] != ELFCLASS64)
                      continue;

                  if (magic[5] != ELFDATA2LSB)
                      continue;

                  unsigned short machine =
                      magic[18] |
                      ((unsigned short)magic[19] << 8);

                  if (machine != EM_AARCH64)
                      continue;

                  strncpy(found, path, sizeof(found) - 1);
                  closedir(d);
                  return 1;
              }

              closedir(d);
              return 0;
          }

          int main(int argc, char **argv)
          {
              if (argc != 2)
              {
                  fprintf(
                      stderr,
                      "Usage: tpk package.tpk\n"
                  );
                  return 1;
              }

              char dir[256];

              snprintf(
                  dir,
                  sizeof(dir),
                  "/tmp/tpk-%d",
                  getpid()
              );

              mkdir(dir, 0755);

              char cmd[4096];

              snprintf(
                  cmd,
                  sizeof(cmd),
                  "/bin/busybox unzip -o '%s' -d '%s'",
                  argv[1],
                  dir
              );

              if (system(cmd) != 0)
              {
                  fprintf(
                      stderr,
                      "TPK extraction failed\n"
                  );
                  return 1;
              }

              if (!find_elf(dir))
              {
                  fprintf(
                      stderr,
                      "No ARM64 ELF executable found\n"
                  );
                  return 1;
              }

              printf(
                  "zenOS TPK: launching %s\n",
                  found
              );

              char *args[] = {
                  found,
                  NULL
              };

              execv(found, args);

              perror("execv");
              return 1;
          }
          EOF

          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            -s \
            tpk.c \
            -o rootfs/usr/bin/zenos-tpk

          chmod +x rootfs/usr/bin/zenos-tpk

          cat > rootfs/usr/bin/tpk <<'EOF'
          #!/bin/sh
          exec /usr/bin/zenos-tpk "$1"
          EOF

          chmod +x rootfs/usr/bin/tpk

      - name: Build zenOS framebuffer GUI
        run: |
          cat > gui.c <<'EOF'
          #include <stdio.h>
          #include <stdint.h>
          #include <fcntl.h>
          #include <unistd.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <linux/fb.h>

          int main(void)
          {
              int fd = open("/dev/fb0", O_RDWR);

              if (fd < 0)
              {
                  perror("zenos-gui: /dev/fb0");
                  return 1;
              }

              struct fb_var_screeninfo vinfo;

              if (ioctl(
                  fd,
                  FBIOGET_VSCREENINFO,
                  &vinfo
              ) < 0)
              {
                  perror("FBIOGET_VSCREENINFO");
                  close(fd);
                  return 1;
              }

              size_t size =
                  (size_t)vinfo.xres *
                  vinfo.yres *
                  4;

              uint32_t *fb = mmap(
                  NULL,
                  size,
                  PROT_READ | PROT_WRITE,
                  MAP_SHARED,
                  fd,
                  0
              );

              if (fb == MAP_FAILED)
              {
                  perror("mmap");
                  close(fd);
                  return 1;
              }

              for (unsigned y = 0; y < vinfo.yres; y++)
              {
                  for (unsigned x = 0; x < vinfo.xres; x++)
                  {
                      fb[y * vinfo.xres + x] =
                          0x10141c;
                  }
              }

              unsigned bar =
                  vinfo.yres < 80 ? 30 : 60;

              for (unsigned y = 0; y < bar; y++)
              {
                  for (unsigned x = 0; x < vinfo.xres; x++)
                  {
                      fb[y * vinfo.xres + x] =
                          0x202938;
                  }
              }

              unsigned box = 120;

              if (vinfo.xres < 400)
                  box = vinfo.xres / 4;

              for (int i = 0; i < 3; i++)
              {
                  unsigned x0 =
                      30 + i * (box + 20);

                  for (unsigned y = 100;
                       y < 100 + box &&
                       y < vinfo.yres;
                       y++)
                  {
                      for (unsigned x = x0;
                           x < x0 + box &&
                           x < vinfo.xres;
                           x++)
                      {
                          fb[y * vinfo.xres + x] =
                              0x34495e;
                      }
                  }
              }

              munmap(fb, size);
              close(fd);

              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            -s \
            gui.c \
            -o rootfs/usr/bin/zenos-gui

          chmod +x rootfs/usr/bin/zenos-gui

      - name: Enable GUI in init
        run: |
          python3 - <<'PY'
          p = "init.c"

          s = open(p).read()

          old = '''printf(
                  "\\n"
                  "=================================\\n"
                  "             zenOS\\n"
                  "        ARM64 userspace\\n"
                  "=================================\\n"
                  "\\n"
              );'''

          new = '''printf(
                  "\\n"
                  "=================================\\n"
                  "             zenOS\\n"
                  "        ARM64 userspace\\n"
                  "=================================\\n"
                  "\\n"
              );

              if (access("/dev/fb0", F_OK) == 0)
              {
                  pid_t gui = fork();

                  if (gui == 0)
                  {
                      execl(
                          "/usr/bin/zenos-gui",
                          "zenos-gui",
                          NULL
                      );

                      _exit(127);
                  }
              }'''

          if old not in s:
              raise SystemExit("init patch target not found")

          s = s.replace(old, new)
          open(p, "w").write(s)
          PY

          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            -s \
            init.c \
            -o rootfs/init

          chmod +x rootfs/init

      - name: Create initramfs
        run: |
          cd rootfs

          find . \
            -print0 |
            cpio \
              --null \
              -o \
              -H newc |
            gzip -9 > ../zenos.img

      - name: Build ARM64 kernel
        run: |
          git clone \
            --depth=1 \
            https://github.com/torvalds/linux.git

          cd linux

          make ARCH=arm64 defconfig

          ./scripts/config \
            --enable CONFIG_DEVTMPFS \
            --enable CONFIG_DEVTMPFS_MOUNT \
            --enable CONFIG_BLK_DEV_INITRD \
            --enable CONFIG_TMPFS \
            --enable CONFIG_VIRTIO \
            --enable CONFIG_VIRTIO_PCI \
            --enable CONFIG_VIRTIO_NET \
            --enable CONFIG_SERIAL_AMBA_PL011 \
            --enable CONFIG_SERIAL_AMBA_PL011_CONSOLE \
            --enable CONFIG_FB \
            --enable CONFIG_FB_SIMPLE

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc)

      - name: QEMU boot test
        run: |
          timeout 20s \
          qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a57 \
            -m 512 \
            -kernel linux/arch/arm64/boot/Image \
            -initrd zenos.img \
            -append "console=ttyAMA0 rdinit=/init" \
            -nographic \
            || true

      - name: Upload zenOS
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64
          path: |
            zenos.img
            linux/arch/arm64/boot/Image
