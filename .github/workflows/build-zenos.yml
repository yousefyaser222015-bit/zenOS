name: Build zenOS
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu build-essential bc bison flex libssl-dev libelf-dev e2fsprogs cpio unzip git wget python3 swig device-tree-compiler

      - name: Build zenOS
        run: |
          set -ex
          mkdir -p src rootfs/bin rootfs/etc rootfs/proc rootfs/sys rootfs/dev rootfs/tmp rootfs/apps out
          git clone --depth=1 https://github.com/mirror/busybox.git
          cd busybox
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          echo CONFIG_STATIC=y >>.config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) busybox
          cd..
          cp busybox/busybox rootfs/bin/busybox
          rootfs/bin/busybox --install -s rootfs/bin || true
          ln -sf busybox rootfs/bin/sh

          cat > src/init.c <<CEND
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/stat.h>
          #include <sys/wait.h>
          #include <sys/reboot.h>
          #include <linux/reboot.h>
          #include <dirent.h>
          #include <fcntl.h>
          #include <linux/fb.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          static int fb_fd=-1; static char *fbp=NULL;
          static struct fb_var_screeninfo vinfo; static struct fb_fix_screeninfo finfo;
          void fb_init(){fb_fd=open("/dev/fb0",O_RDWR); if(fb_fd<0) return; ioctl(fb_fd,FBIOGET_FSCREENINFO,&finfo); ioctl(fb_fd,FBIOGET_VSCREENINFO,&vinfo); long sz=vinfo.xres*vinfo.yres*vinfo.bits_per_pixel/8; fbp=mmap(0,sz,PROT_READ|PROT_WRITE,MAP_SHARED,fb_fd,0); if(fbp==MAP_FAILED) fbp=NULL;}
          void fb_pix(int x,int y,int c){if(!fbp) return; if(x<0||y<0||x>=(int)vinfo.xres||y>=(int)vinfo.yres) return; long off=(x+vinfo.xoffset)*(vinfo.bits_per_pixel/8)+(y+vinfo.yoffset)*finfo.line_length; if(vinfo.bits_per_pixel==32) *(unsigned int*)(fbp+off)=c;}
          void fb_rect(int x,int y,int w,int h,int c){for(int j=y;j<y+h;j++) for(int i=x;i<x+w;i++) fb_pix(i,j,c);}
          void fb_clear(int c){if(!fbp) return; fb_rect(0,0,vinfo.xres,vinfo.yres,c);}
          void fb_circle(int cx,int cy,int r,int c){for(int y=-r;y<=r;y++) for(int x=-r;x<=r;x++) if(x*x+y*y<=r*r) fb_pix(cx+x,cy+y,c);}
          void draw_home(){if(!fbp) return; fb_clear(0x101020); fb_rect(0,0,vinfo.xres,38,0x1E1E2F); DIR *d=opendir("/apps"); if(!d) return; struct dirent *e; int i=0; while((e=readdir(d))){if(e->d_name[0]==46) continue; int cx=70+(i%4)*110, cy=90+(i/4)*110; int rr=50+(i*37)%180, gg=80+(i*61)%150, bb=200; fb_circle(cx,cy,32,(rr<<16)|(gg<<8)|bb); i++; if(i>11) break;} closedir(d);}
          int install_tpk(const char *path){char base[128]; const char *s=strrchr(path,47); s=s?s+1:path; strncpy(base,s,sizeof(base)); char *dot=strrchr(base,46); if(dot) *dot=0; if(!base[0]) strcpy(base,"app"); char dest[256]; snprintf(dest,sizeof(dest),"/apps/%s",base); mkdir("/apps",0755); mkdir(dest,0755); char cmd[512]; snprintf(cmd,sizeof(cmd),"unzip -o %s -d %s >/dev/null 2>&1",path,dest); int r=system(cmd); printf("[zenOS] TPK %s -> %s ret=%d\n",path,dest,r); return r;}
          void list_apps(){DIR *d=opendir("/apps"); if(!d){printf("no apps\n");return;} struct dirent *e; while((e=readdir(d))){if(e->d_name[0]==46) continue; printf(" * %s\n",e->d_name);} closedir(d);}
          void run_app(const char *name){char p1[512],p2[512]; snprintf(p1,sizeof(p1),"/apps/%s/bin/%s",name,name); snprintf(p2,sizeof(p2),"/apps/%s/start.sh",name); char *t=NULL; if(access(p1,X_OK)==0) t=p1; else if(access(p2,X_OK)==0) t=p2; if(!t){printf("no exec for %s\n",name);return;} pid_t pid=fork(); if(pid==0){if(strstr(t,".sh")) execl("/bin/sh","sh",t,NULL); else execl(t,t,NULL); _exit(0);} wait(NULL);}
          void shell_loop(){char line[512]; while(1){printf("zenos~# "); fflush(stdout); if(!fgets(line,sizeof(line),stdin)){sleep(1);continue;} line[strcspn(line,"\n")]='\0'; if(!*line) continue; if(!strcmp(line,"help")) printf("help ls ps clear gui list install <tpk> run <app> reboot\n"); else if(!strcmp(line,"ls")) system("ls -l /apps 2>/dev/null; ls /bin | head -n 30"); else if(!strcmp(line,"ps")) system("ps"); else if(!strcmp(line,"clear")) printf("\033c"); else if(!strcmp(line,"gui")){fb_init(); draw_home(); printf("[GUI] drawn\n");} else if(!strcmp(line,"list")) list_apps(); else if(!strncmp(line,"install ",8)) install_tpk(line+8); else if(!strncmp(line,"run ",4)) run_app(line+4); else if(!strcmp(line,"reboot")){sync(); reboot(LINUX_REBOOT_MAGIC1,LINUX_REBOOT_MAGIC2,LINUX_REBOOT_CMD_RESTART,NULL);} else system(line);}}
          int main(){mount("devtmpfs","/dev","devtmpfs",0,0); mount("proc","/proc","proc",0,0); mount("sysfs","/sys","sysfs",0,0); mkdir("/tmp",0777); mount("tmpfs","/tmp","tmpfs",0,0); printf("\n=== zenOS 1.0 ARM64 ===\n"); fb_init(); if(fbp) draw_home(); shell_loop(); return 0;}
          CEND
          aarch64-linux-gnu-gcc -static -O2 src/init.c -o rootfs/init
          chmod +x rootfs/init
          echo "root:x:0:0:root:/root:/bin/sh" > rootfs/etc/passwd
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.6.32.tar.xz
          tar xf linux-6.6.32.tar.xz
          cd linux-6.6.32
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image
          cp arch/arm64/boot/Image../out/Image
          cd..
          git clone --depth=1 https://github.com/u-boot/u-boot.git
          cd u-boot
          make qemu_arm64_defconfig
          make CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) || true
          cp u-boot.bin../out/u-boot.bin || true
          cd..
          cp out/Image./Image
          cp out/u-boot.bin./u-boot.bin || touch u-boot.bin
          (cd rootfs && find. | cpio -o -H newc | gzip >../out/initramfs.cpio.gz)
          cp out/initramfs.cpio.gz./initramfs.cpio.gz
          dd if=/dev/zero of=zenos.img bs=1M count=256
          mkfs.ext4 -F -L zenos -d rootfs zenos.img
          cat > run-termux.sh <<SH
          #!/data/data/com.termux/files/usr/bin/sh
          qemu-system-aarch64 -machine virt -cpu cortex-a57 -m 1024 -kernel Image -drive if=none,file=zenos.img,format=raw,id=hd0 -device virtio-blk-device,drive=hd0 -append "root=/dev/vda rw console=ttyAMA0 console=tty0 rootfstype=ext4 init=/init" -nographic
          SH
          chmod +x run-termux.sh
          ls -lh zenos.img Image

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zenos-arm64
          path: |
            zenos.img
            Image
            u-boot.bin
            initramfs.cpio.gz
            run-termux.sh
