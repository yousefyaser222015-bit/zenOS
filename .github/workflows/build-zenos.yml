          static size_t fb_size=0;
          static int fb_fd=-1;

          static int input_fds[MAX_INPUTS];
          static int n_inputs=0;
          static int mouse_x=400, mouse_y=240;
          static int mouse_down=0, last_mouse_down=0;
          
          /* Gesture tracking */
          static int gesture_start_x=-1, gesture_start_y=-1;
          static int gesture_active=0;
          
