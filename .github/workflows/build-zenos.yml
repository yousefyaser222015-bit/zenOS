name: Build zenOS ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex \
            libssl-dev libelf-dev \
            cpio gzip \
            qemu-system-arm \
            docker.io

      - name: Linux kernel
        run: |
          git clone --depth=1 https://github.com/torvalds/linux.git linux

      - name: Get ARM64 BusyBox
        run: |
          mkdir -p root/bin

          docker pull arm64v8/busybox:1.38.0

          cid=$(docker create arm64v8/busybox:1.38.0)
          docker cp "$cid:/bin/busybox" root/bin/busybox
          docker rm "$cid"

          chmod 755 root/bin/busybox

          file root/bin/busybox
          root/bin/busybox --help >/dev/null

      - name: BusyBox links
        run: |
          cd root/bin

          ./busybox --install -s .

          mkdir -p ../sbin
          mkdir -p ../usr/bin
          mkdir -p ../usr/sbin

          ln -sf /bin/busybox ../sbin/init
          ln -sf /bin/busybox ../usr/bin/busybox
          ln -sf /bin/busybox ../usr/sbin/busybox

      - name: Create filesystem
        run: |
          mkdir -p root/dev
          mkdir -p root/proc
          mkdir -p root/sys
          mkdir -p root/run
          mkdir -p root/tmp
          mkdir -p root/etc
          mkdir -p root/root
          mkdir -p root/apps
          mkdir -p root/usr/bin
          mkdir -p root/usr/sbin

          chmod 1777 root/tmp

      - name: zenOS init
        run: |
          cat > root/init.c <<'EOF'
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <stdlib.h>

          static void fs(
              const char *src,
              const char *dst,
              const char *type)
          {
              mkdir(dst, 0755);
              mount(src, dst, type, 0, 0);
          }

          static void shell(void)
          {
              for (;;)
              {
                  char *argv[] = {
                      "/bin/sh",
                      "-l",
                      NULL
                  };

                  pid_t p = fork();

                  if (p == 0)
                  {
                      execv(argv[0], argv);
                      _exit(127);
                  }

                  if (p > 0)
                      waitpid(p, NULL, 0);
              }
          }

          int main(void)
          {
              if (getpid() != 1)
                  return 1;

              fs("proc", "proc", "proc");
              fs("sysfs", "sys", "sysfs");
              fs("devtmpfs", "dev", "devtmpfs");
              fs("tmpfs", "run", "tmpfs");
              fs("tmpfs", "tmp", "tmpfs");

              setenv(
                  "PATH",
                  "/bin:/sbin:/usr/bin:/usr/sbin",
                  1
              );

              setenv("HOME", "/root", 1);
              setenv("TERM", "linux", 1);
              setenv("PS1", "zenos~# ", 1);

              shell();

              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            root/init.c \
            -o root/init

          chmod 755 root/init

      - name: TPK runtime
        run: |
          cat > root/usr/bin/zenos-tpk.c <<'EOF'
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <dirent.h>
          #include <string.h>
          #include <limits.h>
          #include <elf.h>

          static int find_elf(
              const char *dir,
              char *out)
          {
              DIR *d = opendir(dir);

              if (!d)
                  return -1;

              struct dirent *e;

              while ((e = readdir(d)))
              {
                  if (e->d_name[0] == '.')
                      continue;

                  char p[PATH_MAX];

                  snprintf(
                      p,
                      sizeof(p),
                      "%s/%s",
                      dir,
                      e->d_name
                  );

                  struct stat st;

                  if (stat(p, &st))
                      continue;

                  if (S_ISDIR(st.st_mode))
                  {
                      if (find_elf(p, out) == 0)
                      {
                          closedir(d);
                          return 0;
                      }
                  }

                  if (!S_ISREG(st.st_mode))
                      continue;

                  if (!(st.st_mode & 0111))
                      continue;

                  FILE *f = fopen(p, "rb");

                  if (!f)
                      continue;

                  unsigned char h[20];

                  if (fread(h, 1, sizeof(h), f)
                      != sizeof(h))
                  {
                      fclose(f);
                      continue;
                  }

                  fclose(f);

                  if (h[0] != 0x7f ||
                      h[1] != 'E' ||
                      h[2] != 'L' ||
                      h[3] != 'F')
                      continue;

                  if (h[4] != ELFCLASS64)
                      continue;

                  if (h[5] != ELFDATA2LSB)
                      continue;

                  unsigned short machine =
                      h[18] | ((unsigned short)h[19] << 8);

                  if (machine != EM_AARCH64)
                      continue;

                  strncpy(
                      out,
                      p,
                      PATH_MAX - 1
                  );

                  out[PATH_MAX - 1] = 0;

                  closedir(d);
                  return 0;
              }

              closedir(d);
              return -1;
          }

          int main(int argc, char **argv)
          {
              if (argc != 2)
              {
                  fprintf(
                      stderr,
                      "usage: tpk <file.tpk>\n"
                  );
                  return 2;
              }

              char dir[PATH_MAX];

              snprintf(
                  dir,
                  sizeof(dir),
                  "/tmp/tpk-%d",
                  getpid()
              );

              mkdir(dir, 0700);

              pid_t p = fork();

              if (p == 0)
              {
                  execl(
                      "/bin/busybox",
                      "busybox",
                      "unzip",
                      "-o",
                      argv[1],
                      "-d",
                      dir,
                      NULL
                  );

                  _exit(127);
              }

              int status = 0;

              waitpid(p, &status, 0);

              if (!WIFEXITED(status) ||
                  WEXITSTATUS(status) != 0)
              {
                  fprintf(
                      stderr,
                      "TPK: ZIP extraction failed\n"
                  );
                  return 3;
              }

              char elf[PATH_MAX];

              if (find_elf(dir, elf))
              {
                  fprintf(
                      stderr,
                      "TPK: no ARM64 ELF program\n"
                  );
                  return 4;
              }

              printf(
                  "TPK: launching %s\n",
                  elf
              );

              execl(elf, elf, NULL);

              perror("TPK");

              return 5;
          }
          EOF

          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            root/usr/bin/zenos-tpk.c \
            -o root/usr/bin/zenos-tpk

          rm root/usr/bin/zenos-tpk.c

          chmod 755 root/usr/bin/zenos-tpk

          cat > root/usr/bin/tpk <<'EOF'
          #!/bin/sh
          exec /usr/bin/zenos-tpk "$1"
          EOF

          chmod 755 root/usr/bin/tpk

      - name: zenOS graphical server
        run: |
          cat > root/usr/bin/zenos-gui.c <<'EOF'
          #include <fcntl.h>
          #include <stdint.h>
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <linux/fb.h>

          static uint32_t color(
              int r,
              int g,
              int b)
          {
              return
                  ((r & 255) << 16) |
                  ((g & 255) << 8) |
                  (b & 255);
          }

          static void pixel(
              uint32_t *fb,
              int sw,
              int x,
              int y,
              uint32_t c)
          {
              fb[y * sw + x] = c;
          }

          static void rect(
              uint32_t *fb,
              int sw,
              int sh,
              int x,
              int y,
              int w,
              int h,
              uint32_t c)
          {
              for (int yy = y; yy < y + h; yy++)
                  for (int xx = x; xx < x + w; xx++)
                      if (xx >= 0 &&
                          yy >= 0 &&
                          xx < sw &&
                          yy < sh)
                          pixel(
                              fb,
                              sw,
                              xx,
                              yy,
                              c
                          );
          }

          int main(void)
          {
              int fd = open(
                  "/dev/fb0",
                  O_RDWR
              );

              if (fd < 0)
              {
                  perror("zenos-gui: /dev/fb0");
                  return 1;
              }

              struct fb_var_screeninfo v;

              if (ioctl(
                      fd,
                      FBIOGET_VSCREENINFO,
                      &v))
                  return 1;

              int w = v.xres;
              int h = v.yres;

              size_t size =
                  (size_t)w *
                  h *
                  4;

              uint32_t *fb =
                  mmap(
                      NULL,
                      size,
                      PROT_READ | PROT_WRITE,
                      MAP_SHARED,
                      fd,
                      0
                  );

              if (fb == MAP_FAILED)
                  return 1;

              rect(
                  fb,
                  w,
                  h,
                  0,
                  0,
                  w,
                  h,
                  color(8, 12, 22)
              );

              rect(
                  fb,
                  w,
                  h,
                  0,
                  0,
                  w,
                  h / 7,
                  color(18, 25, 42)
              );

              rect(
                  fb,
                  w,
                  h,
                  w / 8,
                  h / 5,
                  w * 3 / 4,
                  h / 3,
                  color(25, 35, 58)
              );

              rect(
                  fb,
                  w,
                  h,
                  w / 10,
                  h * 3 / 5,
                  w / 5,
                  h / 6,
                  color(30, 120, 210)
              );

              rect(
                  fb,
                  w,
                  h,
                  w * 4 / 10,
                  h * 3 / 5,
                  w / 5,
                  h / 6,
                  color(40, 160, 100)
              );

              rect(
                  fb,
                  w,
                  h,
                  w * 7 / 10,
                  h * 3 / 5,
                  w / 5,
                  h / 6,
                  color(180, 80, 120)
              );

              msync(
                  fb,
                  size,
                  MS_SYNC
              );

              sleep(30);

              munmap(fb, size);
              close(fd);

              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            root/usr/bin/zenos-gui.c \
            -o root/usr/bin/zenos-gui

          rm root/usr/bin/zenos-gui.c

          chmod 755 root/usr/bin/zenos-gui

      - name: Build Linux
        run: |
          cd linux

          make ARCH=arm64 defconfig

          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_BLK_DEV_INITRD
          ./scripts/config --enable CONFIG_TMPFS

          ./scripts/config --enable CONFIG_VIRTIO
          ./scripts/config --enable CONFIG_VIRTIO_PCI
          ./scripts/config --enable CONFIG_VIRTIO_NET

          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011_CONSOLE

          ./scripts/config --enable CONFIG_FB
          ./scripts/config --enable CONFIG_FB_SIMPLE

          make ARCH=arm64 olddefconfig

          make \
            -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      - name: Build initramfs
        run: |
          cd root

          find . -print0 |
            cpio \
              --null \
              -o \
              -H newc |
            gzip -9 \
            > ../zenos.img

      - name: Release
        run: |
          mkdir -p release

          cp linux/arch/arm64/boot/Image \
             release/Image

          cp zenos.img \
             release/zenos.img

          sha256sum \
            release/Image \
            release/zenos.img \
            > release/SHA256SUMS

          ls -lh release/

      - name: QEMU test
        timeout-minutes: 2
        run: |
          timeout 30 \
          qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a57 \
            -m 512 \
            -kernel linux/arch/arm64/boot/Image \
            -initrd zenos.img \
            -append "console=ttyAMA0 rdinit=/init" \
            -nographic \
            || test $? -eq 124

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64
          path: release/
