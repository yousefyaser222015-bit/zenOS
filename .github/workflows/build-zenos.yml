name: Build zenOS ARM64 Image (Clang & Git BusyBox & LVGL)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Clang, LLVM, ARM64 Toolchain & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm lld \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            build-essential make u-boot-tools \
            parted dosfstools qemu-utils unzip wget git cpio libncurses5-dev bison flex

      - name: Setup Workspace Directories
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/workspace
          mkdir -p ${GITHUB_WORKSPACE}/rootfs/{bin,sbin,etc,proc,sys,dev,apps,tmp}

      - name: Clone and Build BusyBox from Source using Clang/GCC for ARM64
        run: |
          cd ${GITHUB_WORKSPACE}/workspace
          git clone --depth 1 https://github.com/mirror/busybox.git
          cd busybox
          
          make defconfig
          # تفعيل البناء الثابت (Static) ليعمل دون تبعيات خارجية
          sed -i 's/CONFIG_STATIC=n/CONFIG_STATIC=y/' .config
          
          # البناء باستخدام مترجم ARM64 الموثوق
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang HOSTCC=gcc -j$(nproc)
          
          # التثبيت داخل الروتس المخصص للنظام
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CONFIG_PREFIX=${GITHUB_WORKSPACE}/rootfs install

      - name: Clone LVGL and Drivers (v8.3 Stable)
        run: |
          cd ${GITHUB_WORKSPACE}/workspace
          git clone --branch release/v8.3 --depth 1 https://github.com/lvgl/lvgl.git
          git clone --branch release/v8.3 --depth 1 https://github.com/lvgl/lv_drivers.git

      - name: Generate LVGL Configurations
        run: |
          cd ${GITHUB_WORKSPACE}/workspace
          
          cat << 'EOF' > lv_conf.h
          #define LV_CONF_SKIP 0
          #define LV_COLOR_DEPTH 32
          #define LV_USE_OS 1
          #define LV_TICK_CUSTOM 1
          #define LV_TICK_CUSTOM_INCLUDE <stdint.h>
          #define LV_TICK_CUSTOM_SYS_TIME_EXPR (custom_tick_get())
          EOF

          cat << 'EOF' > lv_drv_conf.h
          #define USE_FBDEV 1
          #define FBDEV_PATH "/dev/fb0"
          #define USE_EVDEV 1
          EOF

      - name: Create Native C Init & Tizen TPK Runner (LVGL Interface)
        run: |
          cat << 'EOF' > ${GITHUB_WORKSPACE}/workspace/init.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/wait.h>
          #include <sys/time.h>
          #include "lvgl/lvgl.h"
          #include "lv_drivers/display/fbdev.h"

          uint32_t custom_tick_get(void) {
              struct timeval tv;
              gettimeofday(&tv, NULL);
              return (tv.tv_sec * 1000) + (tv.tv_usec / 1000);
          }

          void mount_filesystems() {
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
          }

          void launch_zenos_shell() {
              printf("\n=========================================\n");
              printf("     zenOS Emergency Shell (zenos~#)     \n");
              printf("=========================================\n");
              setenv("PS1", "zenos~# ", 1);
              
              char command[256];
              while (1) {
                  printf("zenos~# ");
                  fflush(stdout);
                  if (fgets(command, sizeof(command), stdin) == NULL) break;
                  
                  command[strcspn(command, "\n")] = 0;
                  if (strlen(command) == 0) continue;
                  if (strcmp(command, "exit") == 0) break;

                  // مشغل برامج TPK (يتعامل مع صيغة ZIP الخاصة بتطبيقات Tizen ويفكها في مجلد البرامج)
                  if (strncmp(command, "tpk-run ", 8) == 0) {
                      char *tpk_file = command + 8;
                      printf("[zenOS TPK] Unpacking Tizen application package: %s...\n", tpk_file);
                      char cmd[512];
                      snprintf(cmd, sizeof(cmd), "unzip -o %s -d /apps/current_app", tpk_file);
                      system(cmd);
                      printf("[zenOS TPK] Tizen app successfully deployed to /apps/current_app\n");
                      continue;
                  }
                  system(command);
              }
          }

          void run_lvgl_gui() {
              lv_init();
              fbdev_init();

              static lv_disp_draw_buf_t disp_buf;
              static lv_color_t buf[800 * 48];
              lv_disp_draw_buf_init(&disp_buf, buf, NULL, 800 * 48);

              static lv_disp_drv_t disp_drv;
              lv_disp_drv_init(&disp_drv);
              disp_drv.draw_buf = &disp_buf;
              disp_drv.flush_cb = fbdev_flush;
              disp_drv.hor_res = 800;
              disp_drv.ver_res = 480;
              lv_disp_drv_register(&disp_drv);

              // رسم واجهة رسومية متكاملة مستوحاة من هواتف Samsung Tizen
              lv_obj_t * screen = lv_scr_act();
              lv_obj_set_style_bg_color(screen, lv_color_hex(0x0F172A), 0);

              // عنوان الواجهة
              lv_obj_t * label = lv_label_create(screen);
              lv_label_set_text(label, "zenOS Tizen UI (ARM64)");
              lv_obj_align(label, LV_ALIGN_TOP_MID, 0, 30);

              // أزرار تشبه شاشة سامسونج الرئيسية
              for(int i = 0; i < 4; i++) {
                  lv_obj_t * btn = lv_btn_create(screen);
                  lv_obj_set_size(btn, 110, 110);
                  lv_obj_align(btn, LV_ALIGN_CENTER, -200 + (i * 135), 20);
                  lv_obj_set_style_radius(btn, LV_RADIUS_CIRCLE, 0);
              }

              while (1) {
                  lv_task_handler();
                  usleep(5000);
              }
          }

          int main() {
              mount_filesystems();
              printf("\n[zenOS Kernel Booted Successfully]\n");

              pid_t gui_pid = fork();

              if (gui_pid == 0) {
                  printf("[zenOS] Launching LVGL Tizen Display Server...\n");
                  run_lvgl_gui();
                  exit(1);
              } else {
                  int status;
                  waitpid(gui_pid, &status, 0);
                  printf("\n\033[1;31m[zenOS Alert] GUI Stopped! Opening zenos~# Shell...\033[0m\n");
                  launch_zenos_shell();
              }
              return 0;
          }
          EOF

      - name: Compile Init & LVGL using Clang & Target ARM64
        run: |
          cd ${GITHUB_WORKSPACE}/workspace
          LVGL_SRC=$(find lvgl/src -type f -name "*.c")
          LVGL_DRV="lv_drivers/display/fbdev.c"
          
          # استخدام Clang لاستهداف المعمارية المطلوبة ARM64 بدقة
          clang --target=aarch64-linux-gnu -O2 -I. -Ilvgl -Ilv_drivers \
            init.c $LVGL_DRV $LVGL_SRC \
            -o ${GITHUB_WORKSPACE}/rootfs/init -lm -static \
            --sysroot=/usr/aarch64-linux-gnu
            
          chmod +x ${GITHUB_WORKSPACE}/rootfs/init

      - name: Build Initramfs
        run: |
          cd ${GITHUB_WORKSPACE}/rootfs
          find . | cpio -o -H newc | gzip -9 > ${GITHUB_WORKSPACE}/workspace/initrd.img

      - name: Build U-Boot Boot Script
        run: |
          cd ${GITHUB_WORKSPACE}/workspace
          mkimage -A arm64 -O linux -T ramdisk -C gzip -d initrd.img uInitrd
          
          cat << 'EOF' > boot.cmd
          setenv bootargs "console=ttyAMA0 root=/dev/ram0 rw init=/init"
          echo "Booting zenOS Kernel with U-Boot..."
          bootm
          EOF
          mkimage -C none -A arm64 -T script -d boot.cmd boot.scr

      - name: Create Final zenOS .IMG Disk
        run: |
          cd ${GITHUB_WORKSPACE}
          dd if=/dev/zero of=zenos-arm64.img bs=1M count=64
          parted -s zenos-arm64.img mklabel msdos
          parted -s zenos-arm64.img mkpart primary fat16 1MiB 100%
          
          LOOP_DEV=$(sudo losetup -fP --show zenos-arm64.img)
          sudo mkfs.vfat ${LOOP_DEV}p1
          
          mkdir -p mnt
          sudo mount ${LOOP_DEV}p1 mnt
          sudo cp workspace/uInitrd mnt/
          sudo cp workspace/boot.scr mnt/
          
          sudo umount mnt
          sudo losetup -d ${LOOP_DEV}

      - name: Upload zenOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenos-arm64-image
          path: zenos-arm64.img
          
