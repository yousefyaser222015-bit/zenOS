name: Build zenOS ARM64 Image

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools & ARM64 Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            build-essential cmake make \
            u-boot-tools parted dosfstools qemu-utils unzip wget git cpio

      - name: Create Workspace Directories
        run: |
          mkdir -p workspace rootfs/bin rootfs/sbin rootfs/etc rootfs/proc rootfs/sys rootfs/dev rootfs/apps rootfs/lib rootfs/tmp

      - name: Build SDL2 From Source (Cross-Compile for ARM64)
        run: |
          cd workspace
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.2/SDL2-2.30.2.tar.gz
          tar -xf SDL2-2.30.2.tar.gz
          cd SDL2-2.30.2
          mkdir build && cd build
          
          # إعداد وتجميع SDL2 لمعمارية ARM64
          ../configure --host=aarch64-linux-gnu --prefix=/usr/aarch64-linux-gnu --disable-video-x11 --enable-video-kmsdrm --enable-video-dummy
          make -j$(nproc)
          sudo make install
          
          # نسخ مكتبات SDL2 المبنية حديثاً إلى rootfs
          cp -a /usr/aarch64-linux-gnu/lib/libSDL2*.so* ../../rootfs/lib/

      - name: Create Complete C Init with TPK Loader & Crash Protection
        run: |
          cat << 'EOF' > workspace/init.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/wait.h>
          #include <SDL2/SDL.h>

          void mount_filesystems() {
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
          }

          // صدفة الإنقاذ والعمليات
          void launch_zenos_shell() {
              printf("\n=========================================\n");
              printf("          zenOS Interactive Shell        \n");
              printf("=========================================\n");
              
              setenv("PS1", "zenos~# ", 1);
              
              char command[256];
              while (1) {
                  printf("zenos~# ");
                  fflush(stdout);
                  if (fgets(command, sizeof(command), stdin) == NULL) break;
                  
                  command[strcspn(command, "\n")] = 0;
                  if (strlen(command) == 0) continue;

                  if (strcmp(command, "exit") == 0) break;
                  
                  // تشغيل برامج TPK يدوياً من الشيل
                  if (strncmp(command, "tpk-run ", 8) == 0) {
                      char *tpk_file = command + 8;
                      printf("[zenOS TPK] Extracting %s ...\n", tpk_file);
                      char unzip_cmd[512];
                      snprintf(unzip_cmd, sizeof(unzip_cmd), "unzip -o %s -d /apps/current_app", tpk_file);
                      system(unzip_cmd);
                      printf("[zenOS TPK] Package unpacked to /apps/current_app\n");
                      continue;
                  }

                  system(command);
              }
          }

          // تشغيل واجهة Tizen بـ SDL2
          void run_tizen_gui() {
              if (SDL_Init(SDL_INIT_VIDEO) < 0) {
                  printf("[zenOS GUI Error] SDL_Init Failed: %s\n", SDL_GetError());
                  exit(1);
              }

              SDL_Window *win = SDL_CreateWindow("zenOS Launcher", SDL_WINDOWPOS_CENTERED, SDL_WINDOWPOS_CENTERED, 800, 480, SDL_WINDOW_SHOWN);
              if (!win) exit(1);

              SDL_Renderer *ren = SDL_CreateRenderer(win, -1, SDL_RENDERER_ACCELERATED);
              if (!ren) ren = SDL_CreateRenderer(win, -1, SDL_RENDERER_SOFTWARE);

              int running = 1;
              SDL_Event e;
              while (running) {
                  while (SDL_PollEvent(&e)) {
                      if (e.type == SDL_QUIT || e.type == SDL_KEYDOWN) running = 0;
                  }

                  // خلفية التايزن (Tizen Blue)
                  SDL_SetRenderDrawColor(ren, 26, 43, 76, 255);
                  SDL_RenderClear(ren);

                  // شريط علوي
                  SDL_SetRenderDrawColor(ren, 15, 26, 46, 255);
                  SDL_Rect header = {0, 0, 800, 50};
                  SDL_RenderFillRect(ren, &header);

                  // أيقونات التطبيقات الدائرية/المربعة
                  for (int i = 0; i < 4; i++) {
                      SDL_SetRenderDrawColor(ren, 240, 240, 240, 255);
                      SDL_Rect icon = {100 + (i * 170), 180, 100, 100};
                      SDL_RenderFillRect(ren, &icon);
                  }

                  SDL_RenderPresent(ren);
                  SDL_Delay(16);
              }

              SDL_DestroyRenderer(ren);
              SDL_DestroyWindow(win);
              SDL_Quit();
          }

          int main() {
              mount_filesystems();
              printf("\n[zenOS Kernel Booted Successfully]\n");

              // تشغيل الواجهة في عملية منفصلة لمراقبتها وحمايتها من التهنيج
              pid_t gui_pid = fork();

              if (gui_pid == 0) {
                  // تشغيل الواجهة الرسومية
                  run_tizen_gui();
                  exit(0);
              } else {
                  int status;
                  // المراقبة والتأكد هل واجهة الرسوميات انهارت أم مستقرة
                  waitpid(gui_pid, &status, 0);

                  if (WIFEXITED(status) && WEXITSTATUS(status) != 0) {
                      printf("\n\033[1;31m[zenOS Alert] GUI Crashed or Stopped! Launching zenos~# Shell...\033[0m\n");
                  } else {
                      printf("\n[zenOS] GUI Exited. Fallback to Shell...\n");
                  }

                  // الانتقال إلى الشيل zenos~#
                  launch_zenos_shell();
              }

              return 0;
          }
          EOF

      - name: Compile Init with Built SDL2
        run: |
          aarch64-linux-gnu-gcc -O2 workspace/init.c -o rootfs/init \
            -I/usr/aarch64-linux-gnu/include \
            -L/usr/aarch64-linux-gnu/lib \
            -lSDL2 -lpthread -ldl -lm

      - name: Populate RootFS (ARM64 BusyBox & System Libraries)
        run: |
          # تنزيل BusyBox المخصص لـ ARM64
          wget https://busybox.net/downloads/binaries/1.35.0-aarch64-linux-musl/busybox -O rootfs/bin/busybox
          chmod +x rootfs/bin/busybox
          
          # إنشاء روابط الأدوات الأساسية
          cd rootfs/bin
          for app in sh ls cat echo mkdir unzip clear rm cp mv ps kill; do
            ln -s busybox $app
          done
          cd ../..

          # نسخ مكتبات GLIBC و C الأساسية المعالجة بـ ARM64
          cp -a /usr/aarch64-linux-gnu/lib/*.so* rootfs/lib/ 2>/dev/null || true

      - name: Build Initramfs
        run: |
          cd rootfs
          find . | cpio -o -H newc | gzip -9 > ../workspace/initrd.img
          cd ..

      - name: Build U-Boot Boot Script
        run: |
          mkimage -A arm64 -O linux -T ramdisk -C gzip -d workspace/initrd.img workspace/uInitrd
          
          cat << 'EOF' > workspace/boot.cmd
          setenv bootargs "console=ttyAMA0 root=/dev/ram0 rw init=/init"
          echo "Booting zenOS Kernel with U-Boot..."
          bootm
          EOF
          
          mkimage -C none -A arm64 -T script -d workspace/boot.cmd workspace/boot.scr

      - name: Create Final zenOS .IMG Disk Output
        run: |
          dd if=/dev/zero of=zenos-arm64.img bs=1M count=64
          parted -s zenos-arm64.img mklabel msdos
          parted -s zenos-arm64.img mkpart primary fat16 1MiB 100%
          
          LOOP_DEV=$(sudo losetup -fP --show zenos-arm64.img)
          sudo mkfs.vfat ${LOOP_DEV}p1
          
          mkdir -p mnt
          sudo mount ${LOOP_DEV}p1 mnt
          sudo cp workspace/uInitrd mnt/
          sudo cp workspace/boot.scr mnt/
          
          sudo umount mnt
          sudo losetup -d ${LOOP_DEV}

      - name: Upload zenOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenos-arm64-image
          path: zenos-arm64.img
          
