name: Build zenOS ARM64 (Fixed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libncurses-dev wget cpio zip unzip xz-utils

      - name: Download BusyBox ARM64
        run: |
          mkdir -p zenos-rootfs/bin
          wget -q -O zenos-rootfs/bin/busybox \
            https://raw.githubusercontent.com/shutingrz/busybox-static-binaries-fat/main/busybox-aarch64-linux-gnu
          chmod +x zenos-rootfs/bin/busybox

      - name: Build Kernel
        run: |
          wget -q https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.12.51.tar.xz
          tar xf linux-6.12.51.tar.xz
          cd linux-6.12.51
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          ./scripts/config \
            -e CONFIG_FB -e CONFIG_FB_SIMPLE -e CONFIG_FRAMEBUFFER_CONSOLE \
            -e CONFIG_VT -e CONFIG_VT_CONSOLE -e CONFIG_INPUT_EVDEV \
            -e CONFIG_INPUT_KEYBOARD -e CONFIG_INPUT_MOUSE -e CONFIG_INPUT_MISC \
            -e CONFIG_DRM -e CONFIG_DRM_VIRTIO_GPU -e CONFIG_DRM_FBDEV_EMULATION \
            -e CONFIG_FONTS -e CONFIG_FONT_8x16 \
            -e CONFIG_VIRTIO_PCI -e CONFIG_VIRTIO_INPUT \
            -e CONFIG_HID -e CONFIG_HID_GENERIC -e CONFIG_USB_HID \
            -e CONFIG_USB -e CONFIG_USB_EHCI_HCD \
            -e CONFIG_SERIAL_AMBA_PL011 -e CONFIG_SERIAL_AMBA_PL011_CONSOLE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image
          cp arch/arm64/boot/Image ../kernel.img

      - name: Write fixed init.c
        run: |
          cat > zenos-rootfs/init.c << 'CEOF'
          #define _GNU_SOURCE
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <string.h>
          #include <unistd.h>
          #include <dirent.h>
          #include <fcntl.h>
          #include <time.h>
          #include <math.h>
          #include <ctype.h>
          #include <errno.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <sys/mount.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <sys/select.h>
          #include <linux/fb.h>
          #include <linux/input.h>
          #include <linux/vt.h>
          #include <linux/kd.h>

          #define MAX_DIRTY 128
          #define MAX_WINDOWS 8
          #define MAX_CMDS 256
          #define MAX_INPUTS 8
          #define TPK_DIR "/tpk"

          static uint32_t *front=NULL, *back=NULL;
          static int W=800, H=480;
          static size_t fb_sz=0;
          static int fbfd=-1;

          static int input_fds[MAX_INPUTS];
          static int n_inputs=0;
          static int mouse_x=100, mouse_y=100;
          static int mouse_down=0, last_down=0;
          static int key_enter=0, last_enter=0;
          static int key_up=0, key_down=0, key_left=0, key_right=0;
          static int focus_x=100, focus_y=100;
          static int use_keyboard=0;
          static int full_redraw=1;

          typedef struct { int x,y,w,h; } rect_t;
          typedef struct { char cmd[32]; int x,y,w,h,size; uint32_t color; char text[128]; } ui_cmd_t;
          static ui_cmd_t cmds[MAX_CMDS];
          static int ncmds=0;

          typedef struct { int active; int x,y,w,h; char title[64]; char tpk[256]; uint32_t color; int drag; int dx,dy; } win_t;
          static win_t wins[MAX_WINDOWS];
          static int active_win=-1;

          typedef struct { char name[64]; char file[256]; uint32_t c1,c2; char letter; } app_t;
          static app_t apps[32];
          static int napps=0;

          static void klog(const char*fmt,...){
            static int kmsg_fd=-1;
            if(kmsg_fd<0)kmsg_fd=open("/dev/kmsg",O_WRONLY|O_NOCTTY);
            if(kmsg_fd<0)return;
            char buf[512];
            va_list ap;
            va_start(ap,fmt);
            vsnprintf(buf,sizeof(buf),fmt,ap);
            va_end(ap);
            dprintf(kmsg_fd,"<6>zenOS: %s\n",buf);
          }

