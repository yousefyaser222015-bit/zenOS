          #include <stdlib.h>
          #include <stdint.h>
          #include <string.h>
          #include <unistd.h>
          #include <dirent.h>
          #include <fcntl.h>
          #include <time.h>
          #include <math.h>
          #include <signal.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <sys/mount.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <linux/fb.h>
          #include <linux/input.h>
          #include <linux/vt.h>

          #define SCREEN_W 800
          #define SCREEN_H 480
          #define BPP 32

          /* ===== Double Buffering ===== */
          static uint32_t *front_buffer = NULL;
          static uint32_t *back_buffer = NULL;
          static int fb_fd = -1;
          static int screen_w = SCREEN_W, screen_h = SCREEN_H;
          static size_t fb_size = 0;

          /* ===== Dirty Rectangles ===== */
          #define MAX_DIRTY 64
          typedef struct { int x, y, w, h; } rect_t;
          static rect_t dirty_rects[MAX_DIRTY];
          static int dirty_count = 0;
          static int full_redraw_needed = 1;

          /* ===== Input ===== */
          static int mouse_x = -1, mouse_y = -1;
          static int mouse_click = 0;
          static int mouse_prev_click = 0;
          static int evdev_fd = -1;

          /* ===== Window Manager ===== */
          #define MAX_WINDOWS 8
          typedef struct {
              int active;
              int x, y, w, h;
              char title[64];
              pid_t pid;
              uint32_t color;
          } window_t;
          static window_t windows[MAX_WINDOWS];
          static int active_window = -1;

          /* ===== TPK Apps ===== */
          #define TPK_DIR "/tpk"
          #define MAX_APPS 32
          typedef struct {
              char name[64];
              char filename[256];
              uint32_t color1, color2;
              char icon_letter;
          } app_t;
          static app_t apps[MAX_APPS];
          static int app_count = 0;

          /* ===== Font 5x7 ===== */
