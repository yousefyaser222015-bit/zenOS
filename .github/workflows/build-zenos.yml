name: Build zenOS ARM64 with LVGL GUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu bc bison flex \
            libssl-dev libncurses-dev wget cpio qemu-system-arm qemu-utils zip unzip git

      - name: Download BusyBox ARM64
        run: |
          set -e
          mkdir -p zenos-rootfs/bin
          wget -q -O zenos-rootfs/bin/busybox \
            https://raw.githubusercontent.com/shutingrz/busybox-static-binaries-fat/main/busybox-aarch64-linux-gnu
          chmod +x zenos-rootfs/bin/busybox
          ls -lh zenos-rootfs/bin/busybox

      - name: Build Linux Kernel (ARM64 with DRM/Framebuffer)
        run: |
          set -e
          git clone --depth=1 https://github.com/torvalds/linux.git
          cd linux
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- defconfig
          ./scripts/config \
            -e CONFIG_FRAMEBUFFER_CONSOLE \
            -e CONFIG_FB \
            -e CONFIG_VT \
            -e CONFIG_INPUT_EVDEV \
            -e CONFIG_FB_SIMPLE \
            -e CONFIG_FONTS \
            -e CONFIG_FONT_8x8 \
            -e CONFIG_FONT_8x16 \
            -e CONFIG_VT_CONSOLE \
            -e CONFIG_DRM \
            -e CONFIG_DRM_KMS_HELPER \
            -e CONFIG_DRM_FBDEV_EMULATION \
            -e CONFIG_DRM_VIRTIO_GPU \
            -e CONFIG_FB_EFI \
            -e CONFIG_SERIAL_AMBA_PL011 \
            -e CONFIG_SERIAL_AMBA_PL011_CONSOLE
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc) Image
          cp arch/arm64/boot/Image ../kernel.img
          cd ..
          ls -lh kernel.img
          [ -s kernel.img ] || exit 1

      - name: Download and build LVGL for ARM64
        run: |
          set -e
          git clone --depth=1 --branch v8.3.11 https://github.com/lvgl/lvgl.git
          git clone --depth=1 https://github.com/lvgl/lv_drivers.git
          
          # Create lv_conf.h
          cat > lv_conf.h << 'LVCONF'
          #ifndef LV_CONF_H
          #define LV_CONF_H
          #define LV_COLOR_DEPTH 32
          #define LV_COLOR_16_SWAP 0
          #define LV_USE_PERF_MONITOR 0
          #define LV_USE_MEM_MONITOR 0
          #define LV_DPI_DEF 130
          #define LV_DRAW_COMPLEX 1
          #define LV_SHADOW_CACHE_SIZE 0
          #define LV_IMG_CACHE_DEF_SIZE 0
          #define LV_GRADIENT_MAX_STOPS 2
          #define LV_GRAD_CACHE_DEF_SIZE 0
          #define LV_DITHER_GRADIENT 0
          #define LV_DISP_DEF_REFR_PERIOD 30
          #define LV_INDEV_DEF_READ_PERIOD 30
          #define LV_USE_LOG 0
          #define LV_USE_ASSERT_NULL 1
          #define LV_USE_ASSERT_MALLOC 1
          #define LV_USE_ASSERT_STYLE 0
          #define LV_USE_ASSERT_MEM_INTEGRITY 0
          #define LV_USE_ASSERT_OBJ 0
          #define LV_ASSERT_HANDLER_INCLUDE <stdint.h>
          #define LV_ASSERT_HANDLER while(1);
          #define LV_USE_PERF_MONITOR 0
          #define LV_USE_MEM_MONITOR 0
          #define LV_USE_REFR_DEBUG 0
          #define LV_SPRINTF_CUSTOM 0
          #define LV_SPRINTF_USE_FLOAT 0
          #define LV_USE_USER_DATA 1
          #define LV_ENABLE_GC 0
          #define LV_BIG_ENDIAN_SYSTEM 0
          #define LV_ATTRIBUTE_TICK_INC
          #define LV_ATTRIBUTE_TIMER_HANDLER
          #define LV_ATTRIBUTE_FLUSH_READY
          #define LV_ATTRIBUTE_MEM_ALIGN_SIZE 1
          #define LV_ATTRIBUTE_MEM_ALIGN
          #define LV_ATTRIBUTE_LARGE_CONST
          #define LV_ATTRIBUTE_LARGE_RAM_ARRAY
          #define LV_ATTRIBUTE_FAST_MEM
          #define LV_ATTRIBUTE_DMA
          #define LV_EXPORT_CONST_INT(int_value) struct _silence_gcc_warning
          #define LV_USE_LARGE_COORD 0
          #define LV_FONT_MONTSERRAT_8 1
          #define LV_FONT_MONTSERRAT_10 1
          #define LV_FONT_MONTSERRAT_12 1
          #define LV_FONT_MONTSERRAT_14 1
          #define LV_FONT_MONTSERRAT_16 1
          #define LV_FONT_MONTSERRAT_18 1
          #define LV_FONT_MONTSERRAT_20 1
          #define LV_FONT_MONTSERRAT_22 1
          #define LV_FONT_MONTSERRAT_24 1
          #define LV_FONT_MONTSERRAT_26 0
          #define LV_FONT_MONTSERRAT_28 0
          #define LV_FONT_MONTSERRAT_30 0
          #define LV_FONT_MONTSERRAT_32 0
          #define LV_FONT_MONTSERRAT_34 0
          #define LV_FONT_MONTSERRAT_36 0
          #define LV_FONT_MONTSERRAT_38 0
          #define LV_FONT_MONTSERRAT_40 0
          #define LV_FONT_MONTSERRAT_42 0
          #define LV_FONT_MONTSERRAT_44 0
          #define LV_FONT_MONTSERRAT_46 0
          #define LV_FONT_MONTSERRAT_48 0
          #define LV_FONT_MONTSERRAT_28_COMPRESSED 0
          #define LV_FONT_DEJAVU_16_PERSIAN_HEBREW 0
          #define LV_FONT_SIMSUN_16_CJK 0
          #define LV_FONT_UNSCII_8 0
          #define LV_FONT_UNSCII_16 0
          #define LV_FONT_CUSTOM_DECLARE
          #define LV_FONT_DEFAULT &lv_font_montserrat_14
          #define LV_FONT_FMT_TXT_LARGE 0
          #define LV_USE_FONT_COMPRESSED 0
          #define LV_USE_FONT_SUBPX 0
          #define LV_FONT_SUBPX_BGR 0
          #define LV_USE_FONT_PLACEHOLDER 1
          #define LV_USE_BIDI 0
          #define LV_USE_ARABIC_PERSIAN_CHARS 0
          #define LV_USE_PERF_MONITOR 0
          #define LV_USE_MEM_MONITOR 0
          #define LV_USE_REFR_DEBUG 0
          #define LV_SPRINTF_CUSTOM 0
          #define LV_SPRINTF_USE_FLOAT 0
          #define LV_USE_USER_DATA 1
          #define LV_ENABLE_GC 0
          #define LV_BIG_ENDIAN_SYSTEM 0
          #define LV_USE_ANIMATION 1
          #define LV_USE_SHADOW 1
          #define LV_USE_OUTLINE 1
          #define LV_USE_PATTERN 1
          #define LV_USE_VALUE_STR 1
          #define LV_USE_BLEND_MODES 1
          #define LV_USE_OPA_SCALE 1
          #define LV_USE_IMG_TRANSFORM 1
          #define LV_USE_GPU 0
          #define LV_USE_GPU_ARM2D 0
          #define LV_USE_GPU_STM32_DMA2D 0
          #define LV_USE_GPU_NXP_PXP 0
          #define LV_USE_GPU_NXP_VG_LITE 0
          #define LV_USE_GPU_SDL 0
          #define LV_USE_SNAPSHOT 1
          #define LV_USE_MONKEY 0
          #define LV_USE_GRIDNAV 0
          #define LV_USE_FRAGMENT 0
          #define LV_USE_IMGFONT 0
          #define LV_USE_OBSERVER 0
          #define LV_USE_IME_PINYIN 0
          #define LV_USE_OBJ_ID_BUILTIN 0
          #define LV_USE_FILE_EXPLORER 0
          #define LV_USE_MEM_PERF 0
          #define LV_USE_LODEPNG 1
          #define LV_USE_BMP 1
          #define LV_USE_GIF 1
          #define LV_USE_QRCODE 1
          #define LV_USE_FREETYPE 0
          #define LV_USE_RLOTTIE 0
          #define LV_USE_FFMPEG 0
          #define LV_USE_FS_STDIO 0
          #define LV_USE_FS_POSIX 0
          #define LV_USE_FS_WIN32 0
          #define LV_USE_FS_FATFS 0
          #define LV_USE_FS_MEMFS 0
          #define LV_USE_PNG 1
          #define LV_USE_SJPG 1
          #define LV_USE_IME_PINYIN 0
          #define LV_USE_ARC 1
          #define LV_USE_BAR 1
          #define LV_USE_BTN 1
          #define LV_USE_BTNMATRIX 1
          #define LV_USE_CALENDAR 1
          #define LV_USE_CANVAS 1
          #define LV_USE_CHART 1
          #define LV_USE_CHECKBOX 1
          #define LV_USE_COLORWHEEL 1
          #define LV_USE_DROPDOWN 1
          #define LV_USE_IMG 1
          #define LV_USE_IMGBTN 1
          #define LV_USE_KEYBOARD 1
          #define LV_USE_LABEL 1
          #define LV_USE_LED 1
          #define LV_USE_LINE 1
          #define LV_USE_LIST 1
          #define LV_USE_MENU 1
          #define LV_USE_METER 1
          #define LV_USE_MSGBOX 1
          #define LV_USE_ROLLER 1
          #define LV_USE_SLIDER 1
          #define LV_USE_SPINBOX 1
          #define LV_USE_SPINNER 1
          #define LV_USE_SWITCH 1
          #define LV_USE_TEXTAREA 1
          #define LV_USE_TABLE 1
          #define LV_USE_TABVIEW 1
          #define LV_USE_TILEVIEW 1
          #define LV_USE_WIN 1
          #define LV_USE_SPAN 1
          #define LV_CALENDAR_DEFAULT_WEEK_STARTS_MONDAY 0
          #define LV_CALENDAR_DEFAULT_DAY_NAMES {"Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"}
          #define LV_CALENDAR_DEFAULT_MONTH_NAMES {"January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"}
          #endif
          LVCONF
          
          # Copy lv_conf.h to lvgl root
          cp lv_conf.h lvgl/
          
          # Create lv_drv_conf.h
          cat > lv_drv_conf.h << 'DRVCONF'
          #ifndef LV_DRV_CONF_H
          #define LV_DRV_CONF_H
          #include "lv_conf.h"
          #define USE_FBDEV 1
          #define FBDEV_PATH "/dev/fb0"
          #define USE_EVDEV 1
          #define EVDEV_NAME "/dev/input/event0"
          #endif
          DRVCONF
          
          cp lv_drv_conf.h lv_drivers/
          
          # Build LVGL static library
          cd lvgl
          find src -name "*.c" > sources.txt
          aarch64-linux-gnu-gcc -c -O2 -I. -I.. $(cat sources.txt) -DLV_CONF_INCLUDE_SIMPLE
          aarch64-linux-gnu-ar rcs liblvgl.a *.o
          cd ..
          
          # Build lv_drivers
          cd lv_drivers
          aarch64-linux-gnu-gcc -c -O2 -I. -I../lvgl -I.. fbdev.c evdev.c display_mouse_cursor.c
          aarch64-linux-gnu-ar rcs liblv_drivers.a *.o
          cd ..
          
          ls -lh lvgl/liblvgl.a lv_drivers/liblv_drivers.a

      - name: Create init.c with LVGL Tizen-like GUI
        run: |
          set -e
          cat > init.c << 'INITEOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <string.h>
          #include <unistd.h>
          #include <dirent.h>
          #include <fcntl.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <sys/mount.h>
          #include <time.h>
          #include "lvgl/lvgl.h"
          #include "lv_drivers/fbdev.h"
          #include "lv_drivers/evdev.h"
          
          #define TPK_DIR "/tpk"
          
          typedef struct {
              char name[256];
              char path[512];
              lv_color_t color;
          } tpk_app_t;
          
          static tpk_app_t apps[32];
          static int app_count = 0;
          static lv_obj_t *status_bar_label;
          static lv_obj_t *app_grid;
          
          static void scan_tpks(void) {
              DIR *d = opendir(TPK_DIR);
              if (!d) return;
              struct dirent *e;
              app_count = 0;
              lv_color_t colors[] = {
                  lv_color_hex(0xFF6B6B), lv_color_hex(0x4ECDC4), lv_color_hex(0x45B7D1),
                  lv_color_hex(0xFFA07A), lv_color_hex(0x98D8C8), lv_color_hex(0xF7DC6F),
                  lv_color_hex(0xBB8FCE), lv_color_hex(0x85C1E2)
              };
              while ((e = readdir(d)) != NULL && app_count < 32) {
                  if (strstr(e->d_name, ".tpk")) {
                      snprintf(apps[app_count].name, sizeof(apps[0].name), "%s", e->d_name);
                      snprintf(apps[app_count].path, sizeof(apps[0].path), TPK_DIR "/%s", e->d_name);
                      apps[app_count].color = colors[app_count % 8];
                      app_count++;
                  }
              }
              closedir(d);
          }
          
          static void launch_tpk(const char *tpk_name) {
              char unpack_dir[512];
              snprintf(unpack_dir, sizeof(unpack_dir), "/tmp/%s", tpk_name);
              mkdir(unpack_dir, 0755);
              
              char cmd[1024];
              snprintf(cmd, sizeof(cmd), "/bin/busybox unzip -o -d %s %s/%s >/dev/null 2>&1",
                       unpack_dir, TPK_DIR, tpk_name);
              system(cmd);
              
              char exe_path[1024];
              snprintf(exe_path, sizeof(exe_path), "%s/shared/res/entry.sh", unpack_dir);
              struct stat st;
              if (stat(exe_path, &st) != 0) {
                  snprintf(exe_path, sizeof(exe_path), "%s/entry.sh", unpack_dir);
                  if (stat(exe_path, &st) != 0)
                      snprintf(exe_path, sizeof(exe_path), "%s/bin/main", unpack_dir);
              }
              
              pid_t pid = fork();
              if (pid == 0) {
                  chdir(unpack_dir);
                  chmod(exe_path, 0755);
                  setenv("TPK_HOME", unpack_dir, 1);
                  execl(exe_path, exe_path, NULL);
                  exit(1);
              } else if (pid > 0) {
                  int status;
                  waitpid(pid, &status, 0);
              }
          }
          
          static void app_btn_event_cb(lv_event_t *e) {
              lv_event_code_t code = lv_event_get_code(e);
              lv_obj_t *btn = lv_event_get_target(e);
              
              if (code == LV_EVENT_CLICKED) {
                  int idx = (int)(intptr_t)lv_obj_get_user_data(btn);
                  if (idx >= 0 && idx < app_count) {
                      LV_LOG_USER("Launching: %s", apps[idx].name);
                      launch_tpk(apps[idx].name);
                  }
              }
          }
          
          static void update_clock_timer(lv_timer_t *timer) {
              time_t now = time(NULL);
              struct tm *tm = localtime(&now);
              char buf[64];
              strftime(buf, sizeof(buf), "%H:%M | %b %d", tm);
              lv_label_set_text(status_bar_label, buf);
          }
          
          static void create_status_bar(lv_obj_t *parent) {
              lv_obj_t *status_bar = lv_obj_create(parent);
              lv_obj_set_size(status_bar, LV_PCT(100), 50);
              lv_obj_align(status_bar, LV_ALIGN_TOP_MID, 0, 0);
              lv_obj_set_style_bg_color(status_bar, lv_color_hex(0x1A1A2E), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(status_bar, LV_OPA_COVER, LV_PART_MAIN);
              lv_obj_set_style_border_width(status_bar, 0, LV_PART_MAIN);
              lv_obj_set_style_radius(status_bar, 0, LV_PART_MAIN);
              lv_obj_set_style_pad_all(status_bar, 10, LV_PART_MAIN);
              lv_obj_clear_flag(status_bar, LV_OBJ_FLAG_SCROLLABLE);
              
              lv_obj_t *logo = lv_label_create(status_bar);
              lv_label_set_text(logo, "zenOS");
              lv_obj_set_style_text_color(logo, lv_color_hex(0x00D4FF), LV_PART_MAIN);
              lv_obj_set_style_text_font(logo, &lv_font_montserrat_20, LV_PART_MAIN);
              lv_obj_align(logo, LV_ALIGN_LEFT_MID, 10, 0);
              
              status_bar_label = lv_label_create(status_bar);
              lv_obj_set_style_text_color(status_bar_label, lv_color_white(), LV_PART_MAIN);
              lv_obj_set_style_text_font(status_bar_label, &lv_font_montserrat_16, LV_PART_MAIN);
              lv_obj_align(status_bar_label, LV_ALIGN_RIGHT_MID, -10, 0);
              
              lv_timer_create(update_clock_timer, 1000, NULL);
          }
          
          static void create_app_grid(lv_obj_t *parent) {
              app_grid = lv_obj_create(parent);
              lv_obj_set_size(app_grid, LV_PCT(100), LV_SIZE_CONTENT);
              lv_obj_align(app_grid, LV_ALIGN_TOP_MID, 0, 70);
              lv_obj_set_style_bg_opa(app_grid, LV_OPA_TRANSP, LV_PART_MAIN);
              lv_obj_set_style_border_width(app_grid, 0, LV_PART_MAIN);
              lv_obj_set_flex_flow(app_grid, LV_FLEX_FLOW_ROW_WRAP);
              lv_obj_set_flex_align(app_grid, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER, LV_FLEX_ALIGN_CENTER);
              lv_obj_set_style_pad_all(app_grid, 10, LV_PART_MAIN);
              lv_obj_set_style_pad_row(app_grid, 15, LV_PART_MAIN);
              lv_obj_set_style_pad_column(app_grid, 15, LV_PART_MAIN);
              
              scan_tpks();
              
              for (int i = 0; i < app_count; i++) {
                  lv_obj_t *btn = lv_btn_create(app_grid);
                  lv_obj_set_size(btn, 100, 100);
                  lv_obj_set_style_bg_color(btn, apps[i].color, LV_PART_MAIN);
                  lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, LV_PART_MAIN);
                  lv_obj_set_style_radius(btn, 15, LV_PART_MAIN);
                  lv_obj_set_style_shadow_width(btn, 10, LV_PART_MAIN);
                  lv_obj_set_style_shadow_color(btn, lv_color_hex(0x000000), LV_PART_MAIN);
                  lv_obj_set_style_shadow_opa(btn, LV_OPA_50, LV_PART_MAIN);
                  lv_obj_set_style_shadow_ofs_y(btn, 5, LV_PART_MAIN);
                  lv_obj_add_event_cb(btn, app_btn_event_cb, LV_EVENT_CLICKED, (void*)(intptr_t)i);
                  lv_obj_set_user_data(btn, (void*)(intptr_t)i);
                  
                  lv_obj_t *label = lv_label_create(btn);
                  lv_label_set_text(label, apps[i].name);
                  lv_obj_set_style_text_color(label, lv_color_white(), LV_PART_MAIN);
                  lv_obj_set_style_text_font(label, &lv_font_montserrat_12, LV_PART_MAIN);
                  lv_obj_center(label);
              }
              
              if (app_count == 0) {
                  lv_obj_t *msg = lv_label_create(app_grid);
                  lv_label_set_text(msg, "No TPK apps found\nDrop .tpk files in /tpk");
                  lv_obj_set_style_text_color(msg, lv_color_hex(0xFFFFFFAA), LV_PART_MAIN);
                  lv_obj_set_style_text_font(msg, &lv_font_montserrat_16, LV_PART_MAIN);
                  lv_obj_set_style_text_align(msg, LV_TEXT_ALIGN_CENTER, LV_PART_MAIN);
                  lv_obj_center(msg);
              }
          }
          
          static void create_nav_bar(lv_obj_t *parent) {
              lv_obj_t *nav_bar = lv_obj_create(parent);
              lv_obj_set_size(nav_bar, LV_PCT(100), 50);
              lv_obj_align(nav_bar, LV_ALIGN_BOTTOM_MID, 0, 0);
              lv_obj_set_style_bg_color(nav_bar, lv_color_hex(0x1A1A2E), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(nav_bar, LV_OPA_COVER, LV_PART_MAIN);
              lv_obj_set_style_border_width(nav_bar, 0, LV_PART_MAIN);
              lv_obj_set_style_radius(nav_bar, 0, LV_PART_MAIN);
              lv_obj_clear_flag(nav_bar, LV_OBJ_FLAG_SCROLLABLE);
              
              lv_obj_t *label = lv_label_create(nav_bar);
              lv_label_set_text(label, "zenos~# ready | TPK Loader");
              lv_obj_set_style_text_color(label, lv_color_white(), LV_PART_MAIN);
              lv_obj_set_style_text_font(label, &lv_font_montserrat_14, LV_PART_MAIN);
              lv_obj_center(label);
          }
          
          int main(void) {
              printf("zenOS init starting with LVGL...\n");
              
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              mkdir("/dev/pts", 0755);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);
              mkdir("/tmp", 01777);
              mkdir(TPK_DIR, 0755);
              
              if (fork() == 0) {
                  setsid();
                  int fd = open("/dev/console", O_RDWR);
                  if (fd >= 0) {
                      dup2(fd, 0); dup2(fd, 1); dup2(fd, 2);
                      if (fd > 2) close(fd);
                  }
                  setenv("PS1", "zenos~# ", 1);
                  execl("/bin/busybox", "sh", "-i", NULL);
                  exit(1);
              }
              
              lv_init();
              fbdev_init();
              
              static lv_disp_draw_buf_t disp_buf;
              static lv_color_t buf[800 * 480 / 10];
              lv_disp_draw_buf_init(&disp_buf, buf, NULL, 800 * 480 / 10);
              
              static lv_disp_drv_t disp_drv;
              lv_disp_drv_init(&disp_drv);
              disp_drv.draw_buf = &disp_buf;
              disp_drv.flush_cb = fbdev_flush;
              disp_drv.hor_res = 800;
              disp_drv.ver_res = 480;
              lv_disp_drv_register(&disp_drv);
              
              evdev_init();
              static lv_indev_drv_t indev_drv;
              lv_indev_drv_init(&indev_drv);
              indev_drv.type = LV_INDEV_TYPE_POINTER;
              indev_drv.read_cb = evdev_read;
              lv_indev_t *indev = lv_indev_drv_register(&indev_drv);
              
              lv_obj_t *scr = lv_scr_act();
              lv_obj_set_style_bg_color(scr, lv_color_hex(0x0F0F1E), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(scr, LV_OPA_COVER, LV_PART_MAIN);
              
              create_status_bar(scr);
              create_app_grid(scr);
              create_nav_bar(scr);
              
              printf("LVGL GUI initialized\n");
              
              while (1) {
                  lv_timer_handler();
                  usleep(5000);
                  int status;
                  while (waitpid(-1, &status, WNOHANG) > 0);
              }
              
              return 0;
          }
          INITEOF
          
          aarch64-linux-gnu-gcc -O2 -static -o zenos-rootfs/init init.c \
            -I. -Ilvgl -Ilv_drivers \
            lvgl/liblvgl.a lv_drivers/liblv_drivers.a \
            -lm -lpthread
          chmod +x zenos-rootfs/init
          ls -lh zenos-rootfs/init

      - name: Build initramfs
        run: |
          set -e
          cd zenos-rootfs
          mkdir -p dev proc sys tmp tpk dev/input
          ln -sf bin/busybox bin/sh
          ln -sf bin/busybox bin/ls
          ln -sf bin/busybox bin/cat
          ln -sf bin/busybox bin/mkdir
          ln -sf bin/busybox bin/unzip
          ln -sf bin/busybox bin/mount
          ln -sf bin/busybox bin/chmod
          
          mkdir -p tpk/demo.tpk/shared/res
          cat > tpk/demo.tpk/shared/res/entry.sh << 'TPK'
          #!/bin/sh
          echo "Hello from zenOS TPK!"
          sleep 3
          TPK
          chmod +x tpk/demo.tpk/shared/res/entry.sh
          cd tpk/demo.tpk && zip -r ../../demo.tpk . && cd ../..
          rm -rf tpk/demo.tpk
          mv demo.tpk tpk/ 2>/dev/null || true
          
          find . | cpio -H newc -o > ../initramfs.cpio
          gzip -9 < ../initramfs.cpio > ../initramfs.img
          cd ..
          ls -lh initramfs.img
          [ -s initramfs.img ] || exit 1

      - name: Create disk image
        run: |
          set -e
          dd if=/dev/zero of=zenos.img bs=1M count=64
          mkfs.ext4 -F zenos.img
          mkdir -p mnt
          sudo mount -o loop zenos.img mnt
          sudo cp kernel.img initramfs.img mnt/
          sudo sync
          sudo umount mnt
          gzip -k zenos.img
          ls -lh zenos.img*
          [ -s zenos.img ] || exit 1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenos-arm64-lvgl
          path: |
            zenos.img.gz
            kernel.img
            initramfs.img
          if-no-files-found: error

      - name: QEMU smoke test
        run: |
          timeout 20 qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 512 \
            -kernel kernel.img -initrd initramfs.img \
            -append "console=ttyAMA0 rdinit=/init" \
            -device virtio-gpu-pci \
            -device ramfb \
            -display vnc=:5 \
            -nographic || true
