          static inline void px(int x, int y, uint32_t c) {
              if (x >= 0 && x < W && y >= 0 && y < H) fb_back[y * W + x] = c;
          }

          static void fill_rect(int x, int y, int w, int h, uint32_t c) {
              if (x < 0) { w += x; x = 0; }
              if (y < 0) { h += y; y = 0; }
              if (x + w > W) w = W - x;
              if (y + h > H) h = H - y;
              if (w <= 0 || h <= 0) return;
              uint32_t *p = fb_back + y * W + x;
              for (int j = 0; j < h; j++) {
                  for (int i = 0; i < w; i++) p[i] = c;
                  p += W;
              }
          }

          static void rrect(int x, int y, int w, int h, int r, uint32_t c) {
              if (r > w/2) r = w/2;
              if (r > h/2) r = h/2;
              fill_rect(x + r, y, w - 2*r, h, c);
              fill_rect(x, y + r, r, h - 2*r, c);
              fill_rect(x + w - r, y + r, r, h - 2*r, c);
              for (int j = -r; j <= r; j++)
                  for (int i = -r; i <= r; i++)
                      if (i*i + j*j <= r*r) {
                          px(x + r + i, y + r + j, c);
                          px(x + w - r - 1 + i, y + r + j, c);
                          px(x + r + i, y + h - r - 1 + j, c);
                          px(x + w - r - 1 + i, y + h - r - 1 + j, c);
                      }
          }

          static void grad_v(int x, int y, int w, int h, uint32_t c1, uint32_t c2) {
              uint8_t r1=(c1>>16)&0xFF, g1=(c1>>8)&0xFF, b1=c1&0xFF;
              uint8_t r2=(c2>>16)&0xFF, g2=(c2>>8)&0xFF, b2=c2&0xFF;
              for (int j = 0; j < h; j++) {
                  int t = h > 1 ? j : 0;
                  int d = h > 1 ? h - 1 : 1;
                  uint8_t r = r1 + (r2-r1)*t/d;
                  uint8_t g = g1 + (g2-g1)*t/d;
                  uint8_t b = b1 + (b2-b1)*t/d;
                  uint32_t c = 0xFF000000 | (r<<16) | (g<<8) | b;
                  fill_rect(x, y + j, w, 1, c);
              }
          }

          static void dchar(int x, int y, char ch, int s, uint32_t c) {
              if (ch < 32 || ch > 126) ch = '?';
              const uint8_t *g = font8x16[ch - 32];
              for (int row = 0; row < 16; row++)
                  for (int col = 0; col < 8; col++)
                      if (g[row] & (0x80 >> col))
                          for (int sy = 0; sy < s; sy++)
                              for (int sx = 0; sx < s; sx++)
                                  px(x + col*s + sx, y + row*s + sy, c);
          }

          static void dstr(int x, int y, const char *s, int sc, uint32_t c) {
              int cx = x;
              for (int i = 0; s[i]; i++) {
                  if (s[i] == '\n') { cx = x; y += 16*sc + 2; continue; }
                  dchar(cx, y, s[i], sc, c);
                  cx += 8*sc;
              }
          }

          static int strw(const char *s, int sc) { return strlen(s) * 8 * sc; }

          /* ===== TURBO: Run app script, output to ui.txt ===== */
          static void run_app_script(const char *app_dir, const char *event) {
              char cmd[2048];
              if (event && *event) {
                  snprintf(cmd, sizeof(cmd),
                      "cd '%s' && TPK_EVENT='%s' APP_DIR='%s' ./entry.sh > ui.txt 2>/dev/null",
                      app_dir, event, app_dir);
              } else {
                  snprintf(cmd, sizeof(cmd),
                      "cd '%s' && APP_DIR='%s' ./entry.sh > ui.txt 2>/dev/null",
                      app_dir, app_dir);
              }
              system(cmd);
          }

          /* Read ui.txt directly - NO SHELL */
          static int read_ui_file(const char *app_dir, char *out, int sz) {
              char path[512];
              snprintf(path, sizeof(path), "%s/ui.txt", app_dir);
              int fd = open(path, O_RDONLY);
              if (fd < 0) return -1;
              ssize_t r = read(fd, out, sz - 1);
              close(fd);
              if (r < 0) return -1;
              out[r] = 0;
              return 0;
          }

          typedef struct {
              char cmd[32], id[64], text[256];
              int x, y, w, h, size;
              uint32_t color;
          } ui_cmd_t;
          static ui_cmd_t ui_cmds[512];
          static int n_ui_cmds = 0;

          static void parse_ui(const char *output) {
              n_ui_cmds = 0;
              const char *p = output;
              while (*p && n_ui_cmds < 512) {
                  while (*p && isspace(*p)) p++;
                  if (!*p) break;
                  ui_cmd_t *c = &ui_cmds[n_ui_cmds];
                  memset(c, 0, sizeof(*c));
                  char line[1024];
                  int i = 0;
                  while (*p && *p != '\n' && i < 1023) line[i++] = *p++;
                  line[i] = 0;
                  if (*p == '\n') p++;
                  char *save, *tok = strtok_r(line, " \t", &save);
                  if (!tok) continue;
                  if (strcmp(tok, "BG") == 0) {
                      strcpy(c->cmd, "BG");
                      tok = strtok_r(NULL, " \t", &save);
                      if (tok) c->color = strtoul(tok, NULL, 0);
                  } else if (strcmp(tok, "RECT") == 0) {
                      strcpy(c->cmd, "RECT");
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->w = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->h = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->color = strtoul(tok, NULL, 0);
                  } else if (strcmp(tok, "TEXT") == 0) {
                      strcpy(c->cmd, "TEXT");
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->size = atoi(tok);
                      char *q = strchr(save, '"'); char *e = NULL;
                      if (q) { q++; e = strchr(q, '"'); if (e) { int l = e - q; if (l > 255) l = 255; strncpy(c->text, q, l); c->text[l] = 0; } }
                      if (q && e) { q = e + 1; while (*q == ' ' || *q == '\t') q++; if (*q) c->color = strtoul(q, NULL, 0); }
                  } else if (strcmp(tok, "BTN") == 0) {
                      strcpy(c->cmd, "BTN");
                      tok = strtok_r(NULL, " \t", &save); if (tok) strncpy(c->id, tok, 63);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->w = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->h = atoi(tok);
                      char label[128] = {0}; char *q = strchr(save ? save : "", '"'); char *e = NULL;
                      if (q) { q++; e = strchr(q, '"'); if (e) { int l = e - q; if (l > 127) l = 127; strncpy(label, q, l); label[l] = 0; } }
                      if (q && e) { q = e + 1; while (*q == ' ' || *q == '\t') q++; c->color = strtoul(q, NULL, 0); }
                      snprintf(c->text, sizeof(c->text), "%s", label);
                  }
                  n_ui_cmds++;
              }
          }

          /* ===== Extract all TPKs once at startup ===== */
          static void extract_all_tpks(void) {
              mkdir(APPS_DIR, 0755);
              DIR *d = opendir(TPK_DIR);
              if (!d) return;
              struct dirent *e;
              n_apps = 0;
              uint32_t P[][2] = {
                  {0x6C5CE7,0xA29BFE},{0x00B894,0x55EFC4},{0xE17055,0xFAB1A0},
                  {0x0984E3,0x74B9FF},{0xFD79A8,0xFDCB6E},{0x00CEC9,0x81ECEC},
                  {0xE84393,0xFD79A8},{0x2D3436,0x636E72},{0xD63031,0xFF7675},
                  {0x00B894,0x00CEC9},{0xFDCB6E,0xE17055},{0x0984E3,0x6C5CE7}
              };
              while ((e = readdir(d)) && n_apps < MAX_APPS) {
                  char *dot = strstr(e->d_name, ".tpk");
                  if (!dot) continue;
                  
                  char name[64];
                  strncpy(name, e->d_name, dot - e->d_name);
                  name[dot - e->d_name] = 0;
                  
                  char app_dir[256], tpk_path[256], cmd[1024];
                  snprintf(app_dir, sizeof(app_dir), APPS_DIR "/%s", name);
                  snprintf(tpk_path, sizeof(tpk_path), TPK_DIR "/%s", e->d_name);
                  
                  mkdir(app_dir, 0755);
                  /* Extract shared/res to app_dir */
                  snprintf(cmd, sizeof(cmd),
                      "unzip -o -j '%s' 'shared/res/*' -d '%s' >/dev/null 2>&1",
                      tpk_path, app_dir);
                  system(cmd);
                  
                  /* Rename entry.sh if exists */
                  char old_path[512], new_path[512];
                  snprintf(old_path, sizeof(old_path), "%s/shared/res/entry.sh", app_dir);
                  snprintf(new_path, sizeof(new_path), "%s/entry.sh", app_dir);
                  
                  /* Check which path exists */
                  struct stat st;
                  if (stat(old_path, &st) == 0) {
                      rename(old_path, new_path);
                  }
                  chmod(new_path, 0755);
                  
                  strncpy(apps[n_apps].name, name, 63);
                  strncpy(apps[n_apps].dir, app_dir, 255);
                  strncpy(apps[n_apps].tpk, e->d_name, 255);
                  apps[n_apps].icon_letter = name[0];
                  if (apps[n_apps].icon_letter >= 'a' && apps[n_apps].icon_letter <= 'z')
                      apps[n_apps].icon_letter -= 32;
                  apps[n_apps].color1 = P[n_apps % 12][0];
                  apps[n_apps].color2 = P[n_apps % 12][1];
                  
                  /* Pre-run once to generate ui.txt */
                  run_app_script(app_dir, "");
                  
                  n_apps++;
                  klog("extracted: %s", name);
              }
              closedir(d);
              klog("total apps extracted: %d", n_apps);
          }

          static int create_window(const char *name, const char *app_dir, uint32_t color) {
              for (int i = 0; i < MAX_WINDOWS; i++) {
                  if (!windows[i].active) {
                      windows[i].active = 1;
                      windows[i].x = 50 + i * 30;
                      windows[i].y = 80 + i * 20;
                      windows[i].w = 700; windows[i].h = 360;
                      strncpy(windows[i].title, name, 63);
                      strncpy(windows[i].app_dir, app_dir, 255);
                      windows[i].color = color;
                      windows[i].needs_redraw = 1;
                      active_window = i;
                      return i;
                  }
              }
              return -1;
          }

          static void close_window(int idx) {
              if (idx >= 0 && idx < MAX_WINDOWS) {
                  windows[idx].active = 0;
                  if (active_window == idx) active_window = -1;
              }
          }

          static void draw_window(int idx) {
              window_t *w = &windows[idx];
              if (!w->active || w->minimized) return;
              
              /* Re-run script if UI changed */
              if (w->needs_redraw) {
                  run_app_script(w->app_dir, "");
                  w->needs_redraw = 0;
              }
              
              int x = w->x, y = w->y, width = w->w, height = w->h;
              rrect(x, y, width, height, 12, 0x1A1A2E);
              grad_v(x, y, width, 40, 0x2D3436, 0x1A1A2E);
              
              /* Close button */
              int cx = x + width - 36, cy = y + 8;
              rrect(cx, cy, 24, 24, 6, 0xD63031);
              dstr(cx + 8, cy + 6, "X", 2, 0xFFFFFFFF);
              dstr(x + 12, y + 12, w->title, 2, 0xFFFFFFFF);

              char output[UI_CACHE_SIZE];
              if (read_ui_file(w->app_dir, output, sizeof(output)) == 0) {
                  parse_ui(output);
                  uint32_t bg = 0x1A1A2E;
                  for (int i = 0; i < n_ui_cmds; i++)
                      if (strcmp(ui_cmds[i].cmd, "BG") == 0) bg = ui_cmds[i].color;
                  fill_rect(x, y + 40, width, height - 40, bg);
                  for (int i = 0; i < n_ui_cmds; i++) {
                      ui_cmd_t *c = &ui_cmds[i];
                      if (strcmp(c->cmd, "RECT") == 0) {
                          fill_rect(x + c->x, y + 40 + c->y, c->w, c->h, c->color);
                      } else if (strcmp(c->cmd, "TEXT") == 0) {
                          dstr(x + c->x, y + 40 + c->y, c->text, c->size, c->color);
                      } else if (strcmp(c->cmd, "BTN") == 0) {
                          rrect(x + c->x, y + 40 + c->y, c->w, c->h, 8, c->color);
                          int tw = strw(c->text, 2);
                          dstr(x + c->x + (c->w - tw)/2, y + 40 + c->y + (c->h - 16)/2, c->text, 2, 0xFFFFFFFF);
                      }
                  }
              }
          }

          static void draw_status_bar(void) {
              fill_rect(0, 0, W, 40, 0x0D0D22);
              time_t now = time(NULL); struct tm *t = localtime(&now);
              char ts[32];
              strftime(ts, sizeof(ts), "%H:%M", t);
              dstr(20, 12, ts, 2, 0xFFFFFFFF);
              dstr(W - 100, 12, "zenOS", 2, 0x00D4FF);
              /* Input indicator */
              if (n_inputs > 0) {
                  for (int j = -5; j <= 5; j++)
                      for (int i = -5; i <= 5; i++)
                          if (i*i + j*j <= 25)
                              px(W - 130 + i, 20 + j, touch_down ? 0xFF0000 : 0x00FF00);
              }
          }

          #define NAV_H 56
          static void draw_nav_bar(void) {
              int ny = H - NAV_H;
              fill_rect(0, ny, W, NAV_H, 0x000000);
              int btn_w = W / 3;
              int btn_cy = ny + NAV_H / 2;
              
              /* BACK triangle */
              int bx = btn_w / 2;
              int sz = 20;
              for (int i = 0; i < sz*2; i++) {
                  int h = i < sz ? i : sz*2 - i;
                  fill_rect(bx - sz + i, btn_cy - h, 1, h*2 + 1, 0xFFFFFFFF);
              }
              
              /* HOME circle */
              int hx = btn_w + btn_w/2;
              int rad = 18;
              for (int j = -rad; j <= rad; j++)
                  for (int i = -rad; i <= rad; i++) {
                      int d = i*i + j*j;
                      if (d <= rad*rad && d > (rad-4)*(rad-4))
                          px(hx + i, btn_cy + j, 0xFFFFFFFF);
                  }
              
              /* RECENT square */
              int rx = 2*btn_w + btn_w/2;
              int sq = 18;
              fill_rect(rx - sq, btn_cy - sq, sq*2, 3, 0xFFFFFFFF);
              fill_rect(rx - sq, btn_cy + sq - 3, sq*2, 3, 0xFFFFFFFF);
              fill_rect(rx - sq, btn_cy - sq, 3, sq*2, 0xFFFFFFFF);
              fill_rect(rx + sq - 3, btn_cy - sq, 3, sq*2, 0xFFFFFFFF);
          }

          static void draw_home(void) {
              grad_v(0, 40, W, H - 40 - NAV_H, 0x0A0A1E, 0x16213E);
              if (n_apps == 0) {
                  dstr((W - strw("No Apps", 2))/2, H/2, "No Apps", 2, 0xAAAAAA);
                  return;
              }
              int cols = 4, icon = 90, gx = 30, gy = 40;
              int tw = cols*icon + (cols-1)*gx;
              int sx = (W - tw)/2, sy = 90;
              dstr(sx, sy - 30, "Applications", 2, 0x888888);
              for (int i = 0; i < n_apps; i++) {
                  int col = i % cols, row = i / cols;
                  int ax = sx + col*(icon + gx);
                  int ay = sy + row*(icon + gy + 30);
                  grad_v(ax, ay, icon, icon, apps[i].color1, apps[i].color2);
                  int r = icon/5;
                  for (int j = 0; j < r; j++)
                      for (int k = 0; k < r; k++)
                          if (k*k + j*j > r*r) {
                              px(ax + k, ay + j, 0x0A0A1E);
                              px(ax + icon - 1 - k, ay + j, 0x0A0A1E);
                              px(ax + k, ay + icon - 1 - j, 0x0A0A1E);
                              px(ax + icon - 1 - k, ay + icon - 1 - j, 0x0A0A1E);
                          }
                  char l[2] = {apps[i].icon_letter, 0};
                  int sc = icon/32; if (sc < 2) sc = 2;
                  int tw2 = strw(l, sc);
                  dstr(ax + (icon - tw2)/2, ay + (icon - 16*sc)/2, l, sc, 0xFFFFFFFF);
                  char dn[64];
                  int nw = strw(apps[i].name, 2);
                  if (nw > icon + 20) { strncpy(dn, apps[i].name, 12); dn[12] = 0; strcat(dn, ".."); }
                  else strcpy(dn, apps[i].name);
                  int dw = strw(dn, 2);
                  dstr(ax + (icon - dw)/2, ay + icon + 8, dn, 2, 0xCCCCCC);
              }
          }

          /* NO MOUSE CURSOR - touch only */
          static void draw_touch_indicator(void) {
              if (!touch_visible) return;
              /* Fading ripple at touch point */
              if (press_timer > 0) {
                  int r = (20 - press_timer) * 2;
                  uint8_t alpha = press_timer * 12;
                  uint32_t c = 0x00D4FF;
                  for (int j = -r; j <= r; j++)
                      for (int i = -r; i <= r; i++) {
                          int d = i*i + j*j;
                          if (d <= r*r && d > (r-3)*(r-3)) {
                              int xx = press_x + i, yy = press_y + j;
                              if (xx >= 0 && xx < W && yy >= 0 && yy < H) {
                                  uint32_t *p = &fb_back[yy * W + xx];
                                  uint8_t dr = (*p >> 16) & 0xFF;
                                  uint8_t dg = (*p >> 8) & 0xFF;
                                  uint8_t db = *p & 0xFF;
                                  uint8_t sr = (c >> 16) & 0xFF;
                                  uint8_t sg = (c >> 8) & 0xFF;
                                  uint8_t sb = c & 0xFF;
                                  uint8_t nr = (sr * alpha + dr * (255-alpha))/255;
                                  uint8_t ng = (sg * alpha + dg * (255-alpha))/255;
                                  uint8_t nb = (sb * alpha + db * (255-alpha))/255;
                                  *p = 0xFF000000 | (nr << 16) | (ng << 8) | nb;
                              }
                          }
                      }
                  press_timer--;
              }
          }

          static int handle_nav_click(void) {
              int ny = H - NAV_H;
              if (touch_y < ny) return 0;
              int btn_w = W / 3;
              if (touch_x < btn_w) {
                  if (active_window >= 0) close_window(active_window);
              } else if (touch_x < 2*btn_w) {
                  for (int i = 0; i < MAX_WINDOWS; i++)
                      if (windows[i].active) windows[i].active = 0;
                  active_window = -1;
              } else {
                  if (active_window >= 0) close_window(active_window);
              }
              return 1;
          }

          static void handle_touch(void) {
              press_x = touch_x; press_y = touch_y; press_timer = 15;
              touch_visible = 1;
              
              if (touch_y < 40) return;
              if (handle_nav_click()) return;

              if (active_window >= 0 && windows[active_window].active) {
                  window_t *w = &windows[active_window];
                  int lx = touch_x - w->x, ly = touch_y - w->y;
                  if (lx >= w->w - 36 && lx <= w->w - 12 && ly >= 8 && ly <= 32) {
                      close_window(active_window); return;
                  }
                  if (ly >= 0 && ly < 40) {
                      w->x = touch_x - w->w/2; w->y = touch_y - 20;
                      if (w->y < 40) w->y = 40;
                      return;
                  }
                  char output[UI_CACHE_SIZE];
                  if (read_ui_file(w->app_dir, output, sizeof(output)) == 0) {
                      parse_ui(output);
                      int wy = ly - 40;
                      for (int i = 0; i < n_ui_cmds; i++) {
                          if (strcmp(ui_cmds[i].cmd, "BTN") == 0 &&
                              lx >= ui_cmds[i].x && lx <= ui_cmds[i].x + ui_cmds[i].w &&
                              wy >= ui_cmds[i].y && wy <= ui_cmds[i].y + ui_cmds[i].h) {
                              char event[128];
                              snprintf(event, sizeof(event), "click_%s", ui_cmds[i].id);
                              /* Run with event -> regenerates ui.txt */
                              run_app_script(w->app_dir, event);
                              return;
                          }
                      }
                  }
              } else {
                  int cols = 4, icon = 90, gx = 30, gy = 40;
                  int tw = cols*icon + (cols-1)*gx;
                  int sx = (W - tw)/2, sy = 90;
                  for (int i = 0; i < n_apps; i++) {
                      int col = i % cols, row = i / cols;
                      int ax = sx + col*(icon + gx);
                      int ay = sy + row*(icon + gy + 30);
                      if (touch_x >= ax && touch_x <= ax + icon &&
                          touch_y >= ay && touch_y <= ay + icon) {
                          create_window(apps[i].name, apps[i].dir, apps[i].color1);
                          return;
                      }
                  }
              }
          }

          static void init_input(void) {
              n_inputs = 0;
              sleep(1);
              for (int i = 0; i < 16 && n_inputs < MAX_INPUTS; i++) {
                  char path[64];
                  snprintf(path, sizeof(path), "/dev/input/event%d", i);
                  int fd = open(path, O_RDONLY | O_NONBLOCK);
                  if (fd >= 0) {
                      struct input_absinfo abs;
                      if (ioctl(fd, EVIOCGABS(ABS_X), &abs) == 0) {
                          abs_x_min = abs.minimum; abs_x_max = abs.maximum;
                      }
                      if (ioctl(fd, EVIOCGABS(ABS_Y), &abs) == 0) {
                          abs_y_min = abs.minimum; abs_y_max = abs.maximum;
                      }
                      input_fds[n_inputs++] = fd;
                      klog("input: %s", path);
                  }
              }
              klog("total inputs: %d", n_inputs);
          }

          static void poll_input(void) {
              if (n_inputs == 0) return;
              fd_set rfds; FD_ZERO(&rfds);
              int max_fd = -1;
              for (int i = 0; i < n_inputs; i++) {
                  FD_SET(input_fds[i], &rfds);
                  if (input_fds[i] > max_fd) max_fd = input_fds[i];
              }
              struct timeval tv = {0, 0};
              if (select(max_fd + 1, &rfds, NULL, NULL, &tv) <= 0) return;

              for (int i = 0; i < n_inputs; i++) {
                  if (!FD_ISSET(input_fds[i], &rfds)) continue;
                  struct input_event ev;
                  if (read(input_fds[i], &ev, sizeof(ev)) != sizeof(ev)) continue;

                  if (ev.type == EV_ABS) {
                      if (ev.code == ABS_X) {
                          int range = abs_x_max - abs_x_min;
                          int nx = range > 0 ? (ev.value - abs_x_min) * (W - 1) / range : ev.value * W / 32767;
                          if (nx < 0) nx = 0; if (nx >= W) nx = W - 1;
                          touch_x = nx;
                      } else if (ev.code == ABS_Y) {
                          int range = abs_y_max - abs_y_min;
                          int ny = range > 0 ? (ev.value - abs_y_min) * (H - 1) / range : ev.value * H / 32767;
                          if (ny < 0) ny = 0; if (ny >= H) ny = H - 1;
                          touch_y = ny;
                      } else if (ev.code == ABS_PRESSURE || ev.code == ABS_MT_PRESSURE) {
                          int v = ev.value > 0 ? 1 : 0;
                          last_touch_down = touch_down; touch_down = v;
                      }
                  } else if (ev.type == EV_KEY) {
                      int v = ev.value; if (v == 2) v = 1;
                      if (ev.code == BTN_LEFT || ev.code == BTN_TOUCH || ev.code == BTN_MOUSE) {
                          last_touch_down = touch_down; touch_down = v;
                      }
                  } else if (ev.type == EV_REL) {
                      if (ev.code == REL_X) { touch_x += ev.value; if (touch_x<0) touch_x=0; if (touch_x>=W) touch_x=W-1; }
                      if (ev.code == REL_Y) { touch_y += ev.value; if (touch_y<0) touch_y=0; if (touch_y>=H) touch_y=H-1; }
                  }
              }
          }

          static void render(void) {
              memset(fb_back, 0, fb_size);
              draw_home();
              for (int i = 0; i < MAX_WINDOWS; i++)
                  if (windows[i].active) draw_window(i);
              draw_status_bar();
              draw_nav_bar();
              draw_touch_indicator();
              if (fb_front) memcpy(fb_front, fb_back, fb_size);
          }

          int main(void) {
              klog("init starting (TURBO mode)");
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              sleep(2);
              mkdir("/dev/pts", 0755);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);
              mount("tmpfs", "/tmp", "tmpfs", 0, NULL);
              mount("tmpfs", "/var", "tmpfs", 0, NULL);
              mkdir(TPK_DIR, 0755);
              mkdir("/root", 0755);
              mkdir("/data", 0755);

              /* Real shell on /dev/tty2 */
              if (fork() == 0) {
                  setsid();
                  int fd = open("/dev/tty2", O_RDWR);
                  if (fd < 0) fd = open("/dev/console", O_RDWR);
                  if (fd >= 0) { ioctl(fd, TIOCSCTTY, 1); dup2(fd, 0); dup2(fd, 1); dup2(fd, 2); if (fd > 2) close(fd); }
                  setenv("PS1", "zenos~# ", 1);
                  setenv("HOME", "/root", 1);
                  setenv("PATH", "/bin:/usr/bin", 1);
                  execl("/bin/busybox", "sh", "-i", NULL);
                  exit(1);
              }

              { int tty = open("/dev/tty1", O_RDWR);
                if (tty >= 0) { ioctl(tty, VT_ACTIVATE, 1); ioctl(tty, VT_WAITACTIVE, 1); ioctl(tty, KDSETMODE, KD_GRAPHICS); close(tty); }
              }

              sleep(1);
              for (int t = 0; t < 15; t++) {
                  fb_fd = open("/dev/fb0", O_RDWR);
                  if (fb_fd >= 0) break;
                  sleep(1);
              }
              if (fb_fd < 0) { while (1) { int s; while (waitpid(-1, &s, WNOHANG) > 0); sleep(5); } }
              struct fb_var_screeninfo vi;
              ioctl(fb_fd, FBIOGET_VSCREENINFO, &vi);
              W = vi.xres; H = vi.yres; fb_size = W * H * 4;
              fb_front = mmap(0, fb_size, PROT_READ|PROT_WRITE, MAP_SHARED, fb_fd, 0);
              if (fb_front == MAP_FAILED) return 1;
              fb_back = malloc(fb_size);
              memset(fb_back, 0, fb_size);

              init_input();
              
              klog("extracting TPKs...");
              extract_all_tpks();
              
              klog("GUI ready, %dx%d, %d inputs, %d apps", W, H, n_inputs, n_apps);

              while (1) {
                  poll_input();
                  int new_touch = touch_down && !last_touch_down;
                  if (new_touch) handle_touch();
                  last_touch_down = touch_down;
                  render();
                  usleep(16666); /* 60 FPS */
                  int s; while (waitpid(-1, &s, WNOHANG) > 0);
              }
              return 0;
          }
          CEOF
          aarch64-linux-gnu-gcc -O3 -march=armv8-a -mtune=cortex-a57 -static -o zenos-rootfs/init zenos-rootfs/init.c -lm
          chmod +x zenos-rootfs/init
          ls -lh zenos-rootfs/init

      - name: Create real TPK apps (communicate with kernel)
        run: |
          cd zenos-rootfs
          mkdir -p dev proc sys tmp tpk dev/input usr/bin tpk_build root data
          for cmd in sh ls cat mkdir mount chmod unzip sleep echo clear date ps free df uname hostname wc head tail awk grep dirname basename top stat kill mkfifo readlink id whoami pwd touch rm mv cp; do
            ln -sf busybox bin/$cmd 2>/dev/null || true
          done

          # ===== TERMINAL - REAL shell communication via FIFO =====
          mkdir -p tpk_build/Terminal/shared/res
          cat > tpk_build/Terminal/shared/res/entry.sh << 'TERMINAL'
          #!/bin/sh
          # Real terminal: uses FIFO to communicate with actual shell
          FIFO_IN="/tmp/term_in"
          FIFO_OUT="/tmp/term_out"
          HIST="/tmp/term_hist"
          SHELL_PID="/tmp/term_shell_pid"

          # Create FIFOs if needed
          [ ! -p "$FIFO_IN" ] && mkfifo "$FIFO_IN" 2>/dev/null
          [ ! -p "$FIFO_OUT" ] && mkfifo "$FIFO_OUT" 2>/dev/null
          [ ! -f "$HIST" ] && touch "$HIST"

          # Start persistent shell in background if not running
          if [ ! -f "$SHELL_PID" ] || ! kill -0 "$(cat "$SHELL_PID" 2>/dev/null)" 2>/dev/null; then
            (
              while true; do
                if read cmd < "$FIFO_IN"; then
                  echo "zenos~# $cmd" >> "$HIST"
                  eval "$cmd" > "$FIFO_OUT" 2>&1
                  echo "---END---" >> "$FIFO_OUT"
                fi
              done
            ) &
            echo "$!" > "$SHELL_PID"
          fi

          send_cmd() {
            echo "$1" > "$FIFO_IN" &
            # Read output with timeout
            timeout 2 sh -c "
              while IFS= read -r line; do
                if [ \"\$line\" = '---END---' ]; then break; fi
                echo \"\$line\"
              done
            " < "$FIFO_OUT" > /tmp/term_result 2>/dev/null
          }

          echo "BG 0x000000"
          echo "TEXT 10 10 2 \"zenOS Terminal (LIVE)\" 0x00FF00"
          echo "RECT 10 40 680 1 0x008800"

          case "$TPK_EVENT" in
            click_ls) send_cmd "ls -lah /" ;;
            click_ps) send_cmd "ps aux" ;;
            click_df) send_cmd "df -h" ;;
            click_uname) send_cmd "uname -a" ;;
            click_free) send_cmd "cat /proc/meminfo | head -10" ;;
            click_date) send_cmd "date" ;;
            click_whoami) send_cmd "whoami; id" ;;
            click_uptime) send_cmd "cat /proc/uptime" ;;
            click_net) send_cmd "cat /proc/net/dev" ;;
            click_mount) send_cmd "mount" ;;
            click_dmesg) send_cmd "dmesg | tail -20" ;;
            click_clear) : > /tmp/term_result ;;
          esac

          echo "BTN ls       10 50  70 32 \"ls\"      0x2D3436"
          echo "BTN ps       90 50  70 32 \"ps\"      0x2D3436"
          echo "BTN df       170 50 70 32 \"df\"      0x2D3436"
          echo "BTN uname    250 50 70 32 \"uname\"   0x2D3436"
          echo "BTN free     330 50 70 32 \"mem\"     0x2D3436"
          echo "BTN date     410 50 70 32 \"date\"    0x2D3436"
          echo "BTN whoami   10 90  80 32 \"whoami\"  0x0984E3"
          echo "BTN uptime   100 90 80 32 \"uptime\"  0x0984E3"
          echo "BTN net      190 90 80 32 \"net\"     0x0984E3"
          echo "BTN mount    280 90 80 32 \"mount\"   0x0984E3"
          echo "BTN dmesg    370 90 80 32 \"dmesg\"   0x6C5CE7"
          echo "BTN clear    460 90 80 32 \"clear\"   0xD63031"

          Y=135
          if [ -f /tmp/term_result ] && [ -s /tmp/term_result ]; then
            while IFS= read -r line; do
              [ $Y -gt 340 ] && break
              # truncate very long lines
              short=$(echo "$line" | cut -c1-90)
              echo "TEXT 10 $Y 1 \"$short\" 0x00FF00"
              Y=$((Y + 12))
            done < /tmp/term_result
          else
            echo "TEXT 10 140 1 \"Real shell connected via FIFO\" 0xAAAAAA"
            echo "TEXT 10 156 1 \"Click commands to execute\" 0x888888"
          fi
          TERMINAL
          chmod +x tpk_build/Terminal/shared/res/entry.sh
          (cd tpk_build/Terminal && zip -qr ../../tpk/Terminal.tpk .)

          # ===== FILES =====
          mkdir -p tpk_build/Files/shared/res
          cat > tpk_build/Files/shared/res/entry.sh << 'FILES'
          #!/bin/sh
          DF="/tmp/files_dir"; [ ! -f "$DF" ] && echo "/" > "$DF"
          CUR=$(cat "$DF")
          echo "BG 0x0A0A1E"
          echo "TEXT 10 10 2 \"Files\" 0x00D4FF"
