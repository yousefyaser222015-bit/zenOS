          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <string.h>
          #include <unistd.h>
          #include <dirent.h>
          #include <fcntl.h>
          #include <time.h>
          #include <ctype.h>
          #include <signal.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <sys/mount.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <sys/select.h>
          #include <linux/fb.h>
          #include <linux/input.h>
          #include <linux/vt.h>
          #include <linux/kd.h>

          #define MAX_WINDOWS 16
          #define MAX_APPS 64
          #define MAX_INPUTS 16
          #define TPK_DIR "/tpk"           /* source TPK files (read-only) */
          #define APPS_DIR "/var/apps"     /* extracted apps (fast access) */
          #define UI_CACHE_SIZE 131072

          static uint32_t *fb_front=NULL, *fb_back=NULL;
          static int W=800, H=480;
          static size_t fb_size=0;
          static int fb_fd=-1;

          static int input_fds[MAX_INPUTS];
          static int n_inputs=0;
          static int touch_x=400, touch_y=240;
          static int touch_down=0, last_touch_down=0;
          static int touch_visible=0; /* hide cursor until first touch */
          static int abs_x_min=0, abs_x_max=32767;
          static int abs_y_min=0, abs_y_max=32767;

          /* Press animation state */
          static int press_x=-1, press_y=-1, press_timer=0;

          typedef struct {
              int active, x, y, w, h;
              char title[64];
              char app_dir[256];  /* /var/apps/Name */
              uint32_t color;
              int minimized;
              int needs_redraw;   /* UI changed, need to re-render ui.txt */
          } window_t;
          static window_t windows[MAX_WINDOWS];
          static int active_window=-1;

          typedef struct {
              char name[64];
              char dir[256];      /* /var/apps/Name */
              char tpk[256];      /* original .tpk filename */
              uint32_t color1, color2;
