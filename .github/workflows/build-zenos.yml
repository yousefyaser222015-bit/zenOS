              echo "welcome" > "$STATE_FILE"
              ;;
            "click date")
              date > /tmp/term_out 2>&1
              echo "date" > "$STATE_FILE"
              ;;
          esac

          echo "BTN ls    10 60  90 30 \"ls\"     0x2D3436"
          echo "BTN ps    110 60 90 30 \"ps\"     0x2D3436"
          echo "BTN df    210 60 90 30 \"df\"     0x2D3436"
          echo "BTN uname 310 60 90 30 \"uname\"  0x2D3436"
          echo "BTN free  410 60 90 30 \"free\"   0x2D3436"
          echo "BTN date  10 100 90 30 \"date\"   0x2D3436"
          echo "BTN clear 110 100 90 30 \"clear\"  0xD63031"

          Y=140
          if [ -f /tmp/term_out ]; then
            while IFS= read -r line; do
              [ $Y -gt 300 ] && break
              echo "TEXT 10 $Y 1 \"$line\" 0x00FF00"
              Y=$((Y + 10))
            done < /tmp/term_out
          else
            echo "TEXT 10 140 2 \"Click a command above\" 0xAAAAAA"
            echo "TEXT 10 160 2 \"to execute and see output\" 0xAAAAAA"
          fi
          TERMINAL
          chmod +x tpk_build/Terminal/shared/res/entry.sh
          cd tpk_build/Terminal && zip -qr ../../tpk/Terminal.tpk . && cd ../..

          # 2. FILE MANAGER
          echo "[+] Files"
          mkdir -p tpk_build/Files/shared/res
          cat > tpk_build/Files/shared/res/entry.sh << 'FILES'
          #!/bin/sh
          DIR_FILE="/tmp/files_dir"
          [ ! -f "$DIR_FILE" ] && echo "/" > "$DIR_FILE"
          CURRENT=$(cat "$DIR_FILE")

          echo "BG 0x0A0A1E"
          echo "TEXT 10 10 2 \"File Manager\" 0x00D4FF"
          echo "TEXT 10 30 1 \"$CURRENT\" 0xFDCB6E"

          echo "BTN up 10 50 80 30 \"[ UP ]\" 0x0984E3"
          echo "BTN home 100 50 80 30 \"[ HOME ]\" 0x00B894"
          echo "BTN root 190 50 80 30 \"[ ROOT ]\" 0x6C5CE7"

          case "$1" in
            "click up")
              NEW=$(dirname "$CURRENT")
              [ -z "$NEW" ] && NEW="/"
              echo "$NEW" > "$DIR_FILE"
              ;;
            "click home")
              echo "/root" > "$DIR_FILE"
              ;;
            "click root")
              echo "/" > "$DIR_FILE"
              ;;
            click\ d_*)
              NAME=${1#click d_}
              if [ "$CURRENT" = "/" ]; then
                NEW="/$NAME"
              else
                NEW="$CURRENT/$NAME"
              fi
              [ -d "$NEW" ] && echo "$NEW" > "$DIR_FILE"
              ;;
          esac

          CURRENT=$(cat "$DIR_FILE")
          Y=90
          for entry in "$CURRENT"/*; do
            [ $Y -gt 300 ] && break
            [ ! -e "$entry" ] && continue
            NAME=$(basename "$entry")
            if [ -d "$entry" ]; then
              echo "BTN d_$NAME 10 $Y 580 20 \"[DIR]  $NAME\" 0x2D3436"
            else
              SIZE=$(ls -la "$entry" | awk '{print $5}')
              echo "TEXT 10 $Y 1 \"FILE  $NAME  ($SIZE B)\" 0xCCCCCC"
            fi
            Y=$((Y + 22))
          done
          FILES
          chmod +x tpk_build/Files/shared/res/entry.sh
          cd tpk_build/Files && zip -qr ../../tpk/Files.tpk . && cd ../..

          # 3. SYSTEM MONITOR - reads /proc
          echo "[+] Monitor"
          mkdir -p tpk_build/Monitor/shared/res
          cat > tpk_build/Monitor/shared/res/entry.sh << 'MONITOR'
          #!/bin/sh
          echo "BG 0x0A0A1E"
          echo "TEXT 10 10 2 \"System Monitor\" 0x00D4FF"
          echo "TEXT 10 30 1 \"--- Kernel ---\" 0xFDCB6E"

          KVER=$(uname -r 2>/dev/null || echo "unknown")
          HOST=$(hostname 2>/dev/null || echo "zenos")
          UPT=$(cat /proc/uptime 2>/dev/null | awk '{print int($1)}' || echo 0)
          UPT_M=$((UPT / 60))
          UPT_H=$((UPT_M / 60))
          UPT_M=$((UPT_M % 60))

          echo "TEXT 10 50 1 \"Hostname: $HOST\" 0xFFFFFF"
          echo "TEXT 10 62 1 \"Kernel:   $KVER\" 0xFFFFFF"
          echo "TEXT 10 74 1 \"Uptime:   ${UPT_H}h ${UPT_M}m\" 0xFFFFFF"

          echo "TEXT 10 100 1 \"--- Memory ---\" 0xFDCB6E"
          if [ -f /proc/meminfo ]; then
            TOTAL=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
            FREE=$(awk '/MemFree/ {print $2}' /proc/meminfo)
            AVAIL=$(awk '/MemAvailable/ {print $2}' /proc/meminfo)
            USED=$((TOTAL - AVAIL))
            PERCENT=$((USED * 100 / TOTAL))
            TOTAL_MB=$((TOTAL / 1024))
            USED_MB=$((USED / 1024))
            echo "TEXT 10 120 1 \"Total:   ${TOTAL_MB} MB\" 0xFFFFFF"
            echo "TEXT 10 132 1 \"Used:    ${USED_MB} MB ($PERCENT%)\" 0xFFFFFF"
            BAR_W=$((PERCENT * 5))
            echo "RECT 10 146 500 12 0x2D3436"
            echo "RECT 10 146 $BAR_W 12 0x00B894"
          fi

          echo "TEXT 10 170 1 \"--- Processes ---\" 0xFDCB6E"
          echo "TEXT 10 186 1 \"PID  COMMAND\" 0x888888"
          Y=200
          ps | head -12 | tail -11 | while IFS= read -r line; do
            [ $Y -gt 320 ] && break
            echo "TEXT 10 $Y 1 \"$line\" 0xCCCCCC"
            Y=$((Y + 12))
          done

          echo "BTN refresh 10 340 120 30 \"Refresh\" 0x0984E3"
          MONITOR
          chmod +x tpk_build/Monitor/shared/res/entry.sh
          cd tpk_build/Monitor && zip -qr ../../tpk/Monitor.tpk . && cd ../..

          # 4. CALCULATOR - real arithmetic
          echo "[+] Calc"
          mkdir -p tpk_build/Calc/shared/res
          cat > tpk_build/Calc/shared/res/entry.sh << 'CALC'
          #!/bin/sh
          STATE="/tmp/calc_state"
          [ ! -f "$STATE" ] && echo "0" > "$STATE"
          VAL=$(cat "$STATE")

          echo "BG 0x0A0A1E"
          echo "TEXT 10 10 2 \"Calculator\" 0x00D4FF"
          echo "RECT 10 50 560 60 0x2D3436"
          echo "TEXT 20 60 4 \"$VAL\" 0x00FF00"

          echo "BTN c  10  130 90 60 \"C\"  0xD63031"
          echo "BTN d7 110 130 90 60 \"7\"  0x2D3436"
          echo "BTN d8 210 130 90 60 \"8\"  0x2D3436"
          echo "BTN d9 310 130 90 60 \"9\"  0x2D3436"
          echo "BTN opdiv 410 130 90 60 \"/\"  0x0984E3"

          echo "BTN d4 110 200 90 60 \"4\"  0x2D3436"
          echo "BTN d5 210 200 90 60 \"5\"  0x2D3436"
          echo "BTN d6 310 200 90 60 \"6\"  0x2D3436"
          echo "BTN opmul 410 200 90 60 \"*\"  0x0984E3"

          echo "BTN d1 110 270 90 60 \"1\"  0x2D3436"
          echo "BTN d2 210 270 90 60 \"2\"  0x2D3436"
          echo "BTN d3 310 270 90 60 \"3\"  0x2D3436"
          echo "BTN opsub 410 270 90 60 \"-\"  0x0984E3"

          echo "BTN d0 10  340 190 40 \"0\"  0x2D3436"
          echo "BTN eq  210 340 90 40 \"=\"  0x00B894"
          echo "BTN opadd 310 340 90 40 \"+\"  0x0984E3"

          # Handle events
          case "$1" in
            "click c") echo "0" > "$STATE" ;;
            click\ d*) DIGIT=${1#click d}; 
              if [ "$VAL" = "0" ]; then echo "$DIGIT" > "$STATE"
              else echo "${VAL}${DIGIT}" > "$STATE"; fi ;;
            click\ op*)
              OP_FILE="/tmp/calc_op"
              PREV_FILE="/tmp/calc_prev"
              OP=${1#click op}
              echo "$VAL" > "$PREV_FILE"
              echo "$OP" > "$OP_FILE"
              echo "0" > "$STATE"
              ;;
            "click eq")
              OP_FILE="/tmp/calc_op"
              PREV_FILE="/tmp/calc_prev"
              if [ -f "$OP_FILE" ] && [ -f "$PREV_FILE" ]; then
                PREV=$(cat "$PREV_FILE")
                OP=$(cat "$OP_FILE")
                case "$OP" in
                  add) RES=$((PREV + VAL)) ;;
                  sub) RES=$((PREV - VAL)) ;;
                  mul) RES=$((PREV * VAL)) ;;
                  div) [ "$VAL" -ne 0 ] && RES=$((PREV / VAL)) || RES="ERR" ;;
                  *) RES="$VAL" ;;
                esac
                echo "$RES" > "$STATE"
                rm -f "$OP_FILE" "$PREV_FILE"
              fi
              ;;
          esac
          CALC
          chmod +x tpk_build/Calc/shared/res/entry.sh
          cd tpk_build/Calc && zip -qr ../../tpk/Calc.tpk . && cd ../..

          # 5. TEXT EDITOR - real file I/O
          echo "[+] Editor"
          mkdir -p tpk_build/Editor/shared/res
          cat > tpk_build/Editor/shared/res/entry.sh << 'EDITOR'
          #!/bin/sh
