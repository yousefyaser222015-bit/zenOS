          done < "$FILE"

          echo "TEXT 10 320 1 \"Lines: $(wc -l < $FILE)  Size: $(wc -c < $FILE) bytes\" 0x888888"
          EDITOR
          chmod +x tpk_build/Editor/shared/res/entry.sh
          cd tpk_build/Editor && zip -qr ../../tpk/Editor.tpk . && cd ../..

          # 6. SETTINGS - real system changes
          echo "[+] Settings"
          mkdir -p tpk_build/Settings/shared/res
          cat > tpk_build/Settings/shared/res/entry.sh << 'SETTINGS'
          #!/bin/sh
          HNAME_FILE="/tmp/zenos_hostname"
          [ ! -f "$HNAME_FILE" ] && hostname > "$HNAME_FILE" 2>/dev/null || echo "zenos" > "$HNAME_FILE"
          HNAME=$(cat "$HNAME_FILE")
