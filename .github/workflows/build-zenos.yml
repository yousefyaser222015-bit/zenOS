          /* ===== Graphics primitives ===== */
          static inline void put_pixel(int x, int y, uint32_t color) {
              if (x >= 0 && x < W && y >= 0 && y < H)
                  fb_back[y * W + x] = color;
          }

          static inline uint32_t get_pixel(int x, int y) {
              if (x >= 0 && x < W && y >= 0 && y < H)
                  return fb_back[y * W + x];
              return 0;
          }

          static void blend_pixel(int x, int y, uint32_t color, uint8_t alpha) {
              if (x < 0 || x >= W || y < 0 || y >= H) return;
              uint32_t *p = &fb_back[y * W + x];
              uint8_t sr = (color >> 16) & 0xFF;
              uint8_t sg = (color >> 8) & 0xFF;
              uint8_t sb = color & 0xFF;
              uint8_t dr = (*p >> 16) & 0xFF;
              uint8_t dg = (*p >> 8) & 0xFF;
              uint8_t db = *p & 0xFF;
              uint8_t r = (sr * alpha + dr * (255 - alpha)) / 255;
              uint8_t g = (sg * alpha + dg * (255 - alpha)) / 255;
              uint8_t b = (sb * alpha + db * (255 - alpha)) / 255;
              *p = 0xFF000000 | (r << 16) | (g << 8) | b;
          }

          static void fill_rect(int x, int y, int w, int h, uint32_t color) {
              for (int j = y; j < y + h; j++)
                  for (int i = x; i < x + w; i++)
                      put_pixel(i, j, color);
          }

          static void fill_rect_alpha(int x, int y, int w, int h, uint32_t color, uint8_t alpha) {
              for (int j = y; j < y + h; j++)
                  for (int i = x; i < x + w; i++)
                      blend_pixel(i, j, color, alpha);
          }

          static void draw_rounded_rect(int x, int y, int w, int h, int r, uint32_t color) {
              fill_rect(x + r, y, w - 2 * r, h, color);
              fill_rect(x, y + r, r, h - 2 * r, color);
              fill_rect(x + w - r, y + r, r, h - 2 * r, color);
              for (int j = -r; j <= r; j++) {
                  for (int i = -r; i <= r; i++) {
                      if (i * i + j * j <= r * r) {
                          put_pixel(x + r + i, y + r + j, color);
                          put_pixel(x + w - r - 1 + i, y + r + j, color);
                          put_pixel(x + r + i, y + h - r - 1 + j, color);
                          put_pixel(x + w - r - 1 + i, y + h - r - 1 + j, color);
                      }
                  }
              }
          }

          static void draw_gradient_v(int x, int y, int w, int h, uint32_t c1, uint32_t c2) {
              for (int j = 0; j < h; j++) {
                  float t = (float)j / (h - 1);
                  uint8_t r = ((c1 >> 16) & 0xFF) * (1 - t) + ((c2 >> 16) & 0xFF) * t;
                  uint8_t g = ((c1 >> 8) & 0xFF) * (1 - t) + ((c2 >> 8) & 0xFF) * t;
                  uint8_t b = (c1 & 0xFF) * (1 - t) + (c2 & 0xFF) * t;
                  uint32_t color = 0xFF000000 | (r << 16) | (g << 8) | b;
                  for (int i = 0; i < w; i++)
                      put_pixel(x + i, y + j, color);
              }
          }

          static void draw_shadow(int x, int y, int w, int h, int blur, uint8_t alpha) {
              for (int b = blur; b > 0; b--) {
                  uint8_t a = alpha * (blur - b + 1) / blur;
                  for (int j = y + b; j < y + h - b; j++) {
                      blend_pixel(x + b, j, 0x000000, a);
                      blend_pixel(x + w - b - 1, j, 0x000000, a);
                  }
                  for (int i = x + b; i < x + w - b; i++) {
                      blend_pixel(i, y + b, 0x000000, a);
                      blend_pixel(i, y + h - b - 1, 0x000000, a);
                  }
              }
          }

          static void draw_char(int x, int y, char ch, int scale, uint32_t color) {
              if (ch < 32 || ch > 126) ch = '?';
              const uint8_t *glyph = font8x16[ch - 32];
              for (int row = 0; row < 16; row++) {
                  for (int col = 0; col < 8; col++) {
                      if (glyph[row] & (0x80 >> col)) {
                          for (int sy = 0; sy < scale; sy++)
                              for (int sx = 0; sx < scale; sx++)
                                  put_pixel(x + col * scale + sx, y + row * scale + sy, color);
                      }
                  }
              }
          }

          static void draw_string(int x, int y, const char *str, int scale, uint32_t color) {
              int cx = x;
              for (int i = 0; str[i]; i++) {
                  if (str[i] == '\n') {
                      cx = x;
                      y += 16 * scale + 2;
                      continue;
                  }
                  draw_char(cx, y, str[i], scale, color);
                  cx += 8 * scale;
              }
          }

          static int string_width(const char *str, int scale) {
              return strlen(str) * 8 * scale;
          }

          static void draw_string_centered(int y, const char *str, int scale, uint32_t color) {
              int w = string_width(str, scale);
              draw_string((W - w) / 2, y, str, scale, color);
          }

          /* ===== TPK Runner ===== */
          static int run_tpk_app(const char *tpk_path, const char *event, char *output, int out_size) {
              char cmd[2048];
              if (event && *event)
                  snprintf(cmd, sizeof(cmd), "/bin/busybox unzip -p '%s' shared/res/entry.sh 2>/dev/null | TPK_EVENT='%s' /bin/busybox sh 2>/dev/null", tpk_path, event);
              else
                  snprintf(cmd, sizeof(cmd), "/bin/busybox unzip -p '%s' shared/res/entry.sh 2>/dev/null | /bin/busybox sh 2>/dev/null", tpk_path);
              
              FILE *f = popen(cmd, "r");
              if (!f) return -1;
              
              size_t total = 0;
              while (total < (size_t)out_size - 1) {
                  size_t r = fread(output + total, 1, out_size - 1 - total, f);
                  if (r == 0) break;
                  total += r;
              }
              output[total] = 0;
              pclose(f);
              return 0;
          }

          /* ===== UI Command Parser ===== */
          typedef struct {
              char cmd[32];
              int x, y, w, h, size;
              uint32_t color;
              char text[256];
              char id[64];
          } ui_cmd_t;

          static ui_cmd_t ui_cmds[512];
          static int n_ui_cmds = 0;

          static void parse_ui_commands(const char *output) {
              n_ui_cmds = 0;
              const char *p = output;
              
              while (*p && n_ui_cmds < 512) {
                  while (*p && isspace(*p)) p++;
                  if (!*p) break;
                  
                  ui_cmd_t *c = &ui_cmds[n_ui_cmds];
                  memset(c, 0, sizeof(*c));
                  
                  char line[1024];
                  int i = 0;
                  while (*p && *p != '\n' && i < 1023) line[i++] = *p++;
                  line[i] = 0;
                  if (*p == '\n') p++;
                  
                  char *save;
                  char *tok = strtok_r(line, " \t", &save);
                  if (!tok) continue;
                  
                  if (strcmp(tok, "BG") == 0) {
                      strcpy(c->cmd, "BG");
                      tok = strtok_r(NULL, " \t", &save);
                      if (tok) c->color = strtoul(tok, NULL, 0);
                  } else if (strcmp(tok, "RECT") == 0) {
                      strcpy(c->cmd, "RECT");
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->w = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->h = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->color = strtoul(tok, NULL, 0);
                  } else if (strcmp(tok, "TEXT") == 0) {
                      strcpy(c->cmd, "TEXT");
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->size = atoi(tok);
                      char *q = strchr(save, '"');
                      if (q) {
                          q++;
                          char *e = strchr(q, '"');
                          if (e) {
                              int l = e - q;
                              if (l > 255) l = 255;
                              strncpy(c->text, q, l);
                              c->text[l] = 0;
                          }
                      }
                      q = strchr(save ? save : "", '"');
                      if (q) {
                          q = strchr(q + 1, '"');
                          if (q) {
                              q++;
                              while (*q == ' ' || *q == '\t') q++;
                              if (*q) c->color = strtoul(q, NULL, 0);
                          }
                      }
                  } else if (strcmp(tok, "BTN") == 0) {
                      strcpy(c->cmd, "BTN");
                      tok = strtok_r(NULL, " \t", &save); if (tok) strncpy(c->id, tok, 63);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->x = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->y = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->w = atoi(tok);
                      tok = strtok_r(NULL, " \t", &save); if (tok) c->h = atoi(tok);
                      char label[128] = {0};
                      char *q = strchr(save ? save : "", '"');
                      if (q) {
                          q++;
                          char *e = strchr(q, '"');
                          if (e) {
                              int l = e - q;
                              if (l > 127) l = 127;
                              strncpy(label, q, l);
                              label[l] = 0;
                          }
                      }
                      if (q && e) {
                          q = e + 1;
                          while (*q == ' ' || *q == '\t') q++;
                          c->color = strtoul(q, NULL, 0);
                      }
                      snprintf(c->text, sizeof(c->text), "%s", label);
                  }
                  n_ui_cmds++;
              }
          }

          /* ===== Scan TPK Apps ===== */
          static void scan_tpk_apps(void) {
              DIR *d = opendir(TPK_DIR);
              if (!d) return;
              
              struct dirent *e;
              n_apps = 0;
              
              uint32_t palette[][2] = {
                  {0x6C5CE7, 0xA29BFE}, {0x00B894, 0x55EFC4}, {0xE17055, 0xFAB1A0},
                  {0x0984E3, 0x74B9FF}, {0xFD79A8, 0xFDCB6E}, {0x00CEC9, 0x81ECEC},
                  {0xE84393, 0xFD79A8}, {0x2D3436, 0x636E72}, {0xD63031, 0xFF7675},
                  {0x00B894, 0x00CEC9}, {0xFDCB6E, 0xE17055}, {0x0984E3, 0x6C5CE7},
                  {0x6C5CE7, 0x74B9FF}, {0x00CEC9, 0x00B894}, {0xE84393, 0x6C5CE7},
                  {0x2D3436, 0x0984E3}
              };
              
              while ((e = readdir(d)) != NULL && n_apps < MAX_APPS) {
                  char *dot = strstr(e->d_name, ".tpk");
                  if (dot) {
                      strncpy(apps[n_apps].filename, e->d_name, 255);
                      strncpy(apps[n_apps].name, e->d_name, dot - e->d_name);
                      apps[n_apps].name[dot - e->d_name] = 0;
                      apps[n_apps].icon_letter = apps[n_apps].name[0];
                      if (apps[n_apps].icon_letter >= 'a' && apps[n_apps].icon_letter <= 'z')
                          apps[n_apps].icon_letter -= 32;
                      apps[n_apps].color1 = palette[n_apps % 16][0];
                      apps[n_apps].color2 = palette[n_apps % 16][1];
                      apps[n_apps].installed = 1;
                      n_apps++;
                  }
              }
              closedir(d);
          }

          /* ===== Window Management ===== */
          static int create_window(const char *title, const char *tpk_file, uint32_t color) {
              for (int i = 0; i < MAX_WINDOWS; i++) {
                  if (!windows[i].active) {
                      windows[i].active = 1;
                      windows[i].x = 50 + i * 30;
                      windows[i].y = 80 + i * 20;
                      windows[i].w = 700;
                      windows[i].h = 360;
                      windows[i].workspace = current_workspace;
                      strncpy(windows[i].title, title, 63);
                      snprintf(windows[i].tpk_path, sizeof(windows[i].tpk_path), TPK_DIR "/%s", tpk_file);
                      windows[i].color = color;
                      windows[i].minimized = 0;
                      windows[i].maximized = 0;
                      windows[i].title_color = 0xFFFFFFFF;
                      windows[i].last_active = time(NULL);
                      active_window = i;
                      
                      /* Add to recent */
                      if (n_recent < MAX_RECENT) {
                          recent_windows[n_recent++] = i;
                      } else {
                          memmove(recent_windows, recent_windows + 1, (MAX_RECENT - 1) * sizeof(int));
                          recent_windows[MAX_RECENT - 1] = i;
                      }
                      
                      return i;
                  }
              }
              return -1;
          }

          static void close_window(int idx) {
              if (idx >= 0 && idx < MAX_WINDOWS) {
                  windows[idx].active = 0;
                  if (active_window == idx) active_window = -1;
              }
          }

          /* ===== Draw Window ===== */
          static void draw_window(int idx) {
              window_t *w = &windows[idx];
              if (!w->active || w->minimized || w->workspace != current_workspace) return;
              
              int x = w->x, y = w->y, width = w->w, height = w->h;
              
              /* Shadow */
              draw_shadow(x, y, width, height, 8, 40);
              
              /* Window background */
              draw_rounded_rect(x, y, width, height, 12, 0x1A1A2E);
              
              /* Title bar */
              draw_gradient_v(x, y, width, 40, 0x2D3436, 0x1A1A2E);
              
              /* Close button */
              int close_x = x + width - 36, close_y = y + 8;
              draw_rounded_rect(close_x, close_y, 24, 24, 6, 0xD63031);
              draw_string(close_x + 8, close_y + 6, "X", 2, 0xFFFFFFFF);
              
              /* Minimize button */
              int min_x = x + width - 68, min_y = y + 8;
              draw_rounded_rect(min_x, min_y, 24, 24, 6, 0x0984E3);
              draw_string(min_x + 6, min_y + 6, "-", 2, 0xFFFFFFFF);
              
              /* Maximize button */
              int max_x = x + width - 100, max_y = y + 8;
              draw_rounded_rect(max_x, max_y, 24, 24, 6, 0x00B894);
              draw_string(max_x + 6, max_y + 6, "[]", 1, 0xFFFFFFFF);
              
              /* Title */
              draw_string(x + 12, y + 12, w->title, 2, w->title_color);
              
              /* Run TPK and render content */
              char output[65536];
              if (run_tpk_app(w->tpk_path, "", output, sizeof(output)) == 0) {
                  parse_ui_commands(output);
                  
                  /* Apply background */
                  uint32_t bg = 0x1A1A2E;
                  for (int i = 0; i < n_ui_cmds; i++)
                      if (strcmp(ui_cmds[i].cmd, "BG") == 0)
                          bg = ui_cmds[i].color;
                  fill_rect(x, y + 40, width, height - 40, bg);
                  
                  /* Render commands */
                  for (int i = 0; i < n_ui_cmds; i++) {
                      ui_cmd_t *c = &ui_cmds[i];
                      if (strcmp(c->cmd, "RECT") == 0) {
                          fill_rect(x + c->x, y + 40 + c->y, c->w, c->h, c->color);
                      } else if (strcmp(c->cmd, "TEXT") == 0) {
                          draw_string(x + c->x, y + 40 + c->y, c->text, c->size, c->color);
                      } else if (strcmp(c->cmd, "BTN") == 0) {
                          draw_rounded_rect(x + c->x, y + 40 + c->y, c->w, c->h, 8, c->color);
                          int tw = string_width(c->text, 2);
                          draw_string(x + c->x + (c->w - tw) / 2, y + 40 + c->y + (c->h - 16) / 2, c->text, 2, 0xFFFFFFFF);
                          
                          /* Highlight on hover */
                          int lx = mouse_x - x, ly = mouse_y - y - 40;
                          if (lx >= c->x && lx <= c->x + c->w && ly >= c->y && ly <= c->y + c->h) {
                              fill_rect_alpha(x + c->x, y + 40 + c->y, c->w, c->h, 0xFFFFFF, 60);
                          }
                      }
                  }
              } else {
                  draw_string(x + 20, y + 60, "[Error loading app]", 2, 0xFF6B6B);
              }
          }

          /* ===== Draw Status Bar ===== */
          static void draw_status_bar(void) {
              fill_rect_alpha(0, 0, W, 48, 0x0D0D22, 230);
              
              /* Time */
              time_t now = time(NULL);
              struct tm *t = localtime(&now);
              char time_str[32];
              strftime(time_str, sizeof(time_str), "%H:%M", t);
              draw_string(20, 14, time_str, 2, 0xFFFFFFFF);
              
              /* Date */
              char date_str[32];
              strftime(date_str, sizeof(date_str), "%a %b %d", t);
              draw_string(20, 32, date_str, 1, 0xAAAAAAFF);
              
              /* Battery */
              int bat_x = W - 80, bat_y = 12;
              fill_rect(bat_x, bat_y, 50, 20, 0x2D3436);
              int bat_w = battery_level * 48 / 100;
              uint32_t bat_color = battery_level > 20 ? 0x00B894 : 0xD63031;
              fill_rect(bat_x + 1, bat_y + 1, bat_w, 18, bat_color);
              fill_rect(bat_x + 50, bat_y + 6, 4, 8, 0x2D3436);
              char bat_text[8];
              snprintf(bat_text, sizeof(bat_text), "%d%%", battery_level);
              draw_string(bat_x - 30, bat_y + 4, bat_text, 1, 0xFFFFFFFF);
              
              /* WiFi */
              int wifi_x = W - 140, wifi_y = 16;
              if (wifi_connected) {
                  for (int i = 0; i < 3; i++) {
                      int r = 6 + i * 4;
                      for (int j = -r; j <= r; j++) {
                          int yy = wifi_y - (int)sqrt(r * r - j * j) * 6 / 10;
                          put_pixel(wifi_x + j, yy, 0x00D4FF);
                          put_pixel(wifi_x + j, yy + 1, 0x00D4FF);
                      }
                  }
                  put_pixel(wifi_x, wifi_y + 2, 0x00D4FF);
              }
              
              /* zenOS logo */
              draw_string(W - 200, 16, "zenOS", 2, 0x00D4FF);
          }

          /* ===== Draw Navigation Bar ===== */
          static void draw_nav_bar(void) {
              int ny = H - 64;
              fill_rect_alpha(0, ny, W, 64, 0x0D0D22, 230);
              
              /* Back button (triangle) */
              int bx = W / 4;
              for (int i = 0; i < 16; i++) {
                  for (int j = -i / 2; j <= i / 2; j++) {
                      put_pixel(bx - 8 + i, ny + 32 + j, 0xAAAAAAAA);
                  }
              }
              
              /* Home button (circle) */
              int hx = W / 2;
              for (int j = -12; j <= 12; j++) {
                  for (int i = -12; i <= 12; i++) {
                      int d = i * i + j * j;
                      if (d <= 144 && d > 100) {
                          put_pixel(hx + i, ny + 32 + j, 0xFFFFFFFF);
                      }
                  }
              }
              
              /* Recent apps button (square) */
              int rx = 3 * W / 4;
              for (int j = -10; j <= 10; j++) {
                  for (int i = -10; i <= 10; i++) {
                      if (abs(i) > 8 || abs(j) > 8) {
                          put_pixel(rx + i, ny + 32 + j, 0xAAAAAAAA);
                      }
                  }
              }
          }

          /* ===== Draw Home Screen ===== */
          static void draw_home_screen(void) {
              /* Background gradient */
              draw_gradient_v(0, 0, W, H, 0x0A0A1E, 0x16213E);
              
              /* Decorative circles */
              for (int i = 0; i < 5; i++) {
                  int cx = W * (i + 1) / 6;
                  int cy = H / 2;
                  int r = 80 + i * 20;
                  for (int j = -r; j <= r; j++) {
                      for (int k = -r; k <= r; k++) {
                          if (j * j + k * k <= r * r) {
                              blend_pixel(cx + k, cy + j, 0x6C5CE7, 8);
                          }
                      }
                  }
              }
              
              /* App grid */
              scan_tpk_apps();
              if (n_apps == 0) {
                  draw_string_centered(H / 2 - 20, "No Apps Installed", 2, 0xAAAAAA);
                  draw_string_centered(H / 2 + 20, "Install .tpk files in /tpk", 1, 0x777777);
                  return;
              }
              
              int cols = 4, icon_size = 90, gap_x = 30, gap_y = 40;
              int total_w = cols * icon_size + (cols - 1) * gap_x;
              int start_x = (W - total_w) / 2;
              int start_y = 80;
              
              draw_string(start_x, start_y - 30, "Applications", 2, 0x888888);
              
              for (int i = 0; i < n_apps; i++) {
                  int col = i % cols;
                  int row = i / cols;
                  int ax = start_x + col * (icon_size + gap_x);
                  int ay = start_y + row * (icon_size + gap_y + 30);
                  
                  /* Icon shadow */
                  draw_shadow(ax, ay, icon_size, icon_size, icon_size / 6, 30);
                  
                  /* Icon gradient */
                  draw_gradient_v(ax, ay, icon_size, icon_size, apps[i].color1, apps[i].color2);
                  
                  /* Rounded corners mask */
                  int r = icon_size / 5;
                  for (int j = 0; j < r; j++) {
                      for (int k = 0; k < r; k++) {
                          if (k * k + j * j > r * r) {
                              put_pixel(ax + k, ay + j, 0x0A0A1E);
                              put_pixel(ax + icon_size - 1 - k, ay + j, 0x0A0A1E);
                              put_pixel(ax + k, ay + icon_size - 1 - j, 0x0A0A1E);
                              put_pixel(ax + icon_size - 1 - k, ay + icon_size - 1 - j, 0x0A0A1E);
                          }
                      }
                  }
                  
                  /* Icon letter */
                  char letter[2] = {apps[i].icon_letter, 0};
                  int scale = icon_size / 32;
                  if (scale < 2) scale = 2;
                  int tw = string_width(letter, scale);
                  draw_string(ax + (icon_size - tw) / 2, ay + (icon_size - 16 * scale) / 2, letter, scale, 0xFFFFFFFF);
                  
                  /* App name */
                  int name_w = string_width(apps[i].name, 2);
                  char display_name[64];
                  if (name_w > icon_size + 20) {
                      strncpy(display_name, apps[i].name, 12);
                      display_name[12] = 0;
                      strcat(display_name, "..");
                  } else {
                      strcpy(display_name, apps[i].name);
                  }
                  int dw = string_width(display_name, 2);
                  draw_string(ax + (icon_size - dw) / 2, ay + icon_size + 8, display_name, 2, 0xCCCCCC);
                  
                  /* Highlight on hover */
                  if (mouse_x >= ax && mouse_x <= ax + icon_size && mouse_y >= ay && mouse_y <= ay + icon_size) {
                      fill_rect_alpha(ax, ay, icon_size, icon_size, 0xFFFFFF, 40);
                  }
              }
          }

          /* ===== Draw Recent Apps ===== */
          static void draw_recent_apps(void) {
              fill_rect_alpha(0, 0, W, H, 0x000000, 180);
              draw_string_centered(60, "Recent Applications", 3, 0xFFFFFFFF);
              
              int y = 120;
              for (int i = n_recent - 1; i >= 0 && i >= n_recent - 4; i--) {
                  int idx = recent_windows[i];
                  if (!windows[idx].active) continue;
                  
                  draw_rounded_rect(W / 2 - 200, y, 400, 60, 8, 0x2D3436);
                  draw_string(W / 2 - 180, y + 20, windows[idx].title, 2, 0xFFFFFFFF);
                  
                  /* Close button */
                  int close_x = W / 2 + 160;
                  draw_rounded_rect(close_x, y + 18, 24, 24, 6, 0xD63031);
                  draw_string(close_x + 8, y + 22, "X", 2, 0xFFFFFFFF);
                  
                  y += 80;
              }
              
              if (n_recent == 0) {
                  draw_string_centered(H / 2, "No recent apps", 2, 0x888888);
              }
          }

          /* ===== Draw Mouse Cursor ===== */
          static void draw_cursor(void) {
              if (mouse_x < 0 || mouse_y < 0) return;
              
              /* Arrow cursor */
              for (int i = 0; i < 16; i++) {
                  put_pixel(mouse_x + i, mouse_y + i, 0xFFFFFFFF);
                  put_pixel(mouse_x + i, mouse_y + i + 1, 0x000000);
                  if (i < 8) {
                      put_pixel(mouse_x + i, mouse_y, 0xFFFFFFFF);
                      put_pixel(mouse_x, mouse_y + i, 0xFFFFFFFF);
                  }
              }
          }

          /* ===== Handle Clicks ===== */
          static void handle_click(void) {
              /* Status bar click */
              if (mouse_y < 48) {
                  return;
              }
              
              /* Navigation bar click */
              if (mouse_y > H - 64) {
                  int bx = W / 4, hx = W / 2, rx = 3 * W / 4;
                  if (mouse_x > bx - 20 && mouse_x < bx + 20) {
                      /* Back - close active window */
                      if (active_window >= 0) close_window(active_window);
                  } else if (mouse_x > hx - 20 && mouse_x < hx + 20) {
                      /* Home - close all windows */
                      for (int i = 0; i < MAX_WINDOWS; i++) {
                          if (windows[i].active) windows[i].active = 0;
                      }
                      active_window = -1;
                      show_recent_apps = 0;
                  } else if (mouse_x > rx - 20 && mouse_x < rx + 20) {
                      /* Recent apps */
                      show_recent_apps = !show_recent_apps;
                  }
                  return;
              }
              
              /* Recent apps view */
              if (show_recent_apps) {
                  int y = 120;
                  for (int i = n_recent - 1; i >= 0 && i >= n_recent - 4; i--) {
                      int idx = recent_windows[i];
                      if (!windows[idx].active) continue;
                      
                      int close_x = W / 2 + 160;
                      if (mouse_x >= close_x && mouse_x <= close_x + 24 &&
                          mouse_y >= y + 18 && mouse_y <= y + 42) {
                          close_window(idx);
                          return;
                      }
                      y += 80;
                  }
                  return;
              }
              
              /* Window clicks */
              if (active_window >= 0 && windows[active_window].active) {
                  window_t *w = &windows[active_window];
                  int lx = mouse_x - w->x;
                  int ly = mouse_y - w->y;
                  
                  /* Close button */
                  if (lx >= w->w - 36 && lx <= w->w - 12 && ly >= 8 && ly <= 32) {
                      close_window(active_window);
                      return;
                  }
                  
                  /* Minimize button */
                  if (lx >= w->w - 68 && lx <= w->w - 44 && ly >= 8 && ly <= 32) {
                      w->minimized = 1;
                      active_window = -1;
                      return;
                  }
                  
                  /* Maximize button */
                  if (lx >= w->w - 100 && lx <= w->w - 76 && ly >= 8 && ly <= 32) {
                      if (w->maximized) {
                          w->x = 50; w->y = 80; w->w = 700; w->h = 360;
                          w->maximized = 0;
                      } else {
                          w->x = 0; w->y = 48; w->w = W; w->h = H - 112;
                          w->maximized = 1;
                      }
                      return;
                  }
                  
                  /* Drag title bar */
                  if (ly >= 0 && ly < 40) {
                      w->x = mouse_x - w->w / 2;
                      w->y = mouse_y - 20;
                      return;
                  }
                  
                  /* Button clicks in app */
                  char output[65536];
                  if (run_tpk_app(w->tpk_path, "", output, sizeof(output)) == 0) {
                      parse_ui_commands(output);
                      int wy = ly - 40;
                      for (int i = 0; i < n_ui_cmds; i++) {
                          if (strcmp(ui_cmds[i].cmd, "BTN") == 0) {
                              if (lx >= ui_cmds[i].x && lx <= ui_cmds[i].x + ui_cmds[i].w &&
                                  wy >= ui_cmds[i].y && wy <= ui_cmds[i].y + ui_cmds[i].h) {
                                  char event[128];
                                  snprintf(event, sizeof(event), "click_%s", ui_cmds[i].id);
                                  char out2[65536];
                                  run_tpk_app(w->tpk_path, event, out2, sizeof(out2));
                                  return;
                              }
                          }
                      }
                  }
              } else {
                  /* Home screen - app icon clicks */
                  int cols = 4, icon_size = 90, gap_x = 30, gap_y = 40;
                  int total_w = cols * icon_size + (cols - 1) * gap_x;
                  int start_x = (W - total_w) / 2;
                  int start_y = 80;
                  
                  for (int i = 0; i < n_apps; i++) {
                      int col = i % cols;
                      int row = i / cols;
                      int ax = start_x + col * (icon_size + gap_x);
                      int ay = start_y + row * (icon_size + gap_y + 30);
                      
                      if (mouse_x >= ax && mouse_x <= ax + icon_size &&
                          mouse_y >= ay && mouse_y <= ay + icon_size) {
                          create_window(apps[i].name, apps[i].filename, apps[i].color1);
                          return;
                      }
                  }
              }
          }

          /* ===== Input Handling ===== */
          static void init_input(void) {
              n_inputs = 0;
              for (int i = 0; i < 10 && n_inputs < MAX_INPUTS; i++) {
                  char path[64];
                  snprintf(path, sizeof(path), "/dev/input/event%d", i);
                  int fd = open(path, O_RDONLY | O_NONBLOCK);
                  if (fd >= 0) {
                      input_fds[n_inputs++] = fd;
                  }
              }
          }

          static void poll_input(void) {
              if (n_inputs == 0) return;
              
              fd_set rfds;
              FD_ZERO(&rfds);
              int max_fd = -1;
              for (int i = 0; i < n_inputs; i++) {
                  FD_SET(input_fds[i], &rfds);
                  if (input_fds[i] > max_fd) max_fd = input_fds[i];
              }
              
              struct timeval tv = {0, 0};
              int ret = select(max_fd + 1, &rfds, NULL, NULL, &tv);
              if (ret <= 0) return;
              
              for (int i = 0; i < n_inputs; i++) {
                  if (!FD_ISSET(input_fds[i], &rfds)) continue;
                  
                  struct input_event ev;
                  ssize_t r = read(input_fds[i], &ev, sizeof(ev));
                  if (r == sizeof(ev)) {
                      if (ev.type == EV_ABS) {
                          if (ev.code == ABS_X) {
                              mouse_x = ev.value * W / 32767;
                              if (mouse_x < 0) mouse_x = 0;
                              if (mouse_x >= W) mouse_x = W - 1;
                          }
                          if (ev.code == ABS_Y) {
                              mouse_y = ev.value * H / 32767;
                              if (mouse_y < 0) mouse_y = 0;
                              if (mouse_y >= H) mouse_y = H - 1;
                          }
                          if (ev.code == ABS_MT_TRACKING_ID) {
                              last_mouse_down = mouse_down;
                              mouse_down = (ev.value != -1) ? 1 : 0;
                          }
                      } else if (ev.type == EV_KEY) {
                          int v = ev.value;
                          if (v == 2) v = 1;
                          if (ev.code == BTN_LEFT || ev.code == BTN_TOUCH) {
                              last_mouse_down = mouse_down;
                              mouse_down = v;
                          }
                      } else if (ev.type == EV_REL) {
                          if (ev.code == REL_X) {
                              mouse_x += ev.value;
                              if (mouse_x < 0) mouse_x = 0;
                              if (mouse_x >= W) mouse_x = W - 1;
                          }
                          if (ev.code == REL_Y) {
                              mouse_y += ev.value;
                              if (mouse_y < 0) mouse_y = 0;
                              if (mouse_y >= H) mouse_y = H - 1;
                          }
                      }
                  }
              }
          }

          /* ===== Main Render Loop ===== */
          static void render(void) {
              /* Clear back buffer */
              memset(fb_back, 0, fb_size);
              
              /* Draw based on state */
              if (show_recent_apps) {
                  draw_home_screen();
                  draw_recent_apps();
              } else {
                  draw_home_screen();
                  for (int i = 0; i < MAX_WINDOWS; i++) {
                      if (windows[i].active) draw_window(i);
                  }
              }
              
              /* Always draw status and nav bars */
              draw_status_bar();
              draw_nav_bar();
              
              /* Draw cursor */
              draw_cursor();
              
              /* Swap buffers */
              if (fb_front) memcpy(fb_front, fb_back, fb_size);
          }

          /* ===== Main ===== */
          int main(void) {
              /* Mount filesystems */
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              sleep(1);
              mkdir("/dev/pts", 0755);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);
              mount("tmpfs", "/tmp", "tmpfs", 0, NULL);
              mkdir(TPK_DIR, 0755);
              mkdir("/root", 0755);
              mkdir("/data", 0755);
              
              /* Spawn shell */
              if (fork() == 0) {
                  setsid();
                  int fd = open("/dev/tty2", O_RDWR);
                  if (fd < 0) fd = open("/dev/console", O_RDWR);
                  if (fd >= 0) {
                      ioctl(fd, TIOCSCTTY, 1);
                      dup2(fd, 0); dup2(fd, 1); dup2(fd, 2);
                      if (fd > 2) close(fd);
                  }
                  setenv("PS1", "zenos~# ", 1);
                  setenv("HOME", "/root", 1);
                  setenv("PATH", "/bin:/usr/bin", 1);
                  execl("/bin/busybox", "sh", "-i", NULL);
                  exit(1);
              }
              
              /* Switch to graphics mode */
              {
                  int tty = open("/dev/tty1", O_RDWR);
                  if (tty >= 0) {
                      ioctl(tty, VT_ACTIVATE, 1);
                      ioctl(tty, VT_WAITACTIVE, 1);
                      ioctl(tty, KDSETMODE, KD_GRAPHICS);
                      close(tty);
                  }
              }
              
              /* Open framebuffer */
              sleep(1);
              for (int t = 0; t < 15; t++) {
                  fb_fd = open("/dev/fb0", O_RDWR);
                  if (fb_fd >= 0) break;
                  sleep(1);
              }
              if (fb_fd < 0) {
                  while (1) {
                      int s;
                      while (waitpid(-1, &s, WNOHANG) > 0);
                      sleep(5);
                  }
              }
              
              struct fb_var_screeninfo vi;
              ioctl(fb_fd, FBIOGET_VSCREENINFO, &vi);
              W = vi.xres;
              H = vi.yres;
              fb_size = W * H * 4;
              
              fb_front = mmap(0, fb_size, PROT_READ | PROT_WRITE, MAP_SHARED, fb_fd, 0);
              if (fb_front == MAP_FAILED) return 1;
              
              fb_back = malloc(fb_size);
              memset(fb_back, 0, fb_size);
              
              /* Initialize input */
              init_input();
              
              /* Main loop */
              while (1) {
                  poll_input();
                  
                  int new_click = mouse_down && !last_mouse_down;
                  if (new_click) {
                      handle_click();
                  }
                  last_mouse_down = mouse_down;
                  
                  render();
                  usleep(16667); /* 60 FPS */
                  
                  int s;
                  while (waitpid(-1, &s, WNOHANG) > 0);
              }
              
              return 0;
          }
