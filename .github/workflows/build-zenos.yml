name: ZenOS ARM64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            bc bison flex \
            libssl-dev libelf-dev \
            cpio gzip \
            qemu-system-arm

      - name: Download Linux and BusyBox
        run: |
          git clone --depth=1 https://github.com/torvalds/linux.git linux
          git clone --depth=1 https://github.com/mirror/busybox.git busybox

      - name: Build BusyBox
        run: |
          cd busybox

          yes "" | make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            defconfig

          sed -i 's/^# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config

          if grep -q '^# CONFIG_UNZIP is not set' .config; then
            sed -i 's/^# CONFIG_UNZIP is not set/CONFIG_UNZIP=y/' .config
          elif grep -q '^CONFIG_UNZIP=' .config; then
            sed -i 's/^CONFIG_UNZIP=.*/CONFIG_UNZIP=y/' .config
          else
            echo 'CONFIG_UNZIP=y' >> .config
          fi

          make \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            -j$(nproc)

          make \
            CONFIG_PREFIX=$GITHUB_WORKSPACE/root \
            install

      - name: Create ZenOS userspace
        run: |
          mkdir -p root/dev
          mkdir -p root/proc
          mkdir -p root/sys
          mkdir -p root/tmp
          mkdir -p root/run
          mkdir -p root/etc
          mkdir -p root/root
          mkdir -p root/apps
          mkdir -p root/usr/bin

          cat > root/etc/profile <<'EOF'
          export PATH=/bin:/sbin:/usr/bin:/usr/sbin
          export HOME=/root
          export PS1='zenos~# '
          EOF

          cat > root/init.c <<'EOF'
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <stdlib.h>

          static void mount_fs(
              const char *source,
              const char *target,
              const char *type)
          {
              mkdir(target, 0755);
              mount(source, target, type, 0, 0);
          }

          int main(void)
          {
              if (getpid() != 1)
                  return 1;

              mount_fs("proc", "proc", "proc");
              mount_fs("sysfs", "sys", "sysfs");
              mount_fs("devtmpfs", "dev", "devtmpfs");
              mount_fs("tmpfs", "run", "tmpfs");
              mount_fs("tmpfs", "tmp", "tmpfs");

              {
                  char *argv[] = {
                      "/bin/busybox",
                      "--install",
                      "-s",
                      NULL
                  };

                  pid_t pid = fork();

                  if (pid == 0)
                  {
                      execv(argv[0], argv);
                      _exit(127);
                  }

                  waitpid(pid, NULL, 0);
              }

              setenv(
                  "PATH",
                  "/bin:/sbin:/usr/bin:/usr/sbin",
                  1
              );

              setenv("HOME", "/root", 1);
              setenv("PS1", "zenos~# ", 1);

              for (;;)
              {
                  char *argv[] = {
                      "/bin/sh",
                      "-l",
                      NULL
                  };

                  pid_t pid = fork();

                  if (pid == 0)
                  {
                      execv(argv[0], argv);
                      _exit(127);
                  }

                  waitpid(pid, NULL, 0);
              }

              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            root/init.c \
            -o root/init

          chmod 755 root/init

      - name: Build TPK loader
        run: |
          cat > root/tpk.c <<'EOF'
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <dirent.h>
          #include <string.h>
          #include <limits.h>
          #include <elf.h>

          static int find_elf(const char *dir, char *output)
          {
              DIR *dp = opendir(dir);

              if (!dp)
                  return -1;

              struct dirent *entry;

              while ((entry = readdir(dp)) != NULL)
              {
                  if (entry->d_name[0] == '.')
                      continue;

                  char path[PATH_MAX];

                  snprintf(
                      path,
                      sizeof(path),
                      "%s/%s",
                      dir,
                      entry->d_name
                  );

                  struct stat st;

                  if (stat(path, &st) != 0)
                      continue;

                  if (S_ISDIR(st.st_mode))
                  {
                      if (find_elf(path, output) == 0)
                      {
                          closedir(dp);
                          return 0;
                      }
                  }

                  if (!S_ISREG(st.st_mode))
                      continue;

                  if (!(st.st_mode & 0111))
                      continue;

                  FILE *fp = fopen(path, "rb");

                  if (!fp)
                      continue;

                  unsigned char header[64];

                  memset(header, 0, sizeof(header));

                  size_t n = fread(
                      header,
                      1,
                      sizeof(header),
                      fp
                  );

                  fclose(fp);

                  if (n < 20)
                      continue;

                  if (header[0] != 0x7f ||
                      header[1] != 'E' ||
                      header[2] != 'L' ||
                      header[3] != 'F')
                      continue;

                  if (header[4] != ELFCLASS64)
                      continue;

                  if (header[5] != ELFDATA2LSB)
                      continue;

                  unsigned short machine =
                      (unsigned short)header[18] |
                      ((unsigned short)header[19] << 8);

                  if (machine != EM_AARCH64)
                      continue;

                  strncpy(
                      output,
                      path,
                      PATH_MAX - 1
                  );

                  output[PATH_MAX - 1] = 0;

                  closedir(dp);
                  return 0;
              }

              closedir(dp);
              return -1;
          }

          int main(int argc, char **argv)
          {
              if (argc != 2)
              {
                  fprintf(
                      stderr,
                      "usage: tpk app.tpk\n"
                  );

                  return 2;
              }

              char directory[PATH_MAX];

              snprintf(
                  directory,
                  sizeof(directory),
                  "/tmp/tpk-%d",
                  getpid()
              );

              mkdir(directory, 0700);

              pid_t pid = fork();

              if (pid == 0)
              {
                  execl(
                      "/bin/busybox",
                      "busybox",
                      "unzip",
                      "-o",
                      argv[1],
                      "-d",
                      directory,
                      NULL
                  );

                  _exit(127);
              }

              int status = 0;

              waitpid(pid, &status, 0);

              if (!WIFEXITED(status) ||
                  WEXITSTATUS(status) != 0)
              {
                  fprintf(
                      stderr,
                      "TPK: invalid ZIP package\n"
                  );

                  return 3;
              }

              char executable[PATH_MAX];

              if (find_elf(
                      directory,
                      executable) != 0)
              {
                  fprintf(
                      stderr,
                      "TPK: no ARM64 ELF executable found\n"
                  );

                  return 4;
              }

              printf(
                  "TPK: launching %s\n",
                  executable
              );

              execl(
                  executable,
                  executable,
                  NULL
              );

              perror("TPK exec");

              return 5;
          }
          EOF

          aarch64-linux-gnu-gcc \
            -static \
            -O2 \
            root/tpk.c \
            -o root/usr/bin/zenos-tpk

          chmod 755 root/usr/bin/zenos-tpk

          cat > root/usr/bin/tpk <<'EOF'
          #!/bin/sh
          exec /usr/bin/zenos-tpk "$1"
          EOF

          chmod 755 root/usr/bin/tpk

      - name: Build Linux ARM64
        run: |
          cd linux

          make ARCH=arm64 defconfig

          ./scripts/config --enable CONFIG_DEVTMPFS
          ./scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          ./scripts/config --enable CONFIG_BLK_DEV_INITRD
          ./scripts/config --enable CONFIG_TMPFS
          ./scripts/config --enable CONFIG_VIRTIO
          ./scripts/config --enable CONFIG_VIRTIO_PCI
          ./scripts/config --enable CONFIG_VIRTIO_NET
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011
          ./scripts/config --enable CONFIG_SERIAL_AMBA_PL011_CONSOLE

          make ARCH=arm64 olddefconfig

          make \
            -j$(nproc) \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            Image

      - name: Create ZenOS initramfs
        run: |
          cd root

          find . -print0 |
            cpio \
              --null \
              -o \
              -H newc |
            gzip -9 \
            > ../zenos.img

      - name: Prepare release
        run: |
          mkdir -p release

          cp linux/arch/arm64/boot/Image \
             release/Image

          cp zenos.img \
             release/zenos.img

          sha256sum \
             release/Image \
             release/zenos.img \
             > release/SHA256SUMS

      - name: QEMU ARM64 boot test
        timeout-minutes: 2
        run: |
          timeout 30 \
          qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a57 \
            -m 512 \
            -kernel linux/arch/arm64/boot/Image \
            -initrd zenos.img \
            -append "console=ttyAMA0 rdinit=/init" \
            -nographic \
            || test $? -eq 124

      - name: Upload ZenOS
        uses: actions/upload-artifact@v4
        with:
          name: ZenOS-ARM64
          path: release/
