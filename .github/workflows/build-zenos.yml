name: Build Complete Tizen OS Environment for zenOS (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-zenos-full-tizen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools for Fetching Tizen Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                                 bison flex libncurses-dev libssl-dev bc libelf-dev \
                                 qemu-user-static qemu-system-arm qemu-utils \
                                 busybox-static e2fsprogs dosfstools kmod \
                                 rpm2cpio cpio wget curl wayland-protocols weston

      - name: Compile Kernel with DRM & VirtIO GPU Support
        run: |
          mkdir -p kernel_build
          cd kernel_build
          wget https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz
          tar -xf linux-6.1.80.tar.xz
          cd linux-6.1.80
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig

          # تفعيل محرك الرسوميات والواجهة الرسومية
          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          scripts/config --enable CONFIG_VT

          make -j$(nproc) Image
          cd ../..
          mkdir -p boot_kernel
          cp kernel_build/linux-6.1.80/arch/arm64/boot/Image boot_kernel/Image

      - name: Download & Extract Official Tizen Packages
        run: |
          mkdir -p tizen_rpm_packages
          cd tizen_rpm_packages
          
          # رابط مستودع Tizen الرسمي للحزم
          TIZEN_REPO="http://download.tizen.org/releases/weekly/tizen/unified/latest/repos/standard/packages/aarch64"
          
          # تنزيل حزم Tizen الأساسية وحزمة الواجهة الرسومية
          wget -q -r -l1 -nd -A "*.rpm" "$TIZEN_REPO/" || true
          
          mkdir -p extracted_rootfs
          for rpm in *.rpm; do
            if [ -f "$rpm" ]; then
              rpm2cpio "$rpm" | (cd extracted_rootfs && cpio -idmv 2>/dev/null) || true
            fi
          done
          cd ..

      - name: Assemble zenOS RootFS with Tizen Components
        run: |
          mkdir -p zenOS_rootfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,usr/lib,dev,mnt,boot,root,tmp,run}
          
          # تثبيت BusyBox كنسخة احتياطية للأوامر
          BUSYBOX_PATH=$(which busybox)
          cp $BUSYBOX_PATH zenOS_rootfs/bin/busybox
          chmod +x zenOS_rootfs/bin/busybox
          
          for tool in sh ls echo cat cp mv rm mkdir rmdir ps top uname clear; do
            ln -s /bin/busybox zenOS_rootfs/bin/$tool || true
          done

          # دمج ملفات Tizen المستخرجة من حزم RPM
          if [ -d "tizen_rpm_packages/extracted_rootfs" ]; then
            cp -rf tizen_rpm_packages/extracted_rootfs/* zenOS_rootfs/ || true
          fi

          # نقل النواة
          cp boot_kernel/Image zenOS_rootfs/boot/Image

          # إنشاء ملف بدء التشغيل والواجهة الرسومية (/etc/init)
          cat << 'EOF' > zenOS_rootfs/etc/init
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          mount -t devtmpfs none /dev 2>/dev/null || true
          mkdir -p /dev/pts /dev/shm
          mount -t devpts none /dev/pts 2>/dev/null || true

          export XDG_RUNTIME_DIR=/tmp
          mkdir -p /tmp
          chmod 0700 /tmp

          clear
          echo "=================================================="
          echo "    Starting zenOS with Tizen GUI Environment     "
          echo "=================================================="
          
          # تشغيل خادم الرسوميات والواجهة
          if [ -x /usr/bin/weston ]; then
            exec /usr/bin/weston --backend=drm-backend.so --continue-without-input
          else
            echo "Starting Tizen Interactive Shell..."
            exec /bin/sh
          fi
          EOF
          chmod +x zenOS_rootfs/etc/init

      - name: Create Bootable 3GB Disk Image
        run: |
          dd if=/dev/zero of=zenOS-arm64-tizen-full.img bs=1M count=3000
          mkfs.ext4 -F -L "zenOS-Root" zenOS-arm64-tizen-full.img
          
          mkdir -p /tmp/zenos_mnt
          sudo mount -o loop zenOS-arm64-tizen-full.img /tmp/zenos_mnt
          sudo cp -a zenOS_rootfs/* /tmp/zenos_mnt/
          sudo umount /tmp/zenos_mnt

          ls -lh zenOS-arm64-tizen-full.img

      - name: Upload Full Tizen System Image
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Tizen-Full-Image
          path: zenOS-arm64-tizen-full.img
          
