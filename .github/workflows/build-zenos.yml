          };

          static void px(int x,int y,uint32_t c){ if(x>=0&&x<W&&y>=0&&y<H) back[y*W+x]=c; }
          static void bpx(int x,int y,uint32_t c,uint8_t a){
            if(x<0||x>=W||y<0||y>=H)return;
            uint32_t*p=&back[y*W+x];
            uint8_t sr=(c>>16)&0xFF,sg=(c>>8)&0xFF,sb=c&0xFF;
            uint8_t dr=(*p>>16)&0xFF,dg=(*p>>8)&0xFF,db=*p&0xFF;
            *p=0xFF000000|((sr*a+dr*(255-a))/255<<16)|((sg*a+dg*(255-a))/255<<8)|((sb*a+db*(255-a))/255);
          }
          static void frect(int x,int y,int w,int h,uint32_t c){
            for(int j=y;j<y+h;j++)for(int i=x;i<x+w;i++)px(i,j,c);
          }
          static void frect_b(int x,int y,int w,int h,uint32_t c,uint8_t a){
            for(int j=y;j<y+h;j++)for(int i=x;i<x+w;i++)bpx(i,j,c,a);
          }
          static void rrect(int x,int y,int w,int h,int r,uint32_t c){
            frect(x+r,y,w-2*r,h,c);frect(x,y+r,r,h-2*r,c);frect(x+w-r,y+r,r,h-2*r,c);
            for(int j=-r;j<=r;j++)for(int i=-r;i<=r;i++){
              if(i*i+j*j<=r*r){px(x+r+i,y+r+j,c);px(x+w-r-1+i,y+r+j,c);px(x+r+i,y+h-r-1+j,c);px(x+w-r-1+i,y+h-r-1+j,c);}
            }
          }
          static void vgrad(int x,int y,int w,int h,uint32_t c1,uint32_t c2){
            for(int j=0;j<h;j++){
              uint8_t t=255*j/(h>1?h-1:1);
              uint8_t r=((c1>>16)&0xFF)*(255-t)/255+((c2>>16)&0xFF)*t/255;
              uint8_t g=((c1>>8)&0xFF)*(255-t)/255+((c2>>8)&0xFF)*t/255;
              uint8_t b=(c1&0xFF)*(255-t)/255+(c2&0xFF)*t/255;
              uint32_t cc=0xFF000000|(r<<16)|(g<<8)|b;
              for(int i=0;i<w;i++)px(x+i,y+j,cc);
            }
          }
          static void dchar(int x,int y,char ch,int s,uint32_t c){
            if(ch<32||ch>126)ch='?';
            const uint8_t*g=F5x7[ch-32];
            for(int r=0;r<7;r++)for(int co=0;co<5;co++)
              if(g[r]&(0x10>>co))for(int sy=0;sy<s;sy++)for(int sx=0;sx<s;sx++)
                px(x+co*s+sx,y+r*s+sy,c);
          }
          static void dstr(int x,int y,const char*s,int sc,uint32_t c){
            int cx=x;for(int i=0;s[i];i++){if(s[i]=='\n'){cx=x;y+=8*sc+2;continue;}dchar(cx,y,s[i],sc,c);cx+=6*sc;}
          }
          static int strw(const char*s,int sc){return strlen(s)*6*sc;}
          static void shadow(int x,int y,int w,int h,int r,int b){
            for(int bl=b;bl>0;bl--)for(int j=y-bl+2;j<y+h+bl;j++)for(int i=x-bl;i<x+w+bl;i++){
              if(i>=x&&i<x+w&&j>=y&&j<y+h)continue;bpx(i,j,0x000000,10);
            }
          }
          static void swap(void){
            if(!front)return;
            memcpy(front,back,fb_sz);
            full_redraw=0;
          }

          static void init_input(void){
            n_inputs=0;
            for(int i=0;i<10&&n_inputs<MAX_INPUTS;i++){
              char path[64];snprintf(path,sizeof(path),"/dev/input/event%d",i);
              int fd=open(path,O_RDONLY|O_NONBLOCK);
              if(fd>=0){input_fds[n_inputs++]=fd;klog("opened %s",path);}
            }
            if(n_inputs==0)klog("WARNING: no input devices!");
          }

          static void poll_input(void){
            if(n_inputs==0)return;
            fd_set rfds;FD_ZERO(&rfds);
            int max_fd=-1;
            for(int i=0;i<n_inputs;i++){FD_SET(input_fds[i],&rfds);if(input_fds[i]>max_fd)max_fd=input_fds[i];}
            struct timeval tv={0,0};
            int ret=select(max_fd+1,&rfds,NULL,NULL,&tv);
            if(ret<=0)return;

            for(int i=0;i<n_inputs;i++){
              if(!FD_ISSET(input_fds[i],&rfds))continue;
              struct input_event ev;
              ssize_t r=read(input_fds[i],&ev,sizeof(ev));
              if(r==sizeof(ev)){
                if(ev.type==EV_ABS){
                  if(ev.code==ABS_X){mouse_x=ev.value*W/32767;if(mouse_x<0)mouse_x=0;if(mouse_x>=W)mouse_x=W-1;use_keyboard=0;}
                  if(ev.code==ABS_Y){mouse_y=ev.value*H/32767;if(mouse_y<0)mouse_y=0;if(mouse_y>=H)mouse_y=H-1;use_keyboard=0;}
                  if(ev.code==ABS_MT_TRACKING_ID)mouse_down=(ev.value!=-1)?1:0;
                }
                else if(ev.type==EV_KEY){
                  int v=ev.value;if(v==2)v=1;
                  switch(ev.code){
                    case BTN_LEFT:
                    case BTN_TOUCH:
                      last_down=mouse_down;mouse_down=v;use_keyboard=0;break;
                    case KEY_ENTER:
                    case KEY_KPENTER:
                    case KEY_SPACE:
                      last_enter=key_enter;key_enter=v;
                      if(v){mouse_x=focus_x;mouse_y=focus_y;last_down=0;mouse_down=1;use_keyboard=1;}
                      else mouse_down=0;
                      break;
                    case KEY_UP:if(v)key_up=1;break;
                    case KEY_DOWN:if(v)key_down=1;break;
                    case KEY_LEFT:if(v)key_left=1;break;
                    case KEY_RIGHT:if(v)key_right=1;break;
                    case KEY_ESC:if(v&&active_win>=0){wins[active_win].active=0;active_win=-1;full_redraw=1;}break;
                  }
                }
                else if(ev.type==EV_REL){
                  if(ev.code==REL_X){mouse_x+=ev.value;if(mouse_x<0)mouse_x=0;if(mouse_x>=W)mouse_x=W-1;use_keyboard=0;}
                  if(ev.code==REL_Y){mouse_y+=ev.value;if(mouse_y<0)mouse_y=0;if(mouse_y>=H)mouse_y=H-1;use_keyboard=0;}
                }
              }
            }
            if(key_up){focus_y-=20;if(focus_y<0)focus_y=0;key_up=0;use_keyboard=1;full_redraw=1;}
            if(key_down){focus_y+=20;if(focus_y>=H)focus_y=H-1;key_down=0;use_keyboard=1;full_redraw=1;}
            if(key_left){focus_x-=20;if(focus_x<0)focus_x=0;key_left=0;use_keyboard=1;full_redraw=1;}
            if(key_right){focus_x+=20;if(focus_x>=W)focus_x=W-1;key_right=0;use_keyboard=1;full_redraw=1;}
            if(use_keyboard){mouse_x=focus_x;mouse_y=focus_y;}
          }

          static int run_tpk(const char*tpk,const char*event,char*out,int sz){
            char cmd[1024];
            if(event&&*event)snprintf(cmd,sizeof(cmd),"/bin/busybox unzip -p '%s' shared/res/entry.sh 2>/dev/null | /bin/busybox sh -s %s 2>/dev/null",tpk,event);
            else snprintf(cmd,sizeof(cmd),"/bin/busybox unzip -p '%s' shared/res/entry.sh 2>/dev/null | /bin/busybox sh -s 2>/dev/null",tpk);
            FILE*f=popen(cmd,"r");if(!f)return -1;
            size_t t=0;
            while(t<(size_t)sz-1){size_t r=fread(out+t,1,sz-1-t,f);if(r==0)break;t+=r;}
            out[t]=0;pclose(f);return 0;
          }

          static void parse_ui(const char*out){
            ncmds=0;const char*p=out;
            while(*p&&ncmds<MAX_CMDS){
              while(*p&&isspace(*p))p++;if(!*p)break;
              ui_cmd_t*c=&cmds[ncmds];memset(c,0,sizeof(*c));
              char line[512];int i=0;
              while(*p&&*p!='\n'&&i<511)line[i++]=*p++;
              line[i]=0;if(*p=='\n')p++;

              char*save;char*tok=strtok_r(line," \t",&save);if(!tok)continue;

              if(strcmp(tok,"BG")==0){
                strcpy(c->cmd,"BG");
                tok=strtok_r(NULL," \t",&save);if(tok)c->color=strtoul(tok,NULL,0);
              } else if(strcmp(tok,"RECT")==0){
                strcpy(c->cmd,"RECT");
                tok=strtok_r(NULL," \t",&save);if(tok)c->x=atoi(tok);
                tok=strtok_r(NULL," \t",&save);if(tok)c->y=atoi(tok);
                tok=strtok_r(NULL," \t",&save);if(tok)c->w=atoi(tok);
                tok=strtok_r(NULL," \t",&save);if(tok)c->h=atoi(tok);
                tok=strtok_r(NULL," \t",&save);if(tok)c->color=strtoul(tok,NULL,0);
              } else if(strcmp(tok,"TEXT")==0){
                strcpy(c->cmd,"TEXT");
                tok=strtok_r(NULL," \t",&save);if(tok)c->x=atoi(tok);
                tok=strtok_r(NULL," \t",&save);if(tok)c->y=atoi(tok);
                tok=strtok_r(NULL," \t",&save);if(tok)c->size=atoi(tok);
                char*q=strchr(save,'"');
                if(q){
                  q++;char*e=strchr(q,'"');
                  if(e){int l=e-q;if(l>127)l=127;strncpy(c->text,q,l);c->text[l]=0;
                    q=e+1;while(*q==' '||*q=='\t')q++;if(*q)c->color=strtoul(q,NULL,0);}
                }
              } else if(strcmp(tok,"BTN")==0){
                strcpy(c->cmd,"BTN");
                tok=strtok_r(NULL," \t",&save);if(tok)strncpy(c->text,tok,31);
                char id[32];strncpy(id,c->text,31);id[31]=0;
                tok=strtok_r(NULL," \t",&save);if(tok)c->x=atoi(tok);
                tok=strtok_r(NULL," \t",&save);if(tok)c->y=atoi(tok);
                tok=strtok_r(NULL," \t",&save);if(tok)c->w=atoi(tok);
                tok=strtok_r(NULL," \t",&save);if(tok)c->h=atoi(tok);
                char label[64]={0};char*end_q=NULL;
                char*q=strchr(save?save:"",'\"');
                if(q){q++;char*e=strchr(q,'"');if(e){int l=e-q;if(l>63)l=63;strncpy(label,q,l);label[l]=0;end_q=e;}}
                if(end_q){char*col=end_q+1;while(*col==' '||*col=='\t')col++;c->color=strtoul(col,NULL,0);}
                char combined[128];snprintf(combined,sizeof(combined),"%s|%s",id,label);
                strncpy(c->text,combined,127);
              }
              ncmds++;
            }
          }

          static void scan_tpks(void){
            DIR*d=opendir(TPK_DIR);if(!d)return;
            struct dirent*e;napps=0;
            uint32_t P[][2]={{0x6C5CE7,0xA29BFE},{0x00B894,0x55EFC4},{0xE17055,0xFAB1A0},
              {0x0984E3,0x74B9FF},{0xFD79A8,0xFDCB6E},{0x00CEC9,0x81ECEC},
              {0xE84393,0xFD79A8},{0x2D3436,0x636E72},{0xD63031,0xFF7675},
              {0x00B894,0x00CEC9},{0xFDCB6E,0xE17055},{0x0984E3,0x6C5CE7}};
            while((e=readdir(d))&&napps<32){
              char*dot=strstr(e->d_name,".tpk");
              if(dot){
                strncpy(apps[napps].file,e->d_name,255);
                strncpy(apps[napps].name,e->d_name,dot-e->d_name);
                apps[napps].name[dot-e->d_name]=0;
                apps[napps].letter=apps[napps].name[0];
                if(apps[napps].letter>='a'&&apps[napps].letter<='z')apps[napps].letter-=32;
                apps[napps].c1=P[napps%12][0];apps[napps].c2=P[napps%12][1];
                napps++;
              }
            }
            closedir(d);
          }

          static int open_app(const char*name,const char*file,uint32_t color){
            for(int i=0;i<MAX_WINDOWS;i++){
              if(!wins[i].active){
                wins[i].active=1;wins[i].x=40+i*20;wins[i].y=60+i*20;
                wins[i].w=600;wins[i].h=380;
                strncpy(wins[i].title,name,63);
                snprintf(wins[i].tpk,sizeof(wins[i].tpk),TPK_DIR"/%s",file);
                wins[i].color=color;wins[i].drag=0;
                active_win=i;full_redraw=1;return i;
              }
            }
            return -1;
          }

          static void draw_window(int idx){
            win_t*w=&wins[idx];
            shadow(w->x,w->y,w->w,w->h,8,4);
            rrect(w->x,w->y,w->w,w->h,8,0x1A1A2E);
            frect(w->x,w->y,w->w,32,0x2D3436);
            int cx=w->x+w->w-28,cy=w->y+8;
            rrect(cx,cy,16,16,4,0xD63031);dstr(cx+4,cy+4,"X",2,0xFFFFFFFF);
            dstr(w->x+10,w->y+10,w->title,2,0xFFFFFFFF);

            char output[32768];
            if(run_tpk(w->tpk,"",output,sizeof(output))==0){
              parse_ui(output);
              uint32_t bg=0x1A1A2E;
              for(int i=0;i<ncmds;i++)if(strcmp(cmds[i].cmd,"BG")==0)bg=cmds[i].color;
              frect(w->x,w->y+32,w->w,w->h-32,bg);

              for(int i=0;i<ncmds;i++){
                ui_cmd_t*c=&cmds[i];
                if(strcmp(c->cmd,"RECT")==0){
                  frect(w->x+c->x,w->y+32+c->y,c->w,c->h,c->color);
                } else if(strcmp(c->cmd,"TEXT")==0){
                  dstr(w->x+c->x,w->y+32+c->y,c->text,c->size,c->color);
                } else if(strcmp(c->cmd,"BTN")==0){
                  char id[32]={0},label[64]={0};
                  char*sep=strchr(c->text,'|');
                  if(sep){strncpy(id,c->text,sep-c->text);strcpy(label,sep+1);}
                  rrect(w->x+c->x,w->y+32+c->y,c->w,c->h,6,c->color);
                  int tw=strw(label,2);
                  dstr(w->x+c->x+(c->w-tw)/2,w->y+32+c->y+(c->h-14)/2,label,2,0xFFFFFFFF);
                  int lx=mouse_x-w->x,ly=mouse_y-w->y-32;
                  if(lx>=c->x&&lx<=c->x+c->w&&ly>=c->y&&ly<=c->y+c->h){
                    frect_b(w->x+c->x,w->y+32+c->y,c->w,c->h,0xFFFFFF,40);
                  }
                }
              }
            }
          }

          static void draw_home(void){
            vgrad(0,0,W,H,0x0A0A1E,0x16213E);
            frect_b(0,0,W,44,0x0D0D22,220);
            time_t now=time(NULL);struct tm*t=localtime(&now);
            char clk[32],dt[32];strftime(clk,32,"%H:%M:%S",t);strftime(dt,32,"%a %b %d",t);
            dstr(12,4,"zenOS",2,0x00D4FFFF);
            dstr(12,20,dt,2,0xAAAAAAFF);
            dstr(W-100,14,clk,3,0xFFFFFFFF);
            if(n_inputs>0)dstr(W-100,30,"INPUT OK",1,0x00FF00);
            else dstr(W-100,30,"NO INPUT",1,0xFF0000);

            scan_tpks();
            if(napps==0){dstr(W/2-80,H/2,"No TPK Apps",2,0xAAAAAA);return;}
            int cols=4,icon=80,gx=20,gy=25;
            int tw=cols*icon+(cols-1)*gx;
            int sx=(W-tw)/2,sy=70;
            dstr(sx,sy-22,"Apps",2,0x888888);

            for(int i=0;i<napps;i++){
              int col=i%cols,row=i/cols;
              int ax=sx+col*(icon+gx),ay=sy+row*(icon+gy+20);
              shadow(ax,ay,icon,icon,icon/5,4);
              vgrad(ax,ay,icon,icon,apps[i].c1,apps[i].c2);
              int r=icon/5;
              for(int j=0;j<r;j++)for(int i2=0;i2<r;i2++){
                if(i2*i2+j*j>r*r){
                  px(ax+i2,ay+j,0x0A0A1E);px(ax+icon-1-i2,ay+j,0x0A0A1E);
                  px(ax+i2,ay+icon-1-j,0x0A0A1E);px(ax+icon-1-i2,ay+icon-1-j,0x0A0A1E);
                }
              }
              char l[2]={apps[i].letter,0};
              int sc=icon/24;if(sc<2)sc=2;
              int tw2=strw(l,sc);
              dstr(ax+(icon-tw2)/2,ay+(icon-7*sc)/2,l,sc,0xFFFFFFFF);
              int nw=strw(apps[i].name,2);
              if(nw>icon+10){char tmp[20];strncpy(tmp,apps[i].name,12);tmp[12]=0;strcat(tmp,"..");nw=strw(tmp,2);
                dstr(ax+(icon-nw)/2,ay+icon+4,tmp,2,0xCCCCCC);}
              else dstr(ax+(icon-nw)/2,ay+icon+4,apps[i].name,2,0xCCCCCC);

              if(mouse_x>=ax&&mouse_x<=ax+icon&&mouse_y>=ay&&mouse_y<=ay+icon){
                frect_b(ax,ay,icon,icon,0xFFFFFF,30);
              }
            }

            int ny=H-52;frect_b(0,ny,W,52,0x0D0D22,220);
            dstr(10,ny+20,"Touch/Click | Arrow+Enter | ESC=close",1,0x888888);
          }

          static void handle_click(int idx){
            win_t*w=&wins[idx];
            int lx=mouse_x-w->x,ly=mouse_y-w->y-32;
            if(mouse_x>=w->x+w->w-28&&mouse_x<=w->x+w->w-12&&mouse_y>=w->y+8&&mouse_y<=w->y+24){
              w->active=0;if(active_win==idx)active_win=-1;full_redraw=1;return;
            }
            if(ly<0&&ly>-32){w->drag=1;w->dx=mouse_x-w->x;w->dy=mouse_y-w->y;return;}
            char output[32768];
            if(run_tpk(w->tpk,"",output,sizeof(output))==0){
              parse_ui(output);
              for(int i=0;i<ncmds;i++){
                if(strcmp(cmds[i].cmd,"BTN")==0){
                  if(lx>=cmds[i].x&&lx<=cmds[i].x+cmds[i].w&&ly>=cmds[i].y&&ly<=cmds[i].y+cmds[i].h){
                    char id[32]={0};char*sep=strchr(cmds[i].text,'|');
                    if(sep)strncpy(id,cmds[i].text,sep-cmds[i].text);
                    char event[64];snprintf(event,sizeof(event),"click_%s",id);
                    klog("click: %s",event);
                    char out2[32768];
                    run_tpk(w->tpk,event,out2,sizeof(out2));
                    full_redraw=1;return;
                  }
                }
              }
            }
          }

          static void handle_home_click(void){
            scan_tpks();
            int cols=4,icon=80,gx=20,gy=25;
            int tw=cols*icon+(cols-1)*gx;
            int sx=(W-tw)/2,sy=70;
            for(int i=0;i<napps;i++){
              int col=i%cols,row=i/cols;
              int ax=sx+col*(icon+gx),ay=sy+row*(icon+gy+20);
              if(mouse_x>=ax&&mouse_x<=ax+icon&&mouse_y>=ay&&mouse_y<=ay+icon){
                open_app(apps[i].name,apps[i].file,apps[i].c1);return;
              }
            }
          }

          static void render(void){
            draw_home();
            for(int i=0;i<MAX_WINDOWS;i++)if(wins[i].active)draw_window(i);
            if(mouse_x>=0&&mouse_y>=0){
              for(int i=0;i<14;i++){
                px(mouse_x+i,mouse_y+i,0xFFFFFFFF);
                px(mouse_x+i+1,mouse_y+i,0x000000);
                px(mouse_x+i,mouse_y+i+1,0x000000);
              }
              if(use_keyboard){
                for(int i=-20;i<=20;i++){
                  if(i!=-1&&i!=0&&i!=1){
                    px(mouse_x+i,mouse_y,0xFF00FFFF);
                    px(mouse_x,mouse_y+i,0xFF00FFFF);
                  }
                }
              }
            }
            swap();
          }

          int main(void){
            klog("init starting");
            mount("proc","/proc","proc",0,NULL);
            mount("sysfs","/sys","sysfs",0,NULL);
            mount("devtmpfs","/dev","devtmpfs",0,NULL);
            sleep(1);
            mkdir("/dev/pts",0755);mount("devpts","/dev/pts","devpts",0,NULL);
            mount("tmpfs","/tmp","tmpfs",0,NULL);
            mkdir(TPK_DIR,0755);mkdir("/root",0755);mkdir("/data",0755);

            {
              DIR*d=opendir("/dev/input");
              if(d){
                struct dirent*e;
                while((e=readdir(d)))klog("  /dev/input/%s",e->d_name);
                closedir(d);
              }
            }

            if(fork()==0){
              setsid();
              int fd=open("/dev/tty2",O_RDWR);
              if(fd<0)fd=open("/dev/tty1",O_RDWR);
              if(fd>=0){ioctl(fd,TIOCSCTTY,1);dup2(fd,0);dup2(fd,1);dup2(fd,2);if(fd>2)close(fd);}
              setenv("PS1","zenos~# ",1);setenv("HOME","/root",1);
              setenv("PATH","/bin:/usr/bin",1);
              execl("/bin/busybox","sh","-i",NULL);exit(1);
            }

            {
              int tty=open("/dev/tty1",O_RDWR);
              if(tty>=0){
                ioctl(tty,VT_ACTIVATE,1);
                ioctl(tty,VT_WAITACTIVE,1);
                ioctl(tty,KDSETMODE,KD_GRAPHICS);
                close(tty);
              }
            }

            sleep(1);
            for(int t=0;t<15;t++){
              fbfd=open("/dev/fb0",O_RDWR);
              if(fbfd>=0)break;
              sleep(1);
            }
            if(fbfd<0){klog("no fb");while(1){int s;while(waitpid(-1,&s,WNOHANG)>0);sleep(5);}}
            struct fb_var_screeninfo vi;
            ioctl(fbfd,FBIOGET_VSCREENINFO,&vi);
            W=vi.xres;H=vi.yres;fb_sz=W*H*4;
            front=mmap(0,fb_sz,PROT_READ|PROT_WRITE,MAP_SHARED,fbfd,0);
            if(front==MAP_FAILED){klog("mmap fail");return 1;}
            back=malloc(fb_sz);memset(back,0,fb_sz);
            klog("fb: %dx%d",W,H);

            init_input();
            klog("GUI ready, %d inputs",n_inputs);

            while(1){
              poll_input();
              int new_click=(mouse_down&&!last_down)||(key_enter&&!last_enter);
              if(active_win>=0&&wins[active_win].active&&wins[active_win].drag){
                if(mouse_down){wins[active_win].x=mouse_x-wins[active_win].dx;wins[active_win].y=mouse_y-wins[active_win].dy;full_redraw=1;}
                else wins[active_win].drag=0;
              } else if(new_click){
                if(active_win>=0&&wins[active_win].active)handle_click(active_win);
                else handle_home_click();
              }
              last_down=mouse_down;last_enter=key_enter;
              render();
              usleep(20000);
              int s;while(waitpid(-1,&s,WNOHANG)>0);
            }
            return 0;
          }
