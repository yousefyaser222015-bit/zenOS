          /* ===== Double Buffer Management ===== */
          static void init_buffers(void) {
              fb_size = screen_w * screen_h * sizeof(uint32_t);
              back_buffer = (uint32_t*)malloc(fb_size);
              if (!back_buffer) {
                  fprintf(stderr, "Failed to allocate back buffer\n");
                  exit(1);
              }
              memset(back_buffer, 0, fb_size);
          }

          static void mark_dirty(int x, int y, int w, int h) {
              if (full_redraw_needed) return;
              if (dirty_count < MAX_DIRTY) {
                  dirty_rects[dirty_count].x = x;
                  dirty_rects[dirty_count].y = y;
                  dirty_rects[dirty_count].w = w;
                  dirty_rects[dirty_count].h = h;
                  dirty_count++;
              } else {
                  full_redraw_needed = 1;
              }
          }

          static void mark_full_dirty(void) {
              full_redraw_needed = 1;
          }

          static void swap_buffers(void) {
              if (!front_buffer) return;
              
              if (full_redraw_needed) {
                  memcpy(front_buffer, back_buffer, fb_size);
                  full_redraw_needed = 0;
              } else {
                  for (int i = 0; i < dirty_count; i++) {
                      int x = dirty_rects[i].x;
                      int y = dirty_rects[i].y;
                      int w = dirty_rects[i].w;
                      int h = dirty_rects[i].h;
                      
                      for (int row = y; row < y + h && row < screen_h; row++) {
                          memcpy(front_buffer + row * screen_w + x,
                                 back_buffer + row * screen_w + x,
                                 w * sizeof(uint32_t));
                      }
                  }
              }
              dirty_count = 0;
          }

          /* ===== Drawing Functions (on back buffer) ===== */
          static void put_pixel(int x, int y, uint32_t color) {
              if (x >= 0 && x < screen_w && y >= 0 && y < screen_h) {
                  back_buffer[y * screen_w + x] = color;
              }
          }

          static void blend_pixel(int x, int y, uint32_t color, uint8_t alpha) {
              if (x < 0 || x >= screen_w || y < 0 || y >= screen_h) return;
              uint32_t *p = &back_buffer[y * screen_w + x];
              uint8_t sr = (color >> 16) & 0xFF;
              uint8_t sg = (color >> 8) & 0xFF;
              uint8_t sb = color & 0xFF;
              uint8_t dr = (*p >> 16) & 0xFF;
              uint8_t dg = (*p >> 8) & 0xFF;
              uint8_t db = *p & 0xFF;
              uint8_t r = sr * alpha / 255 + dr * (255 - alpha) / 255;
              uint8_t g = sg * alpha / 255 + dg * (255 - alpha) / 255;
              uint8_t b = sb * alpha / 255 + db * (255 - alpha) / 255;
              *p = 0xFF000000 | (r << 16) | (g << 8) | b;
          }

          static void fill_rect(int x, int y, int w, int h, uint32_t color) {
              for (int j = y; j < y + h; j++) {
                  for (int i = x; i < x + w; i++) {
                      put_pixel(i, j, color);
                  }
              }
          }

          static void fill_rect_blend(int x, int y, int w, int h, uint32_t color, uint8_t alpha) {
              for (int j = y; j < y + h; j++) {
                  for (int i = x; i < x + w; i++) {
                      blend_pixel(i, j, color, alpha);
                  }
              }
          }

          static void draw_rounded_rect(int x, int y, int w, int h, int r, uint32_t color) {
              fill_rect(x + r, y, w - 2 * r, h, color);
              fill_rect(x, y + r, r, h - 2 * r, color);
              fill_rect(x + w - r, y + r, r, h - 2 * r, color);
              
              for (int j = -r; j <= r; j++) {
                  for (int i = -r; i <= r; i++) {
                      if (i * i + j * j <= r * r) {
                          put_pixel(x + r + i, y + r + j, color);
                          put_pixel(x + w - r - 1 + i, y + r + j, color);
                          put_pixel(x + r + i, y + h - r - 1 + j, color);
                          put_pixel(x + w - r - 1 + i, y + h - r - 1 + j, color);
                      }
                  }
              }
          }

          static void draw_vertical_gradient(int x, int y, int w, int h, uint32_t c1, uint32_t c2) {
              for (int j = 0; j < h; j++) {
                  uint8_t t = 255 * j / (h > 1 ? h - 1 : 1);
                  uint8_t r = ((c1 >> 16) & 0xFF) * (255 - t) / 255 + ((c2 >> 16) & 0xFF) * t / 255;
                  uint8_t g = ((c1 >> 8) & 0xFF) * (255 - t) / 255 + ((c2 >> 8) & 0xFF) * t / 255;
                  uint8_t b = (c1 & 0xFF) * (255 - t) / 255 + (c2 & 0xFF) * t / 255;
                  uint32_t color = 0xFF000000 | (r << 16) | (g << 8) | b;
                  for (int i = 0; i < w; i++) {
                      put_pixel(x + i, y + j, color);
                  }
              }
          }

          static void draw_char(int x, int y, char ch, int scale, uint32_t color) {
              if (ch < 32 || ch > 126) ch = '?';
              const uint8_t *glyph = font5x7[ch - 32];
              for (int row = 0; row < 7; row++) {
                  for (int col = 0; col < 5; col++) {
                      if (glyph[row] & (0x10 >> col)) {
                          for (int sy = 0; sy < scale; sy++) {
                              for (int sx = 0; sx < scale; sx++) {
                                  put_pixel(x + col * scale + sx, y + row * scale + sy, color);
                              }
                          }
                      }
                  }
              }
          }

          static void draw_string(int x, int y, const char *str, int scale, uint32_t color) {
              int cx = x;
              for (int i = 0; str[i]; i++) {
                  if (str[i] == '\n') {
                      cx = x;
                      y += 8 * scale + 2;
                      continue;
                  }
                  draw_char(cx, y, str[i], scale, color);
                  cx += 6 * scale;
              }
          }

          static int string_width(const char *str, int scale) {
              return strlen(str) * 6 * scale;
          }

          static void draw_string_centered(int y, const char *str, int scale, uint32_t color) {
              int w = string_width(str, scale);
              draw_string((screen_w - w) / 2, y, str, scale, color);
          }

          static void draw_shadow(int x, int y, int w, int h, int radius, int blur) {
              for (int b = blur; b > 0; b--) {
                  for (int j = y - b + 2; j < y + h + b; j++) {
                      for (int i = x - b; i < x + w + b; i++) {
                          if (i >= x && i < x + w && j >= y && j < y + h) continue;
                          blend_pixel(i, j, 0x000000, 8);
                      }
                  }
              }
          }

          /* ===== TPK Scanner ===== */
          static void scan_tpk_apps(void) {
              DIR *d = opendir(TPK_DIR);
              if (!d) return;
              
              struct dirent *e;
              app_count = 0;
              
              uint32_t palette[][2] = {
                  {0x6C5CE7, 0xA29BFE}, {0x00B894, 0x55EFC4}, {0xE17055, 0xFAB1A0},
                  {0x0984E3, 0x74B9FF}, {0xFD79A8, 0xFDCB6E}, {0x00CEC9, 0x81ECEC},
                  {0xE84393, 0xFD79A8}, {0x2D3436, 0x636E72}, {0xD63031, 0xFF7675},
                  {0x6C5CE7, 0x74B9FF}, {0x00B894, 0x00CEC9}, {0xFDCB6E, 0xE17055}
              };
              
              while ((e = readdir(d)) != NULL && app_count < MAX_APPS) {
                  char *dot = strstr(e->d_name, ".tpk");
                  if (dot) {
                      strncpy(apps[app_count].filename, e->d_name, 255);
                      strncpy(apps[app_count].name, e->d_name, dot - e->d_name);
                      apps[app_count].name[dot - e->d_name] = 0;
                      apps[app_count].icon_letter = apps[app_count].name[0];
                      if (apps[app_count].icon_letter >= 'a' && apps[app_count].icon_letter <= 'z') {
                          apps[app_count].icon_letter -= 32;
                      }
                      apps[app_count].color1 = palette[app_count % 12][0];
                      apps[app_count].color2 = palette[app_count % 12][1];
                      app_count++;
                  }
              }
              closedir(d);
          }

          /* ===== TPK Launcher ===== */
          static void launch_tpk(int idx) {
              if (idx < 0 || idx >= app_count) return;
              
              char dir[512];
              snprintf(dir, sizeof(dir), "/tmp/%s", apps[idx].name);
              mkdir(dir, 0755);
              
              char cmd[1024];
              snprintf(cmd, sizeof(cmd), "/bin/busybox unzip -o %s/%s -d %s >/dev/null 2>&1",
                       TPK_DIR, apps[idx].filename, dir);
              system(cmd);
              
              char exe[1024];
              struct stat st;
              snprintf(exe, sizeof(exe), "%s/shared/res/entry.sh", dir);
              if (stat(exe, &st) != 0) {
                  snprintf(exe, sizeof(exe), "%s/entry.sh", dir);
                  if (stat(exe, &st) != 0) {
                      snprintf(exe, sizeof(exe), "%s/bin/main", dir);
                  }
              }
              
              pid_t pid = fork();
              if (pid == 0) {
                  chdir(dir);
                  chmod(exe, 0755);
                  setenv("TPK_HOME", dir, 1);
                  execl(exe, exe, NULL);
                  exit(1);
              } else if (pid > 0) {
                  int status;
                  waitpid(pid, &status, 0);
              }
          }

          /* ===== Input Handling ===== */
          static void init_input(void) {
              for (int i = 0; i < 5; i++) {
                  char path[64];
                  snprintf(path, sizeof(path), "/dev/input/event%d", i);
                  evdev_fd = open(path, O_RDONLY | O_NONBLOCK);
                  if (evdev_fd >= 0) break;
              }
          }

          static void poll_input(void) {
              if (evdev_fd < 0) return;
              
              struct input_event ev;
              while (read(evdev_fd, &ev, sizeof(ev)) == sizeof(ev)) {
                  if (ev.type == EV_ABS) {
                      if (ev.code == ABS_X) mouse_x = ev.value * screen_w / 1024;
                      if (ev.code == ABS_Y) mouse_y = ev.value * screen_h / 1024;
                  }
                  if (ev.type == EV_KEY) {
                      if (ev.code == BTN_TOUCH || ev.code == BTN_MOUSE) {
                          mouse_prev_click = mouse_click;
                          mouse_click = ev.value;
                      }
                  }
                  if (ev.type == EV_REL) {
                      if (ev.code == REL_X) mouse_x += ev.value;
                      if (ev.code == REL_Y) mouse_y += ev.value;
                      if (mouse_x < 0) mouse_x = 0;
                      if (mouse_x >= screen_w) mouse_x = screen_w - 1;
                      if (mouse_y < 0) mouse_y = 0;
                      if (mouse_y >= screen_h) mouse_y = screen_h - 1;
                  }
              }
          }

          /* ===== Window Manager ===== */
          static int create_window(const char *title, int x, int y, int w, int h, uint32_t color) {
              for (int i = 0; i < MAX_WINDOWS; i++) {
                  if (!windows[i].active) {
                      windows[i].active = 1;
                      windows[i].x = x;
                      windows[i].y = y;
                      windows[i].w = w;
                      windows[i].h = h;
                      strncpy(windows[i].title, title, 63);
                      windows[i].color = color;
                      windows[i].pid = 0;
                      return i;
                  }
              }
              return -1;
          }

          static void draw_window(int idx) {
              if (!windows[idx].active) return;
              
              int x = windows[idx].x;
              int y = windows[idx].y;
              int w = windows[idx].w;
              int h = windows[idx].h;
              
              draw_shadow(x, y, w, h, 8, 4);
              draw_rounded_rect(x, y, w, h, 8, 0x1A1A2E);
              
              fill_rect(x, y, w, 32, 0x2D3436);
              draw_string(x + 10, y + 10, windows[idx].title, 2, 0xFFFFFFFF);
              
              int close_x = x + w - 32;
              int close_y = y + 8;
              draw_rounded_rect(close_x, close_y, 16, 16, 4, 0xD63031);
              draw_string(close_x + 4, close_y + 4, "X", 2, 0xFFFFFFFF);
          }

          /* ===== UI Drawing ===== */
          static void draw_status_bar(void) {
              fill_rect_blend(0, 0, screen_w, 44, 0x0D0D22, 220);
              
              time_t now = time(NULL);
              struct tm *t = localtime(&now);
              char clk[32], dt[32];
              strftime(clk, sizeof(clk), "%H:%M", t);
              strftime(dt, sizeof(dt), "%a %b %d", t);
              
              draw_string_centered(14, clk, 3, 0xFFFFFFFF);
              draw_string(12, 16, dt, 2, 0xAAAAAAFF);
              draw_string(12, 4, "zenOS", 2, 0x00D4FFFF);
          }

          static void draw_app_grid(void) {
              scan_tpk_apps();
              
              if (app_count == 0) {
                  draw_string_centered(screen_h / 2 - 20, "No TPK Apps Found", 2, 0xAAAAAAAA);
                  draw_string_centered(screen_h / 2 + 10, "Drop .tpk files in /tpk", 2, 0x77777777);
                  return;
              }
              
              int cols = 3, icon_size = 90, gap_x = 30, gap_y = 25;
              int total_w = cols * icon_size + (cols - 1) * gap_x;
              int start_x = (screen_w - total_w) / 2;
              int start_y = 64;
              
              char header[32];
              snprintf(header, sizeof(header), "Apps (%d)", app_count);
              draw_string(start_x, start_y - 2, header, 2, 0x888888FF);
              start_y += 24;
              
              static int last_click = 0;
              int clicked = mouse_click && !last_click;
              last_click = mouse_click;
              
              for (int i = 0; i < app_count; i++) {
                  int col = i % cols;
                  int row = i / cols;
                  int ax = start_x + col * (icon_size + gap_x);
                  int ay = start_y + row * (icon_size + gap_y + 20);
                  
                  draw_shadow(ax, ay, icon_size, icon_size, icon_size / 5, 4);
                  draw_vertical_gradient(ax, ay, icon_size, icon_size, 
                                        apps[i].color1, apps[i].color2);
                  
                  int r = icon_size / 5;
                  for (int j = 0; j < r; j++) {
                      for (int i2 = 0; i2 < r; i2++) {
                          if (i2 * i2 + j * j > r * r) {
                              put_pixel(ax + i2, ay + j, 0x0A0A1E);
                              put_pixel(ax + icon_size - 1 - i2, ay + j, 0x0A0A1E);
                              put_pixel(ax + i2, ay + icon_size - 1 - j, 0x0A0A1E);
                              put_pixel(ax + icon_size - 1 - i2, ay + icon_size - 1 - j, 0x0A0A1E);
                          }
                      }
                  }
                  
                  char letter[2] = {apps[i].icon_letter, 0};
                  int scale = icon_size / 24;
                  if (scale < 2) scale = 2;
                  int tw = string_width(letter, scale);
                  draw_string(ax + (icon_size - tw) / 2, ay + (icon_size - 7 * scale) / 2,
                             letter, scale, 0xFFFFFFFF);
                  
                  int name_w = string_width(apps[i].name, 2);
                  if (name_w > icon_size + 10) {
                      char tmp[20];
                      strncpy(tmp, apps[i].name, 12);
                      tmp[12] = 0;
                      strcat(tmp, "..");
                      draw_string(ax + (icon_size - string_width(tmp, 2)) / 2,
                                 ay + icon_size + 4, tmp, 2, 0xCCCCCCFF);
                  } else {
                      draw_string(ax + (icon_size - name_w) / 2, ay + icon_size + 4,
                                 apps[i].name, 2, 0xCCCCCCFF);
                  }
                  
                  if (clicked && mouse_x >= ax && mouse_x <= ax + icon_size &&
                      mouse_y >= ay && mouse_y <= ay + icon_size) {
                      fill_rect_blend(ax, ay, icon_size, icon_size, 0xFFFFFF, 60);
                      launch_tpk(i);
                  }
              }
          }

          static void draw_nav_bar(void) {
              int ny = screen_h - 52;
              fill_rect_blend(0, ny, screen_w, 52, 0x0D0D22, 220);
              
              int bx = screen_w / 4;
              for (int i = 0; i < 12; i++) {
                  for (int j = -i / 2; j <= i / 2; j++) {
                      put_pixel(bx - 6 + i, ny + 26 + j, 0xAAAAAAAA);
                  }
              }
              
              int hx = screen_w / 2;
              for (int j = -9; j <= 9; j++) {
                  for (int i = -9; i <= 9; i++) {
                      int d = i * i + j * j;
                      if (d <= 81 && d > 49) {
                          put_pixel(hx + i, ny + 26 + j, 0xFFFFFFFF);
                      }
                  }
              }
              
              int rx = 3 * screen_w / 4;
              for (int j = -8; j <= 8; j++) {
                  for (int i = -8; i <= 8; i++) {
                      if (abs(i) > 6 || abs(j) > 6) {
                          put_pixel(rx + i, ny + 26 + j, 0xAAAAAAAA);
                      }
                  }
              }
          }

          static void draw_mouse_cursor(void) {
              if (mouse_x < 0 || mouse_y < 0) return;
              
              for (int i = 0; i < 12; i++) {
                  put_pixel(mouse_x + i, mouse_y + i, 0xFFFFFFFF);
                  put_pixel(mouse_x + i, mouse_y + i + 1, 0xFFFFFFFF);
                  if (i < 6) {
                      put_pixel(mouse_x + i, mouse_y, 0xFFFFFFFF);
                      put_pixel(mouse_x, mouse_y + i, 0xFFFFFFFF);
                  }
              }
          }

          static void render_frame(void) {
              if (full_redraw_needed || dirty_count > 0) {
                  draw_vertical_gradient(0, 0, screen_w, screen_h, 0x0A0A1E, 0x16213E);
                  draw_status_bar();
                  draw_app_grid();
                  draw_nav_bar();
                  
                  for (int i = 0; i < MAX_WINDOWS; i++) {
                      if (windows[i].active) {
                          draw_window(i);
                      }
                  }
                  
                  draw_mouse_cursor();
                  swap_buffers();
              }
          }

          /* ===== Main ===== */
          int main(void) {
              printf("[zenOS] init starting with double buffering...\n");
              
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              mkdir("/dev/pts", 0755);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);
              mount("tmpfs", "/tmp", "tmpfs", 0, NULL);
              mkdir(TPK_DIR, 0755);
              printf("[zenOS] filesystems mounted\n");

              if (fork() == 0) {
                  setsid();
                  int fd = open("/dev/tty1", O_RDWR);
                  if (fd < 0) fd = open("/dev/console", O_RDWR);
                  if (fd >= 0) {
                      dup2(fd, 0); dup2(fd, 1); dup2(fd, 2);
                      if (fd > 2) close(fd);
                  }
                  setenv("PS1", "zenos~# ", 1);
                  setenv("HOME", "/", 1);
                  setenv("PATH", "/bin:/usr/bin", 1);
                  execl("/bin/busybox", "sh", "-i", NULL);
                  exit(1);
              }
              printf("[zenOS] shell spawned\n");

              sleep(2);
              for (int try = 0; try < 10; try++) {
                  fb_fd = open("/dev/fb0", O_RDWR);
                  if (fb_fd >= 0) break;
                  sleep(1);
              }
              
              if (fb_fd < 0) {
                  printf("[zenOS] ERROR: no framebuffer\n");
                  while (1) {
                      int s;
                      while (waitpid(-1, &s, WNOHANG) > 0);
                      sleep(5);
                  }
              }
              
              struct fb_var_screeninfo vi;
              ioctl(fb_fd, FBIOGET_VSCREENINFO, &vi);
              screen_w = vi.xres;
              screen_h = vi.yres;
              fb_size = screen_w * screen_h * sizeof(uint32_t);
              
              front_buffer = mmap(0, fb_size, PROT_READ | PROT_WRITE, MAP_SHARED, fb_fd, 0);
              if (front_buffer == MAP_FAILED) {
                  printf("[zenOS] mmap failed\n");
                  exit(1);
              }
              
              init_buffers();
              init_input();
              printf("[zenOS] GUI ready: %dx%d\n", screen_w, screen_h);

              while (1) {
                  poll_input();
                  render_frame();
                  usleep(16667);
                  int s;
                  while (waitpid(-1, &s, WNOHANG) > 0);
              }
              
              return 0;
          }
          CEOF
          
          aarch64-linux-gnu-gcc -O2 -static -o zenos-rootfs/init zenos-rootfs/init.c -lm
          chmod +x zenos-rootfs/init
          ls -lh zenos-rootfs/init

      - name: Build initramfs
        run: |
          cd zenos-rootfs
          mkdir -p dev proc sys tmp tpk dev/input usr/bin tpk_build
          for cmd in sh ls cat mkdir mount chmod unzip sleep echo clear; do
            ln -sf busybox bin/$cmd
          done
          
          echo "Creating TPK apps..."
          for app in Calculator Weather Music Settings Camera Gallery; do
            mkdir -p tpk_build/${app}/shared/res
            cat > tpk_build/${app}/shared/res/entry.sh << TPKAPP
          #!/bin/sh
          echo "=== $app on zenOS ==="
          echo "TPK_HOME=\$TPK_HOME"
          sleep 5
          TPKAPP
            chmod +x tpk_build/${app}/shared/res/entry.sh
            cd tpk_build/${app}
            zip -qr ../../tpk/${app}.tpk .
            cd ../..
          done
          rm -rf tpk_build
          ls -lh tpk/
          
          find . | cpio -H newc -o > ../initramfs.cpio
          gzip -9 < ../initramfs.cpio > ../initramfs.img
          cd ..
          ls -lh initramfs.img

      - name: Create disk image
        run: |
          dd if=/dev/zero of=zenos.img bs=1M count=80
          mkfs.ext4 -F -L zenOS zenos.img
          mkdir -p mnt
          sudo mount -o loop zenos.img mnt
          sudo mkdir -p mnt/boot
          sudo cp kernel.img mnt/boot/
          sudo cp initramfs.img mnt/boot/
          sudo sync && sudo umount mnt
          ls -lh zenos.img
          gzip -kf zenos.img

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: zenos-arm64
          path: |
            zenos.img.gz
            kernel.img
            initramfs.img

      - name: QEMU test
        run: |
          timeout 15 qemu-system-aarch64 \
            -M virt -cpu cortex-a57 -m 512 \
            -kernel kernel.img -initrd initramfs.img \
            -append "console=ttyAMA0 rdinit=/init" \
            -device ramfb -nographic -no-reboot || true
