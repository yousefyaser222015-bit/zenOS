          #include <signal.h>
          #include <errno.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <sys/mount.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <sys/select.h>
          #include <sys/utsname.h>
          #include <linux/fb.h>
          #include <linux/input.h>
          #include <linux/vt.h>
          #include <linux/kd.h>
          #include <sys/statvfs.h>

          #define MAX_APPS 64
          #define TPK_DIR "/tpk"
