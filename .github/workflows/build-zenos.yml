name: Build Authentic Tizen OS GUI & Runtime Engine (Dynamic & Termux Ready)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-tizen-os:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools & Native QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
                                 bison flex libncurses-dev libssl-dev bc libelf-dev \
                                 qemu-user-static qemu-system-arm qemu-utils \
                                 e2fsprogs dosfstools kmod cpio wget curl zstd jq zip

      # 1. البحث الديناميكي عن أحدث نواة Linux 6.x وتحميلها وبنائها
      - name: Dynamic Kernel Selection & Compilation (ARM64 VirtIO & DRM)
        run: |
          mkdir -p kernel_build
          cd kernel_build

          echo "[Kernel Fetch] Detecting latest stable Linux 6.x Kernel release..."
          KERNEL_VER=$(curl -s https://www.kernel.org/releases.json | jq -r '.latest_link.version' 2>/dev/null || echo "")
          
          if [ -z "$KERNEL_VER" ]; then
              echo "[Kernel Fetch] Fallback: Scraping kernel.org for latest 6.x..."
              KERNEL_VER=$(curl -s https://cdn.kernel.org/pub/linux/kernel/v6.x/ | grep -oE 'linux-6\.[0-9]+\.[0-9]+\.tar\.xz' | tail -n 1 | sed 's/linux-//;s/\.tar\.xz//')
          fi

          if [ -z "$KERNEL_VER" ]; then
              echo "[CRITICAL ERROR] Could not dynamically resolve Linux kernel version!"
              exit 1
          fi

          echo "[Kernel Fetch] Selected Kernel Version: ${KERNEL_VER}"
          wget -q "https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-${KERNEL_VER}.tar.xz"
          tar -xf "linux-${KERNEL_VER}.tar.xz"
          cd "linux-${KERNEL_VER}"
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make defconfig

          # تفعيل كامل التعاريف الأساسية لـ VirtIO / PCI / DRM / Storage
          scripts/config --enable CONFIG_PCI
          scripts/config --enable CONFIG_PCI_HOST_GENERIC
          scripts/config --enable CONFIG_VIRTIO
          scripts/config --enable CONFIG_VIRTIO_PCI
          scripts/config --enable CONFIG_VIRTIO_MMIO
          scripts/config --enable CONFIG_VIRTIO_BLK
          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_EXT4_FS
          scripts/config --enable CONFIG_TMPFS
          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT
          scripts/config --enable CONFIG_UNIX
          scripts/config --enable CONFIG_INET
          scripts/config --enable CONFIG_NET
          scripts/config --enable CONFIG_VIRTIO_NET
          scripts/config --enable CONFIG_VIRTIO_INPUT
          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION
          scripts/config --enable CONFIG_VT
          scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE
          scripts/config --enable CONFIG_INPUT_EVDEV

          make -j$(nproc) Image
          cd ../..
          mkdir -p boot_kernel
          cp kernel_build/linux-*/arch/arm64/boot/Image boot_kernel/Image

      # 2. البحث الديناميكي والتنفيذ المحمي لاستخراج Tizen RootFS
      - name: Dynamically Resolve & Fetch Valid Tizen RootFS
        run: |
          mkdir -p zenos_rootfs
          
          # قائمة المسارات المحتملة للبحث الذكي داخل سيرفرات Tizen
          SEARCH_URLS=(
            "https://download.tizen.org/releases/daily/tizen/unified/latest/images/standard/tizen-headed-aarch64/"
            "https://download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/latest/images/standard/tizen-headed-aarch64/"
            "https://download.tizen.org/releases/pre-built/tizen-headed-aarch64/"
          )

          DOWNLOAD_SUCCESS=0
          for URL in "${SEARCH_URLS[@]}"; do
              echo "[Tizen Resolver] Scanning: ${URL}..."
              TARBALL=$(curl -sL "$URL" | grep -oE 'tizen-headed-aarch64-[0-9\._\-]+\.tar\.(gz|xz)' | head -n 1)
              
              if [ -n "$TARBALL" ]; then
                  echo "[Tizen Resolver] Found valid image: ${TARBALL}"
                  echo "[Tizen Resolver] Downloading from: ${URL}${TARBALL}"
                  if wget -q --show-progress "${URL}${TARBALL}" -O tizen-headed.tar.archive; then
                      DOWNLOAD_SUCCESS=1
                      break
                  fi
              fi
          done

          if [ $DOWNLOAD_SUCCESS -eq 0 ]; then
              echo "[CRITICAL ERROR] Failed to discover or download any valid Tizen Headed RootFS archive!"
              exit 1
          fi

          echo "[Tizen RootFS] Extracting archive safely..."
          tar -xf tizen-headed.tar.archive -C zenos_rootfs/ || true

          # تصحيح مشكلة المجلد المتداخل (Nested Directory Fix)
          if [ ! -d "zenos_rootfs/usr" ]; then
              SUBDIR=$(find zenos_rootfs/ -mindepth 1 -maxdepth 1 -type d | head -n 1)
              if [ -n "$SUBDIR" ] && [ -d "$SUBDIR/usr" ]; then
                  echo "[Tizen RootFS] Restructuring nested directory: ${SUBDIR}"
                  mv $SUBDIR/* zenos_rootfs/
                  rm -rf $SUBDIR
              fi
          fi

          # التحقق الصريح من صحة شجرة المجلدات
          if [ ! -d "zenos_rootfs/usr" ] || [ ! -d "zenos_rootfs/bin" -a ! -d "zenos_rootfs/usr/bin" ]; then
              echo "[CRITICAL ERROR] RootFS extraction incomplete or corrupted. Critical dirs missing!"
              exit 1
          fi

      # 3. بناء وتثبيت BusyBox ARM64 الأصلي (تجنب ثنائيات الـ Runner x86_64)
      - name: Compile Native ARM64 Static BusyBox
        run: |
          mkdir -p busybox_build
          cd busybox_build
          
          # جلب أحدث إصدار مستقر من BusyBox ديناميكيًا
          BBOX_VER=$(curl -s https://busybox.net/downloads/ | grep -oE 'busybox-[0-9\.]+\.tar\.bz2' | tail -n 1 | sed 's/busybox-//;s/\.tar\.bz2//')
          echo "[BusyBox] Building latest version: ${BBOX_VER}"
          
          wget -q "https://busybox.net/downloads/busybox-${BBOX_VER}.tar.bz2"
          tar -xf "busybox-${BBOX_VER}.tar.bz2"
          cd "busybox-${BBOX_VER}"
          make defconfig
          
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          sed -i 's/CONFIG_STATIC=n/CONFIG_STATIC=y/' .config
          make -j$(nproc) install
          
          cp -r _install/* ../../zenos_rootfs/
          cd ../..
          rm -rf busybox_build

      # 4. فحص جودة وصحة بيئة Tizen قبل متابعة البناء
      - name: Verify Tizen Userspace & Core Components
        run: |
          cd zenos_rootfs
          echo "[Health Check] Verifying Tizen system binaries..."
          
          MISSING_COMPONENTS=0
          [ -f "usr/bin/weston" -o -f "bin/weston" ] || { echo "MISSING: Weston Compositor"; MISSING_COMPONENTS=1; }
          [ -f "usr/bin/dbus-daemon" -o -f "bin/dbus-daemon" ] || { echo "MISSING: D-Bus Daemon"; MISSING_COMPONENTS=1; }
          
          if [ $MISSING_COMPONENTS -eq 1 ]; then
              echo "[CRITICAL ERROR] Required Tizen UI components are missing from downloaded RootFS!"
              exit 1
          fi
          echo "[Health Check] All primary Tizen components verified successfully!"
          cd ..

      # 5. سكريبت الإقلاع المتدرج الحقيقي (Fallback Engine)
      - name: Create robust start-tizen-gui script
        run: |
          cat << 'EOF' > zenos_rootfs/usr/bin/start-tizen-gui
          #!/bin/sh
          export XDG_RUNTIME_DIR=/run/user/0
          export WAYLAND_DISPLAY=wayland-0
          export ELM_ENGINE=wayland_egl
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export LD_LIBRARY_PATH=/usr/lib:/lib:/usr/lib64

          mkdir -p /run/user/0
          chmod 0700 /run/user/0

          dbus-uuidgen --ensure 2>/dev/null
          dbus-daemon --system --fork 2>/dev/null

          echo "[zenOS Engine] Waiting for /dev/dri/card0..."
          WAIT_CARD=0
          while [ ! -c /dev/dri/card0 ] && [ $WAIT_CARD -lt 5 ]; do
              sleep 1
              WAIT_CARD=$((WAIT_CARD+1))
          done

          # المحاولة الأولى: تشغيل Weston مع DRM Backend
          if [ -c /dev/dri/card0 ] && [ -x /usr/bin/weston ]; then
              echo "[zenOS Engine] Attempting Primary Launcher: Weston (DRM)..."
              weston --backend=drm-backend.so --use-pixman --continue-without-input --log=/tmp/weston.log &
              
              COUNT=0
              while [ $COUNT -lt 8 ]; do
                  if [ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]; then
                      echo "[zenOS Engine] Wayland Compositor Launched Successfully!"
                      exit 0
                  fi
                  sleep 1
                  COUNT=$((COUNT+1))
              done
              echo "[zenOS Engine] Weston failed to establish Wayland socket. Checking log:"
              cat /tmp/weston.log 2>/dev/null
          fi

          # المحاولة الثانية: Fallback لـ Enlightenment أو أي واجهة رسومية ثانوية
          if [ -x /usr/bin/enlightenment ]; then
              echo "[zenOS Engine] Attempting Graphical Fallback: Enlightenment..."
              enlightenment &
              sleep 3
              if pgrep enlightenment > /dev/null; then
                  echo "[zenOS Engine] Enlightenment UI Started!"
                  exit 0
              fi
          fi

          echo "[zenOS Engine] All Graphical Environments Failed."
          exit 1
          EOF

          chmod +x zenos_rootfs/usr/bin/start-tizen-gui

      # 6. بناء ملف Init المكتوب بـ C مع التحكم الكامل بـ Console
      - name: Compile Native C Init Manager
        run: |
          cat << 'EOF' > zenos_init.c
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <fcntl.h>
          #include <sys/mount.h>
          #include <sys/stat.h>
          #include <sys/wait.h>

          int main() {
              mount("proc", "/proc", "proc", 0, NULL);
              mount("sysfs", "/sys", "sysfs", 0, NULL);
              mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);
              mkdir("/dev/pts", 0755);
              mkdir("/dev/shm", 0755);
              mkdir("/tmp", 0777);
              mkdir("/run/user", 0755);
              mkdir("/run/user/0", 0700);
              mount("devpts", "/dev/pts", "devpts", 0, NULL);

              printf("\n==================================================\n");
              printf("  zenOS Engine Init (Tizen ARM64 Architecture)    \n");
              printf("==================================================\n\n");

              int res = system("/usr/bin/start-tizen-gui");

              if (res != 0) {
                  printf("\n[zenOS Engine] Graphical Interface Failed or Exited.\n");
                  printf("[zenOS Engine] Dropping to Emergency Maintenance Shell...\n\n");
                  
                  setenv("PS1", "zenos~# ", 1);
                  setenv("TERM", "xterm", 1);
                  setenv("PATH", "/usr/bin:/bin:/usr/sbin:/sbin", 1);

                  while(1) {
                      pid_t pid = fork();
                      if (pid == 0) {
                          setsid();
                          int fd = open("/dev/console", O_RDWR);
                          if (fd >= 0) {
                              dup2(fd, 0);
                              dup2(fd, 1);
                              dup2(fd, 2);
                              if (fd > 2) close(fd);
                          }
                          execl("/bin/sh", "sh", "-l", NULL);
                          exit(0);
                      }
                      waitpid(pid, NULL, 0);
                      sleep(1);
                  }
              }

              while(1) {
                  sleep(3600);
              }
              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc -static zenos_init.c -o zenos_rootfs/sbin/init
          chmod +x zenos_rootfs/sbin/init

      # 7. إنشاء صورة قرص النظام بصيغة Ext4
      - name: Generate Ext4 System Disk Image
        run: |
          dd if=/dev/zero of=zenOS-ARM64-Tizen-GUI.img bs=1M count=2500
          mkfs.ext4 -F -L "zenOS-RootFS" zenOS-ARM64-Tizen-GUI.img
          
          mkdir -p /tmp/zenos_mnt
          sudo mount -o loop zenOS-ARM64-Tizen-GUI.img /tmp/zenos_mnt
          sudo cp -a zenos_rootfs/* /tmp/zenos_mnt/
          sudo umount /tmp/zenos_mnt

      # 8. اختبار الإقلاع الحقيقي عبر QEMU وسحب الـ Boot Log بدقة
      - name: QEMU Boot Smoke Test & Log Verification
        run: |
          echo "[QEMU Test] Launching 20-second smoke test..."
          timeout 20 qemu-system-aarch64 \
            -M virt \
            -cpu cortex-a57 \
            -m 2048M \
            -smp 2 \
            -kernel boot_kernel/Image \
            -drive file=zenOS-ARM64-Tizen-GUI.img,format=raw,if=virtio \
            -append "console=ttyAMA0 root=/dev/vda rw init=/sbin/init" \
            -device virtio-gpu-pci \
            -vnc :5 \
            -nographic > qemu_boot.log 2>&1 || true

          echo "=================== QEMU BOOT LOG OUTPUT ==================="
          cat qemu_boot.log
          echo "==========================================================="

      # 9. تجهيز حزمة ZIP الخاصة بشرط تشغيل Termux
      - name: Create Termux Bundle Archive (ZIP)
        run: |
          mkdir -p termux_package
          cp zenOS-ARM64-Tizen-GUI.img termux_package/
          cp boot_kernel/Image termux_package/

          cat << 'EOF' > termux_package/start-qemu.sh
          #!/data/data/com.termux/files/usr/bin/bash
          echo "Starting zenOS on Termux QEMU..."
          qemu-system-aarch64 \
            -M virt \
            -cpu host \
            -enable-kvm \
            -m 2048M \
            -smp 4 \
            -kernel Image \
            -drive file=zenOS-ARM64-Tizen-GUI.img,format=raw,if=virtio \
            -append "console=ttyAMA0 root=/dev/vda rw init=/sbin/init" \
            -device virtio-gpu-pci \
            -vnc :5 \
            -display default
          EOF

          chmod +x termux_package/start-qemu.sh
          zip -j zenOS-ARM64-Termux.zip termux_package/* qemu_boot.log

      # 10. رفع حزمة ZIP كـ Artifact جاهز للتحميل
      - name: Upload Termux Ready ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Termux-ZIP
          path: zenOS-ARM64-Termux.zip
          
