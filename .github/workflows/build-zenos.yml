name: Build zenOS (ARM64)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # يتيح لك تشغيل البناء يدوياً

jobs:
  build-os:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64 Emulation
        uses: docker/setup-qemu-action@v3

      - name: Build zenOS in ARM64 Container
        uses: addnab/docker-run-action@v3
        with:
          image: arm64v8/ubuntu:24.04
          options: -v ${{ github.workspace }}:/workspace -w /workspace
          run: |
            echo "========== تحديث النظام وتثبيت المتطلبات =========="
            apt-get update -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              build-essential gcc \
              libsdl2-dev libglib2.0-dev \
              busybox-static u-boot-tools \
              fdisk e2fsprogs dosfstools \
              unzip wget curl cpio

            echo "========== كتابة كود النواة (Init) ونظام الحماية =========="
            cat << 'EOF' > init.c
            #include <stdio.h>
            #include <stdlib.h>
            #include <unistd.h>
            #include <sys/wait.h>
            #include <sys/mount.h>
            #include <string.h>

            // دالة تشغيل صدفة الإنقاذ zenos~#
            void launch_emergency_shell() {
                printf("\n\033[1;31m[zenOS] Critical: GUI Display Server crashed or hung!\033[0m\n");
                printf("[zenOS] Dropping to emergency shell to fix errors...\n\n");
                setenv("PS1", "zenos~# ", 1);
                execl("/bin/busybox", "sh", NULL);
                exit(1);
            }

            // دالة محاكية لتشغيل برامج TPK
            void execute_tpk(const char* tpk_path) {
                printf("[zenOS] Loading Tizen Package: %s\n", tpk_path);
                char cmd[512];
                // TPK هو ملف zip، نفك ضغطه في مجلد مؤقت ثم نشغل التطبيق
                snprintf(cmd, sizeof(cmd), "/bin/busybox unzip -q -o %s -d /tmp/app_exec", tpk_path);
                system(cmd);
                printf("[zenOS] TPK Extracted successfully. App is running...\n");
                // هنا يتم تنفيذ الملف التنفيذي الخاص بالتطبيق
            }

            int main() {
                // 1. تركيب ملفات النظام الأساسية
                mount("proc", "/proc", "proc", 0, NULL);
                mount("sysfs", "/sys", "sysfs", 0, NULL);
                mount("devtmpfs", "/dev", "devtmpfs", 0, NULL);

                printf("\n====================================\n");
                printf("       Welcome to zenOS (ARM64)     \n");
                printf("====================================\n");

                // 2. تشغيل خادم العرض (SDL2 Display Server)
                pid_t gui_pid = fork();
                
                if (gui_pid == 0) {
                    // نحن الآن في العملية الابن (خادم العرض)
                    printf("[zenOS] Starting SDL2 GUI Server (Tizen UI style)...\n");
                    // هنا يتم استدعاء تطبيق SDL2 الخاص بك
                    // execl("/bin/zenos-gui", "zenos-gui", NULL);
                    
                    // محاكاة لعمل الواجهة، إذا تم إغلاقها أو انهارت نخرج برمز خطأ
                    sleep(2); 
                    printf("[zenOS GUI] Simulated crash/hang...\n");
                    exit(1); // إرسال إشارة الانهيار
                } else if (gui_pid > 0) {
                    // العملية الأب (Init) تراقب الواجهة
                    int status;
                    waitpid(gui_pid, &status, 0);

                    // 3. التحقق مما إذا كانت الواجهة قد انهارت لفتح zenos~#
                    if (WIFEXITED(status) && WEXITSTATUS(status) != 0) {
                        launch_emergency_shell();
                    } else if (WIFSIGNALED(status)) {
                        launch_emergency_shell();
                    }
                } else {
                    perror("Failed to fork");
                }

                // الحفاظ على بقاء Init قيد التشغيل
                while(1) sleep(10);
                return 0;
            }
            EOF

            echo "========== تجميع ملف Init بـ GCC =========="
            gcc -O2 init.c -o init -lSDL2

            echo "========== إنشاء نظام الملفات (RootFS) =========="
            mkdir -p rootfs/{bin,sbin,etc,proc,sys,usr,dev,tmp}
            cp init rootfs/init
            chmod +x rootfs/init
            
            # تثبيت Busybox كقلب النظام التشغيلي
            cp /bin/busybox rootfs/bin/
            chroot rootfs /bin/busybox --install -s /bin

            echo "========== إنشاء ملف الصورة (zenOS.img) =========="
            # إنشاء ملف صورة بحجم 256 ميغابايت
            dd if=/dev/zero of=zenOS.img bs=1M count=256
            
            # تهيئة القرص وإنشاء ملفات النظام ext4
            mkfs.ext4 -d rootfs zenOS.img

            echo "========== إعداد U-Boot =========="
            # دمج U-Boot يتطلب عادةً حرق المحمل في القطاعات الأولى من القرص
            # سنقوم بإنشاء سكربت u-boot للإقلاع التلقائي
            cat << 'EOF' > boot.cmd
            setenv bootargs console=ttyS0 root=/dev/mmcblk0 rw init=/init
            # في بيئة حقيقية سنحمل النواة هنا عبر fatload
            # booti ${kernel_addr_r} - ${fdt_addr_r}
            EOF
            mkimage -C none -A arm -T script -d boot.cmd boot.scr

            echo "========== اكتمل بناء zenOS بنجاح =========="

      - name: Upload zenOS Image
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Image
          path: zenOS.img
          
