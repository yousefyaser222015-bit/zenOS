name: Build zenOS ARM64 Tizen Minimal

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ROOT: ${{ github.workspace }}/rootfs
      WORK: ${{ github.workspace }}/work
      REPO: https://download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/latest/repos/standard/packages/aarch64/

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          gcc-aarch64-linux-gnu \
          bc bison flex \
          libssl-dev libelf-dev \
          rpm rpm2cpio cpio \
          dnf curl wget xz-utils \
          e2fsprogs zip \
          qemu-system-arm \
          qemu-utils

        mkdir -p "$ROOT" "$WORK"

    - name: Kernel
      run: |
        set -eux

        cd "$WORK"

        wget -q \
          https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz

        tar -xf linux-6.1.80.tar.xz

        cd linux-6.1.80

        export ARCH=arm64
        export CROSS_COMPILE=aarch64-linux-gnu-

        make defconfig

        scripts/config --enable CONFIG_DEVTMPFS
        scripts/config --enable CONFIG_DEVTMPFS_MOUNT

        scripts/config --enable CONFIG_VIRTIO
        scripts/config --enable CONFIG_VIRTIO_PCI
        scripts/config --enable CONFIG_VIRTIO_MMIO
        scripts/config --enable CONFIG_VIRTIO_BLK
        scripts/config --enable CONFIG_VIRTIO_NET
        scripts/config --enable CONFIG_VIRTIO_INPUT

        scripts/config --enable CONFIG_DRM
        scripts/config --enable CONFIG_DRM_KMS_HELPER
        scripts/config --enable CONFIG_DRM_VIRTIO_GPU
        scripts/config --enable CONFIG_DRM_FBDEV_EMULATION

        scripts/config --enable CONFIG_FB
        scripts/config --enable CONFIG_FB_SIMPLE
        scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE

        scripts/config --enable CONFIG_INPUT_EVDEV
        scripts/config --enable CONFIG_INPUT_KEYBOARD
        scripts/config --enable CONFIG_INPUT_MOUSE

        scripts/config --enable CONFIG_EXT4_FS
        scripts/config --enable CONFIG_PROC_FS
        scripts/config --enable CONFIG_SYSFS

        scripts/config --enable CONFIG_NET
        scripts/config --enable CONFIG_INET

        make olddefconfig
        make -j"$(nproc)" Image

        cp arch/arm64/boot/Image "$WORK/Image"

    - name: RootFS
      run: |
        set -eux

        mkdir -p \
          "$ROOT"/{bin,sbin,etc,proc,sys,dev,dev/pts,dev/shm,run,tmp,root,boot,var/log} \
          "$ROOT"/usr/{bin,sbin,lib,libexec,share}

        chmod 1777 "$ROOT/tmp"

    - name: Tizen Repository
      run: |
        set -eux

        mkdir -p "$WORK/repos"

        cat > "$WORK/repos/tizen.repo" <<EOF
        [tizen]
        name=Tizen Unified ARM64
        baseurl=$REPO
        enabled=1
        gpgcheck=0
        repo_gpgcheck=0
        EOF

    - name: Tizen Packages
      run: |
        set -eux

        mkdir -p "$WORK/rpms"

        dnf \
          --releasever=latest \
          --setopt=cachedir="$WORK/dnf-cache" \
          --setopt=keepcache=True \
          --setopt=install_weak_deps=False \
          --setopt=best=False \
          --setopt=skip_if_unavailable=False \
          --disablerepo='*' \
          --repofrompath=tizen,"$REPO" \
          --forcearch=aarch64 \
          --downloadonly \
          --downloaddir="$WORK/rpms" \
          install \
          bash \
          dbus \
          wayland \
          weston \
          libdrm \
          mesa \
          pixman \
          cairo \
          pango \
          fontconfig \
          freetype \
          efl \
          elementary \
          ecore-wayland \
          aul \
          app-core \
          pkgmgr \
          pkgmgr-info \
          pkgmgr-server \
          tizen-platform-config \
          libinput \
          libevdev \
          curl \
          openssl \
          ca-certificates \
          2>&1 || true

        find "$WORK/rpms" \
          -type f \
          -name '*.rpm' \
          -size 0 \
          -delete

        test -n "$(find "$WORK/rpms" -name '*.rpm' -print -quit)"

    - name: Extract Tizen
      run: |
        set -eux

        cd "$WORK"

        for rpm in rpms/*.rpm; do
          rpm2cpio "$rpm" |
            cpio -idm \
              -D "$ROOT" \
              2>/dev/null || true
        done

    - name: BusyBox
      run: |
        set -eux

        cp /bin/busybox "$ROOT/bin/busybox"
        chmod 755 "$ROOT/bin/busybox"

        for app in \
          sh ash ls cat cp mv rm mkdir rmdir \
          mount umount ps kill sleep echo \
          grep sed vi ip ping chmod chown \
          pwd uname dmesg sync date df

        do
          ln -sf /bin/busybox "$ROOT/bin/$app"
        done

    - name: Libraries
      run: |
        set -eux

        mkdir -p "$ROOT/lib" "$ROOT/lib64"

        if [ -f "$ROOT/usr/lib/ld-linux-aarch64.so.1" ]; then
          ln -sf \
            /usr/lib/ld-linux-aarch64.so.1 \
            "$ROOT/lib/ld-linux-aarch64.so.1"

          ln -sf \
            /usr/lib/ld-linux-aarch64.so.1 \
            "$ROOT/lib64/ld-linux-aarch64.so.1"
        fi

        cat > "$ROOT/etc/ld.so.conf" <<EOF
        /lib
        /lib64
        /usr/lib
        /usr/lib64
        /usr/local/lib
        EOF

    - name: Weston
      run: |
        set -eux

        mkdir -p "$ROOT/etc/xdg/weston"

        cat > "$ROOT/etc/xdg/weston/weston.ini" <<EOF
        [core]
        backend=drm-backend.so
        idle-time=0

        [shell]
        locking=false
        panel-position=none

        [output]
        mode=1280x720

        [keyboard]
        keymap_layout=us
        EOF

    - name: GUI
      run: |
        set -eux

        cat > "$ROOT/usr/bin/zenos-gui" <<'EOF'
        #!/bin/sh

        export PATH=/usr/bin:/bin:/usr/sbin:/sbin
        export LD_LIBRARY_PATH=/usr/lib:/lib:/usr/lib64:/lib64
        export XDG_RUNTIME_DIR=/run/user/0
        export WAYLAND_DISPLAY=wayland-0
        export XDG_SESSION_TYPE=wayland
        export ELM_ENGINE=wayland_egl
        export ELM_DISPLAY=wl

        mkdir -p /run/user/0
        chmod 700 /run/user/0
        mkdir -p /var/log

        command -v ldconfig >/dev/null 2>&1 && ldconfig || true

        if command -v dbus-daemon >/dev/null 2>&1; then
          dbus-daemon --system --fork || true
        fi

        if [ ! -e /dev/dri/card0 ]; then
          echo "zenOS: DRM device unavailable" \
            >> /var/log/zenos-gui.log
          exit 1
        fi

        if [ ! -x /usr/bin/weston ]; then
          echo "zenOS: Weston unavailable" \
            >> /var/log/zenos-gui.log
          exit 1
        fi

        exec /usr/bin/weston \
          --backend=drm-backend.so \
          --config=/etc/xdg/weston/weston.ini \
          --continue-without-input \
          --log=/var/log/weston.log
        EOF

        chmod 755 "$ROOT/usr/bin/zenos-gui"

    - name: Tizen Runtime
      run: |
        set -eux

        cat > "$ROOT/usr/bin/zenos-runtime" <<'EOF'
        #!/bin/sh

        export PATH=/usr/bin:/bin:/usr/sbin:/sbin
        export LD_LIBRARY_PATH=/usr/lib:/lib:/usr/lib64:/lib64

        mkdir -p /run/tizen

        if command -v dbus-daemon >/dev/null 2>&1; then
          dbus-daemon --system --fork || true
        fi

        if command -v pkgmgr-server >/dev/null 2>&1; then
          pkgmgr-server \
            >>/var/log/pkgmgr.log 2>&1 &
        fi

        if command -v aul-launcher >/dev/null 2>&1; then
          aul-launcher \
            >>/var/log/aul.log 2>&1 &
        fi

        if command -v launchpad >/dev/null 2>&1; then
          launchpad \
            >>/var/log/launchpad.log 2>&1 &
        fi

        while true; do
          sleep 60
        done
        EOF

        chmod 755 "$ROOT/usr/bin/zenos-runtime"

    - name: Init
      run: |
        set -eux

        cat > "$WORK/init.c" <<'EOF'
        #include <errno.h>
        #include <stdio.h>
        #include <stdlib.h>
        #include <sys/mount.h>
        #include <sys/stat.h>
        #include <sys/types.h>
        #include <unistd.h>

        static void mk(const char *p, mode_t m)
        {
            if (mkdir(p,m) < 0 && errno != EEXIST)
                perror(p);
        }

        static void fs(
            const char *s,
            const char *t,
            const char *f)
        {
            if (mount(s,t,f,0,NULL) < 0 &&
                errno != EBUSY)
                perror(t);
        }

        static void run(const char *p)
        {
            pid_t pid=fork();

            if (pid==0) {
                execl(p,p,NULL);
                _exit(127);
            }
        }

        int main(void)
        {
            mk("/proc",0555);
            mk("/sys",0555);
            mk("/dev",0755);
            mk("/dev/pts",0755);
            mk("/dev/shm",01777);
            mk("/run",0755);
            mk("/run/user",0755);
            mk("/run/user/0",0700);
            mk("/tmp",01777);

            fs("proc","/proc","proc");
            fs("sysfs","/sys","sysfs");
            fs("devtmpfs","/dev","devtmpfs");
            fs("devpts","/dev/pts","devpts");
            fs("tmpfs","/dev/shm","tmpfs");
            fs("tmpfs","/run","tmpfs");

            setenv(
                "PATH",
                "/usr/bin:/bin:/usr/sbin:/sbin",
                1
            );

            setenv("HOME","/root",1);
            setenv("USER","root",1);
            setenv("TERM","linux",1);
            setenv("PS1","zenos~# ",1);

            setenv(
                "XDG_RUNTIME_DIR",
                "/run/user/0",
                1
            );

            setenv(
                "WAYLAND_DISPLAY",
                "wayland-0",
                1
            );

            setenv(
                "XDG_SESSION_TYPE",
                "wayland",
                1
            );

            run("/usr/bin/zenos-runtime");

            sleep(2);

            run("/usr/bin/zenos-gui");

            sleep(5);

            printf("\n");
            printf("================================\n");
            printf("           zenOS ARM64\n");
            printf("       Tizen + Wayland\n");
            printf("================================\n");
            printf("GUI launched asynchronously.\n");
            printf("Fallback shell: zenos~#\n");
            printf("\n");

            execl(
                "/bin/busybox",
                "busybox",
                "sh",
                "-l",
                NULL
            );

            execl(
                "/bin/sh",
                "sh",
                "-l",
                NULL
            );

            for (;;)
                sleep(60);

            return 0;
        }
        EOF

        aarch64-linux-gnu-gcc \
          -static \
          -O2 \
          -Wall \
          -Wextra \
          "$WORK/init.c" \
          -o "$ROOT/sbin/init"

        chmod 755 "$ROOT/sbin/init"

    - name: Kernel In Image
      run: |
        set -eux
        cp "$WORK/Image" "$ROOT/boot/Image"

    - name: Remove X11
      run: |
        set -eux

        find "$ROOT" \
          \( \
            -name '*xorg*' \
            -o -name '*X11*' \
            -o -name 'libX*.so*' \
          \) \
          -delete 2>/dev/null || true

        rm -rf \
          "$ROOT/usr/share/man" \
          "$ROOT/usr/share/doc" \
          "$ROOT/usr/include" \
          "$ROOT/usr/src"

    - name: Create Small Image
      run: |
        set -eux

        IMG="$GITHUB_WORKSPACE/zenOS-arm64.img"

        truncate -s 384M "$IMG"

        mkfs.ext4 \
          -F \
          -L zenOS \
          "$IMG"

        mkdir -p "$WORK/mnt"

        sudo mount \
          -o loop \
          "$IMG" \
          "$WORK/mnt"

        sudo cp -a \
          "$ROOT/." \
          "$WORK/mnt/"

        sync

        sudo umount "$WORK/mnt"

        e2fsck -fy "$IMG"

        resize2fs -M "$IMG"

        file "$IMG"
        du -h "$IMG"

    - name: QEMU Runner
      run: |
        set -eux

        cat > "$GITHUB_WORKSPACE/run-zenos.sh" <<'EOF'
        #!/bin/sh

        exec qemu-system-aarch64 \
          -machine virt \
          -cpu cortex-a72 \
          -m 1024 \
          -smp 4 \
          -kernel zenOS-arm64.img \
          -append "root=/dev/vda rw rootwait console=ttyAMA0,115200" \
          -drive file=zenOS-arm64.img,if=none,format=raw,id=disk \
          -device virtio-blk-pci,drive=disk \
          -device virtio-gpu-pci \
          -device virtio-keyboard-pci \
          -device virtio-mouse-pci \
          -device virtio-rng-pci \
          -nic user,model=virtio-net-pci \
          -display vnc=:5 \
          -serial stdio
        EOF

        chmod 755 "$GITHUB_WORKSPACE/run-zenos.sh"

    - name: Zip
      run: |
        set -eux

        cd "$GITHUB_WORKSPACE"

        zip -9 \
          zenOS-arm64.zip \
          zenOS-arm64.img \
          run-zenos.sh

        ls -lh \
          zenOS-arm64.img \
          zenOS-arm64.zip

    - name: Artifact
      uses: actions/upload-artifact@v4
      with:
        name: zenOS-arm64-Tizen
        path: |
          zenOS-arm64.zip
        compression-level: 0
        retention-days: 14
