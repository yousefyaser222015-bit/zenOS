          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <stdarg.h>
          #include <string.h>
          #include <unistd.h>
          #include <dirent.h>
          #include <fcntl.h>
          #include <time.h>
          #include <math.h>
          #include <ctype.h>
          #include <errno.h>
          #include <sys/types.h>
          #include <sys/wait.h>
          #include <sys/stat.h>
          #include <sys/mount.h>
          #include <sys/ioctl.h>
          #include <sys/mman.h>
          #include <sys/select.h>
          #include <linux/fb.h>
          #include <linux/input.h>
          #include <linux/vt.h>
          #include <linux/kd.h>

          #define MAX_WINDOWS 16
          #define MAX_APPS 64
