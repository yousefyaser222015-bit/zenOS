          } app_t;
          static app_t apps[MAX_APPS];
          static int n_apps=0;

          static void klog(const char *fmt, ...) {
              static int fd=-1;
              if (fd<0) fd=open("/dev/kmsg", O_WRONLY|O_NOCTTY);
              if (fd<0) return;
              char buf[256];
              va_list ap;
              va_start(ap, fmt);
              vsnprintf(buf, sizeof(buf), fmt, ap);
              va_end(ap);
              dprintf(fd, "<6>zenOS: %s\n", buf);
          }

