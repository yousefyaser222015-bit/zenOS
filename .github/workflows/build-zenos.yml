name: Build Compact Tizen OS GUI & Runtime Engine (ARM64)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-tizen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Native Tools
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            bison flex \
            libncurses-dev \
            libssl-dev \
            bc \
            libelf-dev \
            qemu-user-static \
            qemu-system-arm \
            qemu-utils \
            e2fsprogs \
            dosfstools \
            rpm2cpio \
            cpio \
            wget \
            curl \
            zstd \
            busybox-static

          command -v aarch64-linux-gnu-gcc
          command -v rpm2cpio
          command -v cpio
          command -v qemu-system-aarch64
          command -v mkfs.ext4
          command -v busybox

      # 1. بناء Linux ARM64
      - name: Compile Light DRM Kernel
        run: |
          set -euxo pipefail

          rm -rf kernel_build boot_kernel
          mkdir -p kernel_build boot_kernel

          cd kernel_build

          wget -q --show-progress \
            https://cdn.kernel.org/pub/linux/kernel/v6.x/linux-6.1.80.tar.xz

          test -s linux-6.1.80.tar.xz

          tar -xf linux-6.1.80.tar.xz

          test -f linux-6.1.80/Makefile

          cd linux-6.1.80

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-

          make defconfig

          scripts/config --enable CONFIG_DRM
          scripts/config --enable CONFIG_DRM_KMS_HELPER
          scripts/config --enable CONFIG_DRM_VIRTIO_GPU
          scripts/config --enable CONFIG_DRM_FBDEV_EMULATION

          scripts/config --enable CONFIG_DEVTMPFS
          scripts/config --enable CONFIG_DEVTMPFS_MOUNT

          scripts/config --enable CONFIG_FB
          scripts/config --enable CONFIG_FB_SIMPLE
          scripts/config --enable CONFIG_FRAMEBUFFER_CONSOLE

          scripts/config --enable CONFIG_VT
          scripts/config --enable CONFIG_INPUT
          scripts/config --enable CONFIG_INPUT_EVDEV
          scripts/config --enable CONFIG_INPUT_KEYBOARD
          scripts/config --enable CONFIG_INPUT_MOUSE

          scripts/config --enable CONFIG_VIRTIO
          scripts/config --enable CONFIG_VIRTIO_PCI
          scripts/config --enable CONFIG_VIRTIO_BLK
          scripts/config --enable CONFIG_VIRTIO_NET
          scripts/config --enable CONFIG_VIRTIO_INPUT
          scripts/config --enable CONFIG_VIRTIO_CONSOLE

          scripts/config --enable CONFIG_EXT4_FS
          scripts/config --enable CONFIG_TMPFS
          scripts/config --enable CONFIG_PROC_FS
          scripts/config --enable CONFIG_SYSFS

          make olddefconfig

          make -j"$(nproc)" Image

          test -s arch/arm64/boot/Image

          cd ../..

          cp \
            kernel_build/linux-6.1.80/arch/arm64/boot/Image \
            boot_kernel/Image

          test -s boot_kernel/Image

      # 2. جلب Tizen بدون DNF
      - name: Fetch Tizen Runtime Packages
        run: |
          set -euxo pipefail

          rm -rf zenos_rootfs tizen_rpms

          mkdir -p \
            zenos_rootfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,usr/lib,usr/libexec,dev,mnt,boot,root,tmp,run,lib,lib64,var/run}

          mkdir -p tizen_rpms

          cd tizen_rpms

          # latest في Unified يرجع 404 حالياً.
          # reference هو مستودع Unified صالح.
          TIZEN_REPO="https://cdn.download.tizen.org/snapshots/TIZEN/Tizen/Tizen-Unified/reference/repos/standard/packages/aarch64/"

          echo "Checking Tizen repository..."

          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "${TIZEN_REPO}repodata/repomd.xml" \
            -o repomd.xml

          test -s repomd.xml

          echo "Tizen repository OK."

          curl \
            --fail \
            --silent \
            --location \
            "$TIZEN_REPO" \
            -o packages.html

          test -s packages.html

          grep -oE 'href="[^"]+\.rpm"' packages.html \
            | cut -d'"' -f2 \
            | sort -u \
            > rpm_list.txt

          test -s rpm_list.txt

          grep -E \
            "glibc|busybox|bash|wayland|weston|efl|elementary|cairo|pixman|libdrm|dbus|systemd|vconf|aul|buxton|pkgmgr|app-manager|tzsh|enlightenment|libinput|libevdev" \
            rpm_list.txt \
            | grep -vE \
              "\-devel|\-debug|\-doc|\-static|\-tests|x11|xorg" \
            > target_rpms.txt || true

          test -s target_rpms.txt

          echo "Selected packages:"
          cat target_rpms.txt

          while read -r rpm_file; do
            [ -n "$rpm_file" ] || continue

            echo "Downloading: $rpm_file"

            curl \
              --fail \
              --location \
              --retry 4 \
              --retry-delay 2 \
              --output "$rpm_file" \
              "${TIZEN_REPO}${rpm_file}"

            test -s "$rpm_file"
          done < target_rpms.txt

          RPM_COUNT="$(find . -maxdepth 1 -type f -name '*.rpm' | wc -l)"

          echo "RPM count: $RPM_COUNT"

          test "$RPM_COUNT" -gt 0

          cd ..

          # استخراج الحزم
          for rpm in tizen_rpms/*.rpm; do
            [ -f "$rpm" ] || continue

            echo "Extracting $(basename "$rpm")"

            rpm2cpio "$rpm" \
              | (cd zenos_rootfs && cpio -idm --quiet)
          done

          test -d zenos_rootfs/usr

          # تنظيف
          rm -rf \
            zenos_rootfs/usr/apps/* \
            zenos_rootfs/usr/share/man \
            zenos_rootfs/usr/share/doc \
            zenos_rootfs/usr/include \
            zenos_rootfs/var/cache/*

          # BusyBox
          cp /bin/busybox \
            zenos_rootfs/bin/busybox

          cp /bin/busybox \
            zenos_rootfs/bin/busybox.static

          chmod 0755 \
            zenos_rootfs/bin/busybox \
            zenos_rootfs/bin/busybox.static

          cd zenos_rootfs/bin

          ./busybox --install -s .

          cd ../..

          # المكتبات
          mkdir -p \
            zenos_rootfs/lib \
            zenos_rootfs/lib64 \
            zenos_rootfs/usr/lib

          if [ -d zenos_rootfs/usr/lib64 ]; then
            cp -a \
              zenos_rootfs/usr/lib64/. \
              zenos_rootfs/usr/lib/ \
              2>/dev/null || true
          fi

          ln -sf \
            /usr/lib/ld-linux-aarch64.so.1 \
            zenos_rootfs/lib/ld-linux-aarch64.so.1

          ln -sf \
            /usr/lib/ld-linux-aarch64.so.1 \
            zenos_rootfs/lib64/ld-linux-aarch64.so.1

          printf '%s\n' \
            /usr/lib \
            /lib \
            /usr/local/lib \
            > zenos_rootfs/etc/ld.so.conf

      # 3. إعداد GUI + Tizen Runtime
      - name: Setup Tizen GUI Runtime
        run: |
          set -euxo pipefail

          cat > zenos_rootfs/usr/bin/start-tizen-gui <<'EOF'
          #!/bin/sh

          export XDG_RUNTIME_DIR=/run/user/0
          export WAYLAND_DISPLAY=wayland-0
          export ELM_ENGINE=wayland_egl
          export ELM_DISPLAY=wl
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export LD_LIBRARY_PATH=/usr/lib:/lib

          mkdir -p /run/user/0
          chmod 0700 /run/user/0

          /sbin/ldconfig 2>/dev/null || true

          dbus-uuidgen --ensure 2>/dev/null || true

          if command -v dbus-daemon >/dev/null 2>&1; then
              dbus-daemon --system --fork 2>/dev/null || true
          fi

          command -v vconf-init >/dev/null 2>&1 \
            && vconf-init 2>/dev/null || true

          command -v buxtond >/dev/null 2>&1 \
            && buxtond 2>/dev/null &

          if [ -x /usr/bin/weston ]; then
              echo "[zenOS Engine] Starting Weston..."

              weston \
                --backend=drm-backend.so \
                --use-pixman \
                --continue-without-input \
                --log=/tmp/weston.log &

              sleep 3
          fi

          if [ -x /usr/bin/tzsh ]; then
              tzsh &
          elif [ -x /usr/bin/enlightenment ]; then
              enlightenment &
          fi

          exit 0
          EOF

          chmod 0755 \
            zenos_rootfs/usr/bin/start-tizen-gui

          test -x \
            zenos_rootfs/usr/bin/start-tizen-gui

      # 4. Init حقيقي static
      - name: Create Native Tizen Init
        run: |
          set -euxo pipefail

          cat > tizen_init.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <unistd.h>
          #include <sys/mount.h>
          #include <sys/stat.h>

          static void mount_fs(
              const char *src,
              const char *target,
              const char *type)
          {
              mkdir(target, 0755);
              mount(src, target, type, 0, NULL);
          }

          int main(void)
          {
              mount_fs("proc", "/proc", "proc");
              mount_fs("sysfs", "/sys", "sysfs");
              mount_fs("devtmpfs", "/dev", "devtmpfs");

              mkdir("/dev/pts", 0755);
              mkdir("/dev/shm", 0755);
              mkdir("/tmp", 0777);
              mkdir("/run", 0755);
              mkdir("/run/user", 0755);
              mkdir("/run/user/0", 0700);

              mount_fs("devpts", "/dev/pts", "devpts");

              printf(
                  "\n"
                  "==================================================\n"
                  "     zenOS - Tizen GUI & Runtime Engine\n"
                  "==================================================\n\n"
              );

              system("/usr/bin/start-tizen-gui >/tmp/tizen.log 2>&1 &");

              printf("[zenOS] Tizen Core Runtime Layer ACTIVE.\n");
              printf("[zenOS] Interactive shell READY.\n\n");

              setenv("PS1", "zenos~# ", 1);
              setenv("TERM", "linux", 1);
              setenv("PATH",
                     "/usr/bin:/bin:/usr/sbin:/sbin",
                     1);

              if (access("/bin/bash", X_OK) == 0)
                  execl("/bin/bash", "bash", "--login", NULL);

              execl(
                  "/bin/busybox",
                  "busybox",
                  "ash",
                  "-l",
                  NULL
              );

              while (1)
                  sleep(10);

              return 0;
          }
          EOF

          aarch64-linux-gnu-gcc \
            -static \
            tizen_init.c \
            -o zenos_rootfs/sbin/init

          chmod 0755 zenos_rootfs/sbin/init

          test -x zenos_rootfs/sbin/init

          cp boot_kernel/Image \
            zenos_rootfs/boot/Image

          test -s zenos_rootfs/boot/Image

      # 5. إعداد ملفات النظام
      - name: Configure zenOS
        run: |
          set -euxo pipefail

          printf 'zenOS\n' \
            > zenos_rootfs/etc/hostname

          cat > zenos_rootfs/etc/passwd <<'EOF'
          root:x:0:0:root:/root:/bin/sh
          EOF

          cat > zenos_rootfs/etc/group <<'EOF'
          root:x:0:
          tty:x:5:
          video:x:44:
          input:x:24:
          EOF

          cat > zenos_rootfs/etc/profile <<'EOF'
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin
          export HOME=/root
          export USER=root
          export XDG_RUNTIME_DIR=/run/user/0
          export PS1='zenos~# '
          EOF

          cat > zenos_rootfs/etc/hosts <<'EOF'
          127.0.0.1 localhost
          127.0.1.1 zenOS
          ::1 localhost
          EOF

          test -s zenos_rootfs/etc/hostname
          test -s zenos_rootfs/etc/passwd
          test -s zenos_rootfs/etc/profile

      # 6. إنشاء صورة ext4
      - name: Create System Image
        run: |
          set -euxo pipefail

          ROOT_MB="$(du -sm zenos_rootfs | awk '{print $1}')"
          IMAGE_MB=$((ROOT_MB + 192))

          [ "$IMAGE_MB" -ge 256 ] || IMAGE_MB=256

          IMAGE="zenOS-ARM64-Tizen-GUI.img"

          truncate \
            -s "${IMAGE_MB}M" \
            "$IMAGE"

          mkfs.ext4 \
            -F \
            -L "zenOS-Tizen" \
            -m 0 \
            "$IMAGE"

          mkdir -p /tmp/zenos_mnt

          sudo mount \
            -o loop \
            "$IMAGE" \
            /tmp/zenos_mnt

          sudo cp -a \
            zenos_rootfs/. \
            /tmp/zenos_mnt/

          sync

          sudo umount /tmp/zenos_mnt

          e2fsck -fy "$IMAGE"
          resize2fs -M "$IMAGE"

          test -s "$IMAGE"

          ls -lh "$IMAGE"

      # 7. QEMU launcher
      - name: Create QEMU Launcher
        run: |
          set -euxo pipefail

          cat > run-zenos.sh <<'EOF'
          #!/bin/sh

          set -eu

          BASE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"

          exec qemu-system-aarch64 \
            -machine virt \
            -cpu cortex-a72 \
            -m 1024 \
            -smp 4 \
            -kernel "$BASE/boot_kernel/Image" \
            -append "root=/dev/vda rw rootwait init=/sbin/init console=ttyAMA0,115200" \
            -drive "file=$BASE/zenOS-ARM64-Tizen-GUI.img,if=none,format=raw,id=disk" \
            -device "virtio-blk-pci,drive=disk" \
            -device "virtio-gpu-pci" \
            -device "virtio-keyboard-pci" \
            -device "virtio-mouse-pci" \
            -device "virtio-rng-pci" \
            -netdev "user,id=net0" \
            -device "virtio-net-pci,netdev=net0" \
            -display "vnc=:5" \
            -serial "stdio"
          EOF

          chmod 0755 run-zenos.sh

          test -x run-zenos.sh

      # 8. تحقق نهائي
      - name: Verify Build
        run: |
          set -euxo pipefail

          test -s boot_kernel/Image
          test -s zenos_rootfs/sbin/init
          test -s zenos_rootfs/bin/busybox
          test -s zenos_rootfs/usr/bin/start-tizen-gui
          test -s zenOS-ARM64-Tizen-GUI.img
          test -x run-zenos.sh

          file \
            boot_kernel/Image \
            zenOS-ARM64-Tizen-GUI.img \
            zenos_rootfs/sbin/init

          du -sh zenos_rootfs

          ls -lh \
            boot_kernel/Image \
            zenOS-ARM64-Tizen-GUI.img \
            run-zenos.sh

      # 9. رفع النتائج
      - name: Upload Tizen Image
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Tizen-GUI
          path: |
            zenOS-ARM64-Tizen-GUI.img
            boot_kernel/Image
            run-zenos.sh
          if-no-files-found: error
          compression-level: 0
