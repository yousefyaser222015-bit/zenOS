name: Build zenOS System Image (ARM64 for QEMU)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-zenos-image:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. تثبيت أدوات بناء نظام ARM ومحاكي QEMU وصناعة الـ Images
      - name: Install ARM Toolchain & Image Building Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu \
                                 qemu-user-static qemu-system-arm qemu-utils \
                                 busybox-static debootstrap e2fsprogs dosfstools

      # 3. إنشاء هيكل النظام (RootFS) ونواة ARM64 لـ zenOS
      - name: Prepare zenOS RootFS & Kernel
        run: |
          echo "=================================================="
          echo "       Building zenOS RootFS for ARM64            "
          echo "=================================================="
          mkdir -p zenOS_rootfs/{bin,sbin,etc,proc,sys,usr/bin,usr/sbin,dev,mnt}
          
          # نسخ أداة BusyBox بالمسار الصحيح وتحديد مكانها التلقائي
          BUSYBOX_PATH=$(which busybox)
          cp $BUSYBOX_PATH zenOS_rootfs/bin/busybox
          chmod +x zenOS_rootfs/bin/busybox
          
          # عمل روابط الأوامر الأساسية (sh, ls, echo, etc)
          for tool in sh ls echo cat cp mv rm mkdir rmdir ps top; do
            ln -s /bin/busybox zenOS_rootfs/bin/$tool || true
          done

          # إنشاء ملف تشغيل النظام الأول (init script)
          cat << 'EOF' > zenOS_rootfs/etc/init
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          echo ""
          echo "=================================================="
          echo "       Welcome to zenOS (ARM64 Edition)!          "
          echo "=================================================="
          echo ""
          exec /bin/sh
          EOF
          chmod +x zenOS_rootfs/etc/init

      # 4. تجميع وبناء ملف الصورة النهائي zenOS-arm64.img
      - name: Create Bootable .img File
        run: |
          echo "Creating 200MB Raw Disk Image for zenOS..."
          dd if=/dev/zero of=zenOS-arm64.img bs=1M count=200
          
          # تهيئة الملف بنظام ملفات ext4
          mkfs.ext4 -F -L "zenOS-Root" zenOS-arm64.img
          
          # نسخ مكونات الـ RootFS داخل ملف الـ img
          mkdir -p /tmp/zenos_mnt
          sudo mount -o loop zenOS-arm64.img /tmp/zenos_mnt
          sudo cp -a zenOS_rootfs/* /tmp/zenos_mnt/
          sudo umount /tmp/zenos_mnt

          echo "Image creation successful!"
          ls -lh zenOS-arm64.img

      # 5. رفع ملف الـ .img النهائي كـ Artifact قابل للتنزيل والتشغيل
      - name: Upload zenOS OS Image
        uses: actions/upload-artifact@v4
        with:
          name: zenOS-ARM64-Disk-Image
          path: zenOS-arm64.img
          
